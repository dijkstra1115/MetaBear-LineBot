<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05090f" />
  <meta name="robots" content="noindex" />
  <meta name="description" content="MetaBear 訂單流實驗室原型：幣安 BTCUSDT 永續合約的足跡圖、CVD、未平倉量、大戶持倉比與成交量分布。" />
  <title>BTC 訂單流實驗室 · MetaBear</title>
  <link rel="icon" href="/metabear-logo-transparent-64.png" />
  <link rel="stylesheet" href="/orderflow/motion/fonts/fonts.css" />
  <link rel="stylesheet" href="./lab.css" />
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="/" aria-label="MetaBear 首頁"><img src="/metabear-logo-transparent-64.png" width="24" height="24" alt="" /><span>MetaBear</span></a>
    <h1>BTC 訂單流實驗室 <em>原型</em></h1>
    <span id="live" class="live" data-state="off">僅歷史資料</span>
    <div class="controls" role="group" aria-label="圖表設定">
      <label>圖表
        <select id="mode">
          <option value="candles" selected>K 線</option>
          <option value="footprint">足跡</option>
        </select>
      </label>
      <label>單位
        <select id="unit">
          <option value="btc" selected>BTC</option>
          <option value="usd">USD</option>
        </select>
      </label>
      <label>週期
        <select id="tf">
          <option value="1">1 分</option>
          <option value="5">5 分</option>
          <option value="15" selected>15 分</option>
          <option value="60">1 小時</option>
          <option value="240">4 小時</option>
        </select>
      </label>
      <label>價格格距
        <select id="tick">
          <option value="auto" selected>自動</option>
          <option value="10">$10</option>
          <option value="25">$25</option>
          <option value="50">$50</option>
          <option value="100">$100</option>
          <option value="250">$250</option>
        </select>
      </label>
      <label class="check"><input id="profile" type="checkbox" checked />成交量分布</label>
      <label class="check"><input id="heat" type="checkbox" checked />掛單熱力圖</label>
      <label class="check"><input id="liq" type="checkbox" checked />爆倉</label>
      <label class="check"><input id="lmap" type="checkbox" />爆倉地圖（估算）</label>
      <label class="check"><input id="events" type="checkbox" checked />事件</label>
      <div class="zoom" role="group" aria-label="縮放">
        <button id="zoom-out" type="button" aria-label="縮小">−</button>
        <button id="zoom-in" type="button" aria-label="放大">+</button>
        <button id="latest" type="button">最新</button>
      </div>
    </div>
  </header>

  <div id="readout" class="readout" aria-live="polite"></div>

  <main class="stage">
    <canvas id="chart" aria-label="BTC 足跡圖、CVD、未平倉量與多空比"></canvas>
    <p id="status" class="status">載入資料中…</p>
  </main>

  <footer class="note">
    <p id="source"></p>
    <p>滾輪縮放時間、拖曳平移；在右側價格軸上下拖曳或滾輪可縮放價格，雙擊價格軸恢復自動；切到「足跡」並放大到夠寬時顯示足跡數字（左賣右買）。亮色數字為斜向 3 倍以上的不平衡。爆倉地圖是用 OI 變化與假設的槓桿分布推算的估計值，不是交易所資料。事件標記是 5 分鐘 K 棒收盤後偵測到的盤面現象（上方三角偏空、下方偏多、金色為 OI 異動），不是買賣建議。時間為台灣時間。僅供研究，非投資建議。</p>
  </footer>
</body>
</html>
