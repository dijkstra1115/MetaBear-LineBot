<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img"><title>OI 與 Volume，數的是不同事情</title><rect width="760" height="400" rx="12" fill="#101d2d"/><g font-family="sans-serif"><text x="28" y="38" fill="#8be0d7" font-size="24">OI 與 Volume，數的是不同事情</text><text x="32" y="90" fill="#dbe7f3" font-size="22">原本有 100 張未平倉合約</text><text x="32" y="145" fill="#dbe7f3" font-size="22">雙方新開 10 張</text><text x="385" y="145" fill="#38c99a" font-size="23">OI 110　／　成交量 +10</text><text x="32" y="205" fill="#dbe7f3" font-size="22">雙方平掉 10 張</text><text x="385" y="205" fill="#ef6b78" font-size="23">OI 90　／　成交量 +10</text><text x="32" y="265" fill="#dbe7f3" font-size="22">一方開倉、一方平倉</text><text x="385" y="265" fill="#8be0d7" font-size="23">OI 100　／　成交量 +10</text><text x="32" y="325" fill="#9db1c4" font-size="18">三個獨立例子：都從 OI 100 開始；每筆合約只計一次。</text><text x="28" y="375" fill="#9db1c4" font-size="16">MetaBear 概念示意・非即時行情</text></g></svg>