      <div id="vig" class="fx" data-layout-ignore></div>
      <div id="fade" class="fx" data-layout-ignore></div>
      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="__END__" data-track-index="300" data-volume="1"></audio>
    </div>

    <script>
      /*__DATA__*/
      const PERSP = 1400;

      // ---------- the light: a WebGL ribbon, rendered from timeline time only ----------
      const canvas = document.getElementById("light");
      const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true, antialias: false });
      const VS = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const FS = `precision highp float;
        uniform vec2 res; uniform float t; uniform float inten; uniform float lift; uniform float warp;
        float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
        float n(vec2 p){ vec2 i = floor(p), f = fract(p); vec2 u = f*f*(3.0-2.0*f);
          return mix(mix(h(i), h(i+vec2(1,0)), u.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), u.x), u.y); }
        float fbm(vec2 p){ float v = 0.0, a = 0.5; for (int k = 0; k < 5; k++){ v += a*n(p); p *= 2.03; a *= 0.5; } return v; }
        void main(){
          vec2 uv = (gl_FragCoord.xy - 0.5*res) / res.y;
          float q = fbm(uv*1.3 + vec2(t*0.045, -t*0.03));
          float yc = 0.22*sin(uv.x*1.5 + t*0.18 + q*1.8) + lift + warp*0.18*sin(uv.x*3.1 - t*0.5);
          float d = uv.y - yc;
          float body = exp(-pow(d*3.6, 2.0)) * 0.55;
          float rim = exp(-pow((d + 0.05)*22.0, 2.0)) * (0.5 + 0.5*sin(uv.x*2.3 + t*0.4 + q*3.0));
          float d2 = uv.y - (yc - 0.42 + 0.08*sin(uv.x*2.2 - t*0.21));
          float body2 = exp(-pow(d2*4.0, 2.0)) * 0.25;
          vec3 mint = vec3(0.47, 0.88, 0.83), teal = vec3(0.10, 0.42, 0.52), deep = vec3(0.03, 0.12, 0.17);
          float side = smoothstep(-0.9, 0.9, uv.x + (q - 0.5)*0.8);
          vec3 c = mix(teal, deep, side)*body*0.9 + mix(mint, teal, side)*rim*0.9 + teal*body2;
          c *= 0.75 + 0.5*q;
          float vig = smoothstep(1.35, 0.25, length(uv*vec2(0.85, 1.2)));
          gl_FragColor = vec4(c*inten*vig + vec3(0.007, 0.013, 0.016), 1.0);
        }`;
      const sh = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        return s;
      };
      const prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      gl.useProgram(prog);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, "p");
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = (k) => gl.getUniformLocation(prog, k);
      gl.uniform2f(U("res"), 1920, 1080);
      const L = { inten: 0, lift: -0.08, warp: 0 };
      const drawLight = (t) => {
        gl.uniform1f(U("t"), t);
        gl.uniform1f(U("inten"), L.inten);
        gl.uniform1f(U("lift"), L.lift);
        gl.uniform1f(U("warp"), L.warp);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      };

      // ---------- the camera: one state, one writer; depth of field from depth ----------
      const world = document.getElementById("world");
      const stage = document.getElementById("stage");
      const objs = [...document.querySelectorAll(".obj")].map((el) => ({
        el,
        face: el.firstElementChild,
        x: +el.dataset.x,
        y: +el.dataset.y,
        z: +el.dataset.z,
        extra: 0,
        s: 1,
        alpha: el.dataset.alpha ? +el.dataset.alpha : 1,
      }));
      for (const o of objs) o.el.style.transform = `translate3d(${o.x}px, ${o.y}px, ${o.z}px)`;
      const byId = Object.fromEntries(objs.map((o) => [o.el.id, o]));
      const cam = { x: 0, y: 0, z: -260, rx: 0, ry: 3, focus: -260, mblur: 0, dx: 0, dy: 0, dof: 0.016 };
      const applyCamera = () => {
        world.style.transform = `translate3d(${cam.x + cam.dx}px, ${cam.y + cam.dy}px, ${cam.z}px) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg)`;
        for (const o of objs) {
          const r = o.z + cam.z; // depth toward the lens (positive = nearer)
          const blur = Math.min(16, Math.abs(r - cam.focus) * cam.dof) + o.extra;
          const near = r > 1050 ? Math.max(0, 1 - (r - 1050) / 200) : 1; // fly-past: vanish before the lens
          o.face.style.filter = blur > 0.15 ? `blur(${blur.toFixed(2)}px)` : "none";
          o.el.style.opacity = (o.alpha * near).toFixed(3);
          o.el.style.transform = `translate3d(${o.x}px, ${o.y}px, ${o.z}px) scale(${o.s})`;
        }
        stage.style.filter = cam.mblur > 0.1 ? `blur(${cam.mblur.toFixed(2)}px)` : "none";
      };

      const tl = gsap.timeline({ paused: true });
      const leg = (t, d, to, ease = "power2.inOut") => tl.to(cam, { ...to, duration: d, ease, onUpdate: applyCamera }, t);
      const lit = (t, d, to, ease = "sine.inOut") => tl.to(L, { ...to, duration: d, ease }, t);
      const focusIn = (sel, t, d = 0.6) => tl.fromTo(sel, { opacity: 0, filter: "blur(12px)", y: 8 }, { opacity: 1, filter: "blur(0px)", y: 0, duration: d, ease: "power2.out" }, t);
      const extra = (id, t, d, v, ease = "power2.inOut") => tl.to(byId[id], { extra: v, duration: d, ease, onUpdate: applyCamera }, t);
      const alpha = (id, t, d, v, ease = "power2.out") => tl.to(byId[id], { alpha: v, duration: d, ease, onUpdate: applyCamera }, t);

      document.fonts.ready.then(() => {
/*__TIMELINE__*/
      });
    </script>
  </body>
