    <style>
      @font-face {
        font-family: "Noto Sans TC";
        src: url("assets/fonts/NotoSansTC-sub.ttf") format("truetype");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {

        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";

        font-weight: 100 800;

      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #04070b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04070b;
        font-family: "Noto Sans TC", sans-serif;

      }
      #stage {
        position: absolute;
        inset: 0;

      .caps {
        position: absolute;
        left: 70px;

      }
      .cap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;

      .end .url {
        font-family: "JetBrains Mono", monospace;

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920" data-layout-ignore></canvas>

      <div class="layer clip" id="endcard" data-start="{{S10}}" data-duration="{{S10LEN}}" data-track-index="3">
        <div class="end" id="end">
          <img src="assets/img/badge.png" alt="MetaBear" />
          <div class="brand">MetaBear</div>
          <div class="line">完整策略：MetaBear 學院・策略實戰 01</div>
          <div class="url">metabear.io</div>
        </div>
        <p class="disclaimer" id="disclaimer">資料：幣安 BTCUSDT 永續合約｜時間為台灣時間｜歷史案例教學，非投資建議</p>
      </div>

      <div class="caps" id="caps">
{{CAPTIONS_HTML}}
      </div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="{{END}}" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const D = /*@DATA*/ null;
      const C = /*@CUES*/ null;
      const END = {{END}};
      const CAPS = /*@CAPTIONS*/ null;
      const EV_T0 = /*@EVT0*/ null;
      const EV_DUR = {{EVDUR}};

      const W = 1080;
      const H = 1920;
      const COL = { bg: "#04070b", panel: "#0a121c", ink: "#05090f", buy: "#78e1d5", sell: "#f09a5a", gold: "#e8bd7d", red: "#ff8a7f", oi: "#c3d0dc", text: "#edf2ed", muted: "#94a8b9", dim: "#5f7486", line: "#2a3a4a", grid: "rgba(120,160,190,0.07)" };
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';
      const MIN = 60_000;
      const M5 = 300_000;
      const U = (s) => Date.parse(s + "Z");

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");

      // ---------- helpers: every frame is a pure function of film time t ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const out3 = (k) => 1 - Math.pow(1 - k, 3);
      const inExpo = (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10));
      const win = (t, a, b, fi, fo) => (t < a || t > b ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1));
      const pulse = (t, t0, decay = 6) => (t < t0 ? 0 : Math.exp(-(t - t0) * decay));
      const fmt = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
      const rgba = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };
      const taipei = (ms) => {
        const d = new Date(ms + 8 * 3600_000);
        return `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
      };
      function text(str, x, y, { font = TC, size, weight = 700, color = COL.text, align = "left", alpha = 1, base = "alphabetic", track = 0, glow = 0 }) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = base;
        if (track) ctx.letterSpacing = `${track}px`;
        if (glow) {
          ctx.shadowColor = color;
          ctx.shadowBlur = glow;
        }
        ctx.fillText(str, x, y);
        ctx.restore();
      }
      function hline(x1, x2, y, color, width, alpha, dash) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        ctx.restore();
      }
      function rrect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function ring(x, y, t, t0, { r0 = 10, r1 = 70, color = COL.gold, dur = 0.7 } = {}) {
        const k = prog(t, t0, t0 + dur);
        if (k <= 0 || k >= 1) return;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(x, y, lerp(r0, r1, out3(k)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      function checkGlyph(x, y, s, color, a) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.6 * s;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x - 7 * s, y);
        ctx.lineTo(x - 2 * s, y + 5 * s);
        ctx.lineTo(x + 8 * s, y - 6 * s);
        ctx.stroke();
        ctx.restore();
      }

      // ---------- data ----------
      const byT = new Map();
      for (const b of [...D.m5, ...D.wait]) if (!byT.has(b.t)) byT.set(b.t, b);
      const S = [...byT.values()].sort((a, b) => a.t - b.t);
      const P = D.prior;
      const PLAN = D.plan;
      const SWEEP_BAR = S.find((b) => b.t === U("2025-12-09T05:15:00"));
      const RETESTS = ["2025-12-09T05:45:00", "2025-12-09T05:50:00", "2025-12-09T06:25:00", "2025-12-09T06:30:00"].map((s) => S.find((b) => b.t === U(s)));
      const RECLAIM_BAR = S.find((b) => b.t === U("2025-12-09T07:15:00"));
      const DIP = D.wait.reduce((m, b) => (b.l < m.l ? b : m));

      // Film time → market time (what has traded so far), piecewise linear.
      const REVEAL = [
        [0, U("2025-12-09T03:00:00")],
        [C.s2 + 0.3, U("2025-12-09T03:00:00")],
        [C.s3 - 0.2, U("2025-12-09T05:15:00")],
        [C.back + 0.6, U("2025-12-09T05:20:00")],
        [C.s4 + 0.3, U("2025-12-09T05:20:00")],
        [C.oiDrop + 1.2, U("2025-12-09T05:35:00")],
        [C.s6 + 0.2, U("2025-12-09T05:35:00")],
        [C.lessSell + 0.8, U("2025-12-09T07:05:00")],
        [C.reclaim - 1.0, U("2025-12-09T07:15:00")],
        [C.reclaim + 0.2, U("2025-12-09T07:20:00")],
        [C.imb - 0.5, U("2025-12-09T07:20:00")],
        [C.entry - 0.2, U("2025-12-09T07:25:00")],
        [C.s9 + 0.3, U("2025-12-09T07:25:00")],
        [C.dip + 0.4, DIP.t + M5],
        [C.surge, U("2025-12-09T15:25:00")],
        [C.t1, PLAN.t1T],
        [C.t2, PLAN.t2T],
        [C.t2 + 0.8, U("2025-12-09T15:50:00")],
      ];
      function reveal(t) {
        for (let i = 1; i < REVEAL.length; i++) if (t < REVEAL[i][0]) return lerp(REVEAL[i - 1][1], REVEAL[i][1], prog(t, REVEAL[i - 1][0], REVEAL[i][0]));
        return REVEAL.at(-1)[1];
      }

      // Camera: the chart window per scene, eased between keyframes.
      const VIEWS = [
        [C.s2, { t0: U("2025-12-09T03:00:00"), t1: U("2025-12-09T05:25:00"), lo: 89000, hi: 92300 }],
        [C.s3, { t0: U("2025-12-09T04:20:00"), t1: U("2025-12-09T05:30:00"), lo: 89200, hi: 90600 }],
        [C.s4, { t0: U("2025-12-09T04:20:00"), t1: U("2025-12-09T05:45:00"), lo: 89200, hi: 90600 }],
        [C.s6, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:15:00"), lo: 89200, hi: 90600 }],
        [C.s7, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:30:00"), lo: 89200, hi: 90600 }],
        [C.stop - 0.6, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:50:00"), lo: 89000, hi: 92300 }],
        [C.s9, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T16:00:00"), lo: 89000, hi: 92700 }],
      ];
      function view(t) {
        let v = VIEWS[0][1];
        for (let i = 1; i < VIEWS.length; i++) {
          const [at, next] = VIEWS[i];
          const k = inOut(prog(t, at - 0.4, at + 1.0));
          if (k <= 0) break;
          v = Object.fromEntries(Object.keys(v).map((key) => [key, lerp(v[key], next[key], k)]));
        }
        return v;
      }

      const BOX = { x: 100, y: 440, w: 880, h: 700 };
      const OIBOX = { y: 1190, h: 200 };
      const mapX = (v, ms) => BOX.x + ((ms - v.t0) / (v.t1 - v.t0)) * BOX.w;
      const mapY = (v, p) => BOX.y + ((v.hi - p) / (v.hi - v.lo)) * BOX.h;

      // ---------- rail (the strategy-01 lesson's strategy track) ----------
      const STAGES = [
        { k: "地點", w: 180 },
        { k: "事件", w: 180 },
        { k: "確認", w: 380 },
        { k: "執行", w: 180 },
      ];
      const RAIL_Y = 140;
      const RAIL_H = 72;
      const RAIL = (() => {
        const gap = 20;
        let x = (W - STAGES.reduce((s, a) => s + a.w, 0) - gap * 3) / 2;
        return STAGES.map((s) => {
          const box = { ...s, x };
          x += s.w + gap;
          return box;
        });
      })();
      const SLOT_NAMES = ["OI", "吸收", "背離", "收回"];
      const slotXY = (i) => [RAIL[2].x + 140 + i * 62, RAIL_Y];
      const LAND = EV_T0.map((t0) => t0 + EV_DUR);
      const STAGE_ON = [C.s2, C.s3, C.s4, C.s8];
      const STAGE_DONE = [C.s3, C.s4, LAND[3], C.t2];

      function drawRail(t) {
        const a = win(t, 0.3, C.s10 + 0.3, 0.3, 0.5);
        if (a <= 0) return;
        const frame = prog(t, 1.4, 2.0);
        RAIL.forEach((s, i) => {
          const active = prog(t, STAGE_ON[i], STAGE_ON[i] + 0.4);
          const done = prog(t, STAGE_DONE[i], STAGE_DONE[i] + 0.3);
          // The word flies in from the centre, then settles into its box.
          const t0 = 0.3 + i * 0.26;
          const fly = out3(prog(t, t0, t0 + 0.8));
          const tx = s.x + 26;
          const x = lerp(W / 2 - 60, tx, fly);
          const y = lerp(960, RAIL_Y, fly);
          const size = lerp(110, 30, fly);
          if (frame > 0) {
            ctx.save();
            ctx.globalAlpha = a * frame;
            rrect(s.x, RAIL_Y - RAIL_H / 2, s.w, RAIL_H, 14);
            ctx.fillStyle = rgba(COL.panel, 0.8);
            ctx.fill();
            const col = done > 0.5 ? COL.buy : active > 0 ? COL.gold : COL.line;
            ctx.strokeStyle = rgba(col, 0.4 + 0.5 * Math.max(active, done));
            ctx.lineWidth = 2;
            if (active > 0 && done < 1) {
              ctx.shadowColor = COL.gold;
              ctx.shadowBlur = 16 * active;
            }
            ctx.stroke();
            ctx.restore();
            text(`0${i + 1}`, s.x + 14, RAIL_Y - 18, { font: MONO, size: 14, color: COL.dim, alpha: a * frame });
            if (done > 0) checkGlyph(s.x + s.w - 28, RAIL_Y, 1.2, COL.buy, a * done);
          }
          const col = done > 0.5 ? COL.buy : active > 0 ? COL.text : COL.muted;
          text(s.k, x, y + 2, { size, weight: 900, color: col, base: "middle", alpha: a * prog(t, t0, t0 + 0.2), glow: active && done < 1 ? 10 : 0 });
        });
        if (frame <= 0) return;
        SLOT_NAMES.forEach((name, i) => {
          const [x, y] = slotXY(i);
          const ok = prog(t, LAND[i], LAND[i] + 0.25);
          const r = 19 * (1 + 0.35 * pulse(t, LAND[i], 5));
          ctx.save();
          ctx.globalAlpha = a * frame;
          ctx.beginPath();
          ctx.arc(x, y - 6, r, 0, Math.PI * 2);
          ctx.fillStyle = ok > 0 ? rgba(COL.buy, 0.18 * ok) : rgba(COL.ink, 0.85);
          ctx.fill();
          ctx.strokeStyle = ok > 0.5 ? COL.buy : rgba(COL.muted, 0.45);
          ctx.lineWidth = 1.8;
          if (i === 0 && ok < 0.5) ctx.setLineDash([4, 3]);
          ctx.stroke();
          ctx.restore();
          ring(x, y - 6, t, LAND[i], { r0: 19, r1: 60, color: COL.buy, dur: 0.6 });
          checkGlyph(x, y - 6, 1.1, COL.buy, a * ok);
          text(name, x, y + 26, { size: 15, color: ok > 0.5 ? COL.buy : COL.muted, align: "center", base: "middle", alpha: a * frame });
        });
        text("必要", slotXY(0)[0], RAIL_Y - 44, { size: 13, color: COL.gold, align: "center", alpha: a * frame * 0.9 });
      }

      // ---------- evidence cards ----------
      const EVIDENCE = [
        { kicker: "證據 1 / 4 · OI", hero: "OI −1,071", sub: "15 分鐘內，新倉被洗出去", color: COL.oi },
        { kicker: "證據 2 / 4 · 吸收", hero: "賣 310 · 買 67", sub: "低點附近，價格推不動", color: COL.sell },
        { kicker: "證據 3 / 4 · 背離", hero: "Δ −894 → −28", sub: "回落不再創低，賣壓變小", color: COL.gold },
        { kicker: "證據 4 / 4 · 收回", hero: "收回 90,195", sub: "重回前一天的價值區", color: COL.buy },
      ];
      function evidencePose(t, i) {
        const u = t - EV_T0[i];
        const [sx, sy] = slotXY(i);
        const cx = W / 2;
        const cy = 900;
        const from = [W / 2, 1100];
        if (u < 0.6) {
          const p = out3(clamp(u / 0.6));
          return { x: lerp(from[0], cx, p), y: lerp(from[1], cy, p), s: lerp(0.3, 1.5, p) + Math.sin(Math.PI * clamp(u / 0.6)) * 0.4 };
        }
        if (u < 1.85) return { x: cx, y: cy, s: 1.5 + 0.06 * inOut(clamp((u - 0.6) / 1.25)) };
        const p = inExpo(clamp((u - 1.85) / (EV_DUR - 1.85)));
        return { x: lerp(cx, sx, p), y: lerp(cy, sy - 6, p), s: lerp(1.56, 0.08, p) };
      }
      function drawEvidence(t) {
        EVIDENCE.forEach((e, i) => {
          const u = t - EV_T0[i];
          if (u < 0 || u > EV_DUR + 0.05) return;
          const hold = win(u, 0.3, 1.9, 0.3, 0.3);
          if (hold > 0) {
            ctx.fillStyle = `rgba(2,5,9,${0.55 * hold})`;
            ctx.fillRect(0, BOX.y - 60, W, OIBOX.y + OIBOX.h - BOX.y + 80);
          }
          const pose = evidencePose(t, i);
          const a = 1 - prog(u, EV_DUR - 0.12, EV_DUR);
          const w = 520;
          const h = 190;
          ctx.save();
          ctx.translate(pose.x, pose.y);
          ctx.scale(pose.s, pose.s);
          ctx.globalAlpha = a;
          ctx.shadowColor = e.color;
          ctx.shadowBlur = 40;
          rrect(-w / 2, -h / 2, w, h, 22);
          ctx.fillStyle = "rgba(8,14,24,0.95)";
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = rgba(e.color, 0.85);
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = e.color;
          ctx.fillRect(-w / 2, -h / 2 + 28, 6, h - 56);
          ctx.restore();
          ctx.save();
          ctx.translate(pose.x, pose.y);
          ctx.scale(pose.s, pose.s);
          text(e.kicker, -w / 2 + 34, -h / 2 + 38, { size: 18, color: COL.gold, base: "middle", alpha: a, track: 2 });
          text(e.hero, -w / 2 + 32, 4, { size: 58, weight: 900, color: COL.text, base: "middle", alpha: a, glow: 14 });
          text(e.sub, -w / 2 + 34, h / 2 - 34, { size: 22, weight: 500, color: COL.muted, base: "middle", alpha: a });
          ctx.restore();
        });
      }

      // ---------- HUD ----------
      const hud = { ms: U("2025-12-09T03:00:00"), price: null, color: COL.text };
      function drawHud(t) {
        const a = win(t, 1.6, C.s10 + 0.2, 0.6, 0.5);
        if (a <= 0) return;
        text("2025.12.09", 90, 268, { font: MONO, size: 26, weight: 500, color: COL.muted, alpha: a });
        text(taipei(hud.ms), 90, 350, { font: NUM, size: 86, color: COL.text, alpha: a, track: 2 });
        text("台灣時間", 260, 350, { size: 22, weight: 500, color: COL.dim, alpha: a });
        text("BTCUSDT 永續 · 幣安", W - 90, 268, { size: 24, weight: 500, color: COL.muted, align: "right", alpha: a });
        if (hud.price != null) text(fmt(hud.price, 1), W - 90, 350, { font: NUM, size: 80, color: hud.color, align: "right", alpha: a, track: 1 });
      }

      // ---------- scene 1: title ----------
      function drawTitle(t) {
        const a = win(t, 1.2, C.s2 + 0.2, 0.6, 0.6);
        if (a <= 0) return;
        text("策略 01 實戰", W / 2, 840, { size: 40, color: COL.gold, align: "center", alpha: a, track: 6 });
        text("掃過前低，收回才算數", W / 2, 960, { size: 86, weight: 900, color: COL.text, align: "center", alpha: a, glow: 18 });
        text("2025.12.09 · BTCUSDT 永續", W / 2, 1050, { font: MONO, size: 30, weight: 500, color: COL.muted, align: "center", alpha: a * prog(t, 1.8, 2.4) });
      }

      // ---------- 5-minute chart (scenes 2, 4, 6–9) ----------
      function chartAlpha(t) {
        // Hidden while the 1-minute break and the two footprint panels take over.
        const oneMinute = win(t, C.brk - 0.3, C.s4 + 0.1, 0.3, 0.4);
        return win(t, C.s2 - 0.1, C.s10 + 0.2, 0.6, 0.6) * (1 - 0.92 * oneMinute);
      }
      function drawLevel(v, price, label, color, alpha, dash) {
        if (alpha <= 0 || price < v.lo || price > v.hi) return;
        const y = mapY(v, price);
        hline(BOX.x, BOX.x + BOX.w, y, color, 2, alpha, dash);
        text(label, BOX.x + 6, y - 10, { size: 22, color, alpha });
      }
      function drawChart(t) {
        const a = chartAlpha(t);
        if (a <= 0) return;
        const v = view(t);
        const now = reveal(t);
        const bw = Math.max(2, (M5 / (v.t1 - v.t0)) * BOX.w * 0.62);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.rect(BOX.x - 10, BOX.y - 20, BOX.w + 20, BOX.h + 40);
        ctx.clip();
        // Grid.
        const step = v.hi - v.lo > 2000 ? 500 : 200;
        for (let p = Math.ceil(v.lo / step) * step; p <= v.hi; p += step) {
          hline(BOX.x, BOX.x + BOX.w, mapY(v, p), COL.grid, 1, 1);
          text(fmt(p), BOX.x + BOX.w - 4, mapY(v, p) - 6, { font: MONO, size: 18, weight: 400, color: COL.dim, align: "right" });
        }
        // Prior-day profile, faint, on the right.
        const prof = win(t, C.s2 + 0.4, C.s4, 0.8, 0.8) + win(t, C.targets, C.s10, 0.6, 0.6) * 0.5;
        if (prof > 0) {
          const max = Math.max(...D.profile.map((r) => r[1]));
          for (const [p, vol] of D.profile) {
            if (p < v.lo || p + 100 > v.hi) continue;
            const inVA = p >= P.val - 100 && p <= P.vah;
            const len = (vol / max) * 200;
            ctx.fillStyle = rgba(inVA ? COL.gold : COL.muted, (inVA ? 0.22 : 0.12) * prof);
            ctx.fillRect(BOX.x + BOX.w - len, mapY(v, p + 100) + 1, len, Math.max(1, mapY(v, p) - mapY(v, p + 100) - 2));
          }
        }
        // Levels.
        const lowA = prog(t, C.low, C.low + 0.5);
        const valA = prog(t, C.val, C.val + 0.5);
        const reclaimed = prog(t, C.reclaim, C.reclaim + 0.4);
        const brokeFlash = pulse(t, C.brk, 2.5);
        drawLevel(v, P.low, `前低 ${fmt(P.low, 0)}`, brokeFlash > 0.05 ? COL.red : COL.gold, lowA * (0.85 - 0.35 * prog(t, C.s7, C.s8)), [14, 8]);
        drawLevel(v, P.val, `VAL ${fmt(P.val)}`, reclaimed > 0.5 ? COL.buy : COL.gold, valA, reclaimed > 0.5 ? null : [14, 8]);
        drawLevel(v, P.poc, `POC ${fmt(P.poc)}`, COL.muted, prof * 0.9 + prog(t, C.targets, C.targets + 0.5) * 0.1, [6, 8]);
        drawLevel(v, P.vah, `VAH ${fmt(P.vah)}`, COL.muted, prof * 0.9 + prog(t, C.targets, C.targets + 0.5) * 0.1, [6, 8]);
        if (valA > 0) ring(mapX(v, RECLAIM_BAR.t + M5 / 2), mapY(v, P.val), t, C.reclaim, { r0: 14, r1: 110, color: COL.buy, dur: 0.8 });
        // Candles up to the reveal time; the newest grows.
        let last = null;
        for (const b of S) {
          if (b.t >= now) break;
          const g = clamp((now - b.t) / M5);
          const cx = mapX(v, b.t + M5 / 2);
          if (cx < BOX.x - 20 || cx > BOX.x + BOX.w + 20) continue;
          const up = b.c >= b.o;
          const col = up ? COL.buy : COL.sell;
          const close = lerp(b.o, b.c, g);
          const hi = lerp(b.o, b.h, g);
          const lo = lerp(b.o, b.l, g);
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1.5, bw * 0.12);
          ctx.beginPath();
          ctx.moveTo(cx, mapY(v, hi));
          ctx.lineTo(cx, mapY(v, lo));
          ctx.stroke();
          const y1 = mapY(v, Math.max(b.o, close));
          const y2 = mapY(v, Math.min(b.o, close));
          ctx.fillStyle = col;
          ctx.fillRect(cx - bw / 2, y1, bw, Math.max(1.5, y2 - y1));
          last = { b, close };
        }
        // Scene 6: the later dips stay above the sweep low, with far less selling.
        const kd = win(t, C.s6 + 0.3, C.s7 + 0.6, 0.5, 0.6);
        if (kd > 0) {
          const pts = [SWEEP_BAR, ...RETESTS].filter((b) => b.t < now);
          ctx.save();
          ctx.globalAlpha *= kd;
          ctx.strokeStyle = rgba(COL.gold, 0.8);
          ctx.setLineDash([8, 8]);
          ctx.lineWidth = 2;
          ctx.beginPath();
          pts.forEach((b, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, mapX(v, b.t + M5 / 2), mapY(v, b.l) + 14));
          ctx.stroke();
          ctx.setLineDash([]);
          pts.forEach((b, i) => {
            const x = mapX(v, b.t + M5 / 2);
            const y = mapY(v, b.l) + 14;
            ctx.fillStyle = i ? COL.gold : COL.sell;
            ctx.beginPath();
            ctx.arc(x, y, 6, 0, Math.PI * 2);
            ctx.fill();
            text(`Δ ${b.delta > 0 ? "+" : ""}${fmt(b.delta)}`, x, y + 34, { font: NUM, size: i ? 26 : 32, color: i ? COL.gold : COL.sell, align: "center" });
          });
          ctx.restore();
        }
        // Scene 8: entry, stop and targets.
        const ke = prog(t, C.entry, C.entry + 0.3);
        if (ke > 0) {
          const ex = mapX(v, PLAN.entryT);
          const ey = mapY(v, PLAN.entry);
          const ks = prog(t, C.stop, C.stop + 0.5);
          const kt = prog(t, C.targets, C.targets + 0.5);
          if (ks > 0) {
            ctx.fillStyle = rgba(COL.red, 0.1 * ks);
            ctx.fillRect(ex, ey, BOX.x + BOX.w - ex, mapY(v, PLAN.stop) - ey);
            hline(ex, BOX.x + BOX.w, mapY(v, PLAN.stop), COL.red, 2.5, ks);
            text(`停損 ${fmt(PLAN.stop)}`, BOX.x + BOX.w - 8, mapY(v, PLAN.stop) + 30, { size: 24, color: COL.red, align: "right", alpha: ks });
          }
          if (kt > 0) {
            ctx.fillStyle = rgba(COL.buy, 0.08 * kt);
            ctx.fillRect(ex, mapY(v, PLAN.t2), BOX.x + BOX.w - ex, ey - mapY(v, PLAN.t2));
            for (const [price, label, hitT] of [
              [PLAN.t1, "目標一 POC", C.t1],
              [PLAN.t2, "目標二 VAH", C.t2],
            ]) {
              const hit = prog(t, hitT, hitT + 0.3);
              hline(ex, BOX.x + BOX.w, mapY(v, price), hit > 0.5 ? COL.buy : COL.gold, 2.5, kt);
              text(`${label} ${fmt(price)}`, BOX.x + BOX.w - 8, mapY(v, price) - 12, { size: 24, color: hit > 0.5 ? COL.buy : COL.gold, align: "right", alpha: kt });
              if (hit > 0) checkGlyph(BOX.x + BOX.w - 300, mapY(v, price) - 20, 1.3, COL.buy, hit);
              ring(BOX.x + BOX.w - 300, mapY(v, price) - 20, t, hitT, { r0: 12, r1: 90, color: COL.buy, dur: 0.8 });
            }
          }
          hline(ex, BOX.x + BOX.w, ey, COL.gold, 2.5, ke, [10, 6]);
          ctx.fillStyle = COL.gold;
          ctx.beginPath();
          ctx.arc(ex, ey, 9 + 10 * pulse(t, C.entry, 4), 0, Math.PI * 2);
          ctx.fill();
          text(`進場 ${fmt(PLAN.entry)}`, ex - 14, ey - 18, { size: 26, color: COL.gold, align: "right", alpha: ke });
        }
        // Scene 9: the deepest dip while waiting.
        const kw = win(t, C.dip, C.night + 0.4, 0.4, 0.6);
        if (kw > 0) {
          const x = mapX(v, DIP.t + M5 / 2);
          const y = mapY(v, DIP.l);
          ctx.fillStyle = rgba(COL.gold, kw);
          ctx.beginPath();
          ctx.arc(x, y + 12, 7, 0, Math.PI * 2);
          ctx.fill();
          text(`最低 ${fmt(DIP.l)} · 距停損 ${fmt(DIP.l - PLAN.stop)}`, x, y + 52, { size: 26, color: COL.gold, align: "center", alpha: kw });
        }
        ctx.restore();
        if (last && t >= C.s2 + 0.3) {
          hud.ms = last.b.t + M5 * clamp((now - last.b.t) / M5);
          hud.price = last.close;
          hud.color = last.close >= PLAN.entry && t > C.entry ? COL.buy : COL.text;
        }
      }

      // ---------- OI panel (scenes 2–7) ----------
      function drawOi(t) {
        const a = win(t, C.s2 + 0.6, C.s8 + 0.4, 0.6, 0.6) * chartAlpha(t);
        if (a <= 0) return;
        const v = view(t);
        const now = reveal(t);
        const lo = 87400;
        const hi = 89400;
        const y = (oi) => OIBOX.y + 30 + ((hi - oi) / (hi - lo)) * (OIBOX.h - 40);
        ctx.save();
        ctx.globalAlpha = a;
        text("未平倉量 OI（BTC）", BOX.x, OIBOX.y, { size: 24, weight: 500, color: COL.muted });
        ctx.beginPath();
        ctx.rect(BOX.x - 6, OIBOX.y + 10, BOX.w + 12, OIBOX.h);
        ctx.clip();
        ctx.strokeStyle = COL.oi;
        ctx.lineWidth = 3;
        ctx.beginPath();
        let started = false;
        let lastOi = null;
        for (const b of S) {
          if (b.t >= now || b.oi == null) break;
          const x = mapX(v, b.t + M5);
          (started ? ctx.lineTo : ctx.moveTo).call(ctx, x, y(b.oi));
          started = true;
          lastOi = b.oi;
        }
        ctx.stroke();
        ctx.restore();
        if (lastOi != null) text(fmt(lastOi), BOX.x + BOX.w, OIBOX.y, { font: NUM, size: 40, color: COL.oi, align: "right", alpha: a });
        const jump = S.find((b) => b.t === U("2025-12-09T04:30:00"));
        const kj = win(t, C.newOi, C.s3 + 0.2, 0.3, 0.4);
        if (kj > 0) {
          const x = mapX(v, jump.t + M5);
          ring(x, y(jump.oi), t, C.newOi, { color: COL.oi });
          text("下跌途中，新倉 +1,040", x - 10, y(jump.oi) - 18, { size: 26, color: COL.oi, align: "right", alpha: kj * a });
        }
        const kc = win(t, C.oiDrop, C.s5, 0.3, 0.4);
        if (kc > 0) {
          const after = S.find((b) => b.t === U("2025-12-09T05:30:00"));
          const x = mapX(v, after.t + M5);
          ring(x, y(after.oi), t, C.oiDrop + 0.6, { color: COL.oi, r1: 90 });
          text("15 分鐘 −1,071", x - 20, y(after.oi) + 50, { font: NUM, size: 40, color: COL.oi, align: "right", alpha: kc * a, glow: 10 });
        }
      }

      // ---------- scene 3: the break, minute by minute ----------
      function drawBreak(t) {
        const a = win(t, C.brk - 0.3, C.s4 + 0.1, 0.3, 0.4);
        if (a <= 0) return;
        const bars = D.m1;
        const lo = 89300;
        const hi = 89900;
        const y = (p) => BOX.y + ((hi - p) / (hi - lo)) * BOX.h;
        const step = BOX.w / bars.length;
        const di = bars.findIndex((b) => b.t === D.sweep.t);
        // Minutes before the break appear quickly; the break minute dives in slow motion.
        const shown = (i) => (i < di ? prog(t, C.brk - 0.3 + i * 0.06, C.brk + i * 0.06) : i === di ? prog(t, C.brk, C.brk + 0.1) : prog(t, C.back + (i - di - 1) * 0.15, C.back + 0.2 + (i - di - 1) * 0.15));
        const dive = inOut(prog(t, C.brk + 0.1, C.lowest + 0.4));
        ctx.save();
        ctx.globalAlpha = a;
        text("1 分鐘 K 線", BOX.x, BOX.y - 8, { size: 24, weight: 500, color: COL.muted });
        for (let p = 89300; p <= 89900; p += 100) {
          hline(BOX.x, BOX.x + BOX.w, y(p), COL.grid, 1, 1);
          text(fmt(p), BOX.x + BOX.w - 4, y(p) - 6, { font: MONO, size: 18, weight: 400, color: COL.dim, align: "right" });
        }
        const flash = pulse(t, C.brk + 0.4, 2.2);
        hline(BOX.x, BOX.x + BOX.w, y(P.low), flash > 0.05 ? COL.red : COL.gold, 2 + 3 * flash, 1, [14, 8]);
        text(`前低 ${fmt(P.low, 0)}`, BOX.x + 6, y(P.low) - 12, { size: 24, color: flash > 0.05 ? COL.red : COL.gold });
        const vmax = 1504;
        let price = bars[0].o;
        bars.forEach((b, i) => {
          const g = shown(i);
          if (g <= 0) return;
          const cx = BOX.x + step * (i + 0.5);
          const isDive = i === di;
          const lowNow = isDive ? lerp(b.o, b.l, dive) : b.l;
          const closeNow = isDive ? (dive < 1 ? lowNow + (b.o - lowNow) * 0.15 : lerp(lowNow, b.c, prog(t, C.lowest + 0.4, C.back - 0.2))) : b.c;
          const up = closeNow >= b.o;
          const col = up ? COL.buy : COL.sell;
          ctx.globalAlpha = a * g;
          ctx.strokeStyle = col;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx, y(isDive ? Math.max(b.h, b.o) : b.h));
          ctx.lineTo(cx, y(lowNow));
          ctx.stroke();
          const y1 = y(Math.max(b.o, closeNow));
          ctx.fillStyle = col;
          ctx.fillRect(cx - step * 0.3, y1, step * 0.6, Math.max(2, y(Math.min(b.o, closeNow)) - y1));
          text(taipei(b.t), cx, BOX.y + BOX.h + 30, { font: MONO, size: 17, weight: 400, color: isDive ? COL.text : COL.dim, align: "center" });
          // Volume under the chart.
          const vh = (b.vol / vmax) * 150 * (isDive ? dive : 1);
          ctx.fillStyle = b.delta < 0 ? rgba(COL.sell, 0.85) : rgba(COL.buy, 0.85);
          ctx.fillRect(cx - step * 0.3, OIBOX.y + OIBOX.h - vh, step * 0.6, vh);
          price = isDive ? closeNow : b.c;
          if (isDive && dive > 0) {
            ring(cx, y(P.low), t, C.brk + 0.4, { color: COL.red, r1: 120, dur: 0.9 });
            ring(cx, y(P.low), t, C.brk + 0.6, { color: COL.red, r1: 160, dur: 1.0 });
          }
        });
        ctx.globalAlpha = a;
        text("成交量（每分鐘，BTC）", BOX.x, OIBOX.y + 6, { size: 22, weight: 500, color: COL.dim });
        const kv = prog(t, C.minute, C.minute + 0.4);
        if (kv > 0) {
          const cx = BOX.x + step * (di + 0.5);
          text("1 分鐘 1,504 BTC · Δ −798", cx - 30, OIBOX.y + 60, { font: NUM, size: 40, color: COL.sell, align: "right", alpha: kv });
        }
        const kl = prog(t, C.lowest, C.lowest + 0.4);
        if (kl > 0) text(`最低 ${fmt(D.sweep.low, 1)}`, BOX.x + step * (di + 0.5) + 18, y(D.sweep.low) + 10, { font: NUM, size: 44, color: COL.sell, alpha: kl, glow: 12 });
        ctx.restore();
        hud.ms = Math.min(D.sweep.t + MIN, reveal(t));
        hud.price = price;
        hud.color = COL.sell;
      }

      // ---------- footprint panels (scenes 5 and 8) ----------
      function footprintPanel(t, { t0, t1, rows, bandSize, title, highlight, note, priceLine }) {
        const a = win(t, t0, t1, 0.5, 0.5);
        if (a <= 0) return;
        const zoom = out3(prog(t, t0, t0 + 0.7));
        const px = 140;
        const pw = 800;
        const top = 520;
        const rowH = Math.min(64, 600 / rows.length);
        const max = Math.max(...rows.map((r) => r[1] + r[2]));
        ctx.save();
        ctx.globalAlpha = a;
        ctx.fillStyle = "rgba(2,5,9,0.8)";
        ctx.fillRect(0, BOX.y - 60, W, OIBOX.y + OIBOX.h - BOX.y + 80);
        ctx.translate(W / 2, 800);
        ctx.scale(lerp(0.35, 1, zoom), lerp(0.35, 1, zoom));
        ctx.translate(-W / 2, -800);
        text(title, W / 2, top - 30, { size: 30, color: COL.text, align: "center" });
        text("主動賣", px + pw / 2 - 20, top - 70 + 0, { size: 22, color: COL.sell, align: "right", alpha: 0 });
        const rowsDesc = [...rows].sort((x, y) => y[0] - x[0]);
        rowsDesc.forEach(([p, buy, sell], k) => {
          const y = top + k * rowH;
          const hl = highlight(p, t);
          const strength = Math.sqrt((buy + sell) / max);
          ctx.fillStyle = rgba(sell > buy ? COL.sell : COL.buy, 0.12 + 0.4 * strength + 0.25 * hl);
          ctx.fillRect(px + 150, y + 2, pw - 150, rowH - 4);
          if (hl > 0) {
            ctx.strokeStyle = rgba(COL.gold, hl);
            ctx.lineWidth = 3;
            ctx.strokeRect(px + 150, y + 2, pw - 150, rowH - 4);
          }
          text(fmt(p), px + 130, y + rowH / 2 + 9, { font: MONO, size: 24, weight: 500, color: COL.muted, align: "right" });
          text(fmt(sell, sell < 10 ? 1 : 0), px + 150 + (pw - 150) / 2 - 24, y + rowH / 2 + 12, { font: MONO, size: 30, weight: 600, color: "#ffe2cd", align: "right" });
          text(fmt(buy, buy < 10 ? 1 : 0), px + 150 + (pw - 150) / 2 + 24, y + rowH / 2 + 12, { font: MONO, size: 30, weight: 600, color: "#d6fffa" });
        });
        text("主動賣", px + 150 + (pw - 150) / 2 - 24, top + rows.length * rowH + 40, { size: 24, color: COL.sell, align: "right" });
        text("主動買", px + 150 + (pw - 150) / 2 + 24, top + rows.length * rowH + 40, { size: 24, color: COL.buy });
        if (priceLine) priceLine(top, rowH, rowsDesc, px, pw);
        ctx.restore();
        note(a, top + rows.length * rowH + 110);
      }

      function drawAbsorption(t) {
        const bar = D.m1.find((b) => b.t === D.sweep.t);
        footprintPanel(t, {
          t0: C.s5 - 0.2,
          t1: C.s6 + 0.2,
          rows: bar.levels,
          title: "13:17 這一分鐘的足跡（每格 50 美元）",
          highlight: (p, t) => (p <= 89450 ? prog(t, C.sold + (89450 - p) / 50 * 0.38, C.sold + (89450 - p) / 50 * 0.38 + 0.2) : 0),
          note: (a, y) => {
            const k = prog(t, C.buyers - 0.2, C.buyers + 0.3);
            text("低點上方 0.15% 內", W / 2, y, { size: 28, weight: 500, color: COL.muted, align: "center", alpha: a * k });
            text(`主動賣 ${D.sweep.absorb.sell} · 主動買 ${D.sweep.absorb.buy}`, W / 2, y + 70, { font: NUM, size: 64, color: COL.sell, align: "center", alpha: a * k });
            const kh = prog(t, C.held, C.held + 0.4);
            text("價格停在 89,368.9，沒有再往下", W / 2, y + 130, { size: 30, color: COL.gold, align: "center", alpha: a * kh });
          },
        });
        if (t > C.s5 - 0.2 && t < C.s6) {
          hud.ms = D.sweep.t + MIN;
          hud.price = D.sweep.low;
          hud.color = COL.sell;
        }
      }

      function drawEntryImbalance(t) {
        const rows = D.entryBar.levels.filter((r) => r[0] >= 90190 && r[0] <= 90320);
        const map = new Map(rows.map((r) => [r[0], r]));
        footprintPanel(t, {
          t0: C.imb - 0.6,
          t1: C.entry + 0.1,
          rows,
          title: "15:20 回測 VAL 的足跡（每格 10 美元）",
          highlight: (p, t) => (p === 90190 || p === 90200 ? prog(t, C.imb + 0.3, C.imb + 0.6) : 0),
          priceLine: (top, rowH, desc, px, pw) => {
            // Diagonal: buy at a price against the sell one level below.
            const k = prog(t, C.imb + 0.4, C.imb + 0.9);
            if (k <= 0) return;
            const iy = (p) => top + desc.findIndex((r) => r[0] === p) * rowH + rowH / 2;
            const sellX = px + 150 + (pw - 150) / 2 - 90;
            const buyX = px + 150 + (pw - 150) / 2 + 90;
            ctx.strokeStyle = rgba(COL.gold, k);
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(sellX, iy(90190));
            ctx.lineTo(buyX, iy(90200));
            ctx.stroke();
            text("×30", buyX + 70, iy(90200) + 10, { font: NUM, size: 40, color: COL.gold, alpha: k });
            text("下方沒有賣單", buyX + 70, iy(90190) + 10, { size: 22, color: COL.gold, alpha: k });
          },
          note: (a, y) => {
            const k = prog(t, C.imb + 0.6, C.imb + 1.0);
            const b = map.get(90200);
            const below = map.get(90190);
            text(`90,200：主動買 ${b[1]} 對 左下 主動賣 ${below[2]}`, W / 2, y, { size: 30, color: COL.text, align: "center", alpha: a * k });
            text("連續兩格：買方不平衡", W / 2, y + 66, { size: 46, weight: 900, color: COL.buy, align: "center", alpha: a * k });
          },
        });
      }

      function draw(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.bg;
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, 880, 120, W / 2, 880, 1200);
        g.addColorStop(0, "rgba(16,31,45,0.5)");
        g.addColorStop(1, "rgba(4,7,11,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
        drawTitle(t);
        drawChart(t);
        drawOi(t);
        drawBreak(t);
        drawAbsorption(t);
        drawEntryImbalance(t);
        drawEvidence(t);
        drawHud(t);
        drawRail(t);
      }

      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 100px ${NUM}`),
        document.fonts.load(`400 20px ${MONO}`),
        document.fonts.load(`700 40px ${TC}`, "掃過前低"),
      ]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        CAPS.forEach(([a, b], i) => {
          const el = document.getElementById(`cap${i}`);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, a);
          tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, b - 0.18);
        });
        tl.fromTo("#end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, C.s10 + 0.2);
        tl.fromTo("#disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, C.s10 + 0.7);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
