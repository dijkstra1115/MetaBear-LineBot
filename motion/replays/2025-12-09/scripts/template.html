    <style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <div id="stage" data-layout-ignore>
        <div id="world">
          <canvas id="p-bg" class="plane" width="1000" height="1450"></canvas>
          <canvas id="p-fp" class="plane" width="1600" height="2000"></canvas>
          <canvas id="p-oi" class="plane" width="1920" height="440"></canvas>
          <canvas id="p-chart" class="plane" width="1920" height="1520"></canvas>
        </div>
      </div>
      <canvas id="overlay" width="1080" height="1920" data-layout-ignore></canvas>

      <div class="layer clip" id="endcard" data-start="{{S10}}" data-duration="{{S10LEN}}" data-track-index="3">

          <div class="url">metabear.io</div>
        </div>
        <p class="disclaimer" id="disclaimer">資料：幣安 BTCUSDT 永續合約｜時間為台灣時間｜歷史案例教學，非投資建議</p>
      </div>

      <div class="caps" id="caps">
{{CAPTIONS_HTML}}
      </div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="{{END}}" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const D = /*@DATA*/ null;
      const C = /*@CUES*/ null;
      const END = {{END}};
      const CAPS = /*@CAPTIONS*/ null;
      const EV_T0 = /*@EVT0*/ null;
      const EV_DUR = {{EVDUR}};

      const W = 1080;
      const H = 1920;
      const COL = { bg: "#04070b", panel: "#0a121c", ink: "#05090f", buy: "#78e1d5", sell: "#f09a5a", gold: "#e8bd7d", red: "#ff8a7f", oi: "#c3d0dc", text: "#edf2ed", muted: "#94a8b9", dim: "#5f7486", line: "#2a3a4a", grid: "rgba(120,160,190,0.09)" };
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';
      const MIN = 60_000;
      const M5 = 300_000;
      const U = (s) => Date.parse(s + "Z");

      // ---------- helpers: every frame is a pure function of film time t ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const ease = {
        linear: (k) => k,
        inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
        p2inOut: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
        p4out: (k) => 1 - Math.pow(1 - k, 4),
        out3: (k) => 1 - Math.pow(1 - k, 3),
        expoOut: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
        circOut: (k) => Math.sqrt(1 - Math.pow(k - 1, 2)),
        backOut: (k) => 1 + 2.4 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2),
        inExpo: (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10)),
      };
      const win = (t, a, b, fi, fo) => (t < a || t > b ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1));
      const pulse = (t, t0, decay = 6) => (t < t0 ? 0 : Math.exp(-(t - t0) * decay));
      const fmt = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
      const rgba = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };
      const taipei = (ms) => {
        const d = new Date(ms + 8 * 3600_000);
        return `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
      };
      function text(ctx, str, x, y, { font = TC, size, weight = 700, color = COL.text, align = "left", alpha = 1, base = "alphabetic", track = 0, glow = 0 }) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = base;
        if (track) ctx.letterSpacing = `${track}px`;
        if (glow) {
          ctx.shadowColor = color;
          ctx.shadowBlur = glow;
        }
        ctx.fillText(str, x, y);
        ctx.restore();
      }
      function hline(ctx, x1, x2, y, color, width, alpha, dash) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        ctx.restore();
      }
      function rrect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function ring(ctx, x, y, t, t0, { r0 = 10, r1 = 70, color = COL.gold, dur = 0.7, width = 3 } = {}) {
        const k = prog(t, t0, t0 + dur);
        if (k <= 0 || k >= 1) return;
        ctx.save();
        ctx.globalAlpha *= 1 - k;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.arc(x, y, lerp(r0, r1, ease.out3(k)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      function checkGlyph(ctx, x, y, s, color, a) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.6 * s;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x - 7 * s, y);
        ctx.lineTo(x - 2 * s, y + 5 * s);
        ctx.lineTo(x + 8 * s, y - 6 * s);
        ctx.stroke();
        ctx.restore();
      }

      // ---------- planes ----------
      const plane = (id, scale) => {
        const el = document.getElementById(id);
        return { el, ctx: el.getContext("2d"), scale, w: el.width / scale, h: el.height / scale };
      };
      const PL = { bg: plane("p-bg", 0.25), fp: plane("p-fp", 2), oi: plane("p-oi", 2), chart: plane("p-chart", 2) };
      const ov = document.getElementById("overlay").getContext("2d");
      const stage = document.getElementById("stage");
      const world = document.getElementById("world");
      // Static depths of each plane (translateZ); the camera moves the world, never the planes.
      const Z = { bg: -2600, fp: -1100, oi: -40, chart: 0 };
      function placePlanes() {
        PL.bg.el.style.transform = `translateZ(${Z.bg}px) scale(2.85)`;
        PL.fp.el.style.transform = `translateZ(${Z.fp}px)`;
        PL.oi.el.style.transform = `translateZ(${Z.oi}px)`;
        PL.chart.el.style.transform = `translateZ(${Z.chart}px)`;
      }
      function begin(p) {
        p.ctx.setTransform(p.scale, 0, 0, p.scale, 0, 0);
        p.ctx.clearRect(0, 0, p.w, p.h);
        return p.ctx;
      }

      // ---------- data ----------
      const byT = new Map();
      for (const b of [...D.m5, ...D.wait]) if (!byT.has(b.t)) byT.set(b.t, b);
      const S = [...byT.values()].sort((a, b) => a.t - b.t);
      const P = D.prior;
      const PLAN = D.plan;
      const SWEEP_BAR = S.find((b) => b.t === U("2025-12-09T05:15:00"));
      const RETESTS = ["2025-12-09T05:45:00", "2025-12-09T05:50:00", "2025-12-09T06:25:00", "2025-12-09T06:30:00"].map((s) => S.find((b) => b.t === U(s)));
      const RECLAIM_BAR = S.find((b) => b.t === U("2025-12-09T07:15:00"));
      const DIP = D.wait.reduce((m, b) => (b.l < m.l ? b : m));

      // Film time → market time traded so far (piecewise linear).
      const REVEAL = [
        [0, U("2025-12-09T03:00:00")],
        [C.four + 0.2, U("2025-12-09T03:00:00")],
        [C.s2 + 2.0, U("2025-12-09T05:10:00")],
        [C.s3 - 0.2, U("2025-12-09T05:15:00")],
        [C.back + 0.6, U("2025-12-09T05:20:00")],
        [C.s4 + 0.3, U("2025-12-09T05:20:00")],
        [C.oiDrop + 1.2, U("2025-12-09T05:35:00")],
        [C.s6 + 0.2, U("2025-12-09T05:35:00")],
        [C.lessSell + 0.8, U("2025-12-09T07:05:00")],
        [C.reclaim - 1.0, U("2025-12-09T07:15:00")],
        [C.reclaim + 0.2, U("2025-12-09T07:20:00")],
        [C.imb - 0.5, U("2025-12-09T07:20:00")],
        [C.entry - 0.2, U("2025-12-09T07:25:00")],
        [C.s9 + 0.3, U("2025-12-09T07:25:00")],
        [C.dip + 0.4, DIP.t + M5],
        [C.surge, U("2025-12-09T15:25:00")],
        [C.t1, PLAN.t1T],
        [C.t2, PLAN.t2T],
        [C.t2 + 0.8, U("2025-12-09T15:50:00")],
      ];
      function reveal(t) {
        for (let i = 1; i < REVEAL.length; i++) if (t < REVEAL[i][0]) return lerp(REVEAL[i - 1][1], REVEAL[i][1], prog(t, REVEAL[i - 1][0], REVEAL[i][0]));
        return REVEAL.at(-1)[1];
      }
      // The chart's data window per scene, eased between keyframes (the "lens" inside the plane).
      const VIEWS = [
        [C.s2, { t0: U("2025-12-09T03:00:00"), t1: U("2025-12-09T05:25:00"), lo: 89000, hi: 92300 }],
        [C.s3, { t0: U("2025-12-09T04:20:00"), t1: U("2025-12-09T05:30:00"), lo: 89200, hi: 90600 }],
        [C.s4, { t0: U("2025-12-09T04:20:00"), t1: U("2025-12-09T05:45:00"), lo: 89200, hi: 90600 }],
        [C.s6, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:15:00"), lo: 89200, hi: 90600 }],
        [C.s7, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:30:00"), lo: 89200, hi: 90600 }],
        [C.stop - 0.6, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T07:50:00"), lo: 89000, hi: 92300 }],
        [C.s9, { t0: U("2025-12-09T05:00:00"), t1: U("2025-12-09T16:00:00"), lo: 89000, hi: 92700 }],
      ];
      function view(t) {
        let v = VIEWS[0][1];
        for (let i = 1; i < VIEWS.length; i++) {
          const [at, next] = VIEWS[i];
          const k = ease.inOut(prog(t, at - 0.4, at + 1.0));
          if (k <= 0) break;
          v = Object.fromEntries(Object.keys(v).map((key) => [key, lerp(v[key], next[key], k)]));
        }
        return v;
      }

      // ---------- camera: one pose, legs in sequence ----------
      // Pose = world transform: translate3d(x, y, z) rotateX(rx) rotateY(ry). Camera in → z up.
      const FLAT = { x: 0, y: 0, z: 0, rx: 0, ry: 0 };
      const POSE = {
        surge: { x: -330, y: 120, z: 330, rx: 14, ry: -16 },
        brk: { x: -150, y: 20, z: 380, rx: -6, ry: 14 },
        wide: { x: 0, y: -20, z: -300, rx: 26, ry: 0 },
        loc: { x: 0, y: 30, z: 10, rx: 10, ry: 0 },
        bar: { x: -40, y: 10, z: 170, rx: 6, ry: -4 },
        oi: { x: 0, y: -330, z: 120, rx: 16, ry: 0 },
        inside: { x: 0, y: -20, z: 1040, rx: 0, ry: 0 },
        pan: { x: 0, y: 30, z: 40, rx: 4, ry: 7 },
        panEnd: { x: 0, y: 30, z: 40, rx: 4, ry: -5 },
        reclaim: { x: -200, y: 170, z: 200, rx: 4, ry: -9 },
        exec: { x: 0, y: 20, z: 40, rx: 8, ry: 0 },
        waitA: { x: 0, y: 0, z: -70, rx: 6, ry: 8 },
        waitB: { x: 0, y: 0, z: -70, rx: 6, ry: -6 },
        whip: { x: 0, y: 170, z: 90, rx: -4, ry: -4 },
        end: { x: 0, y: 60, z: -1700, rx: 22, ry: 0 },
      };
      // [start, end, target pose, ease]
      const LEGS = [
        [0, 1.0, POSE.brk, "p4out"],
        [C.hook2 - 0.02, C.hook2 + 0.01, POSE.surge, "linear"], // hard cut
        [C.four - 0.15, C.four + 0.9, POSE.wide, "p4out"],
        [C.s2, C.s3 - 0.3, POSE.loc, "p2inOut"],
        [C.s3 - 0.2, C.s3 + 0.9, POSE.bar, "p4out"],
        [C.s4 - 0.1, C.s4 + 1.1, POSE.oi, "p2inOut"],
        [C.s5 - 0.1, C.s5 + 1.6, POSE.inside, "p4out"],
        [C.s6 - 0.1, C.s6 + 1.4, POSE.pan, "p2inOut"],
        [C.s6 + 1.4, C.s7 - 0.2, POSE.panEnd, "p2inOut"],
        [C.s7 - 0.1, C.s7 + 1.4, POSE.reclaim, "p2inOut"],
        [C.s8 - 0.1, C.s8 + 1.6, POSE.inside, "p4out"],
        [C.entry - 0.9, C.entry + 0.3, POSE.exec, "p4out"],
        [C.s9 - 0.1, C.s9 + 1.0, POSE.waitA, "p2inOut"],
        [C.s9 + 1.0, C.surge - 0.3, POSE.waitB, "p2inOut"],
        [C.surge - 0.3, C.surge + 0.6, POSE.whip, "p4out"],
        [C.s10 - 0.1, C.s10 + 2.2, POSE.end, "p2inOut"],
      ];
      function poseAt(t) {
        let p = { ...FLAT, z: 120 };
        for (const [a, b, to, e] of LEGS) {
          if (t <= a) break;
          const k = ease[e](prog(t, a, b));
          p = Object.fromEntries(Object.keys(p).map((key) => [key, lerp(p[key], to[key], k)]));
        }
        // Impact shake on the break and the hook cut (deterministic, decays fast).
        const hit = pulse(t, 0.55, 9) + pulse(t, C.brk + 0.35, 6);
        p.x += hit * 14 * Math.sin(t * 61);
        p.y += hit * 10 * Math.sin(t * 47 + 1);
        return p;
      }
      function applyCamera(t) {
        const p = poseAt(t);
        world.style.transform = `translate3d(${p.x}px, ${p.y}px, ${p.z}px) rotateX(${p.rx}deg) rotateY(${p.ry}deg)`;
        // Travel blur rides camera speed; sharp the instant a leg lands.
        const q = poseAt(Math.max(0, t - 1 / 30));
        const speed = Math.hypot(p.x - q.x, p.y - q.y, (p.z - q.z) * 0.6) + Math.abs(p.rx - q.rx) * 6 + Math.abs(p.ry - q.ry) * 6;
        const cut = t >= C.hook2 - 0.02 && t <= C.hook2 + 0.05;
        const travel = cut ? 0 : clamp((speed - 6) / 50) * 7;
        // Depth of field: the world softens while an evidence card holds, and at the end.
        const card = Math.max(...EV_T0.map((t0) => win(t - t0, 0.3, 1.9, 0.3, 0.3)));
        const endBlur = prog(t, C.s10, C.s10 + 1.6) * 8;
        stage.style.filter = `blur(${(travel + card * 6 + endBlur).toFixed(2)}px) brightness(${(1 - card * 0.45 - prog(t, C.s10, C.s10 + 1.6) * 0.5).toFixed(3)})`;
        // The chart is passed through on the dives into the footprint.
        PL.chart.el.style.opacity = (1 - prog(p.z, 640, 940)).toFixed(3);
        PL.oi.el.style.opacity = (1 - prog(p.z, 600, 900)).toFixed(3);
        // Rack focus to the OI plane in confirmation 1.
        const oiFocus = win(t, C.s4 + 0.4, C.s5 - 0.2, 0.6, 0.4);
        PL.chart.el.style.filter = `blur(${(oiFocus * 5).toFixed(2)}px)`;
        return p;
      }

      // ---------- background plane: deep dots for parallax ----------
      function drawBackground() {
        const ctx = begin(PL.bg);
        let s = 9;
        const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        for (let i = 0; i < 520; i++) {
          const x = rnd() * PL.bg.w;
          const y = rnd() * PL.bg.h;
          const r = 0.4 + rnd() * 1.4;
          ctx.fillStyle = `rgba(150,190,210,${(0.15 + rnd() * 0.45).toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        for (let gx = 0; gx <= PL.bg.w; gx += 50) hline(ctx, gx, gx, 0, COL.grid, 0, 0);
        ctx.strokeStyle = "rgba(120,160,190,0.05)";
        ctx.lineWidth = 0.5;
        for (let gy = 0; gy <= PL.bg.h; gy += 36) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(PL.bg.w, gy);
          ctx.stroke();
        }
      }

      // ---------- chart plane ----------
      const CB = { x: 40, y: 40, w: 880, h: 680 };
      const hud = { ms: U("2025-12-09T15:30:00"), price: null, color: COL.text };
      const mapX = (v, ms) => CB.x + ((ms - v.t0) / (v.t1 - v.t0)) * CB.w;
      const mapY = (v, p) => CB.y + ((v.hi - p) / (v.hi - v.lo)) * CB.h;
      function grid(ctx, v) {
        const step = v.hi - v.lo > 2400 ? 500 : 200;
        for (let p = Math.ceil(v.lo / step) * step; p <= v.hi; p += step) {
          hline(ctx, CB.x, CB.x + CB.w, mapY(v, p), COL.grid, 1, 1);
          text(ctx, fmt(p), CB.x + CB.w - 4, mapY(v, p) - 6, { font: MONO, size: 16, weight: 400, color: COL.dim, align: "right" });
        }
      }
      function candles(ctx, v, now, { from = 0 } = {}) {
        const bw = Math.max(2, (M5 / (v.t1 - v.t0)) * CB.w * 0.62);
        let last = null;
        for (const b of S) {
          if (b.t < from) continue;
          if (b.t >= now) break;
          const g = clamp((now - b.t) / M5);
          const cx = mapX(v, b.t + M5 / 2);
          if (cx < CB.x - 20 || cx > CB.x + CB.w + 20) continue;
          const close = lerp(b.o, b.c, g);
          const col = close >= b.o ? COL.buy : COL.sell;
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1.5, bw * 0.12);
          ctx.beginPath();
          ctx.moveTo(cx, mapY(v, lerp(b.o, b.h, g)));
          ctx.lineTo(cx, mapY(v, lerp(b.o, b.l, g)));
          ctx.stroke();
          const y1 = mapY(v, Math.max(b.o, close));
          ctx.fillStyle = col;
          ctx.fillRect(cx - bw / 2, y1, bw, Math.max(1.5, mapY(v, Math.min(b.o, close)) - y1));
          last = { b, close, cx };
        }
        return last;
      }
      function level(ctx, v, price, label, color, alpha, dash, width = 2) {
        if (alpha <= 0 || price < v.lo || price > v.hi) return;
        const y = mapY(v, price);
        hline(ctx, CB.x, CB.x + CB.w, y, color, width, alpha, dash);
        text(ctx, label, CB.x + 6, y - 10, { size: 20, color, alpha });
      }
      function targets(ctx, v, t, x0, hits) {
        for (const [price, label, hitT] of [
          [PLAN.t1, "目標一 POC", hits[0]],
          [PLAN.t2, "目標二 VAH", hits[1]],
        ]) {
          if (price < v.lo || price > v.hi) continue;
          const hit = prog(t, hitT, hitT + 0.25);
          const y = mapY(v, price);
          const col = hit > 0.5 ? COL.buy : COL.gold;
          hline(ctx, x0, CB.x + CB.w, y, col, 2.5 + 2 * pulse(t, hitT, 4), 1, hit > 0.5 ? null : [10, 6]);
          text(ctx, `${label} ${fmt(price)}`, CB.x + CB.w - 8, y - 12, { size: 22, color: col, align: "right" });
          if (hit > 0) {
            const cx = CB.x + CB.w - 260;
            checkGlyph(ctx, cx, y - 20, 1.5 + 0.6 * pulse(t, hitT, 5), COL.buy, hit);
            ring(ctx, cx, y - 20, t, hitT, { r0: 12, r1: 110, color: COL.buy, dur: 0.8, width: 4 });
          }
        }
      }

      // Hook A: the surge through both targets, compressed into one second.
      function chartHookSurge(ctx, t) {
        const v = { t0: U("2025-12-09T13:20:00"), t1: U("2025-12-09T15:55:00"), lo: 89600, hi: 92400 };
        grid(ctx, v);
        const now = lerp(U("2025-12-09T15:20:00"), U("2025-12-09T15:50:00"), ease.out3(prog(t, 0, 1.2)));
        level(ctx, v, PLAN.entry, `進場 ${fmt(PLAN.entry)}`, COL.gold, 0.8, [10, 6]);
        targets(ctx, v, t, CB.x, [0.75, 1.15]);
        const last = candles(ctx, v, now);
        if (last) {
          hud.ms = last.b.t + M5;
          hud.price = last.close;
          hud.color = COL.buy;
        }
      }

      // The break, minute by minute (hook B and scene 3).
      function chartBreak(ctx, t, { start, low, back, fast }) {
        const bars = D.m1;
        const lo = 89300;
        const hi = 89900;
        const y = (p) => CB.y + ((hi - p) / (hi - lo)) * CB.h;
        const step = CB.w / bars.length;
        const di = bars.findIndex((b) => b.t === D.sweep.t);
        const shown = (i) => (i < di ? prog(t, start + i * (fast ? 0 : 0.06), start + 0.25 + i * (fast ? 0 : 0.06)) : i === di ? prog(t, start + 0.3, start + 0.4) : prog(t, back + (i - di - 1) * 0.15, back + 0.2 + (i - di - 1) * 0.15));
        const dive = ease.inOut(prog(t, start + 0.4, low));
        for (let p = lo; p <= hi; p += 100) {
          hline(ctx, CB.x, CB.x + CB.w, y(p), COL.grid, 1, 1);
          text(ctx, fmt(p), CB.x + CB.w - 4, y(p) - 6, { font: MONO, size: 16, weight: 400, color: COL.dim, align: "right" });
        }
        const flash = pulse(t, start + 0.5, 2.2);
        hline(ctx, CB.x, CB.x + CB.w, y(P.low), flash > 0.05 ? COL.red : COL.gold, 2 + 4 * flash, 1, [14, 8]);
        text(ctx, `前低 ${fmt(P.low, 0)}`, CB.x + 6, y(P.low) - 12, { size: 22, color: flash > 0.05 ? COL.red : COL.gold });
        let price = bars[0].o;
        bars.forEach((b, i) => {
          const g = shown(i);
          if (g <= 0) return;
          const cx = CB.x + step * (i + 0.5);
          const isDive = i === di;
          const lowNow = isDive ? lerp(b.o, b.l, dive) : b.l;
          const closeNow = isDive ? (dive < 1 ? lowNow + (b.o - lowNow) * 0.15 : lerp(lowNow, b.c, prog(t, low, back - 0.2))) : b.c;
          const col = closeNow >= b.o ? COL.buy : COL.sell;
          ctx.save();
          ctx.globalAlpha *= g;
          ctx.strokeStyle = col;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx, y(isDive ? Math.max(b.h, b.o) : b.h));
          ctx.lineTo(cx, y(lowNow));
          ctx.stroke();
          const y1 = y(Math.max(b.o, closeNow));
          ctx.fillStyle = col;
          ctx.fillRect(cx - step * 0.3, y1, step * 0.6, Math.max(2, y(Math.min(b.o, closeNow)) - y1));
          text(ctx, taipei(b.t), cx, CB.y + CB.h + 26, { font: MONO, size: 15, weight: 400, color: isDive ? COL.text : COL.dim, align: "center" });
          ctx.restore();
          if (isDive && dive > 0) {
            ring(ctx, cx, y(P.low), t, start + 0.5, { color: COL.red, r1: 140, dur: 0.9 });
            ring(ctx, cx, y(P.low), t, start + 0.7, { color: COL.red, r1: 190, dur: 1.0 });
          }
          price = isDive ? closeNow : b.c;
        });
        hud.ms = Math.min(D.sweep.t + MIN, D.m1[0].t + MIN * (di + clamp(dive) + 1));
        hud.price = price;
        hud.color = COL.sell;
        return { di, step, y };
      }

      function chartMain(ctx, t) {
        const v = view(t);
        const now = reveal(t);
        grid(ctx, v);
        // Prior-day profile, faint, on the right.
        const prof = win(t, C.s2 + 0.4, C.s4, 0.8, 0.8) + win(t, C.targets, C.s10, 0.6, 0.6) * 0.5;
        if (prof > 0) {
          const max = Math.max(...D.profile.map((r) => r[1]));
          for (const [p, vol] of D.profile) {
            if (p < v.lo || p + 100 > v.hi) continue;
            const inVA = p >= P.val - 100 && p <= P.vah;
            const len = (vol / max) * 200;
            ctx.fillStyle = rgba(inVA ? COL.gold : COL.muted, (inVA ? 0.22 : 0.12) * prof);
            ctx.fillRect(CB.x + CB.w - len, mapY(v, p + 100) + 1, len, Math.max(1, mapY(v, p) - mapY(v, p + 100) - 2));
          }
        }
        // Levels: the two location lines sweep in like lasers.
        const sweep = (t0) => ease.out3(prog(t, t0, t0 + 0.6));
        const reclaimed = prog(t, C.reclaim, C.reclaim + 0.4);
        const brokeFlash = pulse(t, C.brk, 2.5);
        const lowK = sweep(C.low);
        if (lowK > 0 && P.low > v.lo && P.low < v.hi) {
          const y = mapY(v, P.low);
          const col = brokeFlash > 0.05 ? COL.red : COL.gold;
          hline(ctx, CB.x, CB.x + CB.w * lowK, y, col, 2 + 3 * pulse(t, C.low, 3), 0.85 - 0.35 * prog(t, C.s7, C.s8), [14, 8]);
          text(ctx, `前低 ${fmt(P.low, 0)}`, CB.x + 6, y - 10, { size: 20, color: col, alpha: lowK });
        }
        const valK = sweep(C.val);
        if (valK > 0 && P.val > v.lo && P.val < v.hi) {
          const y = mapY(v, P.val);
          const col = reclaimed > 0.5 ? COL.buy : COL.gold;
          hline(ctx, CB.x, CB.x + CB.w * valK, y, col, 2 + 3 * pulse(t, C.val, 3) + 3 * pulse(t, C.reclaim, 3), 1, reclaimed > 0.5 ? null : [14, 8]);
          text(ctx, `VAL ${fmt(P.val)}`, CB.x + 6, y - 10, { size: 20, color: col, alpha: valK });
          // A light sweep runs along VAL when it is reclaimed.
          const ls = prog(t, C.reclaim, C.reclaim + 0.9);
          if (ls > 0 && ls < 1) {
            const lx = CB.x + CB.w * ease.out3(ls);
            const g = ctx.createLinearGradient(lx - 160, 0, lx + 40, 0);
            g.addColorStop(0, rgba(COL.buy, 0));
            g.addColorStop(1, rgba(COL.buy, 0.9));
            ctx.fillStyle = g;
            ctx.fillRect(lx - 160, y - 4, 200, 8);
          }
          ring(ctx, mapX(v, RECLAIM_BAR.t + M5 / 2), y, t, C.reclaim, { r0: 14, r1: 120, color: COL.buy, dur: 0.8 });
        }
        level(ctx, v, P.poc, `POC ${fmt(P.poc)}`, COL.muted, prof * 0.9, [6, 8]);
        level(ctx, v, P.vah, `VAH ${fmt(P.vah)}`, COL.muted, prof * 0.9, [6, 8]);
        const last = candles(ctx, v, now);
        // Scene 6: later dips stay above the sweep low, with far less selling.
        const kd = win(t, C.s6 + 0.3, C.s7 + 0.6, 0.5, 0.6);
        if (kd > 0) {
          const pts = [SWEEP_BAR, ...RETESTS].filter((b) => b.t < now);
          ctx.save();
          ctx.globalAlpha *= kd;
          ctx.strokeStyle = rgba(COL.gold, 0.85);
          ctx.setLineDash([8, 8]);
          ctx.lineWidth = 2;
          ctx.beginPath();
          pts.forEach((b, i) => (i ? ctx.lineTo : ctx.moveTo).call(ctx, mapX(v, b.t + M5 / 2), mapY(v, b.l) + 14));
          ctx.stroke();
          ctx.setLineDash([]);
          pts.forEach((b, i) => {
            const x = mapX(v, b.t + M5 / 2);
            const y = mapY(v, b.l) + 14;
            const pop = ease.backOut(prog(t, C.s6 + 0.4 + i * 0.5, C.s6 + 0.7 + i * 0.5));
            ctx.fillStyle = i ? COL.gold : COL.sell;
            ctx.beginPath();
            ctx.arc(x, y, 7 * pop, 0, Math.PI * 2);
            ctx.fill();
            text(ctx, `Δ ${b.delta > 0 ? "+" : ""}${fmt(b.delta)}`, x, y + 32, { font: NUM, size: i ? 26 * pop : 34 * pop, color: i ? COL.gold : COL.sell, align: "center", alpha: pop });
          });
          ctx.restore();
        }
        // Scene 8: entry drops in, then stop and targets.
        const ke = prog(t, C.entry - 0.25, C.entry);
        if (ke > 0) {
          const ex = mapX(v, PLAN.entryT);
          const ey = mapY(v, PLAN.entry);
          const ks = ease.out3(prog(t, C.stop, C.stop + 0.6));
          const kt = ease.out3(prog(t, C.targets, C.targets + 0.6));
          if (ks > 0) {
            ctx.fillStyle = rgba(COL.red, 0.12 * ks);
            const sy = mapY(v, PLAN.stop);
            ctx.fillRect(ex, ey, (CB.x + CB.w - ex) * ks, sy - ey);
            hline(ctx, ex, ex + (CB.x + CB.w - ex) * ks, sy, COL.red, 2.5, 1);
            text(ctx, `停損 ${fmt(PLAN.stop)}`, CB.x + CB.w - 8, sy + 28, { size: 22, color: COL.red, align: "right", alpha: ks });
          }
          if (kt > 0) {
            ctx.fillStyle = rgba(COL.buy, 0.08 * kt);
            const ty = mapY(v, PLAN.t2);
            ctx.fillRect(ex, ty + (ey - ty) * (1 - kt), CB.x + CB.w - ex, (ey - ty) * kt);
            ctx.save();
            ctx.globalAlpha *= kt;
            targets(ctx, v, t, ex, [C.t1, C.t2]);
            ctx.restore();
          }
          // The needle falls from above with a short streak, then rests.
          const drop = ease.p4out(prog(t, C.entry - 0.25, C.entry + 0.15));
          const ny = lerp(ey - 360, ey, drop);
          for (let k = 3; k >= 1; k--) {
            ctx.fillStyle = rgba(COL.gold, 0.18 * (1 - drop) / k);
            ctx.beginPath();
            ctx.arc(ex, ny - k * 26 * (1 - drop), 10, 0, Math.PI * 2);
            ctx.fill();
          }
          hline(ctx, ex, CB.x + CB.w, ey, COL.gold, 2.5, drop, [10, 6]);
          ctx.fillStyle = COL.gold;
          ctx.beginPath();
          ctx.arc(ex, ny, 10 + 10 * pulse(t, C.entry + 0.1, 4), 0, Math.PI * 2);
          ctx.fill();
          ring(ctx, ex, ey, t, C.entry + 0.1, { r0: 10, r1: 90, color: COL.gold });
          text(ctx, `進場 ${fmt(PLAN.entry)}`, ex - 16, ey - 18, { size: 24, color: COL.gold, align: "right", alpha: drop });
        }
        // Scene 9: the deepest dip while waiting.
        const kw = win(t, C.dip, C.night + 0.4, 0.4, 0.6);
        if (kw > 0) {
          const x = mapX(v, DIP.t + M5 / 2);
          const y = mapY(v, DIP.l);
          ctx.fillStyle = rgba(COL.gold, kw);
          ctx.beginPath();
          ctx.arc(x, y + 12, 7, 0, Math.PI * 2);
          ctx.fill();
          text(ctx, `最低 ${fmt(DIP.l)} · 距停損 ${fmt(DIP.l - PLAN.stop)}`, x, y + 50, { size: 24, color: COL.gold, align: "center", alpha: kw });
        }
        if (last && t >= C.s2 + 0.3) {
          hud.ms = last.b.t + M5 * clamp((now - last.b.t) / M5);
          hud.price = last.close;
          hud.color = last.close >= PLAN.entry && t > C.entry ? COL.buy : COL.text;
        }
        return { v, now };
      }

      function drawChartPlane(t) {
        const ctx = begin(PL.chart);
        if (t < C.hook2) return chartBreak(ctx, t, { start: -0.15, low: 0.6, back: 99, fast: true });
        if (t < C.four + 0.2) {
          ctx.save();
          ctx.globalAlpha = 1 - prog(t, C.four - 0.1, C.four + 0.2);
          chartHookSurge(ctx, t - C.hook2);
          ctx.restore();
          return;
        }
        // Scene 3 match cut: the 13:15 bar widens to fill the plane and splits into minutes.
        const morph = prog(t, C.brk - 0.75, C.brk - 0.15);
        const minute = win(t, C.brk - 0.35, C.s4 + 0.4, 0.25, 0.5);
        if (minute < 1) {
          ctx.save();
          ctx.globalAlpha = 1 - minute;
          const { v } = chartMain(ctx, t);
          if (morph > 0 && morph < 1 && t < C.s4) {
            const x0 = mapX(v, SWEEP_BAR.t + M5 * 0.2);
            const x1 = mapX(v, SWEEP_BAR.t + M5 * 0.8);
            const k = ease.inOut(morph);
            ctx.strokeStyle = rgba(COL.sell, 0.9);
            ctx.lineWidth = 3;
            ctx.strokeRect(lerp(x0, CB.x, k), lerp(mapY(v, SWEEP_BAR.h), CB.y, k), lerp(x1 - x0, CB.w, k), lerp(mapY(v, SWEEP_BAR.l) - mapY(v, SWEEP_BAR.h), CB.h, k));
          }
          ctx.restore();
        }
        if (minute > 0) {
          ctx.save();
          ctx.globalAlpha = minute;
          const r = chartBreak(ctx, t, { start: C.brk - 0.35, low: C.lowest + 0.4, back: C.back, fast: false });
          const kv = prog(t, C.minute, C.minute + 0.4);
          if (kv > 0) text(ctx, "1 分鐘 1,504 BTC · Δ −798", CB.x + r.step * (r.di + 0.5) - 24, CB.y + CB.h - 30, { font: NUM, size: 40, color: COL.sell, align: "right", alpha: kv });
          const kl = prog(t, C.lowest, C.lowest + 0.4);
          if (kl > 0) text(ctx, `最低 ${fmt(D.sweep.low, 1)}`, CB.x + r.step * (r.di + 0.5) + 18, r.y(D.sweep.low) + 10, { font: NUM, size: 46 * (1 + 0.2 * pulse(t, C.lowest, 5)), color: COL.sell, alpha: kl, glow: 12 });
          ctx.restore();
        }
      }

      // ---------- OI plane ----------
      function drawOiPlane(t) {
        const ctx = begin(PL.oi);
        const a = win(t, C.s2 + 0.6, C.s5 + 0.8, 0.6, 0.6);
        if (a <= 0) return;
        const v = view(t);
        const now = reveal(t);
        const lo = 87400;
        const hi = 89400;
        const y = (oi) => 40 + ((hi - oi) / (hi - lo)) * 160;
        ctx.globalAlpha = a;
        text(ctx, "未平倉量 OI（BTC）", CB.x, 26, { size: 22, weight: 500, color: COL.muted });
        ctx.save();
        ctx.beginPath();
        ctx.rect(CB.x - 6, 30, CB.w + 12, 190);
        ctx.clip();
        ctx.strokeStyle = COL.oi;
        ctx.lineWidth = 3;
        ctx.beginPath();
        let started = false;
        let lastOi = null;
        for (const b of S) {
          if (b.t >= now || b.oi == null) break;
          const x = mapX(v, b.t + M5);
          (started ? ctx.lineTo : ctx.moveTo).call(ctx, x, y(b.oi));
          started = true;
          lastOi = b.oi;
        }
        ctx.stroke();
        ctx.restore();
        if (lastOi != null) text(ctx, fmt(lastOi), CB.x + CB.w, 26, { font: NUM, size: 38, color: COL.oi, align: "right" });
        const jump = S.find((b) => b.t === U("2025-12-09T04:30:00"));
        const kj = win(t, C.newOi, C.s3 + 0.2, 0.3, 0.4);
        if (kj > 0) {
          const x = mapX(v, jump.t + M5);
          ring(ctx, x, y(jump.oi), t, C.newOi, { color: COL.oi, r1: 90 });
          text(ctx, "下跌途中，新倉 +1,040", x - 10, y(jump.oi) - 16, { size: 24, color: COL.oi, align: "right", alpha: kj });
        }
        const kc = win(t, C.oiDrop, C.s5, 0.3, 0.4);
        if (kc > 0) {
          const after = S.find((b) => b.t === U("2025-12-09T05:30:00"));
          const x = mapX(v, after.t + M5);
          ring(ctx, x, y(after.oi), t, C.oiDrop + 0.6, { color: COL.oi, r1: 110 });
          text(ctx, "15 分鐘 −1,071", x - 20, y(after.oi) + 8, { font: NUM, size: 46 * (1 + 0.25 * pulse(t, C.oiDrop + 0.6, 5)), color: COL.oi, align: "right", alpha: kc, glow: 10 });
        }
      }

      // ---------- footprint plane (behind the chart; the camera dives through to it) ----------
      function footprint(ctx, t, { t0, rows, title, hl, note, extra }) {
        const k = win(t, t0, t0 + 20, 0.4, 0);
        if (k <= 0) return;
        const pad = 60;
        const top = 120;
        const rowH = Math.min(64, 560 / rows.length);
        const max = Math.max(...rows.map((r) => r[1] + r[2]));
        const cellX = pad + 150;
        const cellW = PL.fp.w - cellX - pad;
        text(ctx, title, PL.fp.w / 2, 70, { size: 30, color: COL.text, align: "center", alpha: k });
        const desc = [...rows].sort((x, y) => y[0] - x[0]);
        desc.forEach(([p, buy, sell], i) => {
          // Rows assemble from the bottom up, each sliding in a little after the one below.
          const order = desc.length - 1 - i;
          const a = ease.out3(prog(t, t0 + 0.3 + order * 0.07, t0 + 0.65 + order * 0.07));
          if (a <= 0) return;
          const y = top + i * rowH;
          const dx = (1 - a) * (order % 2 ? 80 : -80);
          const h = hl(p, t);
          const strength = Math.sqrt((buy + sell) / max);
          ctx.save();
          ctx.globalAlpha *= a;
          ctx.translate(dx, 0);
          ctx.fillStyle = rgba(sell > buy ? COL.sell : COL.buy, 0.12 + 0.4 * strength + 0.3 * h);
          ctx.fillRect(cellX, y + 2, cellW, rowH - 4);
          if (h > 0) {
            ctx.strokeStyle = rgba(COL.gold, h);
            ctx.lineWidth = 3;
            ctx.strokeRect(cellX, y + 2, cellW, rowH - 4);
          }
          text(ctx, fmt(p), cellX - 20, y + rowH / 2 + 9, { font: MONO, size: 22, weight: 500, color: COL.muted, align: "right" });
          text(ctx, fmt(sell, sell < 10 ? 1 : 0), cellX + cellW / 2 - 24, y + rowH / 2 + 12, { font: MONO, size: 30 * (1 + 0.25 * h * pulse(t, t0, 0.0001)), weight: 600, color: "#ffe2cd", align: "right" });
          text(ctx, fmt(buy, buy < 10 ? 1 : 0), cellX + cellW / 2 + 24, y + rowH / 2 + 12, { font: MONO, size: 30, weight: 600, color: "#d6fffa" });
          ctx.restore();
        });
        const by = top + rows.length * rowH;
        text(ctx, "主動賣", cellX + cellW / 2 - 24, by + 36, { size: 22, color: COL.sell, align: "right", alpha: k });
        text(ctx, "主動買", cellX + cellW / 2 + 24, by + 36, { size: 22, color: COL.buy, alpha: k });
        if (extra) extra(top, rowH, desc, cellX, cellW);
        note(by + 80);
      }
      function drawFpPlane(t) {
        const ctx = begin(PL.fp);
        const absorb = win(t, C.s5 - 0.2, C.s6 + 0.3, 0.3, 0.5);
        if (absorb > 0) {
          ctx.save();
          ctx.globalAlpha = absorb;
          const bar = D.m1.find((b) => b.t === D.sweep.t);
          footprint(ctx, t, {
            t0: C.s5 + 0.4,
            rows: bar.levels,
            title: "13:17 這一分鐘的足跡（每格 50 美元）",
            hl: (p, t) => (p <= 89450 ? ease.out3(prog(t, C.sold + ((89450 - p) / 50) * 0.38, C.sold + ((89450 - p) / 50) * 0.38 + 0.2)) : 0),
            note: (y) => {
              const k = prog(t, C.buyers - 0.2, C.buyers + 0.3);
              text(ctx, "低點上方 0.15% 內", PL.fp.w / 2, y, { size: 26, weight: 500, color: COL.muted, align: "center", alpha: k });
              const sell = Math.round(D.sweep.absorb.sell * ease.out3(prog(t, C.sold, C.sold + 1.0)));
              text(ctx, `主動賣 ${sell} · 主動買 ${D.sweep.absorb.buy}`, PL.fp.w / 2, y + 74, { font: NUM, size: 68 * (1 + 0.12 * pulse(t, C.buyers, 4)), color: COL.sell, align: "center", alpha: k });
              text(ctx, "價格停在 89,368.9，沒有再往下", PL.fp.w / 2, y + 136, { size: 28, color: COL.gold, align: "center", alpha: prog(t, C.held, C.held + 0.4) });
            },
          });
          ctx.restore();
        }
        const entry = win(t, C.s8 - 0.2, C.entry - 0.3, 0.3, 0.4);
        if (entry > 0) {
          const rows = D.entryBar.levels.filter((r) => r[0] >= 90190 && r[0] <= 90320);
          const map = new Map(rows.map((r) => [r[0], r]));
          ctx.save();
          ctx.globalAlpha = entry;
          footprint(ctx, t, {
            t0: C.s8 + 0.4,
            rows,
            title: "15:20 回測 VAL 的足跡（每格 10 美元）",
            hl: (p, t) => (p === 90190 || p === 90200 ? prog(t, C.imb + 0.3, C.imb + 0.6) : 0),
            extra: (top, rowH, desc, cellX, cellW) => {
              const k = ease.out3(prog(t, C.imb + 0.4, C.imb + 0.9));
              if (k <= 0) return;
              const iy = (p) => top + desc.findIndex((r) => r[0] === p) * rowH + rowH / 2;
              const sx = cellX + cellW / 2 - 90;
              const bx = cellX + cellW / 2 + 90;
              ctx.strokeStyle = rgba(COL.gold, 1);
              ctx.lineWidth = 4;
              ctx.beginPath();
              ctx.moveTo(sx, iy(90190));
              ctx.lineTo(lerp(sx, bx, k), lerp(iy(90190), iy(90200), k));
              ctx.stroke();
              text(ctx, "×30", bx + 70, iy(90200) + 12, { font: NUM, size: 46 * (1 + 0.3 * pulse(t, C.imb + 0.9, 5)), color: COL.gold, alpha: k, glow: 10 });
              text(ctx, "下方沒有賣單", bx + 70, iy(90190) + 10, { size: 20, color: COL.gold, alpha: k });
            },
            note: (y) => {
              const k = prog(t, C.imb + 0.6, C.imb + 1.0);
              const b = map.get(90200);
              const below = map.get(90190);
              text(ctx, `90,200：主動買 ${b[1]} 對 左下 主動賣 ${below[2]}`, PL.fp.w / 2, y, { size: 28, color: COL.text, align: "center", alpha: k });
              text(ctx, "連續兩格：買方不平衡", PL.fp.w / 2, y + 66, { size: 46, weight: 900, color: COL.buy, align: "center", alpha: k });
            },
          });
          ctx.restore();
        }
      }

      // ---------- overlay: rail, HUD, hook type, evidence cards ----------
      const STAGES = [
        { k: "地點", w: 180 },
        { k: "事件", w: 180 },
        { k: "確認", w: 380 },
        { k: "執行", w: 180 },
      ];
      const RAIL_Y = 140;
      const RAIL_H = 72;
      const RAIL = (() => {
        const gap = 20;
        let x = (W - STAGES.reduce((s, a) => s + a.w, 0) - gap * 3) / 2;
        return STAGES.map((s) => {
          const box = { ...s, x };
          x += s.w + gap;
          return box;
        });
      })();
      const SLOT_NAMES = ["OI", "吸收", "背離", "收回"];
      const slotXY = (i) => [RAIL[2].x + 140 + i * 62, RAIL_Y];
      const LAND = EV_T0.map((t0) => t0 + EV_DUR);
      const STAGE_ON = [C.s2, C.s3, C.s4, C.s8];
      const STAGE_DONE = [C.s3, C.s4, LAND[3], C.t2];
      // The four words slam in on the beat, each with its own entrance (scale-slam, side-snap, rise, snap).
      const WORD_T = [0, 1, 2, 3].map((i) => C.four + i * 0.24);
      function wordPose(t, i) {
        const k = prog(t, WORD_T[i], WORD_T[i] + 0.45);
        if (i === 0) return { k, dx: 0, dy: 0, s: lerp(2.2, 1, ease.p4out(k)), rot: 0, blur: (1 - k) * 10 };
        if (i === 1) return { k, dx: lerp(-260, 0, ease.expoOut(k)), dy: 0, s: 1, rot: 0, blur: 0 };
        if (i === 2) return { k, dx: 0, dy: lerp(80, 0, ease.circOut(k)), s: 1, rot: lerp(-0.25, 0, ease.circOut(k)), blur: 0 };
        return { k, dx: lerp(260, 0, ease.expoOut(k)), dy: 0, s: 1, rot: 0, blur: 0 };
      }
      function drawRail(t) {
        const a = win(t, C.four - 0.05, C.s10 + 0.3, 0.05, 0.5);
        if (a <= 0) return;
        const frame = ease.out3(prog(t, C.four + 0.6, C.four + 1.0));
        RAIL.forEach((s, i) => {
          const active = prog(t, STAGE_ON[i], STAGE_ON[i] + 0.4);
          const done = prog(t, STAGE_DONE[i], STAGE_DONE[i] + 0.3);
          if (frame > 0) {
            ov.save();
            ov.globalAlpha = a * frame;
            rrect(ov, s.x, RAIL_Y - RAIL_H / 2, s.w, RAIL_H, 14);
            ov.fillStyle = rgba(COL.panel, 0.85);
            ov.fill();
            const col = done > 0.5 ? COL.buy : active > 0 ? COL.gold : COL.line;
            ov.strokeStyle = rgba(col, 0.4 + 0.5 * Math.max(active, done));
            ov.lineWidth = 2;
            if (active > 0 && done < 1) {
              ov.shadowColor = COL.gold;
              ov.shadowBlur = 16 * active;
            }
            ov.stroke();
            ov.restore();
            text(ov, `0${i + 1}`, s.x + 14, RAIL_Y - 18, { font: MONO, size: 14, color: COL.dim, alpha: a * frame });
            if (done > 0) checkGlyph(ov, s.x + s.w - 28, RAIL_Y, 1.2 + 0.4 * pulse(t, STAGE_DONE[i], 5), COL.buy, a * done);
          }
          const p = wordPose(t, i);
          if (p.k <= 0) return;
          const col = done > 0.5 ? COL.buy : active > 0 ? COL.text : COL.muted;
          ov.save();
          ov.translate(s.x + 26 + p.dx, RAIL_Y + 2 + p.dy);
          ov.rotate(p.rot);
          ov.scale(p.s, p.s);
          if (p.blur > 0.3) ov.filter = `blur(${p.blur}px)`;
          text(ov, s.k, 0, 0, { size: 30, weight: 900, color: col, base: "middle", alpha: a * clamp(p.k * 3), glow: active && done < 1 ? 10 : 0 });
          ov.restore();
        });
        if (frame <= 0) return;
        SLOT_NAMES.forEach((name, i) => {
          const [x, y] = slotXY(i);
          const ok = prog(t, LAND[i], LAND[i] + 0.25);
          const r = 19 * (1 + 0.35 * pulse(t, LAND[i], 5) + 0.25 * pulse(t, C.allFour, 4));
          ov.save();
          ov.globalAlpha = a * frame;
          ov.beginPath();
          ov.arc(x, y - 6, r, 0, Math.PI * 2);
          ov.fillStyle = ok > 0 ? rgba(COL.buy, 0.18 * ok) : rgba(COL.ink, 0.85);
          ov.fill();
          ov.strokeStyle = ok > 0.5 ? COL.buy : rgba(COL.muted, 0.45);
          ov.lineWidth = 1.8;
          if (i === 0 && ok < 0.5) ov.setLineDash([4, 3]);
          ov.stroke();
          ov.restore();
          ring(ov, x, y - 6, t, LAND[i], { r0: 19, r1: 60, color: COL.buy, dur: 0.6 });
          checkGlyph(ov, x, y - 6, 1.1, COL.buy, a * ok);
          text(ov, name, x, y + 26, { size: 15, color: ok > 0.5 ? COL.buy : COL.muted, align: "center", base: "middle", alpha: a * frame });
        });
        text(ov, "必要", slotXY(0)[0], RAIL_Y - 44, { size: 13, color: COL.gold, align: "center", alpha: a * frame * 0.9 });
      }

      function drawHud(t) {
        const a = win(t, 0, C.s10 + 0.2, 0, 0.5);
        if (a <= 0) return;
        const y0 = 268;
        text(ov, "2025.12.09", 90, y0, { font: MONO, size: 26, weight: 500, color: COL.muted, alpha: a });
        text(ov, taipei(hud.ms), 90, y0 + 82, { font: NUM, size: 86, color: COL.text, alpha: a, track: 2 });
        text(ov, "台灣時間", 260, y0 + 82, { size: 22, weight: 500, color: COL.dim, alpha: a });
        text(ov, "BTCUSDT 永續 · 幣安", W - 90, y0, { size: 24, weight: 500, color: COL.muted, align: "right", alpha: a });
        if (hud.price != null) text(ov, fmt(hud.price, 1), W - 90, y0 + 82, { font: NUM, size: 80, color: hud.color, align: "right", alpha: a, track: 1 });
        const kick = win(t, C.s2 + 0.2, C.s3, 0.5, 0.5);
        if (kick > 0) text(ov, "策略 01 實戰：掃過前低，收回才算數", W / 2, 228, { size: 24, color: COL.gold, align: "center", alpha: kick, track: 2 });
      }

      // Hook type: "跌破前低，" slams in (scale + blur → sharp), "反而做多？" side-snaps on the cut.
      function drawHookType(t) {
        const out = 1 - ease.inOut(prog(t, C.four + 0.3, C.four + 0.8));
        if (out <= 0) return;
        const k1 = prog(t, C.hook, C.hook + 0.5);
        if (k1 > 0) {
          ov.save();
          ov.globalAlpha = out * clamp(k1 * 2.5);
          ov.translate(W / 2, 1270);
          const s = lerp(1.7, 1, ease.p4out(k1));
          ov.scale(s, s);
          if (k1 < 1) ov.filter = `blur(${((1 - ease.p4out(k1)) * 16).toFixed(1)}px)`;
          text(ov, "跌破前低，", 0, 0, { size: 104, weight: 900, color: COL.text, align: "center", base: "middle", glow: 20 });
          ov.restore();
        }
        const k2 = prog(t, C.hook2, C.hook2 + 0.45);
        if (k2 > 0) {
          ov.save();
          ov.globalAlpha = out * clamp(k2 * 3);
          ov.translate(W / 2 + lerp(420, 0, ease.expoOut(k2)), 1400);
          text(ov, "反而做多？", 0, 0, { size: 112, weight: 900, color: COL.gold, align: "center", base: "middle", glow: 24 });
          ov.restore();
        }
      }

      const EVIDENCE = [
        { kicker: "證據 1 / 4 · OI", hero: "OI −1,071", sub: "停損與強平：多單出清", color: COL.oi, from: [700, 1330] },
        { kicker: "證據 2 / 4 · 吸收", hero: "賣 310 · 買 67", sub: "低點附近，價格推不動", color: COL.sell, from: [540, 1100] },
        { kicker: "證據 3 / 4 · 背離", hero: "Δ −894 → −28", sub: "回落不再創低，賣壓變小", color: COL.gold, from: [420, 1050] },
        { kicker: "證據 4 / 4 · 收回", hero: "收回 90,195", sub: "重回前一天的價值區", color: COL.buy, from: [760, 700] },
      ];
      function evidencePose(t, i) {
        const u = t - EV_T0[i];
        const [sx, sy] = slotXY(i);
        const [fx, fy] = EVIDENCE[i].from;
        const cx = W / 2;
        const cy = 900;
        if (u < 0.6) {
          const p = ease.out3(clamp(u / 0.6));
          return { x: lerp(fx, cx, p), y: lerp(fy, cy, p), s: lerp(0.25, 1.5, p) + Math.sin(Math.PI * clamp(u / 0.6)) * 0.4 };
        }
        if (u < 1.85) return { x: cx, y: cy, s: 1.5 + 0.06 * ease.inOut(clamp((u - 0.6) / 1.25)) };
        const p = ease.inExpo(clamp((u - 1.85) / (EV_DUR - 1.85)));
        return { x: lerp(cx, sx, p), y: lerp(cy, sy - 6, p), s: lerp(1.56, 0.08, p) };
      }
      function card(t, i, pose, a) {
        const e = EVIDENCE[i];
        const w = 520;
        const h = 190;
        ov.save();
        ov.translate(pose.x, pose.y);
        ov.scale(pose.s, pose.s);
        ov.globalAlpha = a;
        ov.shadowColor = e.color;
        ov.shadowBlur = 40;
        rrect(ov, -w / 2, -h / 2, w, h, 22);
        ov.fillStyle = "rgba(8,14,24,0.95)";
        ov.fill();
        ov.shadowBlur = 0;
        ov.strokeStyle = rgba(e.color, 0.85);
        ov.lineWidth = 2;
        ov.stroke();
        ov.fillStyle = e.color;
        ov.fillRect(-w / 2, -h / 2 + 28, 6, h - 56);
        text(ov, e.kicker, -w / 2 + 34, -h / 2 + 38, { size: 18, color: COL.gold, base: "middle", alpha: 1, track: 2 });
        text(ov, e.hero, -w / 2 + 32, 4, { size: 58, weight: 900, color: COL.text, base: "middle", glow: 14 });
        text(ov, e.sub, -w / 2 + 34, h / 2 - 34, { size: 22, weight: 500, color: COL.muted, base: "middle" });
        ov.restore();
      }
      function drawEvidence(t) {
        EVIDENCE.forEach((e, i) => {
          const u = t - EV_T0[i];
          if (u < 0 || u > EV_DUR + 0.05) return;
          const a = 1 - prog(u, EV_DUR - 0.12, EV_DUR);
          // Motion trail while it travels fast: ghosts from a few frames back.
          if (u < 0.6 || u > 1.85) for (let k = 3; k >= 1; k--) if (u - k * 0.03 > 0) card(t, i, evidencePose(t - k * 0.03, i), a * 0.12 * (1 - k / 4));
          card(t, i, evidencePose(t, i), a);
        });
      }

      function draw(t) {
        applyCamera(t);
        drawChartPlane(t);
        drawOiPlane(t);
        drawFpPlane(t);
        ov.setTransform(1, 0, 0, 1, 0, 0);
        ov.clearRect(0, 0, W, H);
        const top = ov.createLinearGradient(0, 0, 0, 430);
        top.addColorStop(0, "rgba(4,7,11,0.96)");
        top.addColorStop(0.7, "rgba(4,7,11,0.75)");
        top.addColorStop(1, "rgba(4,7,11,0)");
        ov.fillStyle = top;
        ov.fillRect(0, 0, W, 430);
        const bottom = ov.createLinearGradient(0, 1420, 0, 1920);
        bottom.addColorStop(0, "rgba(4,7,11,0)");
        bottom.addColorStop(0.25, "rgba(4,7,11,0.7)");
        bottom.addColorStop(1, "rgba(4,7,11,0.95)");
        ov.fillStyle = bottom;
        ov.fillRect(0, 1420, W, 500);
        drawHookType(t);
        drawEvidence(t);
        drawHud(t);
        drawRail(t);
      }

      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 100px ${NUM}`),
        document.fonts.load(`400 20px ${MONO}`),
        document.fonts.load(`900 40px ${TC}`, "跌破前低反而做多"),
      ]).then(() => {
        placePlanes();
        drawBackground();
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        CAPS.forEach(([a, b], i) => {
          const el = document.getElementById(`cap${i}`);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, a);
          tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, b - 0.18);
        });
        tl.fromTo("#end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, C.s10 + 0.9);
        tl.fromTo("#disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, C.s10 + 1.4);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
