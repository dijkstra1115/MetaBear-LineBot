    <script>
      const D = /*@DATA*/ null;
      const C = /*@CUES*/ null;
      const W = 1080, CX0 = 40, CX1 = 976, CY0 = 360, CY1 = 1050;
      const NUM = '"Barlow Condensed"', MONO = '"JetBrains Mono"', TC = '"Noto Sans TC"';
      const COL = { ground: "#05090f", ink: "#edf2ed", ink2: "#94a8b9", dim: "#5f7486", grid: "#0c1520", up: "#c4d0d6", down: "#5f7486", gold: "#e8bd7d", long: "#78e1d5", short: "#f09a5a", stop: "#ef7b76" };
      const MIN = 60_000, TPE = 8 * 3600_000;
      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const out3 = (k) => 1 - Math.pow(1 - k, 3);
      const fmt = (p) => Math.round(p).toLocaleString("en-US");
      const hhmm = (ms) => new Date(ms + TPE).toISOString().slice(11, 16);
      const rgba = (hex, a) => `rgba(${parseInt(hex.slice(1, 3), 16)},${parseInt(hex.slice(3, 5), 16)},${parseInt(hex.slice(5, 7), 16)},${a})`;

      // 5-minute bars for wide views.
      const BARS5 = [];
      for (const b of D.bars) {
        const t = Math.floor(b[0] / (5 * MIN)) * 5 * MIN, last = BARS5.at(-1);
        if (last && last[0] === t) (last[2] = Math.max(last[2], b[2])), (last[3] = Math.min(last[3], b[3])), (last[4] = b[4]);
        else BARS5.push([t, b[1], b[2], b[3], b[4]]);
      }

      // ---------- time → state (pure) ----------
      function cursorAt(t) {
        const K = C.cursor;
        if (t <= K[0][0]) return K[0][1];
        for (let i = 1; i < K.length; i++) {
          if (t <= K[i][0]) {
            const [ta, ma] = K[i - 1], [tb, mb] = K[i];
            return tb === ta ? mb : lerp(ma, mb, (t - ta) / (tb - ta));
          }
        }
        return K.at(-1)[1];
      }
      // Wide views hold still; inside a trade the camera follows the newest bar.
      function camState(m, t) {
        if (!m.follow) return m.to;
        const x1 = cursorAt(t) + C.lead * C.span;
        return { x0: x1 - C.span, x1, y0: m.y0, y1: m.y1 };
      }
      function camAt(t) {
        let prev = C.cam[0];
        for (let i = 1; i < C.cam.length; i++) {
          const m = C.cam[i];
          if (t < m.t0) break;
          if (t < m.t1) {
            // Both ends are evaluated now, so a following camera stays on the fast-forwarding cursor.
            const a = camState(prev, t), b = camState(m, t), k = inOut((t - m.t0) / (m.t1 - m.t0));
            return { x0: lerp(a.x0, b.x0, k), x1: lerp(a.x1, b.x1, k), y0: lerp(a.y0, b.y0, k), y1: lerp(a.y1, b.y1, k) };
          }
          prev = m;
        }
        return camState(prev, t);
      }
      const tradeAt = (t) => C.trades.findIndex((s) => t >= s.S && t < s.E);
      const fx = (cam, mt) => CX0 + ((mt - cam.x0) / (cam.x1 - cam.x0)) * (CX1 - CX0);
      const fy = (cam, p) => CY1 - ((p - cam.y0) / (cam.y1 - cam.y0)) * (CY1 - CY0);

      // ---------- drawing ----------
      function drawGrid(cam) {
        ctx.strokeStyle = COL.grid;
        ctx.lineWidth = 1;
        const span = cam.y1 - cam.y0, step = span > 1500 ? 500 : span > 600 ? 100 : 50;
        ctx.font = `500 22px ${MONO}`;
        ctx.fillStyle = COL.dim;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        for (let p = Math.ceil(cam.y0 / step) * step; p < cam.y1; p += step) {
          const y = Math.round(fy(cam, p)) + 0.5;
          if (y < CY0 || y > CY1) continue;
          ctx.beginPath();
          ctx.moveTo(CX0, y);
          ctx.lineTo(CX1, y);
          ctx.stroke();
          if (step >= 100 || p % 100 === 0) ctx.fillText(fmt(p), CX1 + 8, y);
        }
        const tspan = cam.x1 - cam.x0, ts = tspan > 600 * MIN ? 180 * MIN : tspan > 180 * MIN ? 60 * MIN : 30 * MIN;
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        for (let m = Math.ceil(cam.x0 / ts) * ts; m < cam.x1; m += ts) {
          const x = Math.round(fx(cam, m)) + 0.5;
          if (x < CX0 || x > CX1) continue;
          ctx.beginPath();
          ctx.moveTo(x, CY0);
          ctx.lineTo(x, CY1);
          ctx.stroke();
          ctx.fillText(hhmm(m), x, CY1 + 10);
        }
      }
      function drawCandles(cam, now, ghost) {
        const wide = cam.x1 - cam.x0 > 400 * MIN;
        const src = wide ? BARS5 : D.bars, len = wide ? 5 * MIN : MIN;
        const slot = ((CX1 - CX0) * len) / (cam.x1 - cam.x0);
        const bw = Math.max(1, Math.round(slot * 0.62)), ww = slot > 6 ? 2 : 1;
        for (const b of src) {
          if (b[0] + len < cam.x0 || b[0] > cam.x1) continue;
          const done = b[0] + len <= now + 1;
          if (!done && !ghost) continue;
          const a = done ? 1 : ghost * 0.32;
          if (a <= 0) continue;
          const x = Math.round(fx(cam, b[0] + len / 2));
          const up = b[4] >= b[1];
          ctx.fillStyle = rgba(up ? COL.up : COL.down, a);
          ctx.fillRect(x - ww / 2, fy(cam, b[2]), ww, Math.max(1, fy(cam, b[3]) - fy(cam, b[2])));
          const top = fy(cam, Math.max(b[1], b[4])), bot = fy(cam, Math.min(b[1], b[4]));
          ctx.fillRect(x - bw / 2, top, bw, Math.max(1, bot - top));
        }
      }
      // Prior-day levels over the hours they are valid; the 08:00 set draws in when the cursor gets there.
      const LEVEL_NAMES = [["high", "前日高"], ["vah", "前日 VAH"], ["poc", "前日 POC"], ["val", "前日 VAL"], ["low", "前日低"]];
      function drawLevels(cam, now, t, focus) {
        D.levelSets.forEach((L, k) => {
          if (now < L.from) return;
          const wide = t < C.hookEnd + 0.4 || t >= C.recap[0];
          const grow = k === 1 && C.switchAt != null && !wide ? out3(clamp((t - C.switchAt) / 0.35)) : 1;
          const xa = Math.max(CX0, fx(cam, L.from)), xb = Math.min(CX1, fx(cam, L.to));
          if (xb <= xa) return;
          for (const [key, name] of LEVEL_NAMES) {
            const p = L[key], y = Math.round(fy(cam, p)) + 0.5;
            if (y < CY0 + 4 || y > CY1 - 4) continue;
            const hot = focus && Math.abs(focus.level - p) < 1 && now >= focus.from && now < focus.to;
            ctx.strokeStyle = rgba(COL.gold, hot ? 1 : 0.42);
            ctx.lineWidth = hot ? 2 : 1;
            ctx.setLineDash(hot ? [10, 6] : [6, 8]);
            ctx.beginPath();
            ctx.moveTo(xa, y);
            ctx.lineTo(lerp(xa, xb, grow), y);
            ctx.stroke();
            ctx.setLineDash([]);
            if (grow < 1) continue;
            ctx.font = `500 ${hot ? 26 : 22}px ${MONO}`;
            const label = `${name.replace("前日 ", "")} ${fmt(p)}`;
            const w = ctx.measureText(label).width + 14;
            ctx.fillStyle = COL.ground;
            ctx.fillRect(xa + 6, y - 15, w, 30);
            ctx.fillStyle = rgba(COL.gold, hot ? 1 : 0.7);
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(label, xa + 13, y + 1);
          }
        });
      }
      function drawPosition(cam, x, now, alpha, t, slot) {
        const s = x.long ? 1 : -1, xa = fx(cam, x.src === "B-hold" ? x.entryT : x.entryT + MIN);
        const end = Math.min(now, x.exitT), xb = Math.max(xa + 8, fx(cam, end));
        const open = slot ? out3(clamp((t - slot.fire) / 0.15)) : 1;
        const ye = fy(cam, x.entry), yt = lerp(ye, fy(cam, x.tp), open), ys = lerp(ye, fy(cam, x.stop), open);
        ctx.fillStyle = rgba(COL.long, 0.18 * alpha);
        ctx.fillRect(xa, Math.min(ye, yt), xb - xa, Math.abs(yt - ye));
        ctx.fillStyle = rgba(COL.stop, 0.18 * alpha);
        ctx.fillRect(xa, Math.min(ye, ys), xb - xa, Math.abs(ys - ye));
        ctx.lineWidth = 2;
        for (const [y, c] of [[yt, COL.long], [ys, COL.stop], [ye, COL.ink]]) {
          ctx.strokeStyle = rgba(c, alpha);
          ctx.beginPath();
          ctx.moveTo(xa, Math.round(y) + 0.5);
          ctx.lineTo(xb, Math.round(y) + 0.5);
          ctx.stroke();
        }
        // Entry arrow.
        const ac = x.long ? COL.long : COL.short;
        ctx.fillStyle = rgba(ac, alpha);
        ctx.beginPath();
        const ay = ye + s * 26;
        ctx.moveTo(xa, ye + s * 4);
        ctx.lineTo(xa - 14, ay + s * 12);
        ctx.lineTo(xa + 14, ay + s * 12);
        ctx.closePath();
        ctx.fill();
        if (slot && alpha === 1 && open === 1) {
          ctx.font = `500 24px ${MONO}`;
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          const lx = Math.min(CX1 - 6, Math.max(xb, xa + 240));
          ctx.fillStyle = COL.long;
          ctx.fillText(`停利 ${fmt(x.tp)}`, lx, yt + (yt < ye ? -16 : 16));
          ctx.fillStyle = COL.stop;
          ctx.fillText(`停損 ${fmt(x.stop)}`, lx, ys + (ys < ye ? -16 : 16));
        }
        if (now >= x.exitT) {
          const px = x.result === "tp" ? x.tp : x.result === "stop" ? x.stop : x.entry;
          ctx.fillStyle = rgba(x.result === "tp" ? COL.long : COL.stop, alpha);
          ctx.beginPath();
          ctx.arc(fx(cam, x.exitT), fy(cam, px), 9, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // The entry bar's footprint opened up beside the chart, the stacked cells filled; B shows its
      // absorption zone instead. Opens just before the trigger beat and folds away after the fire.
      const PX0 = 700, PW = 268, ROW = 40;
      function drawEvidence(cam, x, slot, t) {
        const open = clamp((t - slot.trig + 0.1) / 0.12), close = clamp((t - slot.fire - 0.45) / 0.15);
        const k = open * (1 - close);
        if (open <= 0) return;
        const color = x.long ? COL.long : COL.short;
        if (x.src === "B-hold") {
          const xa = fx(cam, x.signalT - 20 * MIN), xb = fx(cam, x.signalT + 5 * MIN);
          const ya = fy(cam, x.zone[1]), yb = fy(cam, x.zone[0]);
          ctx.fillStyle = rgba(COL.gold, 0.22 * open);
          ctx.fillRect(xa, ya, xb - xa, yb - ya);
          ctx.strokeStyle = rgba(COL.gold, open);
          ctx.lineWidth = 2;
          ctx.strokeRect(xa + 1, ya + 1, xb - xa - 2, yb - ya - 2);
          if (k <= 0) return;
          const py = clamp((ya + yb) / 2 - 90, CY0 + 20, CY1 - 200);
          ctx.fillStyle = rgba(COL.ground, 0.94 * k);
          ctx.fillRect(PX0, py, PW, 180);
          ctx.strokeStyle = rgba(COL.gold, k);
          ctx.strokeRect(PX0 + 1, py + 1, PW - 2, 178);
          ctx.textAlign = "left";
          ctx.textBaseline = "alphabetic";
          ctx.fillStyle = rgba(COL.ink2, k);
          ctx.font = `500 22px ${MONO}`;
          ctx.fillText("VAL 回測區 ±0.15%", PX0 + 18, py + 40);
          ctx.fillStyle = rgba(COL.ink, k);
          ctx.font = `700 72px ${NUM}`;
          ctx.fillText(`${x.absorb}`, PX0 + 18, py + 116);
          ctx.font = `700 30px ${TC}`;
          ctx.fillText("顆主動買被吸收", PX0 + 18, py + 160);
          return;
        }
        if (k <= 0) return;
        const rows = [...x.footprint].sort((a, b) => b[0] - a[0]);
        const stack = new Set(x.stack.map((p) => Math.round(p)));
        const order = [...x.stack].sort((a, b) => (x.long ? a - b : b - a));
        const h = 82 + rows.length * ROW;
        const midP = (Math.max(...x.stack) + Math.min(...x.stack)) / 2 + D.tick / 2;
        const py = clamp(fy(cam, midP) - h / 2, CY0 + 10, CY1 - h - 10);
        const w = PW * out3(open);
        // Connector from the bar to the panel.
        const bx = fx(cam, x.signalT + MIN / 2), by = fy(cam, midP);
        ctx.strokeStyle = rgba(COL.gold, k);
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(bx + 8, by);
        ctx.lineTo(PX0, py + h / 2);
        ctx.stroke();
        ctx.fillStyle = rgba(COL.ground, 0.95 * k);
        ctx.fillRect(PX0, py, w, h);
        ctx.strokeStyle = rgba(COL.gold, k);
        ctx.strokeRect(PX0 + 0.5, py + 0.5, w - 1, h - 1);
        if (open < 1) return;
        ctx.textBaseline = "middle";
        ctx.font = `500 20px ${MONO}`;
        ctx.fillStyle = rgba(COL.ink2, k);
        ctx.textAlign = "left";
        ctx.fillText(`${hhmm(x.signalT)} 足跡`, PX0 + 14, py + 26);
        const cw = 72, cs = PX0 + PW - 14 - 2 * cw - 6, cb = cs + cw + 6;
        ctx.textAlign = "center";
        ctx.fillText("賣", cs + cw / 2, py + 60);
        ctx.fillText("買", cb + cw / 2, py + 60);
        rows.forEach(([p, bu, se], r) => {
          const y = py + 80 + r * ROW;
          const hot = stack.has(Math.round(p)), i = hot ? order.indexOf(p) : -1;
          const on = hot ? clamp((t - slot.trig - i * 0.05) / 0.06) : 0;
          ctx.font = `500 20px ${MONO}`;
          ctx.textAlign = "left";
          ctx.fillStyle = rgba(COL.dim, k);
          ctx.fillText(fmt(p), PX0 + 14, y + ROW / 2);
          for (const [cx, q, side] of [[cs, se, "sell"], [cb, bu, "buy"]]) {
            const lit = on > 0 && (x.long ? side === "buy" : side === "sell");
            ctx.fillStyle = lit ? rgba(color, 0.9 * on * k) : rgba(COL.grid, k);
            ctx.fillRect(cx, y + 3, cw, ROW - 6);
            ctx.font = `700 26px ${NUM}`;
            ctx.textAlign = "center";
            ctx.fillStyle = lit && on > 0.5 ? COL.ground : rgba(COL.ink2, k);
            ctx.fillText(q.toFixed(1), cx + cw / 2, y + ROW / 2 + 1);
          }
        });
      }
      // Lock: the reticle slides along the level from the right edge and snaps.
      function drawReticle(cam, x, slot, t) {
        if (t < slot.lock || t > slot.fire + 0.15) return;
        const a = t > slot.fire ? 1 - (t - slot.fire) / 0.15 : 1;
        const tx = Math.min(CX1 - 60, fx(cam, cursorAt(slot.lock)) + 90), ty = fy(cam, x.level);
        const k = out3(clamp((t - slot.lock) / 0.18));
        const px = lerp(CX1 + 40, tx, k), sc = t - slot.lock < 0.18 ? 1.3 : lerp(1.3, 1, out3(clamp((t - slot.lock - 0.18) / 0.12)));
        const r = 32 * sc;
        if (t < slot.lock + 0.16) {
          const from = ty < (CY0 + CY1) / 2 ? CY1 : CY0, sy = lerp(from, ty, out3((t - slot.lock) / 0.16));
          ctx.strokeStyle = rgba(COL.gold, 0.9);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(CX0, sy);
          ctx.lineTo(CX1, sy);
          ctx.stroke();
        }
        ctx.strokeStyle = rgba(COL.gold, a);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, ty, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          ctx.moveTo(px + dx * (r - 6), ty + dy * (r - 6));
          ctx.lineTo(px + dx * (r + 10), ty + dy * (r + 10));
        }
        ctx.stroke();
        ctx.fillStyle = rgba(COL.gold, a);
        ctx.beginPath();
        ctx.arc(px, ty, 3, 0, Math.PI * 2);
        ctx.fill();
      }
      function drawMarkers(cam, alpha) {
        for (const x of D.trades) drawPosition(cam, x, Number.MAX_SAFE_INTEGER, alpha, 0, null);
      }
      function drawHeader(t, now, i) {
        if (t < C.hookEnd || t >= C.endcard[0]) return;
        ctx.textBaseline = "alphabetic";
        ctx.textAlign = "left";
        ctx.fillStyle = COL.ink2;
        ctx.font = `500 30px ${MONO}`;
        const shown = Math.min(now, D.day0 + 24 * 60 * MIN - MIN), d = new Date(shown + TPE);
        ctx.fillText(`${d.getUTCMonth() + 1}/${d.getUTCDate()}`, 56, 216);
        ctx.fillStyle = COL.ink;
        ctx.font = `700 92px ${NUM}`;
        ctx.fillText(hhmm(shown), 52, 300);
        ctx.textAlign = "right";
        ctx.font = `700 40px ${TC}`;
        const n = i >= 0 ? C.trades[i].n : D.trades.length;
        ctx.fillStyle = COL.ink;
        ctx.fillText(`第 ${n} / ${D.trades.length} 筆`, 1024, 216);
        // One dot per trade, filled once its result is in.
        for (let k = 0; k < D.trades.length; k++) {
          const x = 1024 - (D.trades.length - 1 - k) * 36 - 11, y = 282;
          const s = C.trades[k], done = t >= s.result;
          ctx.beginPath();
          ctx.arc(x, y, 11, 0, Math.PI * 2);
          if (done) {
            ctx.fillStyle = D.trades[k].result === "tp" ? COL.long : COL.stop;
            ctx.fill();
          } else {
            ctx.strokeStyle = k === i ? COL.ink : COL.dim;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        }
      }
      function draw(t) {
        ctx.fillStyle = COL.ground;
        ctx.fillRect(0, 0, W, 1920);
        if (t >= C.endcard[0]) return;
        const cam = camAt(t), now = cursorAt(t), i = tradeAt(t);
        const ghost = t < C.hookEnd ? 1 : 1 - clamp((t - C.hookEnd) / 0.4);
        const overview = t < C.hookEnd + 0.4 || t >= C.recap[0];
        drawGrid(cam);
        ctx.save();
        ctx.beginPath();
        ctx.rect(CX0, CY0, CX1 - CX0, CY1 - CY0);
        ctx.clip();
        const slot = i >= 0 ? C.trades[i] : null, x = slot ? D.trades[i] : null;
        // Fire: three frames of recoil.
        if (slot && t >= slot.fire && t < slot.fire + 0.1) {
          const f = Math.floor((t - slot.fire) * 30);
          ctx.translate([0, 7, -5, 3][f] ?? 0, [0, -6, 4, -2][f] ?? 0);
        }
        drawLevels(cam, overview ? D.day0 + 24 * 60 * MIN : now, t, x && { level: x.level, from: x.touchT ?? x.signalT - 20 * MIN, to: x.exitT });
        if (overview) drawMarkers(cam, t < C.hookEnd ? 1 : t >= C.recap[0] ? clamp((t - C.recap[0] - 0.4) / 0.3) : ghost);
        else for (let k = 0; k < i; k++) drawPosition(cam, D.trades[k], now, 0.35, t, null);
        if (slot && t >= slot.fire) drawPosition(cam, x, now, 1, t, slot);
        drawCandles(cam, now, ghost);
        if (slot && t >= slot.trig - 0.1) drawEvidence(cam, x, slot, t);
        if (slot) drawReticle(cam, x, slot, t);
        if (slot && t >= slot.fire && t < slot.fire + 0.3) {
          const k = (t - slot.fire) / 0.3, ex = fx(cam, x.src === "B-hold" ? x.entryT : x.entryT + MIN), ey = fy(cam, x.entry);
          ctx.strokeStyle = rgba(x.long ? COL.long : COL.short, 1 - k);
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(ex, ey, 12 + 80 * out3(k), 0, Math.PI * 2);
          ctx.stroke();
        }
        // Target hit: two frames of the chart filled with the result colour.
        if (slot && t >= slot.result && t < slot.result + 0.07) {
          ctx.fillStyle = rgba(x.result === "tp" ? COL.long : COL.stop, 0.28);
          ctx.fillRect(CX0, CY0, CX1 - CX0, CY1 - CY0);
        }
        ctx.restore();
        ctx.strokeStyle = COL.grid;
        ctx.lineWidth = 2;
        ctx.strokeRect(CX0, CY0, CX1 - CX0, CY1 - CY0);
        drawHeader(t, now, i);
        // The drop: one frame of light over everything, once in the film.
        if (t >= C.drop && t < C.drop + 0.05) {
          ctx.fillStyle = "rgba(237,242,237,0.16)";
          ctx.fillRect(0, 0, W, 1920);
        }
      }

      // ---------- timeline ----------
      window.__timelines = window.__timelines || {};
      Promise.all([
        document.fonts.load(`700 92px ${NUM}`),
        document.fonts.load(`500 26px ${MONO}`),
        document.fonts.load(`700 40px ${TC}`, "第筆前日高低停損利"),
      ]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: C.end, duration: C.end, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        const snap = (sel, at) => tl.fromTo(sel, { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.1, ease: "power3.out", immediateRender: false }, at);
        C.trades.forEach((s, k) => {
          const n = s.n, stop = D.trades[k].result !== "tp";
          snap(`#t${n}-l1`, s.lock);
          snap(`#t${n}-l2`, s.trig);
          snap(`#t${n}-l3`, s.fire);
          snap(`#t${n}-sub`, s.fire + 0.08);
          tl.set(`#t${n}-block`, { opacity: 0 }, s.E);
          tl.set(`#t${n}-stamp`, { opacity: 1, scale: 1.2 }, s.result);
          tl.to(`#t${n}-stamp`, { scale: 1, duration: 0.12, ease: "expo.out" }, s.result);
          if (stop) {
            const jolt = [[-14, 10, -6], [8, -12, 4], [0, 0, 0]];
            jolt.forEach((xs, j) => ["a", "b", "c"].forEach((p, q) => tl.set(`#t${n}-stamp .slice.${p}`, { x: xs[q] }, s.result + 0.033 + j * 0.033)));
          }
        });
        snap("#hook-1", 0);
        snap("#hook-2", 0);
        snap("#recap-1", C.recap[0] + 0.5);
        snap("#recap-2", C.recap[0] + 1.03);
        tl.fromTo("#switch", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.1, ease: "power3.out", immediateRender: false }, C.switchAt ?? 0);
        tl.fromTo("#end-mark", { opacity: 0, scale: 0.6, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)", immediateRender: false }, C.endcard[0] + 0.05);
        tl.fromTo("#end-url", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, C.endcard[0] + 0.52);
        tl.fromTo("#end-line", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.18, ease: "power3.out", immediateRender: false }, C.endcard[0] + 1.03);
        tl.fromTo("#end-note", { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, C.endcard[0] + 1.03);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
