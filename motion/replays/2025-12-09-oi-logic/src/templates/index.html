<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Generated by scripts/build.mjs from src/templates/index.html; edit those, not index.html. -->
    <!-- Design and camera language follow the course replay (motion/replays/2025-12-09, v3): one 3D
         space of canvas planes, a camera that pushes, dives and passes through, data cards with rack
         focus. Content is this film's: CVD leads, OI appears only as two big-number cards. -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans TC";
        src: url("assets/fonts/NotoSansTC-sub.ttf") format("truetype");
        font-weight: 100 900;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/barlow-condensed-latin-700-normal.woff2") format("woff2");
        font-weight: 700;
        font-display: block;
      }
      @font-face {
        font-family: "Barlow Condensed";
        src: url("assets/fonts/barlow-condensed-latin-500-normal.woff2") format("woff2");
        font-weight: 500;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 800;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #04070b;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 46%, #0d1b28 0%, #04070b 62%);
        font-family: "Noto Sans TC", sans-serif;
        color: #edf2ed;
      }
      /* The lens: a static perspective stage. Travel blur goes here, never on the world. */
      #stage {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        perspective: 1400px;
        perspective-origin: 540px 840px;
        overflow: hidden;
      }
      /* The world: one pose written by applyCamera(). */
      #world {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform-origin: 540px 840px;
      }
      .plane {
        position: absolute;
        display: block;
      }
      #p-bg {
        left: -1460px;
        top: -2000px;
        width: 4000px;
        height: 5800px;
      }
      #p-chart {
        left: 60px;
        top: 360px;
        width: 960px;
        height: 700px;
      }
      #p-cvd {
        left: 60px;
        top: 1080px;
        width: 960px;
        height: 340px;
      }
      #overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <div id="stage" data-layout-ignore>
        <div id="world">
          <canvas id="p-bg" class="plane" width="1000" height="1450"></canvas>
          <canvas id="p-cvd" class="plane" width="1920" height="680"></canvas>
          <canvas id="p-chart" class="plane" width="1920" height="1400"></canvas>
        </div>
      </div>
      <canvas id="overlay" width="1080" height="1920" data-layout-ignore></canvas>
      <div id="close" class="clip" data-composition-id="close" data-composition-src="compositions/close.html" data-start="{{CLOSE_START}}" data-duration="{{CLOSE_LEN}}" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="captions" class="clip" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="{{END}}" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <audio id="vo" src="assets/audio/vo.wav" data-start="0" data-duration="{{END}}" data-track-index="10" data-volume="1"></audio>
      <audio id="score" src="assets/audio/score.wav" data-start="0" data-duration="{{END}}" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      const D = /*@DATA*/ null;
      const C = /*@CUES*/ null;
      const END = {{END}};

      const W = 1080;
      const H = 1920;
      const COL = { bg: "#04070b", panel: "#0a121c", ink: "#05090f", buy: "#78e1d5", sell: "#f09a5a", gold: "#e8bd7d", red: "#ff8a7f", oi: "#c3d0dc", text: "#edf2ed", muted: "#94a8b9", dim: "#5f7486", line: "#2a3a4a", grid: "rgba(120,160,190,0.09)" };
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';
      const MIN = 60_000;
      const M5 = 300_000;
      const U = (s) => Date.parse(s + "Z");
      const TP = (hhmm) => U(`2025-12-09T${String(Number(hhmm.slice(0, 2)) - 8).padStart(2, "0")}:${hhmm.slice(3)}:00`); // Taipei → UTC ms

      // ---------- helpers: every frame is a pure function of film time t ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const ease = {
        linear: (k) => k,
        inOut: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
        p2inOut: (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2),
        p4out: (k) => 1 - Math.pow(1 - k, 4),
        out3: (k) => 1 - Math.pow(1 - k, 3),
        expoOut: (k) => (k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)),
        circOut: (k) => Math.sqrt(1 - Math.pow(k - 1, 2)),
        backOut: (k) => 1 + 2.4 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2),
        inExpo: (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10)),
      };
      const win = (t, a, b, fi, fo) => (t < a || t > b ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1));
      const pulse = (t, t0, decay = 6) => (t < t0 ? 0 : Math.exp(-(t - t0) * decay));
      const fmt = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
      const rgba = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
      };
      const taipei = (ms) => {
        const d = new Date(ms + 8 * 3600_000);
        return `${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")}`;
      };
      function text(ctx, str, x, y, { font = TC, size, weight = 700, color = COL.text, align = "left", alpha = 1, base = "alphabetic", track = 0, glow = 0 }) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = base;
        if (track) ctx.letterSpacing = `${track}px`;
        if (glow) {
          ctx.shadowColor = color;
          ctx.shadowBlur = glow;
        }
        ctx.fillText(str, x, y);
        ctx.restore();
      }
      function hline(ctx, x1, x2, y, color, width, alpha, dash) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y);
        ctx.stroke();
        ctx.restore();
      }
      function seg(ctx, x1, y1, x2, y2, color, width, alpha, dash) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = "round";
        if (dash) ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.restore();
      }
      function dot(ctx, x, y, r, color, alpha = 1) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      function rrect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function ring(ctx, x, y, t, t0, { r0 = 10, r1 = 70, color = COL.gold, dur = 0.7, width = 3 } = {}) {
        const k = prog(t, t0, t0 + dur);
        if (k <= 0 || k >= 1) return;
        ctx.save();
        ctx.globalAlpha *= 1 - k;
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.beginPath();
        ctx.arc(x, y, lerp(r0, r1, ease.out3(k)), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      function checkGlyph(ctx, x, y, s, color, a) {
        if (a <= 0) return;
        ctx.save();
        ctx.globalAlpha *= a;
        ctx.strokeStyle = color;
        ctx.lineWidth = 3.6 * s;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.beginPath();
        ctx.moveTo(x - 7 * s, y);
        ctx.lineTo(x - 2 * s, y + 5 * s);
        ctx.lineTo(x + 8 * s, y - 6 * s);
        ctx.stroke();
        ctx.restore();
      }
      // A label on a plane: text with a short leader to its anchor.
      function callout(ctx, str, ax, ay, dx, dy, color, alpha, size = 26) {
        if (alpha <= 0) return;
        seg(ctx, ax, ay, ax + dx * 0.82, ay + dy * 0.82, color, 2, alpha * 0.8);
        dot(ctx, ax, ay, 5, color, alpha);
        text(ctx, str, ax + dx, ay + dy + (dy < 0 ? -6 : size), { size, color, align: dx < -10 ? "right" : dx > 10 ? "left" : "center", alpha, glow: 10 });
      }

      // ---------- planes ----------
      const plane = (id, scale) => {
        const el = document.getElementById(id);
        return { el, ctx: el.getContext("2d"), scale, w: el.width / scale, h: el.height / scale };
      };
      const PL = { bg: plane("p-bg", 0.25), cvd: plane("p-cvd", 2), chart: plane("p-chart", 2) };
      const ov = document.getElementById("overlay").getContext("2d");
      const stage = document.getElementById("stage");
      const world = document.getElementById("world");
      // Static depths of each plane (translateZ); the camera moves the world, never the planes.
      const Z = { bg: -2600, cvd: -40, chart: 0 };
      function placePlanes() {
        PL.bg.el.style.transform = `translateZ(${Z.bg}px) scale(2.85)`;
        PL.cvd.el.style.transform = `translateZ(${Z.cvd}px)`;
        PL.chart.el.style.transform = `translateZ(${Z.chart}px)`;
      }
      function begin(p) {
        p.ctx.setTransform(p.scale, 0, 0, p.scale, 0, 0);
        p.ctx.clearRect(0, 0, p.w, p.h);
        return p.ctx;
      }

      // ---------- data ----------
      const byT = new Map();
      for (const b of [...D.m5, ...D.wait]) if (!byT.has(b.t)) byT.set(b.t, b);
      const S = [...byT.values()].sort((a, b) => a.t - b.t);
      const P = D.prior;
      const PLAN = D.plan;
      const M1 = [...D.m1, ...D.m1e];
      const barOf = (ms) => S.find((b) => b.t === ms);
      const SWEEP_BAR = barOf(TP("13:15"));
      const SHORTS_BAR = barOf(TP("12:35"));
      const COVER_BAR = barOf(TP("13:30"));
      const RECLAIM_BAR = barOf(TP("15:15"));
      const DIP = D.wait.reduce((m, b) => (b.l < m.l ? b : m));
      // CVD from 10:00: cumulative 5-minute deltas, refined to minutes where we have them.
      let cum = 0;
      const CVD = [];
      for (const b of S) {
        const ones = M1.filter((m) => m.t >= b.t && m.t < b.t + M5);
        CVD.push([b.t, cum]);
        if (ones.length === 5) for (const m of ones) CVD.push([m.t + MIN, (cum += m.delta)]);
        else CVD.push([b.t + M5, (cum += b.delta)]);
      }
      function cvdAt(ms) {
        let i = 0;
        while (i + 1 < CVD.length && CVD[i + 1][0] <= ms) i++;
        const [a, va] = CVD[i];
        const [b, vb] = CVD[Math.min(i + 1, CVD.length - 1)];
        return b > a ? lerp(va, vb, clamp((ms - a) / (b - a))) : va;
      }
      // The divergence: the sweep minute against the CVD low ten minutes later.
      const DIV = { a: TP("13:17") + MIN, b: TP("13:28") + MIN, pa: D.sweep.low, pb: M1.find((m) => m.t === TP("13:28")).l };
      DIV.ca = cvdAt(DIV.a);
      DIV.cb = cvdAt(DIV.b);
      // Footprint of the sweep minute at $50.
      const SWEEP_FP = (() => {
        const m = new Map();
        for (const [p, buy, sell] of M1.find((b) => b.t === D.sweep.t).levels) {
          const k = Math.floor(p / 50) * 50;
          const x = m.get(k) ?? [k, 0, 0];
          x[1] += buy;
          x[2] += sell;
          m.set(k, x);
        }
        return [...m.values()].map(([p, b, s]) => [p, Math.round(b * 10) / 10, Math.round(s * 10) / 10]);
      })();

      // Film time → market time traded so far (piecewise, eased; drops back are cuts).
      const REVEAL = [
        [0, TP("13:16") + 0.6 * MIN],
        [C.hook.brk + 0.25, TP("13:17") + 0.45 * MIN],
        [C.hook.and - 0.06, TP("13:18") + 0.4 * MIN],
        [C.hook.and - 0.05, TP("23:28")],
        [C.setup.start - 0.15, TP("23:47")],
        [C.setup.start, TP("11:00")],
        [C.setup.cvd - 0.2, TP("12:30")],
        [C.setup.cvd + 0.5, TP("12:35")],
        [C.setup.oi + 0.2, TP("12:37")],
        [C.setup.rule, TP("12:40")],
        [C.setup.shorts + 0.6, TP("12:45")],
        [C.setup.end, TP("13:14")],
        [C.sweep.brk - 0.25, TP("13:16") + 0.8 * MIN],
        [C.sweep.minute + 1.0, TP("13:18")],
        [C.sweep.never + 0.4, TP("13:29")],
        [C.sweep.end, TP("13:29") + 0.6 * MIN],
        [C.turn.time + 0.3, TP("13:30") + 0.3 * MIN],
        [C.turn.oi + 1.0, TP("13:35")],
        [C.turn.end, TP("13:40")],
        [C.reclaim.reclaim + 0.5, TP("15:19") + 0.8 * MIN],
        [C.reclaim.retest - 0.3, TP("15:25")],
        [C.reclaim.busiest + 0.6, TP("15:25")],
        [C.reclaim.entry - 0.1, TP("15:29") + 0.6 * MIN],
        [C.reclaim.entry + 0.6, TP("15:30")],
        [C.reclaim.speechEnd - 0.3, TP("15:31")],
        [C.result.targets - 0.1, TP("23:34")],
        [C.result.apart + 0.9, TP("23:46")],
        [END + 1, TP("23:50")],
      ];
      function reveal(t) {
        let i = 0;
        while (i + 1 < REVEAL.length && REVEAL[i + 1][0] <= t) i++;
        const [t0, v0] = REVEAL[i];
        const [t1, v1] = REVEAL[Math.min(i + 1, REVEAL.length - 1)];
        if (t1 <= t0) return v0;
        if (t1 - t0 < 0.02 || v1 < v0) return t < t1 ? v0 : v1;
        return lerp(v0, v1, ease.p2inOut(clamp((t - t0) / (t1 - t0))));
      }
      // The chart's data window per beat, eased between keyframes (the "lens" inside the plane).
      // [time it lands, window, seconds before, seconds after]. The minute window (13:05–13:35) is the
      // same lens zoomed in: the 5-minute bars split into their minutes on the way (see splitAt).
      const VIEWS = [
        [C.setup.start, { t0: TP("10:40"), t1: TP("13:00"), lo: 89450, hi: 90700 }],
        [C.setup.end - 0.6, { t0: TP("12:15"), t1: TP("13:30"), lo: 89250, hi: 90500 }, 0.8, 0.6],
        [C.sweep.brk - 0.3, { t0: TP("13:05"), t1: TP("13:35"), lo: 89280, hi: 89990 }, 0.75, 0.15],
        [C.sweep.absorb + 0.2, { t0: TP("13:14"), t1: TP("13:21"), lo: 89330, hi: 89730 }, 0.6, 0.4],
        [C.turn.start + 0.3, { t0: TP("12:15"), t1: TP("13:50"), lo: 89200, hi: 90700 }, 0.6, 0.5],
        [C.reclaim.start + 0.4, { t0: TP("13:00"), t1: TP("15:45"), lo: 89200, hi: 90650 }],
        [C.reclaim.retest - 0.2, { t0: TP("15:05"), t1: TP("15:40"), lo: 90170, hi: 90420 }],
        [C.reclaim.entry + 0.5, { t0: TP("13:00"), t1: TP("16:10"), lo: 89100, hi: 90700 }],
        [C.reclaim.speechEnd - 0.1, { t0: TP("13:00"), t1: TP("24:00"), lo: 89000, hi: 92700 }],
      ];
      function cvdRange(t0, t1) {
        let lo = Infinity;
        let hi = -Infinity;
        for (const [ms, v] of CVD) if (ms >= t0 && ms <= t1) (lo = Math.min(lo, v)), (hi = Math.max(hi, v));
        const pad = (hi - lo) * 0.14 + 30;
        return [lo - pad, hi + pad];
      }
      for (const [, v] of VIEWS) [v.c0, v.c1] = cvdRange(v.t0, v.t1);
      function view(t) {
        let v = VIEWS[0][1];
        for (let i = 1; i < VIEWS.length; i++) {
          const [at, next, pre = 0.4, post = 1.0] = VIEWS[i];
          const k = ease.inOut(prog(t, at - pre, at + post));
          if (k <= 0) break;
          v = Object.fromEntries(Object.keys(v).map((key) => [key, lerp(v[key], next[key], k)]));
        }
        return v;
      }
      // How far the 5-minute bars around the sweep have split into their minutes (0 = 5m, 1 = 1m).
      const splitAt = (t) => ease.inOut(prog(t, C.sweep.brk - 1.05, C.sweep.brk - 0.15)) * (1 - ease.inOut(prog(t, C.turn.start - 0.3, C.turn.start + 0.8)));

      // ---------- camera: one pose, legs in sequence ----------
      // Pose = world transform: translate3d(x, y, z) rotateX(rx) rotateY(ry). Camera in → z up.
      const FLAT = { x: 0, y: 0, z: 0, rx: 0, ry: 0 };
      const POSE = {
        brk: { x: -150, y: 40, z: 380, rx: -6, ry: 14 },
        surge: { x: -330, y: 150, z: 330, rx: 14, ry: -16 },
        loc: { x: 0, y: 40, z: 10, rx: 10, ry: 0 },
        locR: { x: 0, y: 40, z: 40, rx: 8, ry: -5 },
        cvd: { x: 0, y: -300, z: 150, rx: 14, ry: 0 },
        bar: { x: -60, y: 30, z: 190, rx: 6, ry: -4 },
        both: { x: 0, y: -130, z: 60, rx: 9, ry: 4 },
        zoomMin: { x: 0, y: 120, z: 150, rx: 4, ry: 0 },
        zoom5: { x: 0, y: 110, z: 140, rx: 4, ry: 2 },
        pan: { x: 0, y: 40, z: 40, rx: 4, ry: 7 },
        panEnd: { x: 0, y: 40, z: 40, rx: 4, ry: -5 },
        reclaim: { x: -200, y: 190, z: 200, rx: 4, ry: -9 },
        exec: { x: 0, y: 40, z: 40, rx: 8, ry: 0 },
        waitB: { x: 0, y: 0, z: -70, rx: 6, ry: -6 },
        whip: { x: 0, y: 190, z: 90, rx: -4, ry: -4 },
        end: { x: 0, y: 60, z: -1700, rx: 22, ry: 0 },
      };
      // [start, end, target pose, ease]
      const LEGS = [
        [0, 1.0, POSE.brk, "p4out"],
        [C.hook.and - 0.06, C.hook.and - 0.04, POSE.surge, "linear"], // hard cut
        [C.setup.start - 0.02, C.setup.start + 1.1, POSE.loc, "p4out"],
        [C.setup.cvd - 0.3, C.setup.cvd + 0.9, POSE.cvd, "p2inOut"],
        [C.setup.shorts - 0.5, C.setup.shorts + 0.7, POSE.locR, "p2inOut"],
        [C.sweep.start - 0.1, C.sweep.brk - 0.4, POSE.bar, "p4out"],
        [C.sweep.then - 0.3, C.sweep.then + 1.0, POSE.both, "p2inOut"],
        [C.sweep.absorb - 0.4, C.sweep.absorb + 0.6, POSE.zoomMin, "p2inOut"],
        [C.turn.start - 0.1, C.turn.start + 1.0, POSE.loc, "p4out"],
        [C.turn.up - 0.25, C.turn.up + 0.9, POSE.cvd, "p2inOut"],
        [C.turn.cover - 0.5, C.turn.cover + 0.8, POSE.locR, "p2inOut"],
        [C.reclaim.start - 0.1, C.reclaim.reclaim, POSE.pan, "p2inOut"],
        [C.reclaim.reclaim, C.reclaim.failed + 0.2, POSE.reclaim, "p2inOut"],
        [C.reclaim.retest - 0.6, C.reclaim.retest + 0.6, POSE.zoom5, "p2inOut"],
        [C.reclaim.entry + 0.1, C.reclaim.entry + 1.3, POSE.exec, "p2inOut"],
        [C.reclaim.speechEnd - 0.3, C.result.start + 1.0, POSE.waitB, "p2inOut"],
        [C.result.targets - 0.2, C.result.targets + 0.6, POSE.whip, "p4out"],
        [C.close.start - 0.1, C.close.start + 2.2, POSE.end, "p2inOut"],
      ];
      function poseAt(t) {
        let p = { ...FLAT, z: 120 };
        for (const [a, b, to, e] of LEGS) {
          if (t <= a) break;
          const k = ease[e](prog(t, a, b));
          p = Object.fromEntries(Object.keys(p).map((key) => [key, lerp(p[key], to[key], k)]));
        }
        // Impact shake on the break (hook and scene) — deterministic, decays fast.
        const hit = pulse(t, C.hook.brk + 0.2, 9) + pulse(t, C.sweep.brk + 0.25, 6);

      }
      // Data cards (the two OI readings): when they hold, the world racks out of focus.
      const CARDS = [
        { t0: C.setup.oi - 0.15, t1: C.setup.shorts - 0.35, kicker: "12:35–12:40 · 未平倉量 OI", value: 1040, sub: "CVD ↓ ＋ OI ↑ → 新空單追進場", subAt: C.setup.rule - 0.1, color: COL.oi, subColor: COL.sell, from: [540, 1240] },
        { t0: C.turn.oi - 0.15, t1: C.turn.cover - 0.35, kicker: "13:30–13:35 · 未平倉量 OI", value: -902, sub: "CVD ↑ ＋ OI ↓ → 空單回補", subAt: C.turn.rule - 0.1, color: COL.oi, subColor: COL.buy, from: [540, 1240] },

      const cardHold = (t) => Math.max(...CARDS.map((c) => win(t, c.t0 + 0.35, c.t1 - 0.25, 0.3, 0.3)));
      function applyCamera(t) {
        const p = poseAt(t);

        const cut = (t >= C.hook.and - 0.07 && t <= C.hook.and + 0.02) || (t >= C.setup.start - 0.03 && t <= C.setup.start + 0.05);

      // ---------- background plane: deep dots for parallax ----------
      function drawBackground() {
        const ctx = begin(PL.bg);
        let s = 9;
        const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        for (let i = 0; i < 520; i++) {
          const x = rnd() * PL.bg.w;
          const y = rnd() * PL.bg.h;
          const r = 0.4 + rnd() * 1.4;
          ctx.fillStyle = `rgba(150,190,210,${(0.15 + rnd() * 0.45).toFixed(2)})`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();

        ctx.lineWidth = 0.5;
        for (let gy = 0; gy <= PL.bg.h; gy += 36) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(PL.bg.w, gy);
          ctx.stroke();
        }
      }

      // ---------- chart plane ----------
      const CB = { x: 40, y: 36, w: 880, h: 620 };
      const hud = { ms: TP("13:16"), price: null, color: COL.text };
      const mapX = (v, ms) => CB.x + ((ms - v.t0) / (v.t1 - v.t0)) * CB.w;
      const mapY = (v, p) => CB.y + ((v.hi - p) / (v.hi - v.lo)) * CB.h;
      function grid(ctx, v) {
        const span = v.hi - v.lo;
        const step = span > 2400 ? 500 : span > 900 ? 200 : span > 350 ? 100 : 50;
        for (let p = Math.ceil(v.lo / step) * step; p <= v.hi; p += step) {
          hline(ctx, CB.x, CB.x + CB.w, mapY(v, p), COL.grid, 1, 1);
          text(ctx, fmt(p), CB.x + CB.w - 4, mapY(v, p) - 6, { font: MONO, size: 16, weight: 400, color: COL.dim, align: "right" });
        }
        const mins = (v.t1 - v.t0) / MIN;
        const ts = (mins > 300 ? 120 : mins > 100 ? 30 : mins > 40 ? 10 : mins > 15 ? 5 : 1) * MIN;
        for (let ms = Math.ceil(v.t0 / ts) * ts; ms <= v.t1; ms += ts) {
          const x = mapX(v, ms);
          if (x < CB.x + 20 || x > CB.x + CB.w - 70) continue;
          text(ctx, taipei(ms), x, CB.y + CB.h + 26, { font: MONO, size: 15, weight: 400, color: COL.dim, align: "center" });
        }
      }
      // A bar part-way through: its path is the 1-minute extremes where we have them.
      function partial(b, now) {
        const g = clamp((now - b.t) / M5);
        if (g >= 1) return { h: b.h, l: b.l, c: b.c };
        const ones = M1.filter((m) => m.t >= b.t && m.t < now);
        if (ones.length) {
          const last = ones.at(-1);
          const k = clamp((now - last.t) / MIN);
          const h = Math.max(b.o, ...ones.slice(0, -1).map((m) => m.h), lerp(last.o, last.h, k));
          const l = Math.min(b.o, ...ones.slice(0, -1).map((m) => m.l), lerp(last.o, last.l, k));
          return { h, l, c: lerp(last.o, last.c, k) };
        }
        return { h: lerp(b.o, b.h, g), l: lerp(b.o, b.l, g), c: lerp(b.o, b.c, g) };
      }
      // A minute bar part-way through; the sweep minute dives to its low first, then comes back.
      function minutePartial(m, now) {
        const k = clamp((now - m.t) / MIN);
        if (m.t !== D.sweep.t) return { h: lerp(m.o, m.h, k), l: lerp(m.o, m.l, k), c: lerp(m.o, m.c, k) };
        const l = k < 0.35 ? lerp(m.o, m.l, k / 0.35) : m.l;
        return { h: Math.max(m.o, lerp(m.o, m.h, clamp(k / 0.7))), l, c: k < 0.35 ? l : lerp(m.l, m.c, (k - 0.35) / 0.65) };
      }
      function drawBar(ctx, v, cx, w, o, p) {
        const col = p.c >= o ? COL.buy : COL.sell;
        ctx.strokeStyle = col;
        ctx.lineWidth = Math.max(1.5, Math.min(3, w * 0.12));
        ctx.beginPath();
        ctx.moveTo(cx, mapY(v, p.h));
        ctx.lineTo(cx, mapY(v, p.l));
        ctx.stroke();
        const y1 = mapY(v, Math.max(o, p.c));
        ctx.fillStyle = col;
        ctx.fillRect(cx - w / 2, y1, w, Math.max(1.5, mapY(v, Math.min(o, p.c)) - y1));
      }
      function candles(ctx, v, now, { focus = null, k = 0, split = 0, focusMin = null, kMin = 0 } = {}) {
        const bw = Math.max(2, (M5 / (v.t1 - v.t0)) * CB.w * 0.62);
        const mw = Math.max(2, (MIN / (v.t1 - v.t0)) * CB.w * 0.6);
        const es = ease.inOut(split);
        let last = null;
        for (const b of S) {
          if (b.t >= now) break;
          const cx = mapX(v, b.t + M5 / 2);
          if (cx < CB.x - bw * 3 || cx > CB.x + CB.w + bw * 3) continue;
          const p = partial(b, now);
          const kids = split > 0 ? M1.filter((m) => m.t >= b.t && m.t < b.t + M5) : [];
          if (kids.length === 5) {
            // The 5-minute bar fans out into its five minutes: each minute starts on the parent and
            // slides to its own slot while the parent fades.
            if (es < 1) {
              ctx.globalAlpha = (1 - es) * (1 - 0.7 * kMin);
              drawBar(ctx, v, cx, bw, b.o, p);
            }
            for (const m of kids) {
              if (m.t >= now) break;
              ctx.globalAlpha = es * (m.t === focusMin ? 1 - kMin : 1 - 0.7 * kMin);
              drawBar(ctx, v, lerp(cx, mapX(v, m.t + MIN / 2), es), lerp(bw, mw, es), m.o, minutePartial(m, now));
            }
            ctx.globalAlpha = 1;
            last = { b, close: p.c, cx };
            continue;
          }
          const col = p.c >= b.o ? COL.buy : COL.sell;
          ctx.globalAlpha = (b.t === focus ? 1 - k : 1 - 0.7 * k) * (1 - 0.7 * kMin);
          ctx.strokeStyle = col;
          ctx.lineWidth = Math.max(1.5, bw * 0.12);

          ctx.moveTo(cx, mapY(v, p.h));
          ctx.lineTo(cx, mapY(v, p.l));
          ctx.stroke();
          const y1 = mapY(v, Math.max(b.o, p.c));
          ctx.fillStyle = col;
          ctx.fillRect(cx - bw / 2, y1, bw, Math.max(1.5, mapY(v, Math.min(b.o, p.c)) - y1));

        }
        ctx.globalAlpha = 1;
        return last;
      }
      // One bar's footprint, unfolded where the bar stands: every price row splits into aggressive
      // sells (left) and buys (right), on the chart's own price scale.
      function unfoldBar(ctx, t, { cx, k, rows, band, y, width, hl, hlBuy = () => 0 }) {
        if (k <= 0) return;
        const w = lerp(16, width, ease.out3(k));

        const mid = (rows.length - 1) / 2;

        ctx.globalAlpha *= clamp(k * 1.5);

        rows.forEach(([p, buy, sell], i) => {
          const y0 = y(p + band);
          const h = y(p) - y0;

          ctx.fillStyle = rgba(COL.buy, 0.1 + 0.55 * Math.sqrt(buy / max));

          if (gb > 0) {

            ctx.shadowColor = COL.gold;
            ctx.shadowBlur = 18 * g;
            ctx.strokeStyle = rgba(COL.gold, g);
            ctx.lineWidth = 3.5;
            ctx.strokeRect(cx - w / 2, y0 + 1, w, h - 2);
            ctx.restore();
          }

          text(ctx, fmt(buy, buy < 10 ? 1 : 0), cx + 14, y0 + h / 2 + fs * 0.36, { font: MONO, size: fs, weight: 600, color: "#d6fffa", alpha: ta });

      function level(ctx, v, price, label, color, alpha, dash, width = 2) {

        for (const [price, label, hitT] of [

          [PLAN.t2, "目標二 VAH", hits[1]],

          if (price < v.lo || price > v.hi) continue;
          const hit = prog(t, hitT, hitT + 0.25);
          const y = mapY(v, price);
          const col = hit > 0.5 ? COL.buy : COL.gold;

      // Hook B: the surge through both targets.

        const last = candles(ctx, v, now);
        if (last) {

          hud.price = last.close;

      }

      // Minute view: the break (hook A), then the ten minutes of divergence (scene 3), which zooms
      // into the sweep minute and unfolds it.
      function chartMinutes(ctx, t, mv, { unfold = 0 } = {}) {
        const now = reveal(t);

        for (let p = Math.ceil(mv.lo / gs) * gs; p <= mv.hi; p += gs) {

        text(ctx, `前低 ${fmt(P.low, 0)}`, CB.x + CB.w - 90, y(P.low) - 12, { size: 24, color: flash > 0.05 ? COL.red : COL.gold, align: "right", alpha: 1 - unfold });

          if (b.t >= now) break;
          const cx = x(b.t + MIN / 2);
          if (cx < CB.x - step || cx > CB.x + CB.w + step) continue;
          const k = clamp((now - b.t) / MIN);
          const isDive = b.t === D.sweep.t;
          // Within the minute: down to the low first, then back.
          const lowNow = k < 0.35 ? lerp(b.o, b.l, k / 0.35) : b.l;
          const hiNow = lerp(b.o, b.h, clamp(k / 0.7));
          const closeNow = k < 0.35 ? lowNow : lerp(b.l, b.c, (k - 0.35) / 0.65);

          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(cx, y(h));
          ctx.lineTo(cx, y(l));
          ctx.stroke();
          const y1 = y(Math.max(b.o, c));
          ctx.fillStyle = col;
          ctx.fillRect(cx - step * 0.3, y1, step * 0.6, Math.max(2, y(Math.min(b.o, c)) - y1));
          ctx.restore();
          if (Math.round((b.t - TP("13:00")) / MIN) % every === 0) text(ctx, taipei(b.t), cx, CB.y + CB.h + 26, { font: MONO, size: 15, weight: 400, color: isDive ? COL.text : COL.dim, align: "center" });
          if (isDive) {

            ring(ctx, cx, y(P.low), t, C.sweep.brk + 0.25, { color: COL.red, r1: 160, dur: 1.0 });

          text(ctx, `主動賣 ${D.sweep.absorb.sell}`, lx, y(89480) + 58, { font: NUM, size: 54, color: COL.sell, alpha: ka, glow: 10 });
          text(ctx, `主動買 ${D.sweep.absorb.buy}`, lx, y(89480) + 112, { font: NUM, size: 54, color: COL.buy, alpha: ka, glow: 10 });
          text(ctx, "賣單被吸收", lx, y(89480) + 160, { size: 28, color: COL.gold, alpha: prog(t, A + 1.0, A + 1.4), glow: 8 });
        }
        ctx.restore();
        hud.ms = now;
        if (price != null) hud.price = price;
        hud.color = COL.sell;

      }

      function chartMain(ctx, t) {
        const v = view(t);
        const now = reveal(t);
        grid(ctx, v);
        // Prior-day profile, faint, on the right.
        const prof = win(t, C.setup.start + 0.4, C.sweep.start, 0.8, 0.8);
        if (prof > 0) {
          const max = Math.max(...D.profile.map((r) => r[1]));
          for (const [p, vol] of D.profile) {
            if (p < v.lo || p + 100 > v.hi) continue;
            const inVA = p >= P.val - 100 && p <= P.vah;

            ctx.fillStyle = rgba(inVA ? COL.gold : COL.muted, (inVA ? 0.22 : 0.12) * prof);

        const sweep = (t0) => ease.out3(prog(t, t0, t0 + 0.6));
        const reclaimed = prog(t, C.reclaim.reclaim + 0.2, C.reclaim.reclaim + 0.6);
        const lowK = sweep(C.setup.start + 0.4);
        if (lowK > 0 && P.low > v.lo && P.low < v.hi) {
          const y = mapY(v, P.low);
          const fl = pulse(t, C.sweep.brk + 0.25, 2.2);
          const lc = fl > 0.05 ? COL.red : COL.gold;
          hline(ctx, CB.x, CB.x + CB.w * lowK, y, lc, 2 + 3 * pulse(t, C.setup.start + 0.4, 3) + 4 * fl, 0.85 - 0.35 * prog(t, C.reclaim.reclaim, C.reclaim.retest), [14, 8]);

          const col = reclaimed > 0.5 ? COL.buy : COL.gold;
          const rT = C.reclaim.reclaim + 0.2;

          text(ctx, `VAL ${fmt(P.val)}`, CB.x + 6, y - 10, { size: 20, color: col, alpha: valK });
          // A light sweep runs along VAL when it is reclaimed.
          const ls = prog(t, rT, rT + 0.9);
          if (ls > 0 && ls < 1) {
            const lx = CB.x + CB.w * ease.out3(ls);
            const g = ctx.createLinearGradient(lx - 160, 0, lx + 40, 0);
            g.addColorStop(0, rgba(COL.buy, 0));
            g.addColorStop(1, rgba(COL.buy, 0.9));
            ctx.fillStyle = g;
            ctx.fillRect(lx - 160, y - 4, 200, 8);

          ring(ctx, rx, y, t, rT, { r0: 14, r1: 120, color: COL.buy, dur: 0.8 });
          // "The breakdown has failed."
          const kf = win(t, C.reclaim.failed - 0.15, C.reclaim.retest + 0.2, 0.25, 0.4);
          if (kf > 0) {
            const s = 1 + 0.3 * pulse(t, C.reclaim.failed - 0.15, 7);
            ctx.save();
            ctx.translate(rx - 40, y - 64);
            ctx.scale(s, s);
            text(ctx, "跌破失敗", 0, 0, { size: 56, weight: 900, color: COL.buy, align: "right", alpha: kf, glow: 18 });
            text(ctx, "FAILED BREAKDOWN", 0, 40, { font: MONO, size: 18, weight: 700, color: COL.buy, align: "right", alpha: kf * 0.8, track: 2 });
            ctx.restore();
          }
        }
        // The re-test bar unfolds into its footprint while the window pushes in on it.
        const R = C.reclaim;
        const kU = ease.out3(prog(t, R.retest - 0.1, R.retest + 0.5)) * (1 - ease.inOut(prog(t, R.busiest + 0.5, R.busiest + 0.95)));
        const split = splitAt(t);
        const kMin = ease.out3(prog(t, C.sweep.absorb + 0.1, C.sweep.absorb + 0.7)) * (1 - prog(t, C.turn.start - 0.45, C.turn.start - 0.15));
        const last = candles(ctx, v, now, { focus: TP("15:20"), k: kU, split, focusMin: D.sweep.t, kMin });
        // The sweep minute: its print, the divergence that follows, then its footprint.
        if (split > 0) {
          const dx = mapX(v, D.sweep.t + MIN / 2);
          const dy = mapY(v, D.sweep.low);
          ring(ctx, dx, mapY(v, P.low), t, C.sweep.brk + 0.25, { color: COL.red, r1: 160, dur: 1.0 });
          const kv = win(t, C.sweep.minute, C.sweep.then + 0.2, 0.3, 0.4) * split;
          if (kv > 0) text(ctx, "1 分鐘 Δ −798", dx - 24, dy + 8, { font: NUM, size: 46 * (1 + 0.2 * pulse(t, C.sweep.minute, 5)), color: COL.sell, align: "right", alpha: kv, glow: 12 });
          const kd = win(t, C.sweep.never - 0.1, C.sweep.absorb, 0.4, 0.35) * split;
          if (kd > 0) {
            const k = ease.out3(prog(t, C.sweep.never - 0.1, C.sweep.never + 0.6));
            const xa = mapX(v, DIV.a - MIN / 2);
            const xb = mapX(v, DIV.b - MIN / 2);
            const ya = mapY(v, DIV.pa) + 12;
            const yb = mapY(v, DIV.pb) + 12;
            seg(ctx, xa, ya, lerp(xa, xb, k), lerp(ya, yb, k), COL.buy, 3.5, kd, [10, 7]);
            dot(ctx, xa, ya, 7, COL.buy, kd);
            if (k >= 1) dot(ctx, xb, yb, 7, COL.buy, kd);
            text(ctx, "價格沒破底", xb + 20, yb + 46, { size: 30, color: COL.buy, alpha: kd * prog(t, C.sweep.never + 0.3, C.sweep.never + 0.7), glow: 12 });
          }
          if (kMin > 0) {
            const A = C.sweep.absorb + 0.8;
            const yv = (p) => mapY(v, p);
            unfoldBar(ctx, t, { cx: dx, k: kMin, rows: SWEEP_ROWS, band: 25, y: yv, width: 380, hl: (p) => (p < 89500 ? ease.out3(prog(t, A + ((p - 89350) / 25) * 0.12, A + 0.2 + ((p - 89350) / 25) * 0.12)) : 0) });
            const lx = dx + 205;
            const ka = prog(t, A + 0.5, A + 0.9) * kMin;
            text(ctx, "89,500 以下", lx, yv(89480), { size: 22, weight: 500, color: COL.muted, alpha: ka });
            text(ctx, `主動賣 ${D.sweep.absorb.sell}`, lx, yv(89480) + 58, { font: NUM, size: 54, color: COL.sell, alpha: ka, glow: 10 });
            text(ctx, `主動買 ${D.sweep.absorb.buy}`, lx, yv(89480) + 112, { font: NUM, size: 54, color: COL.buy, alpha: ka, glow: 10 });
            text(ctx, "賣單被吸收", lx, yv(89480) + 160, { size: 28, color: COL.gold, alpha: prog(t, A + 1.0, A + 1.4) * kMin, glow: 8 });
          }
        }
        const BUSY = 90300; // the 15:20 bar's busiest $10 level: sells 25, buys 47
        const ux = mapX(v, TP("15:20") + M5 / 2);
        const yv = (p) => mapY(v, p);
        if (kU > 0) {
          const rows = D.entryBar.levels.filter((r) => r[0] >= 90190 && r[0] <= 90340);
          const kS = ease.out3(prog(t, R.stack - 0.1, R.stack + 0.5));
          const kB = prog(t, R.busiest - 0.15, R.busiest + 0.15);
          unfoldBar(ctx, t, {
            cx: ux, k: kU, rows, band: 10, y: yv, width: 420,
            hlBuy: (p) => (p >= 90260 && p <= 90310 ? kS * ease.out3(prog(t, R.stack + ((90310 - p) / 10) * 0.08, R.stack + 0.25 + ((90310 - p) / 10) * 0.08)) : 0),
            hl: (p) => (p === BUSY ? kB * (0.75 + 0.25 * Math.sin((t - R.busiest) * 9)) : 0),
          });
          const w = lerp(16, 420, ease.out3(kU));
          // Six levels in a row, buyers 20+ at each.
          if (kS > 0) {
            const bx = ux + w / 2 + 12;
            const yTop = yv(90320);
            const yBot = yv(90260);
            ctx.save();
            ctx.globalAlpha *= kS * kU;
            ctx.strokeStyle = COL.buy;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(bx, yTop + 2);
            ctx.lineTo(bx + 10, yTop + 2);
            ctx.lineTo(bx + 10, yBot - 2);
            ctx.lineTo(bx, yBot - 2);
            ctx.stroke();
            ctx.restore();
            text(ctx, "連續 6 格", bx + 22, (yTop + yBot) / 2 - 6, { size: 26, color: COL.buy, alpha: kS * kU, glow: 8 });
            text(ctx, "主動買 ≥ 20", bx + 22, (yTop + yBot) / 2 + 28, { font: NUM, size: 30, color: COL.buy, alpha: kS * kU });
          }
          if (kB > 0) text(ctx, "成交最多", ux - w / 2 - 14, yv(BUSY + 5) + 9, { size: 26, color: COL.gold, align: "right", alpha: kB * kU, glow: 12 });
        }
        // The busiest level stays as a band; the next bar comes back into it, and that is the entry.
        const kBand = ease.out3(prog(t, R.busiest + 0.2, R.busiest + 0.7)) * (1 - prog(t, R.speechEnd - 0.4, R.speechEnd + 0.2));
        if (kBand > 0) {
          const x0 = ux - 14;
          const x1 = lerp(x0, CB.x + CB.w, ease.out3(prog(t, R.busiest + 0.2, R.busiest + 0.8)));
          const yt = yv(BUSY + 10);
          const yb = yv(BUSY);
          ctx.save();
          ctx.globalAlpha *= kBand;
          ctx.fillStyle = rgba(COL.gold, 0.18 + 0.12 * pulse(t, R.entry - 0.05, 3));
          ctx.fillRect(x0, yt, x1 - x0, yb - yt);
          ctx.restore();
          hline(ctx, x0, x1, yt, COL.gold, 2 + 3 * pulse(t, R.entry - 0.05, 4), kBand);
          text(ctx, "成交最多的價位 90,300–90,310", CB.x + CB.w - 8, yb + 30, { size: 22, color: COL.gold, align: "right", alpha: kBand * prog(t, R.busiest + 0.6, R.busiest + 1.0) * (1 - prog(t, R.entry + 0.2, R.entry + 0.6)) });
          const tx = mapX(v, TP("15:29") + 0.6 * MIN);
          ring(ctx, tx, yt, t, R.entry - 0.05, { r0: 10, r1: 120, color: COL.gold, dur: 0.9, width: 4 });
          ring(ctx, tx, yt, t, R.entry + 0.1, { r0: 10, r1: 70, color: COL.gold, dur: 0.7, width: 3 });
        }
        // Who opened, who closed: the two readings tagged on their bars.
        const kS = Math.max(win(t, C.setup.shorts - 0.2, C.sweep.start + 0.3, 0.3, 0.4), win(t, C.turn.chasers - 0.5, C.reclaim.start + 0.3, 0.3, 0.4));
        const sx = mapX(v, SHORTS_BAR.t + M5 / 2);
        const sy = mapY(v, SHORTS_BAR.l) + 10;
        if (kS > 0) callout(ctx, "新空單進場", sx, sy, -60, 74, COL.sell, kS * ease.out3(prog(t, C.setup.shorts - 0.2, C.setup.shorts + 0.3)) + (t > C.turn.start ? kS : 0) * (t > C.turn.start ? 1 : 0), 30);
        const kC = win(t, C.turn.cover - 0.2, C.reclaim.start + 0.3, 0.3, 0.4);
        const cx = mapX(v, COVER_BAR.t + M5 / 2);
        const cy = mapY(v, COVER_BAR.h) - 10;
        if (kC > 0) callout(ctx, "空單回補", cx, cy, -40, -80, COL.buy, kC, 30);
        // The same traders: an arc from the shorts' entry to the cover.
        const ka = win(t, C.turn.chasers - 0.1, C.reclaim.start + 0.3, 0.3, 0.4);
        if (ka > 0) {
          const k = ease.inOut(prog(t, C.turn.chasers - 0.1, C.turn.chasers + 1.0));
          const ax = sx - 60;
          const ay = sy + 104;
          const bx = cx;
          const by = cy;
          const qx = (ax + bx) / 2 + 60;
          const qy = Math.max(ay, by) + 170;
          ctx.save();
          ctx.globalAlpha *= ka;
          ctx.strokeStyle = COL.gold;
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 8]);
          ctx.shadowColor = COL.gold;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          for (let i = 0; i <= 48 * k; i++) {
            const u = i / 48;
            const x = (1 - u) * (1 - u) * ax + 2 * (1 - u) * u * qx + u * u * bx;
            const yy = (1 - u) * (1 - u) * ay + 2 * (1 - u) * u * qy + u * u * by;
            i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
          }
          ctx.stroke();
          ctx.restore();
        }
        // Entry drops in with the stop; targets join in the result.
        const ke = prog(t, C.reclaim.entry - 0.25, C.reclaim.entry);
        if (ke > 0) {
          const ex = mapX(v, PLAN.entryT);
          const ey = mapY(v, PLAN.entry);
          const ks = ease.out3(prog(t, C.reclaim.entry + 0.3, C.reclaim.entry + 0.9));
          const kt = ease.out3(prog(t, C.result.start, C.result.start + 0.6));
          if (ks > 0) {
            ctx.fillStyle = rgba(COL.red, 0.12 * ks);
            const sy2 = mapY(v, PLAN.stop);
            ctx.fillRect(ex, ey, (CB.x + CB.w - ex) * ks, sy2 - ey);
            hline(ctx, ex, ex + (CB.x + CB.w - ex) * ks, sy2, COL.red, 2.5, 1);
            text(ctx, `停損 ${fmt(PLAN.stop)}`, CB.x + CB.w - 8, sy2 + 28, { size: 22, color: COL.red, align: "right", alpha: ks });
          }
          if (kt > 0) {
            ctx.fillStyle = rgba(COL.buy, 0.08 * kt);
            const ty = mapY(v, PLAN.t2);
            ctx.fillRect(ex, ty + (ey - ty) * (1 - kt), CB.x + CB.w - ex, (ey - ty) * kt);
            ctx.save();
            ctx.globalAlpha *= kt;
            targets(ctx, v, t, ex, RESULT_HITS);
            ctx.restore();
          }
          // The needle falls from above with a short streak, then rests.
          const drop = ease.p4out(prog(t, C.reclaim.entry - 0.25, C.reclaim.entry + 0.15));
          const ny = lerp(ey - 360, ey, drop);
          for (let k = 3; k >= 1; k--) {
            ctx.fillStyle = rgba(COL.gold, (0.18 * (1 - drop)) / k);
            ctx.beginPath();
            ctx.arc(ex, ny - k * 26 * (1 - drop), 10, 0, Math.PI * 2);
            ctx.fill();
          }
          hline(ctx, ex, CB.x + CB.w, ey, COL.gold, 2.5, drop, [10, 6]);
          ctx.fillStyle = COL.gold;
          ctx.beginPath();
          ctx.arc(ex, ny, 10 + 10 * pulse(t, C.reclaim.entry + 0.1, 4), 0, Math.PI * 2);
          ctx.fill();
          ring(ctx, ex, ey, t, C.reclaim.entry + 0.1, { r0: 10, r1: 90, color: COL.gold });
          // Right of the needle: the entry sits inside the next bar, so its left is the bar itself.
          text(ctx, `做多 ${fmt(PLAN.entry)}`, ex + 22, ey - 18, { size: 26, color: COL.gold, alpha: drop, glow: 10 });
        }
        // The deepest dip while waiting.
        const kw = win(t, C.result.start + 0.3, C.close.start + 0.4, 0.4, 0.6) * (now >= DIP.t + M5 ? 1 : 0);
        if (kw > 0) {
          const x = mapX(v, DIP.t + M5 / 2);
          const y = mapY(v, DIP.l);
          dot(ctx, x, y + 12, 7, COL.gold, kw);
          text(ctx, `最低 ${fmt(DIP.l)} · 距停損 ${fmt(DIP.l - PLAN.stop)}`, x, y + 50, { size: 24, color: COL.gold, align: "center", alpha: kw });
        }
        if (last) {
          hud.ms = now;
          hud.price = last.close;
          hud.color = last.close >= last.b.o ? COL.buy : COL.sell;
        }
        return { v, now };
      }

      const HOOK_VIEW = { t0: TP("13:08"), t1: TP("13:22"), lo: 89300, hi: 89900 };
      const SWEEP_ROWS = M1.find((b) => b.t === D.sweep.t).levels;
      function drawChartPlane(t) {
        const ctx = begin(PL.chart);
        if (t < C.hook.and - 0.05) return chartMinutes(ctx, t, HOOK_VIEW);
        if (t < C.setup.start) return chartHookSurge(ctx, t);
        chartMain(ctx, t);
      }

      // How far the camera is pushed in on a bar (the sweep minute, the re-test bar).
      const zoomAmt = (t) =>
        Math.max(
          ease.inOut(prog(t, C.sweep.absorb - 0.4, C.sweep.absorb + 0.6)) * (1 - ease.inOut(prog(t, C.turn.start - 0.35, C.turn.start + 0.25))),
          ease.inOut(prog(t, C.reclaim.retest - 0.6, C.reclaim.retest + 0.4)) * (1 - ease.inOut(prog(t, C.reclaim.entry + 0.1, C.reclaim.entry + 1.0))),
        );

      // ---------- CVD plane (the film's main evidence) ----------
      const CV = { x: 40, y: 60, w: 880, h: 250 };
      function cvdLine(ctx, t, x, yOf, from, to, now, hot) {
        const pts = CVD.filter(([ms]) => ms >= from - M5 && ms <= now);
        pts.push([now, cvdAt(now)]);
        for (let i = 1; i < pts.length; i++) {
          const [a, va] = pts[i - 1];
          const [b, vb] = pts[i];
          const up = vb >= va;
          const h = hot(b, up);
          seg(ctx, x(a), yOf(va), x(b), yOf(vb), up ? COL.buy : COL.sell, 3 + h * 3, 1);
          if (h > 0.05) seg(ctx, x(a), yOf(va), x(b), yOf(vb), up ? COL.buy : COL.sell, 12, h * 0.25);
        }
        const v = cvdAt(now);
        dot(ctx, x(now), yOf(v), 6, v >= cvdAt(now - M5) ? COL.buy : COL.sell);
        return v;
      }
      function drawCvdPlane(t) {
        const ctx = begin(PL.cvd);
        const a = (t < C.setup.start ? 0 : win(t, C.setup.start + 0.2, C.close.start + 1.4, 0.6, 0.8)) * (1 - 0.85 * zoomAmt(t));
        if (a <= 0) return;
        ctx.globalAlpha = a;
        rrect(ctx, 6, 6, PL.cvd.w - 12, PL.cvd.h - 12, 18);
        ctx.fillStyle = "rgba(10,18,28,0.55)";
        ctx.fill();
        ctx.strokeStyle = rgba(COL.line, 0.7);
        ctx.lineWidth = 1.5;
        ctx.stroke();
        const now = reveal(t);
        const hot = (ms, up) => (!up && ms > TP("12:30") && ms <= TP("12:40") ? win(t, C.setup.cvd - 0.2, C.sweep.start + 0.6, 0.3, 0.6) : 0) + (up && ms > TP("13:29") && ms <= TP("13:40") ? win(t, C.turn.up - 0.2, C.reclaim.start + 0.5, 0.3, 0.6) : 0);
        const v = view(t);
        const yOf = (c) => CV.y + ((v.c1 - c) / (v.c1 - v.c0)) * CV.h;
        ctx.save();
        ctx.beginPath();
        ctx.rect(CV.x - 4, CV.y - 10, CV.w + 8, CV.h + 20);
        ctx.clip();
        const gs = v.c1 - v.c0 > 1500 ? 500 : 250;
        for (let c = Math.ceil(v.c0 / gs) * gs; c <= v.c1; c += gs) hline(ctx, CV.x, CV.x + CV.w, yOf(c), COL.grid, 1, 1);
        const value = cvdLine(ctx, t, (ms) => mapX(v, ms), yOf, v.t0, v.t1, now, hot);
        // Divergence on CVD: a lower low ten minutes after the sweep, while price held.
        const kd = win(t, C.sweep.lows - 0.1, C.turn.start + 0.4, 0.4, 0.5) * splitAt(t);
        if (kd > 0) {
          const k = ease.out3(prog(t, C.sweep.lows - 0.1, C.sweep.lows + 0.6));
          const xa = mapX(v, DIV.a);
          const xb = mapX(v, DIV.b);
          const ya = yOf(DIV.ca) + 14;
          const yb = yOf(DIV.cb) + 14;
          seg(ctx, xa, ya, lerp(xa, xb, k), lerp(ya, yb, k), COL.sell, 3.5, kd, [10, 7]);
          dot(ctx, xa, ya, 7, COL.sell, kd);
          if (k >= 1) dot(ctx, xb, yb, 7, COL.sell, kd);
          text(ctx, "CVD 創新低", xb + 22, yb + 10, { size: 30, color: COL.sell, alpha: kd * prog(t, C.sweep.lows + 0.3, C.sweep.lows + 0.7), glow: 12 });
        }
        ctx.restore();
        text(ctx, "CVD 累計主動買賣（BTC）", CV.x, 40, { size: 22, weight: 500, color: COL.muted });
        text(ctx, `${value >= 0 ? "+" : "−"}${fmt(Math.abs(Math.round(value)))}`, CV.x + CV.w, 42, { font: NUM, size: 40, color: value >= cvdAt(now - M5) ? COL.buy : COL.sell, align: "right" });
      }

      // ---------- overlay: HUD, hook type, OI cards, closing lines ----------
      function drawHud(t) {
        const a = win(t, 0, C.close.start + 0.4, 0, 0.5);
        if (a <= 0) return;
        const y0 = 196;
        text(ov, "2025.12.09", 90, y0, { font: MONO, size: 26, weight: 500, color: COL.muted, alpha: a });
        text(ov, taipei(hud.ms), 90, y0 + 82, { font: NUM, size: 86, color: COL.text, alpha: a, track: 2 });
        text(ov, "台灣時間", 260, y0 + 82, { size: 22, weight: 500, color: COL.dim, alpha: a });
        text(ov, "BTCUSDT 永續 · 幣安", W - 90, y0, { size: 24, weight: 500, color: COL.muted, align: "right", alpha: a });
        if (hud.price != null) text(ov, fmt(hud.price, 1), W - 90, y0 + 82, { font: NUM, size: 80, color: hud.color, align: "right", alpha: a, track: 1 });
        // Timeframe switch, like a terminal's: the highlight slides when the bars split or merge.
        const ka = a * (t < C.setup.start ? 0 : prog(t, C.setup.start + 0.3, C.setup.start + 0.8));
        if (ka > 0) {
          const s = splitAt(t);
          const x0 = 90;
          const y = y0 + 112;
          const segW = 92;
          ov.save();
          ov.globalAlpha = ka;
          rrect(ov, x0, y, segW * 2, 38, 19);
          ov.fillStyle = "rgba(10,18,28,0.85)";
          ov.fill();
          ov.strokeStyle = rgba(COL.line, 0.9);
          ov.lineWidth = 1.5;
          ov.stroke();
          rrect(ov, x0 + 3 + segW * s, y + 3, segW - 6, 32, 16);
          ov.fillStyle = rgba(COL.gold, 0.9);
          ov.fill();
          ov.restore();
          text(ov, "5 分 K", x0 + segW / 2, y + 26, { size: 20, color: s < 0.5 ? COL.ink : COL.muted, align: "center", alpha: ka });
          text(ov, "1 分 K", x0 + segW * 1.5, y + 26, { size: 20, color: s >= 0.5 ? COL.ink : COL.muted, align: "center", alpha: ka });
          const h1 = win(t, C.sweep.brk - 1.05, C.sweep.brk + 1.0, 0.3, 0.4);
          const h2 = win(t, C.turn.start - 0.3, C.turn.start + 1.4, 0.3, 0.4);
          text(ov, "放大：1 根 = 1 分鐘", x0 + segW * 2 + 18, y + 27, { size: 22, color: COL.gold, alpha: ka * h1 });
          text(ov, "回到 5 分鐘", x0 + segW * 2 + 18, y + 27, { size: 22, color: COL.gold, alpha: ka * h2 });
        }
      }

      // Hook type: "跌破前低，" slams in (scale + blur → sharp), "反而做多？" side-snaps on the cut.
      function drawHookType(t) {
        const out = 1 - ease.inOut(prog(t, C.setup.start - 0.35, C.setup.start));
        if (out <= 0) return;
        const k1 = prog(t, C.hook.brk - 0.25, C.hook.brk + 0.25);
        const gone1 = t >= C.hook.and - 0.05 ? 0 : 1;
        if (k1 > 0 && gone1) {
          ov.save();
          ov.globalAlpha = out * clamp(k1 * 2.5);
          ov.translate(W / 2, 1270);
          const s = lerp(1.7, 1, ease.p4out(k1));
          ov.scale(s, s);
          if (k1 < 1) ov.filter = `blur(${((1 - ease.p4out(k1)) * 16).toFixed(1)}px)`;
          text(ov, "跌破前低，", 0, 0, { size: 112, weight: 900, color: COL.text, align: "center", base: "middle", glow: 20 });
          ov.restore();
        }
        const k2 = prog(t, C.hook.and - 0.05, C.hook.and + 0.4);
        if (k2 > 0) {
          ov.save();
          ov.globalAlpha = out * clamp(k2 * 3);
          ov.translate(W / 2 + lerp(420, 0, ease.expoOut(k2)), 1290);
          text(ov, "反而做多？", 0, 0, { size: 124, weight: 900, color: COL.gold, align: "center", base: "middle", glow: 24 });
          ov.restore();
        }
      }

      function cardPose(t, c) {
        const u = t - c.t0;
        const dur = c.t1 - c.t0;
        const cx = W / 2;
        const cy = 880;
        const [fx, fy] = c.from;
        if (u < 0.6) {
          const p = ease.out3(clamp(u / 0.6));
          return { x: lerp(fx, cx, p), y: lerp(fy, cy, p), s: lerp(0.25, 1.5, p) + Math.sin(Math.PI * clamp(u / 0.6)) * 0.4 };
        }
        if (u < dur - 0.45) return { x: cx, y: cy, s: 1.5 + 0.06 * ease.inOut(clamp((u - 0.6) / Math.max(0.1, dur - 1.05))) };
        // Out: up and away toward the price readout.
        const p = ease.inExpo(clamp((u - (dur - 0.45)) / 0.45));
        return { x: lerp(cx, W - 220, p), y: lerp(cy, 250, p), s: lerp(1.56, 0.1, p) };
      }
      function drawCard(t, c, pose, a) {
        const w = 560;
        const h = 210;
        ov.save();
        ov.translate(pose.x, pose.y);
        ov.scale(pose.s, pose.s);
        ov.globalAlpha = a;
        ov.shadowColor = c.color;
        ov.shadowBlur = 40;
        rrect(ov, -w / 2, -h / 2, w, h, 22);
        ov.fillStyle = "rgba(8,14,24,0.95)";
        ov.fill();
        ov.shadowBlur = 0;
        ov.strokeStyle = rgba(c.color, 0.85);
        ov.lineWidth = 2;
        ov.stroke();
        text(ov, c.kicker, -w / 2 + 32, -h / 2 + 38, { size: 18, color: COL.gold, base: "middle", track: 2 });
        const n = Math.round(c.value * ease.out3(prog(t, c.t0 + 0.2, c.t0 + 0.9)));
        text(ov, `OI ${n >= 0 ? "+" : "−"}${fmt(Math.abs(n))}`, -w / 2 + 30, 4, { font: NUM, size: 78, weight: 700, color: COL.text, base: "middle", glow: 14 });
        text(ov, "BTC", w / 2 - 32, 14, { font: NUM, size: 34, weight: 500, color: COL.muted, align: "right", base: "middle" });
        text(ov, c.sub, -w / 2 + 32, h / 2 - 34, { size: 25, weight: 700, color: c.subColor, base: "middle", alpha: prog(t, c.subAt, c.subAt + 0.3) });
        ov.restore();
      }
      function drawCards(t) {
        for (const c of CARDS) {
          const u = t - c.t0;
          if (u < 0 || u > c.t1 - c.t0 + 0.02) continue;
          const a = 1 - prog(u, c.t1 - c.t0 - 0.1, c.t1 - c.t0);
          // Motion trail while it travels fast: ghosts from a few frames back.
          if (u < 0.6 || u > c.t1 - c.t0 - 0.45) for (let k = 3; k >= 1; k--) if (u - k * 0.03 > 0) drawCard(t, c, cardPose(t - k * 0.03, c), a * 0.12 * (1 - k / 4));
          drawCard(t, c, cardPose(t, c), a);
        }
      }

      function draw(t) {
        applyCamera(t);
        drawChartPlane(t);
        drawCvdPlane(t);
        ov.setTransform(1, 0, 0, 1, 0, 0);
        ov.clearRect(0, 0, W, H);
        const top = ov.createLinearGradient(0, 0, 0, 360);
        top.addColorStop(0, "rgba(4,7,11,0.96)");
        top.addColorStop(0.7, "rgba(4,7,11,0.75)");
        top.addColorStop(1, "rgba(4,7,11,0)");
        ov.fillStyle = top;
        ov.fillRect(0, 0, W, 360);
        const bottom = ov.createLinearGradient(0, 1420, 0, 1920);
        bottom.addColorStop(0, "rgba(4,7,11,0)");
        bottom.addColorStop(0.25, "rgba(4,7,11,0.7)");
        bottom.addColorStop(1, "rgba(4,7,11,0.95)");
        ov.fillStyle = bottom;
        ov.fillRect(0, 1420, W, 500);
        drawHookType(t);
        drawCards(t);
        drawHud(t);
      }

      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 100px ${NUM}`),
        document.fonts.load(`400 20px ${MONO}`),
        document.fonts.load(`900 40px ${TC}`, "跌破前低反而做多"),
      ]).then(() => {
        placePlanes();
        drawBackground();
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
