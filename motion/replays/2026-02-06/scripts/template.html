  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920" data-layout-ignore></canvas>

    <script>
      const D = /*@DATA*/ null;
      const C = /*@CUES*/ null;
      const END = {{END}};
      const CAPS = /*@CAPTIONS*/ null;

      const W = 1080;
      const H = 1920;
      const COL = { bg: "#04070b", buy: "#78e1d5", sell: "#f09a5a", gold: "#e8bd7d", text: "#edf2ed", muted: "#94a8b9", dim: "#5f7486", grid: "rgba(120,160,190,0.07)" };
      const BUY = "120,225,213";
      const SELL = "240,154,90";
      const GOLD = "232,189,125";
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");

      // ---------- helpers (every frame is a pure function of film time t) ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const prog = (t, a, b) => clamp((t - a) / (b - a));
      const inOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const out3 = (k) => 1 - Math.pow(1 - k, 3);
      const backOut = (k) => 1 + 2.4 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2);
      // Fade in over fi after a, fade out over fo before b.
      const win = (t, a, b, fi, fo) => (t < a || t > b ? 0 : Math.min(fi ? clamp((t - a) / fi) : 1, fo ? clamp((b - t) / fo) : 1));
      const fmt = (v, d = 0) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
      const taipei = (ms, sec) => {
        const d = new Date(ms + 8 * 3600_000);
        const p = (n) => String(n).padStart(2, "0");
        return `${p(d.getUTCHours())}:${p(d.getUTCMinutes())}${sec ? ":" + p(d.getUTCSeconds()) : ""}`;
      };
      const tpeDate = (ms) => {
        const d = new Date(ms + 8 * 3600_000);
        return `${d.getUTCFullYear()}.${String(d.getUTCMonth() + 1).padStart(2, "0")}.${String(d.getUTCDate()).padStart(2, "0")}`;
      };
      function text(str, x, y, { font, size, weight = 700, color = COL.text, align = "left", alpha = 1, base = "alphabetic", track = 0 }) {
        if (alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha *= alpha;
        ctx.font = `${weight} ${size}px ${font}`;
        ctx.fillStyle = color;
        ctx.textAlign = align;
        ctx.textBaseline = base;
        if (track) ctx.letterSpacing = `${track}px`;
        ctx.fillText(str, x, y);
        ctx.restore();
      }

      // Seeded grain tiles, made once.
      const grain = [];
      {
        let s = 20260206;
        const rnd = () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
        for (let k = 0; k < 4; k++) {
          const g = document.createElement("canvas");
          g.width = 270;
          g.height = 480;
          const gx = g.getContext("2d");
          const img = gx.createImageData(270, 480);
          for (let i = 0; i < img.data.length; i += 4) {
            const v = Math.floor(rnd() * 255);
            img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
            img.data[i + 3] = 255;
          }
          gx.putImageData(img, 0, 0);
          grain.push(g);
        }
      }

      // Chart frame shared by every scene.
      const BOX = { x: 96, y: 540, w: 888, h: 820 };

      // ---------- scene 0: background, HUD ----------
      function drawBackground(t) {
        ctx.fillStyle = COL.bg;
        ctx.fillRect(0, 0, W, H);
        const g = ctx.createRadialGradient(W / 2, 900, 120, W / 2, 900, 1150);
        g.addColorStop(0, "rgba(16,31,45,0.55)");
        g.addColorStop(1, "rgba(4,7,11,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, W, H);
      }

      function drawGrain(t) {
        ctx.save();
        ctx.globalAlpha = 0.07;
        ctx.globalCompositeOperation = "screen";
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(grain[Math.floor(t * 12) % 4], 0, 0, W, H);
        ctx.restore();
        const v = ctx.createRadialGradient(W / 2, H / 2, 600, W / 2, H / 2, 1250);
        v.addColorStop(0, "rgba(0,0,0,0)");
        v.addColorStop(1, "rgba(0,0,0,0.55)");
        ctx.fillStyle = v;
        ctx.fillRect(0, 0, W, H);
      }

      // The HUD shows the market time and price of whatever the active scene is showing.
      const hud = { ms: D.low.t, price: null, sec: false };
      function drawHud(t) {
        const a = win(t, 0.25, C.s7 + 0.4, 0.8, 0.6);
        if (a <= 0) return;
        text(tpeDate(hud.ms), 80, 200, { font: MONO, size: 30, weight: 500, color: COL.muted, alpha: a });
        text(taipei(hud.ms, hud.sec), 80, 300, { font: NUM, size: 104, color: COL.text, alpha: a, track: 2 });
        text("台灣時間", 80, 350, { font: TC, size: 26, weight: 500, color: COL.dim, alpha: a });
        text("BTCUSDT 永續 · 幣安", W - 80, 200, { font: TC, size: 28, weight: 500, color: COL.muted, alpha: a, align: "right" });
        if (hud.price != null)
          text(fmt(hud.price, 1), W - 80, 300, { font: NUM, size: 92, color: hud.color || COL.text, alpha: a, align: "right", track: 1 });
      }

      // ---------- scene 1: the moment ----------
      function drawMoment(t) {
        const a = win(t, 0, C.s2 + 0.2, 0, 0.6);
        if (a <= 0) return;
        // The clock runs up to 08:19:00 and the low lands with a hit.
        hud.ms = D.low.t - 22_000 + 22_000 * inOut(prog(t, C.clock - 1.2, C.slam));
        hud.sec = true;
        hud.price = null;
        const k = prog(t, C.slam, C.slam + 0.32);
        if (k <= 0) return;
        const since = t - C.slam;
        const shake = 16 * Math.exp(-since * 5) * Math.sin(since * 58);
        ctx.save();
        ctx.globalAlpha = a * out3(k);
        ctx.translate(W / 2 + shake, 980);
        const s = lerp(1.7, 1, out3(k));
        ctx.scale(s, s);
        ctx.shadowColor = `rgba(${SELL},0.55)`;
        ctx.shadowBlur = 60;
        text("59,800", 0, 0, { font: NUM, size: 300, color: COL.sell, align: "center", base: "middle", track: 4 });
        ctx.restore();
        text("BTC 這一波的最低點", W / 2, 1180, { font: TC, size: 40, weight: 500, color: COL.muted, align: "center", alpha: a * prog(t, C.slam + 0.4, C.slam + 1.1) });
      }

      // ---------- scene 2: two days down ----------
      function drawSlide(t) {
        const a = win(t, C.s2 - 0.2, C.s3 + 0.3, 0.6, 0.6);
        if (a <= 0) return;
        const pts = D.line.map((b) => [b[0], b[4]]);
        pts[pts.length - 1] = [D.low.t, D.low.price];
        const n = pts.length;
        const p = inOut(prog(t, C.s2 + 0.1, C.drop + 0.4));
        const lo = 58200;
        const hi = 78600;
        const x = (i) => BOX.x + (i / (n - 1)) * BOX.w;
        const y = (v) => BOX.y + ((hi - v) / (hi - lo)) * BOX.h;
        const upto = p * (n - 1);
        ctx.save();
        ctx.globalAlpha = a;
        // Slow push toward the head of the line.
        const zoom = lerp(1, 1.03, p);
        const hx = x(upto);
        ctx.translate(hx, 950);
        ctx.scale(zoom, zoom);
        ctx.translate(-hx, -950);
        for (let g = 60000; g <= 78000; g += 2000) {
          ctx.strokeStyle = COL.grid;
          ctx.beginPath();
          ctx.moveTo(BOX.x, y(g));
          ctx.lineTo(BOX.x + BOX.w, y(g));
          ctx.stroke();
          text(fmt(g), BOX.x + 4, y(g) - 8, { font: MONO, size: 20, weight: 400, color: COL.dim });
        }
        // Filled area under the drawn part.
        const last = Math.floor(upto);
        const frac = upto - last;
        const head = last < n - 1 ? lerp(pts[last][1], pts[last + 1][1], frac) : pts[n - 1][1];
        ctx.beginPath();
        ctx.moveTo(x(0), y(pts[0][1]));
        for (let i = 1; i <= last; i++) ctx.lineTo(x(i), y(pts[i][1]));
        ctx.lineTo(x(upto), y(head));
        const area = ctx.createLinearGradient(0, BOX.y, 0, BOX.y + BOX.h);
        area.addColorStop(0, `rgba(${SELL},0.22)`);
        area.addColorStop(1, `rgba(${SELL},0)`);
        ctx.strokeStyle = COL.sell;
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";
        ctx.stroke();
        ctx.lineTo(x(upto), BOX.y + BOX.h);
        ctx.lineTo(x(0), BOX.y + BOX.h);
        ctx.closePath();
        ctx.fillStyle = area;
        ctx.fill();
        // Head.
        ctx.shadowColor = `rgba(${GOLD},0.9)`;
        ctx.shadowBlur = 28;
        ctx.fillStyle = COL.gold;
        ctx.beginPath();
        ctx.arc(x(upto), y(head), 9, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        // The high, marked once the line has passed it.
        const peak = D.line.reduce((m, b, i) => (b[2] > D.line[m][2] ? i : m), 0);
        if (upto >= peak) {
          const ka = prog(t, C.s2 + 0.1, C.s2 + 0.8);
          ctx.strokeStyle = `rgba(${GOLD},${0.6 * ka})`;
          ctx.setLineDash([6, 8]);
          ctx.beginPath();
          ctx.moveTo(x(peak), y(D.high.price));
          ctx.lineTo(BOX.x + BOX.w, y(D.high.price));
          ctx.stroke();
          ctx.setLineDash([]);
          text(fmt(D.high.price, 1), x(peak) + 16, y(D.high.price) - 18, { font: NUM, size: 44, color: COL.gold, alpha: ka });
        }
        ctx.restore();
        // −22.3 % once the line reaches the low.
        const kd = prog(t, C.drop, C.drop + 0.45);
        if (kd > 0) {
          ctx.save();
          ctx.globalAlpha = a * out3(kd);
          ctx.translate(BOX.x + BOX.w - 10, BOX.y + 120);
          const s = lerp(1.4, 1, out3(kd));
          ctx.scale(s, s);
          text("−22.3%", 0, 0, { font: NUM, size: 150, color: COL.sell, align: "right", base: "middle" });
          ctx.restore();
          text("兩天", BOX.x + BOX.w - 10, BOX.y + 230, { font: TC, size: 36, weight: 500, color: COL.muted, align: "right", alpha: a * kd });
        }
        hud.ms = lerp(pts[0][0], pts[n - 1][0], p);
        hud.sec = false;
        hud.price = head;
        hud.color = COL.text;
      }

      // ---------- candles (scenes 3 and 6) ----------
      function candleChart(t, bars, count, lo, hi, box, opt = {}) {
        const step = box.w / opt.slots;
        const bw = Math.max(6, step * 0.56);
        const y = (v) => box.y + ((hi - v) / (hi - lo)) * box.h;
        for (let g = Math.ceil(lo / 1000) * 1000; g <= hi; g += 1000) {
          ctx.strokeStyle = COL.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(box.x, y(g));
          ctx.lineTo(box.x + box.w, y(g));
          ctx.stroke();
          text(fmt(g), box.x + 4, y(g) - 8, { font: MONO, size: 20, weight: 400, color: COL.dim });
        }
        for (let i = 0; i < bars.length && i < count; i++) {
          const b = bars[i];
          const grow = clamp(count - i);
          const cx = box.x + step * (i + 0.5);
          const up = b.c >= b.o;
          const color = up ? COL.buy : COL.sell;
          const mid = (b.o + b.c) / 2;
          const scale = out3(grow);
          ctx.globalAlpha = grow;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(cx, y(lerp(mid, b.h, scale)));
          ctx.lineTo(cx, y(lerp(mid, b.l, scale)));
          ctx.stroke();
          const top = y(lerp(mid, Math.max(b.o, b.c), scale));
          const bot = y(lerp(mid, Math.min(b.o, b.c), scale));
          ctx.fillStyle = color;
          ctx.fillRect(cx - bw / 2, top, bw, Math.max(2, bot - top));
          ctx.globalAlpha = 1;
        }
        return { y, step };
      }

      // ---------- scene 3: the last 25 minutes ----------
      function drawSelling(t) {
        const a = win(t, C.s3 - 0.3, C.s4, 0.6, 0);
        if (a <= 0) return;
        const bars = D.bars5.slice(0, 10);
        const count = 10 * inOut(prog(t, C.s3 + 0.1, C.fiveX));
        const box = { x: BOX.x, y: BOX.y, w: BOX.w, h: 470 };
        ctx.save();
        ctx.globalAlpha = a;
        const { step } = candleChart(t, bars, count, 59600, 64700, box, { slots: 10 });
        // Volume.
        const vb = { y: 1060, h: 150 };
        const vmax = 14042;
        text("成交量（每 5 分鐘，BTC）", BOX.x, vb.y - 14, { font: TC, size: 24, weight: 500, color: COL.dim });
        bars.forEach((b, i) => {
          const g = clamp(count - i);
          if (g <= 0) return;
          const h = (b.vol / vmax) * vb.h * out3(g);
          ctx.fillStyle = b.delta < 0 ? `rgba(${SELL},0.8)` : `rgba(${BUY},0.8)`;
          ctx.fillRect(BOX.x + step * (i + 0.5) - step * 0.3, vb.y + vb.h - h, step * 0.6, h);
        });
        const k5 = prog(t, C.fiveX - 0.2, C.fiveX + 0.4);
        if (k5 > 0) {
          const i0 = 4;
          const i1 = 8;
          text(fmt(D.bars5[i0].vol), BOX.x + step * (i0 + 0.5), vb.y + vb.h - (D.bars5[i0].vol / vmax) * vb.h - 12, { font: NUM, size: 34, color: COL.muted, align: "center", alpha: k5 });
          text(`${fmt(D.bars5[i1].vol)}  ×5.3`, BOX.x + step * (i1 + 0.5) - 20, vb.y - 50, { font: NUM, size: 50, color: COL.sell, align: "center", alpha: k5 });
        }
        // CVD.
        const cb = { y: 1240, h: 140 };
        const lo = -12000;
        const yc = (v) => cb.y + ((0 - v) / (0 - lo)) * cb.h;
        text("CVD（累計主動買賣差，BTC）", BOX.x, cb.y - 10, { font: TC, size: 24, weight: 500, color: COL.dim });
        ctx.strokeStyle = COL.sell;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(BOX.x, yc(0));
        let lastV = 0;
        for (let i = 0; i < bars.length; i++) {
          const g = clamp(count - i);
          if (g <= 0) break;
          const prev = i ? bars[i - 1].cvd : 0;
          lastV = lerp(prev, bars[i].cvd, g);
          ctx.lineTo(BOX.x + step * (i + g), yc(lastV));
        }
        ctx.stroke();
        text(fmt(Math.round(lastV)), BOX.x + BOX.w, cb.y + cb.h + 6, { font: NUM, size: 64, color: COL.sell, align: "right" });
        ctx.restore();
        // HUD follows the newest revealed bar.
        const idx = Math.min(bars.length - 1, Math.max(0, Math.ceil(count) - 1));
        hud.ms = bars[idx].t + 5 * 60_000;
        hud.sec = false;
        hud.price = bars[idx].c;
        hud.color = COL.sell;
      }

      // ---------- scenes 4 and 5: the footprint at 60,000 ----------
      const FP = D.fp.filter((b) => b.t >= Date.parse("2026-02-06T00:12:00Z") && b.t <= Date.parse("2026-02-06T00:23:00Z"));
      const LOW_I = FP.findIndex((b) => b.l === D.low.price);
      // When each minute column appears.
      const REVEAL = [C.s4 + 0.15, C.s4 + 0.65, C.sixty - 0.15, C.sixty + 0.5, C.third - 0.75, C.third - 0.5, C.third - 0.25, C.third + 0.15, C.back + 0.5, C.back + 0.9, C.back + 1.3, C.back + 1.7];
      const FP_LO = 59700;
      const FP_HI = 61400;

      function drawFootprint(t) {
        const a = win(t, C.s4, C.s6 + 0.3, 0, 0.7);
        if (a <= 0) return;
        const colW = lerp(110, 74, inOut(prog(t, C.back + 0.3, C.back + 1.9)));
        const x0 = BOX.x + 20;
        const rowH = (BOX.h - 60) / ((FP_HI - FP_LO) / 100);
        const y = (p) => BOX.y + ((FP_HI - p) / (FP_HI - FP_LO)) * (BOX.h - 60);
        // Slow-motion push toward the pierce, released at the reclaim.
        const push = inOut(prog(t, C.pierce - 0.5, C.low + 0.6)) * (1 - inOut(prog(t, C.back - 0.2, C.back + 0.8)));
        const fx = x0 + colW * (LOW_I + 0.5);
        const fy = y(60000);
        ctx.save();
        ctx.globalAlpha = a;
        // Keep the push inside the chart frame so it never covers the tally above.
        ctx.beginPath();
        ctx.rect(0, BOX.y - 30, W, BOX.h + 30);
        ctx.clip();
        ctx.translate(fx, fy);
        ctx.scale(1 + 0.32 * push, 1 + 0.32 * push);
        ctx.translate(-fx, -fy);
        // Price rows.
        for (let p = FP_LO; p <= FP_HI; p += 100) {
          ctx.strokeStyle = COL.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x0, y(p));
          ctx.lineTo(BOX.x + BOX.w, y(p));
          ctx.stroke();
          if (p % 200 === 0) text(fmt(p), x0 - 12, y(p) + 7, { font: MONO, size: 18, weight: 400, color: COL.dim, align: "right" });
        }
        let maxVol = 1;
        FP.forEach((b) => b.levels.forEach(([, bu, se]) => (maxVol = Math.max(maxVol, bu + se))));
        let latest = 0;
        FP.forEach((b, i) => {
          const r = prog(t, REVEAL[i], REVEAL[i] + 0.35);
          if (r <= 0) return;
          latest = i;
          const cx = x0 + colW * i;
          // The low minute draws its range in slow motion: down to 59,800, held, then the close.
          let lowNow = b.l;
          let closeNow = b.c;
          if (i === LOW_I) {
            const dive = inOut(prog(t, C.pierce - 0.25, C.low + 0.5));
            lowNow = lerp(b.o, b.l, dive);
            const snap = backOut(prog(t, C.back - 0.1, C.back + 0.5));
            closeNow = t < C.back - 0.1 ? Math.max(lowNow, lerp(b.o, 59850, dive)) : lerp(59850, b.c, snap);
          }
          ctx.globalAlpha = a * out3(r);
          for (const [p, bu, se] of b.levels) {
            if (i === LOW_I && p < lowNow - 100) continue;
            const vol = bu + se;
            const strength = Math.sqrt(vol / maxVol);
            const rgb = se > bu ? SELL : BUY;
            const yy = y(p + 100);
            ctx.fillStyle = `rgba(${rgb},${(0.1 + 0.5 * strength).toFixed(3)})`;
            ctx.fillRect(cx + 10, yy + 1, colW - 14, rowH - 2);
            const fs = colW > 95 ? 21 : 17;
            text(fmt(se), cx + 10 + (colW - 14) / 2 - 5, yy + rowH / 2 + 7, { font: MONO, size: fs, weight: 500, color: "rgba(255,226,205,0.95)", align: "right" });
            text(fmt(bu), cx + 10 + (colW - 14) / 2 + 5, yy + rowH / 2 + 7, { font: MONO, size: fs, weight: 500, color: "rgba(214,255,250,0.95)", align: "left" });
          }
          // Candle on the column's left edge.
          const up = closeNow >= b.o;
          ctx.strokeStyle = up ? COL.buy : COL.sell;
          ctx.fillStyle = up ? COL.buy : COL.sell;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx + 4, y(b.h));
          ctx.lineTo(cx + 4, y(lowNow));
          ctx.stroke();
          const top = y(Math.max(b.o, closeNow));
          ctx.fillRect(cx + 1, top, 6, Math.max(2, y(Math.min(b.o, closeNow)) - top));
          text(taipei(b.t), cx + colW / 2 + 3, BOX.y + BOX.h - 18, { font: MONO, size: colW > 95 ? 19 : 15, weight: 400, color: COL.dim, align: "center" });
        });
        ctx.globalAlpha = a;
        // The 60,000 line flashes on each touch.
        const flash = Math.max(...[C.sixty - 0.15, C.sixty + 0.5, C.pierce, C.back].map((c) => Math.exp(-Math.max(0, t - c) * 4) * (t >= c ? 1 : 0)));
        ctx.strokeStyle = `rgba(${GOLD},${0.55 + 0.45 * flash})`;
        ctx.lineWidth = 2 + 4 * flash;
        ctx.shadowColor = `rgba(${GOLD},0.9)`;
        ctx.shadowBlur = 10 + 30 * flash;
        ctx.beginPath();
        ctx.moveTo(x0, y(60000));
        ctx.lineTo(BOX.x + BOX.w, y(60000));
        ctx.stroke();
        ctx.shadowBlur = 0;
        text("60,000", BOX.x + BOX.w, y(60000) - 12, { font: NUM, size: 40, color: COL.gold, align: "right" });
        // The band where sellers hit and price stopped: 59,800–60,100.
        const kb = win(t, C.band - 0.1, C.s5 + 0.6, 0.5, 0.6);
        if (kb > 0) {
          ctx.strokeStyle = `rgba(${SELL},${0.9 * kb})`;
          ctx.lineWidth = 3;
          ctx.setLineDash([10, 8]);
          ctx.strokeRect(x0 + 4, y(60100), colW * (latest + 1), y(59800) - y(60100));
          ctx.setLineDash([]);
        }
        ctx.restore();
        // Seller vs buyer tally for that band (outside the push so it stays readable).
        const kt = win(t, C.band, C.s5 + 0.6, 0.4, 0.6);
        if (kt > 0) {
          const c = out3(prog(t, C.seller - 0.2, C.qty + 0.9));
          text("59,800 – 60,100 之間的主動成交", W / 2, 420, { font: TC, size: 30, weight: 500, color: COL.muted, align: "center", alpha: kt });
          text(`賣 ${fmt(Math.round(2390 * c))} BTC`, W / 2 - 30, 500, { font: NUM, size: 72, color: COL.sell, align: "right", alpha: kt });
          text(`買 ${fmt(Math.round(756 * c))} BTC`, W / 2 + 30, 500, { font: NUM, size: 72, color: COL.buy, align: "left", alpha: kt });
        }
        // Freeze: it does not go lower.
        const kf = win(t, C.stuck - 0.05, C.back + 0.1, 0.25, 0.3);
        if (kf > 0) {
          ctx.fillStyle = `rgba(0,0,0,${0.45 * kf})`;
          ctx.fillRect(0, BOX.y - 40, W, BOX.h + 80);
          ctx.save();
          ctx.globalAlpha = kf;
          ctx.translate(W / 2, BOX.y + BOX.h / 2 + 40);
          const s = lerp(1.25, 1, out3(prog(t, C.stuck - 0.05, C.stuck + 0.3)));
          ctx.scale(s, s);
          text("跌不下去", 0, 0, { font: TC, size: 130, weight: 900, color: COL.text, align: "center", base: "middle", track: 8 });
          ctx.restore();
        }
        // Reclaim tag.
        const kr = win(t, C.back + 0.2, C.oi - 0.2, 0.3, 0.4);
        if (kr > 0) text("收 60,003.9 · 回到 6 萬之上", BOX.x + BOX.w / 2, BOX.y - 6, { font: TC, size: 34, weight: 700, color: COL.gold, align: "center", alpha: kr });
        // Open interest drains.
        const ko = win(t, C.oi - 0.3, C.s6 + 0.2, 0.4, 0.5);
        if (ko > 0) {
          const k = inOut(prog(t, C.oi, C.oiQty + 0.8));
          const from = D.bars5[0].oi;
          const to = D.bars5[8].oi;
          const v = lerp(from, to, k);
          const by = 1395;
          text("未平倉量 OI（BTC）", BOX.x, by, { font: TC, size: 28, weight: 500, color: COL.muted, alpha: ko });
          ctx.globalAlpha = ko;
          ctx.fillStyle = "rgba(120,160,190,0.15)";
          ctx.fillRect(BOX.x, by + 16, BOX.w, 22);
          ctx.fillStyle = COL.gold;
          ctx.fillRect(BOX.x, by + 16, BOX.w * ((v - 88000) / (from - 88000)), 22);
          ctx.globalAlpha = 1;
          text(fmt(Math.round(v)), BOX.x + BOX.w, by, { font: NUM, size: 44, color: COL.text, align: "right", alpha: ko });
          text(`−${fmt(Math.round(from - v))}`, BOX.x + BOX.w, by + 86, { font: NUM, size: 44, color: COL.sell, align: "right", alpha: ko * k });
        }
        // HUD.
        const b = FP[latest];
        hud.ms = b.t + (latest === LOW_I && t < C.back ? 0 : 60_000);
        hud.sec = false;
        hud.price = latest === LOW_I && t < C.back ? Math.max(D.low.price, lerp(b.o, b.l, inOut(prog(t, C.pierce - 0.25, C.low + 0.5)))) : b.c;
        hud.color = t < C.back ? COL.sell : COL.gold;
      }

      // ---------- scene 6: the V ----------
      function drawV(t) {
        const a = win(t, C.s6 - 0.2, C.s8, 0.6, 0.6) * lerp(1, 0.08, inOut(prog(t, C.s7, C.s7 + 0.8)));
        if (a <= 0) return;
        const bars = D.bars5;
        const i30 = bars.findIndex((b) => b.t === Date.parse("2026-02-06T00:50:00Z"));
        const i90 = bars.length - 1;
        const count = t < C.p1 + 0.3 ? lerp(10, i30 + 1, inOut(prog(t, C.s6 - 0.1, C.p1 + 0.3))) : lerp(i30 + 1, i90 + 1, inOut(prog(t, C.p1 + 0.3, C.p2 + 0.6)));
        const pull = inOut(prog(t, C.s6 - 0.2, C.s6end));
        ctx.save();
        ctx.globalAlpha = a;
        const cx = BOX.x + BOX.w;
        const cy = BOX.y + BOX.h / 2;
        ctx.translate(cx, cy);
        ctx.scale(lerp(1.15, 1, pull), lerp(1.15, 1, pull));
        ctx.translate(-cx, -cy);
        const VBOX = { x: BOX.x, y: BOX.y + 40, w: BOX.w, h: 660 };
        const { y, step } = candleChart(t, bars, count, 59400, 66400, VBOX, { slots: bars.length });
        // Markers at +30 minutes and +1.5 hours.
        const mark = (i, k, label, price) => {
          if (k <= 0) return;
          const mx = BOX.x + step * (i + 0.5);
          ctx.strokeStyle = `rgba(${GOLD},${0.7 * k})`;
          ctx.setLineDash([5, 7]);
          ctx.beginPath();
          ctx.moveTo(mx, y(price) - 20);
          ctx.lineTo(mx, BOX.y);
          ctx.stroke();
          ctx.setLineDash([]);
          text(label, mx, BOX.y - 14, { font: TC, size: 30, weight: 700, color: COL.gold, align: "center", alpha: k });
        };
        mark(i30, prog(t, C.p1, C.p1 + 0.4), "+30 分鐘", bars[i30].h);
        mark(i90, prog(t, C.p2, C.p2 + 0.4), "+1.5 小時", bars[i90].h);
        ctx.restore();
        const idx = Math.min(bars.length - 1, Math.max(0, Math.ceil(count) - 1));
        hud.ms = bars[idx].t + 5 * 60_000;
        hud.sec = false;
        hud.price = bars[idx].c;
        hud.color = COL.buy;
        // Big rolling price.
        const kp = win(t, C.s6, C.s7 + 0.3, 0.4, 0.5);
        if (kp > 0) text(fmt(Math.round(bars[idx].c)), W / 2, 1385, { font: NUM, size: 130, color: COL.buy, align: "center", alpha: kp, track: 3 });
      }

      function draw(t) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.globalAlpha = 1;
        drawBackground(t);
        drawMoment(t);
        drawSlide(t);
        drawSelling(t);
        drawFootprint(t);
        drawV(t);
        drawHud(t);
        drawGrain(t);
      }

      // ---------- timeline ----------
      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 100px ${NUM}`),
        document.fonts.load(`400 20px ${MONO}`),
        document.fonts.load(`700 40px ${TC}`, "跌不下去"),
      ]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        // Subtitles.
        CAPS.forEach(([a, b], i) => {
          const el = document.getElementById(`cap${i}`);
          tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.18, ease: "power1.out", immediateRender: false }, a);
          tl.to(el, { opacity: 0, duration: 0.18, ease: "power1.in" }, b - 0.18);
        });
        // Honesty beat: three cards, the backtest, then the line.
        const at = (id, t0) => tl.fromTo(`#${id}`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, t0);
        at("card1", C.s7 + 0.3);
        at("card2", C.s7 + 0.9);
        at("card3", C.s7 + 1.5);
        at("note", C.tested);
        at("slogan", C.analyse);
        // End card.
        tl.fromTo("#end", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out", immediateRender: false }, C.s8 + 0.1);
        tl.fromTo("#disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, C.s8 + 0.6);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
