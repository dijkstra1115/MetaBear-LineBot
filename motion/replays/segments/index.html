        ctx.textAlign = "center";

          const t = D.bars[j][0];
          if (t % 3_600_000) continue;
          // Hours from both sides of a jump would collide at its divider, which names the days instead.
          if ((D.jumps ?? []).some((jp) => Math.abs(j - jp.bar) < 6)) continue;
          const x = S.cx(j);
          if (x < 0) continue;
          ctx.strokeStyle = COL.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 0.5, PY0 - 40);
          ctx.lineTo(x + 0.5, PY1 + 20);
          ctx.stroke();
          ctx.fillStyle = COL.muted;
          ctx.fillText(tpeHour(t) === "00:00" ? tpeDate(t) : tpeHour(t), x, PY1 + 52);
        }
        // Axis borders.
        ctx.fillStyle = "rgba(42,46,57,1)";
        ctx.fillRect(PX1, PY0 - 60, 2, PY1 - PY0 + 110);
        ctx.fillRect(0, PY1 + 22, W, 2);
      }

      function drawWatermark() {
        ctx.font = `700 120px ${NUM}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(209,212,220,0.045)";
        ctx.fillText("BTCUSDT · 5", PX1 / 2, (PY0 + PY1) / 2);
      }

      // Prior UTC day's high and low: one segment per day on screen (lines in the plot, then the
      // current day's price tags on the axis, which lies outside the plot's clip).
      function drawPrior(S, axis = false) {
        const from = Math.max(0, S.i - VIS - 2);
        let j = from;
        while (j <= S.i) {
          const p = D.prior[j];
          let k = j;
          while (k + 1 <= S.i && JSON.stringify(D.prior[k + 1]) === JSON.stringify(p)) k++;
          // Only today's levels: an older day's lines would sit unlabelled on the chart.
          if (p && k === S.i) {
            const x0 = Math.max(0, S.cx(j) - SLOT / 2);
            const x1 = k === S.i ? PX1 : S.cx(k) + SLOT / 2;
            for (const [price, name] of [
              [p[0], "前日高"],
              [p[1], "前日低"],
            ]) {
              const y = S.y(price);
              if (y < PY0 - 30 || y > PY1 + 30) continue;
              if (axis) {
                if (k === S.i) tag(PX1 + 4, y, fmt(price), "rgba(232,189,125,0.95)", "#141414", `600 24px ${MONO}`);
                continue;
              }
              hline(y, x0, x1, "rgba(232,189,125,0.8)", [10, 8], 2);
              if (k === S.i) {
                ctx.font = `600 26px ${TC}`;
                ctx.fillStyle = COL.gold;
                ctx.textAlign = "left";
                ctx.textBaseline = "bottom";
                ctx.fillText(name, Math.max(18, x0 + 8), y - 6);
              }
            }
          }
          j = k + 1;
        }
      }

      // The rules count price within ±0.15 % of a level as at it: a faint band shows that range, so
      // a trade that only came near the line reads as near it.
      const BAND = 0.0015;
      function band(S, price, x0, x1) {
        const y0 = S.y(price * (1 + BAND));
        const y1 = S.y(price * (1 - BAND));
        ctx.fillStyle = "rgba(179,157,219,0.12)";
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
      function drawLevels(S, t) {
        // A trade's level appears with it and fades after the exit; one already drawn (the prior
        // day's high or low, a flip stretch's line) only gets its band here.
        D.trades.forEach((tr, k) => {
          if (!tr.levelPrice || tr.signal > S.i) return;
          const fade = 1 - clamp((t - eventT("exit", k) - 0.5) / 0.4);
          const a = Math.min(easeOut(pop(t, k)), fade);
          if (a <= 0) return;
          const y = S.y(tr.levelPrice);
          const x0 = Math.max(0, S.cx(tr.signal - 30));
          const x1 = S.cx(tr.signal) + 4 * SLOT;
          const drawn = (D.showPrior ? D.prior[tr.signal] ?? [] : []).includes(tr.levelPrice) || D.lines.some((l) => l.price === tr.levelPrice);
          ctx.globalAlpha = a;
          if (!D.lines.some((l) => l.price === tr.levelPrice)) band(S, tr.levelPrice, x0, x1);
          if (drawn) {
            ctx.globalAlpha = 1;
            return;
          }
          hline(y, x0, x1, COL.level, [3, 6], 3);
          ctx.font = `600 26px ${TC}`;
          ctx.fillStyle = COL.level;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillText(`${tr.level} ±0.15%`, x0 + 6, y - 6);
          ctx.globalAlpha = 1;
        });
      }

      function drawCandles(S) {
        for (let j = Math.max(0, S.i - VIS - 2); j <= S.i; j++) {
          const [, o, h, l, c] = D.bars[j];
          const cx = S.cx(j);
          if (cx < -SLOT) continue;
          ctx.fillStyle = c >= o ? COL.up : COL.down;
          const yh = Math.round(S.y(h));
          const yl = Math.round(S.y(l));
          ctx.fillRect(cx - 1, yh, 2, Math.max(1, yl - yh));
          const y0 = Math.round(S.y(Math.max(o, c)));
          const y1 = Math.round(S.y(Math.min(o, c)));
          ctx.fillRect(cx - 5, y0, 10, Math.max(2, y1 - y0));
        }
      }

      function drawLast(S) {
        const [, o, h, l, c] = D.bars[S.i];
        const col = c >= o ? COL.up : COL.down;
        const y = S.y(c);
        hline(y, 0, PX1, col, [3, 5], 1.5);
        tag(PX1 + 4, y, fmt(c), col, "#fff", `700 26px ${MONO}`);
        // OHLC readout, as on a trading terminal.
        ctx.font = `500 27px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        let x = 26;
        for (const [k, v] of [
          ["O", o],
          ["H", h],
          ["L", l],
          ["C", c],
        ]) {
          ctx.fillStyle = COL.muted;
          ctx.fillText(k, x, OHLC_Y);
          x += 22;
          ctx.fillStyle = col;
          const s = fmt(v);
          ctx.fillText(s, x, OHLC_Y);
          x += ctx.measureText(s).width + 22;
        }
      }

      // Position boxes sit behind the candles (layer "box"); their tags, rings and the result sit
      // in front (layer "front"). A closed box shrinks to its exit bar and drops its price tags;
      // the result stays until the next entry.
      function drawPositions(S, t, layer) {
        D.trades.forEach((tr, k) => {
          if (tr.signal > S.i) return;
          const te = eventT("entry", k);
          const tx = eventT("exit", k);
          const next = k + 1 < D.trades.length ? eventT("entry", k + 1) : Infinity;
          const long = tr.dir === "long";
          const closed = t >= tx;
          const won = tr.result === "tp";
          const e = backOut(pop(t, k));
          const dim = closed ? lerp(1, 0.4, clamp((t - tx - 0.5) / 0.4)) : 1;
          const x0 = S.cx(tr.signal) + 7;
          const shrink = closed ? easeOut(clamp((t - tx - 0.5) / 0.4)) : 0;
          const x1 = lerp(x0 + BOX * SLOT, Math.max(x0 + SLOT, S.cx(tr.exit) + SLOT / 2), shrink);
          if (x1 < 0) return;
          const ye = S.y(tr.entry);
          const yt = lerp(ye, S.y(tr.tp), e);
          const ys = lerp(ye, S.y(tr.stop), e);
          if (layer === "front") return front();
          ctx.globalAlpha = dim;
          ctx.fillStyle = `rgba(${UP},0.22)`;
          ctx.fillRect(x0, Math.min(ye, yt), x1 - x0, Math.abs(yt - ye));
          ctx.fillStyle = `rgba(${DOWN},0.22)`;
          ctx.fillRect(x0, Math.min(ye, ys), x1 - x0, Math.abs(ys - ye));
          // Open profit or loss so far: a stronger shade from the entry to the latest close.
          const lastBar = Math.min(S.i, tr.exit);
          const now = closed ? (won ? tr.tp : tr.stop) : D.bars[S.i][4];
          if (S.i > tr.signal) {
            const yn = S.y(clamp(now, Math.min(tr.stop, tr.tp), Math.max(tr.stop, tr.tp)));
            const good = long ? now >= tr.entry : now <= tr.entry;
            ctx.fillStyle = `rgba(${good ? UP : DOWN},0.32)`;
            const xn = Math.min(x1, S.cx(lastBar) + 5);
            ctx.fillRect(x0, Math.min(ye, yn), Math.max(0, xn - x0), Math.abs(yn - ye));
          }
          hline(ye, x0, x1, "rgba(209,212,220,0.9)", [], 2);
          ctx.globalAlpha = 1;

          function front() {
            const tags = closed ? 1 - clamp((t - tx - 0.5) / 0.3) : 1;
            // Target and stop tags give way to the result as it lands.
            const levels = closed ? 1 - clamp((t - tx) / 0.12) : 1;
            if (e > 0.6 && levels > 0) {
              ctx.globalAlpha = clamp((e - 0.6) / 0.3) * levels;
              const tpAbove = yt < ye;
              tag(x1, yt + (tpAbove ? -22 : 22), `目標 ${fmt(tr.tp)}`, `rgba(${UP},0.95)`, "#fff", `600 24px ${TC}`, "right");
              tag(x1, ys + (tpAbove ? 22 : -22), `停損 ${fmt(tr.stop)}`, `rgba(${DOWN},0.95)`, "#fff", `600 24px ${TC}`, "right");
            }
            // Entry tag, left of the box.
            ctx.globalAlpha = clamp(pop(t, k) / 0.4) * tags;
            if (tags > 0) tag(x0 - 6, ye, `${long ? "多" : "空"} ${fmt(tr.entry)}`, long ? COL.up : COL.down, "#fff", `700 28px ${TC}`, "right");
            ctx.globalAlpha = 1;
            // Entry flash: a ring on the entry price.
            const f = clamp((t - te) / 0.5);
            if (f > 0 && f < 1) ring(x0, ye, 10 + 60 * easeOut(f), 1 - f, long ? UP : DOWN);
            if (!closed) return;
            // Result: a ring where the target or stop was hit, then a tag that stays until the next entry.
            const r = clamp((t - tx) / 0.3);
            const xe = S.cx(tr.exit);
            const yr = S.y(won ? tr.tp : tr.stop);
            const g = clamp((t - tx) / 0.6);
            if (g < 1) ring(xe, yr, 12 + 90 * easeOut(g), 1 - g, won ? UP : DOWN);
            const gone = 1 - clamp((t - next + 0.1) / 0.25);
            if (gone <= 0) return;
            const scale = lerp(1.5, 1, easeOut(r));
            const label = won ? `止盈 +${tr.r}R` : "停損 −1R";
            ctx.font = `700 34px ${TC}`;
            const w = (ctx.measureText(label).width + 22) * scale;
            ctx.save();
            ctx.globalAlpha = clamp(r * 2) * gone;
            // Beside the hit level, kept inside the plot.
            ctx.translate(Math.min(xe + SLOT, PX1 - 10 - w), yr + (yr < ye ? -34 : 34));
            ctx.scale(scale, scale);
            tag(0, 0, label, won ? COL.up : COL.down, "#fff", `700 34px ${TC}`, "left");
            ctx.restore();
          }
        });
      }

      function ring(x, y, r, a, rgb) {
        ctx.strokeStyle = `rgba(${rgb},${a})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Rule panel, top right: the rule running over this stretch (or each course strategy that took a
      // trade in it, one row each) and its state, then one dot per trade in the stretch, filled with
      // its result once it closes, so it is clear every trade is shown.
      function drawPanel(t) {
        const x0 = 680;
        const rows = D.rules ?? [{ key: null, name: D.ruleName }];
        let k = -1;
        D.trades.forEach((tr, j) => {
          if (t >= eventT("entry", j)) k = j;
        });
        ctx.textBaseline = "middle";
        rows.forEach((row, r) => {
          const y = 50 + r * 36;
          let kr = -1;
          D.trades.forEach((tr, j) => {
            if ((row.key == null || tr.rule === row.key) && t >= eventT("entry", j)) kr = j;
          });
          const tr = D.trades[kr];
          const on = kr >= 0 && t < eventT("exit", kr) + 0.7;
          const done = on && t >= eventT("exit", kr);
          const rgb = on ? (tr.dir === "long" ? UP : DOWN) : "120,123,134";
          if (on) {
            ctx.fillStyle = `rgba(${rgb},${0.16 * clamp((t - eventT("entry", kr)) / 0.25)})`;
            roundRect(x0 - 12, y - 16, W - 24 - (x0 - 12), 32, 6);
            ctx.fill();
          }
          ctx.fillStyle = `rgba(${rgb},${on ? 1 : 0.7})`;
          ctx.beginPath();
          ctx.arc(x0 + 6, y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.textAlign = "left";
          ctx.font = `500 24px ${TC}`;
          ctx.fillStyle = on ? "#eef0f4" : COL.muted;
          ctx.fillText(row.name, x0 + 24, y + 1);
          ctx.textAlign = "right";
          ctx.font = `600 22px ${TC}`;
          ctx.fillStyle = on ? `rgb(${done ? (tr.result === "tp" ? UP : DOWN) : rgb})` : "rgba(120,123,134,0.75)";
          ctx.fillText(on ? (done ? (tr.result === "tp" ? "止盈" : "停損") : tr.dir === "long" ? "持多" : "持空") : "監控中", W - 36, y + 1);
        });
        const y = 50 + (rows.length - 1) * 36;
        const cur = D.trades[k];
        const on = k >= 0 && t < eventT("exit", k) + 0.7;
        const rgb = on ? (cur.dir === "long" ? UP : DOWN) : "120,123,134";
        D.trades.forEach((x, j) => {
          const cx = W - 42 - (D.trades.length - 1 - j) * 26;
          ctx.beginPath();
          ctx.arc(cx, y + 42, 8, 0, Math.PI * 2);
          if (t >= eventT("exit", j)) {
            ctx.fillStyle = `rgb(${x.result === "tp" ? UP : DOWN})`;
            ctx.fill();
          } else {
            ctx.strokeStyle = j === k && on ? `rgb(${rgb})` : "rgba(120,123,134,0.75)";
            ctx.lineWidth = 2;
            ctx.stroke();
          }
        });
        ctx.textAlign = "right";
        ctx.font = `500 22px ${TC}`;
        ctx.fillStyle = COL.muted;
        ctx.fillText("這段的每一筆", W - 42 - (D.trades.length - 1) * 26 - 20, y + 43);
      }

      // A flip stretch's level stays on screen: a line across the plot, then its price tag on the axis.
      function drawLines(S, axis = false) {
        for (const l of D.lines) {
          const y = S.y(l.price);
          if (y < PY0 - 30 || y > PY1 + 30) continue;
          if (axis) {
            tag(PX1 + 4, y, fmt(l.price), "rgba(179,157,219,0.95)", "#141414", `600 24px ${MONO}`);
            continue;
          }
          band(S, l.price, 0, PX1);
          hline(y, 0, PX1, "rgba(179,157,219,0.85)", [3, 6], 3);
          ctx.font = `600 26px ${TC}`;
          ctx.fillStyle = COL.level;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillText(`${l.name} ±0.15%`, 18, y - 6);
        }
      }

      // Alert feed, top left of the chart: what the rules saw, then the order they placed. An alert
      // stays until shortly after its trade opens; the order line until the trade closes.
      const TONES = { level: "232,189,125", buy: UP, sell: DOWN, info: "120,144,176" };
      const FEED = EVENTS.flatMap((e) => {
        if (e.type !== "alert" && e.type !== "entry") return [];
        const tr = D.trades[e.trade];
        const entryAt = eventT("entry", e.trade);
        if (e.type === "alert") {
          const a = tr.alerts[e.alert];
          return [{ t: e.t, until: entryAt + 1.6, rgb: TONES[a.tone], time: D.bars[a.bar][0], text: a.text }];
        }
        if (e.type === "entry") return [{ t: e.t, until: eventT("exit", e.trade) + 0.7, rgb: tr.dir === "long" ? UP : DOWN, time: D.bars[tr.signal][0] + 300_000, text: `開${tr.dir === "long" ? "多" : "空"} ${fmt(tr.entry)}` }];
        return [];
      });
      // Opening card in the feed's band: the stretch, the rule, and that every trade is in the film.
      // It fades out as the first alert takes the band.
      function drawIntro(t) {
        const out = EVENTS.length ? EVENTS[0].t : END;
        const a = Math.min(easeOut(clamp(t / 0.35)), 1 - clamp((t - out + 0.25) / 0.25));
        if (a <= 0) return;
        ctx.globalAlpha = a;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        const x = 28 - 30 * (1 - easeOut(clamp(t / 0.35)));
        ctx.fillStyle = COL.gold;
        ctx.fillRect(x - 8, FEED_Y + 14, 6, 230);
        ctx.font = `700 46px ${TC}`;
        ctx.fillStyle = "#eef0f4";
        ctx.fillText(D.intro[0], x + 14, FEED_Y + 50);
        ctx.font = `500 30px ${TC}`;
        ctx.fillStyle = COL.text;
        ctx.fillText(D.intro[1], x + 14, FEED_Y + 132);
        ctx.font = `600 30px ${TC}`;
        ctx.fillStyle = COL.gold;
        ctx.fillText(D.intro[2], x + 14, FEED_Y + 196);
        ctx.globalAlpha = 1;
      }

      // A stretch over weeks jumps the days without a trade: a card in the feed's band while the
      // chart holds, and a dashed divider with the number of days where the bars join.
      const JUMPS = EVENTS.filter((e) => e.type === "jump");
      function drawJumpCard(t) {
        for (const ev of JUMPS) {
          const k = (t - ev.t) / 1.6;
          if (k < 0 || k > 1) continue;
          const a = Math.min(easeOut(clamp(k / 0.2)), 1 - clamp((k - 0.8) / 0.2));
          const days = D.jumps[ev.jump].days;
          ctx.globalAlpha = a;
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillStyle = COL.gold;
          ctx.fillRect(20, FEED_Y + 14, 6, 150);
          ctx.font = `700 46px ${TC}`;
          ctx.fillStyle = "#eef0f4";
          ctx.fillText(`跳過 ${days} 天`, 42, FEED_Y + 50);
          ctx.font = `500 30px ${TC}`;
          ctx.fillStyle = COL.text;
          ctx.fillText("這幾天規則沒有開單", 42, FEED_Y + 120);
          ctx.globalAlpha = 1;
        }
      }
      function drawJumpLines(S) {
        for (const j of D.jumps ?? []) {
          if (j.bar > S.i) continue;
          const x = S.cx(j.bar) - SLOT / 2;
          if (x < 0) continue;
          ctx.strokeStyle = "rgba(232,189,125,0.7)";
          ctx.lineWidth = 2;
          ctx.setLineDash([8, 8]);
          ctx.beginPath();
          ctx.moveTo(Math.round(x) + 0.5, PY0 - 30);
          ctx.lineTo(Math.round(x) + 0.5, PY1);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.font = `600 24px ${TC}`;
          ctx.fillStyle = COL.gold;
          ctx.textAlign = "left";
          ctx.textBaseline = "top";
          ctx.fillText(`+${j.days} 天`, x + 8, PY0 - 26);
        }
      }

      function drawFeed(t) {
        // The feed has its own band between the OHLC line and the chart, so it never covers price.
        ctx.fillStyle = "rgba(42,46,57,0.6)";
        ctx.fillRect(0, FEED_Y - 14, W, 1);
        ctx.fillRect(0, FEED_Y + FEED_ROWS * 62 + 4, W, 1);
        const live = FEED.filter((f) => t >= f.t && t < f.until + 0.3).slice(-FEED_ROWS);
        live.forEach((f, row) => {
          const inn = easeOut(clamp((t - f.t) / 0.22));
          const out = 1 - clamp((t - f.until) / 0.3);
          ctx.globalAlpha = inn * out;
          const x = 20 - 40 * (1 - inn);
          const y = FEED_Y + row * 62;
          ctx.font = `600 28px ${TC}`;
          const w = ctx.measureText(f.text).width + 132;
          ctx.fillStyle = "rgba(24,28,40,0.94)";
          roundRect(x, y, w, 54, 8);
          ctx.fill();
          ctx.strokeStyle = "rgba(209,212,220,0.12)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = `rgb(${f.rgb})`;
          ctx.fillRect(x, y + 8, 5, 38);
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          ctx.font = `500 22px ${MONO}`;
          ctx.fillStyle = COL.muted;
          ctx.fillText(tpeHour(f.time), x + 20, y + 28);
          ctx.font = `600 28px ${TC}`;
          ctx.fillStyle = "#eef0f4";
          ctx.fillText(f.text, x + 108, y + 28);
          ctx.globalAlpha = 1;
        });
      }

      function drawEdge(t) {
        // A brief edge glow on each result: green for a target, red for a stop.
        for (const ev of EVENTS) {
          if (ev.type !== "exit") continue;
          const k = clamp((t - ev.t) / 0.5);
          if (k <= 0 || k >= 1) continue;
          const rgb = D.trades[ev.trade].result === "tp" ? UP : DOWN;
          const g = ctx.createRadialGradient(W / 2, 960, 700, W / 2, 960, 1250);
          g.addColorStop(0, `rgba(${rgb},0)`);
          g.addColorStop(1, `rgba(${rgb},${0.28 * (1 - k)})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, 1920);
        }
      }

      function draw(t) {
        ctx.fillStyle = "#131722";
        ctx.fillRect(0, 0, W, 1920);
        const S = state(t);
        drawWatermark();
        drawGrid(S);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, PY0 - 40, PX1, PY1 - PY0 + 60);
        ctx.clip();
        if (D.showPrior) drawPrior(S);
        drawLines(S);
        drawJumpLines(S);
        drawLevels(S, t);
        drawPositions(S, t, "box");
        drawCandles(S);
        drawPositions(S, t, "front");
        ctx.restore();
        if (D.showPrior) drawPrior(S, true);
        drawLines(S, true);
        drawLast(S);
        drawPanel(t);
        drawIntro(t);
        drawJumpCard(t);
        drawFeed(t);
        drawEdge(t);
      }

      // ---------- timeline ----------
      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 26px ${MONO}`),
        document.fonts.load(`700 40px ${TC}`, "多空止盈停損目標前日高低"),
      ]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        CAPS.forEach(([a, b], i) => {
          const el = document.getElementById(`cap${i}`);
          tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, a);
          tl.to(el, { opacity: 0, duration: 0.15, ease: "power1.in" }, b - 0.15);
        });
        tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, ENDCARD_AT);
