    <style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920" data-layout-ignore></canvas>

      <div class="head" data-layout-allow-occlusion>
        <img src="assets/img/badge.png" alt="" />
        <div>
          <div class="sym">BTCUSDT<span class="tf"><span id="tf5">永續 · 5 分</span><span id="tf1">永續 · 1 分足跡</span></span></div>
          <div class="meta">幣安 · 歷史回放 {{DATE}}</div>
        </div>
      </div>

      <div class="caps" id="caps">
{{CAPTIONS_HTML}}
      </div>

      <div class="clip" id="endcard" data-start="{{ENDCARD_AT}}" data-duration="{{ENDCARD}}" data-track-index="3">
        <div class="end" id="end">
          <img src="assets/img/badge.png" alt="" />
          <div class="brand">MetaBear</div>
          <div class="tagline">訂單流策略研究</div>
          <div class="join" id="join">metabear.io</div>
          <div class="url" id="url">每一段覆盤與訂單流課程</div>
        </div>
        <div class="disclaimer" id="disclaimer">
          <div>歷史資料回放：幣安 BTCUSDT 永續合約</div>
          <div>{{DATE}}（台灣時間）</div>
          <div>影片內容僅供教學，非投資建議。</div>
        </div>
      </div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="{{END}}" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const D = /*@DATA*/ null;
      const Q = /*@CUES*/ null;
      const { END, ENDCARD_AT, ZOOM_AT, ZOOM_LEN, REVEAL5, REVEAL1, EVENTS, CAPTIONS } = Q;

      const W = 1080;
      const H = 1920;
      const COL = { up: "#26a69a", down: "#ef5350", text: "#d1d4dc", muted: "#787b86", grid: "rgba(42,46,57,0.75)", gold: "#e8bd7d", level: "#b39ddb", liq: "#f09a5a" };
      const UP = "38,166,154";
      const DOWN = "239,83,80";
      const RGB = { gold: "232,189,125", level: "179,157,219", liq: "240,154,90" };
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';
      const LONG = D.dir === "long";
      const TR = D.trade;

      // Chart geometry: plot area, price axis on the right, delta row and time axis below.
      const PX1 = 900;
      const PY0 = 480;
      const OHLC_Y = 230;
      const FEED_Y = 268;
      const PY1 = 1410;
      const DELTA_Y = PY1 + 40;
      const AXIS_Y = PY1 + 100;
      const SLOT5 = 15;
      const RIGHT5 = 8 * SLOT5; // px right of the newest 5-minute bar
      const SLOT1 = 54; // 1-minute footprint bar before the entry; narrows while the position runs
      const RIGHT1 = 270; // px right of the newest 1-minute bar: room for the position box

      const stage = document.getElementById("stage");
      const main = stage.getContext("2d");
      const layer = () => {
        const c = document.createElement("canvas");
        c.width = W;
        c.height = H;
        return c;
      };
      const off5 = layer();
      const off1 = layer();
      let ctx = main;
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeOut = (k) => 1 - Math.pow(1 - k, 3);
      const easeInOut = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
      const backOut = (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
      const fmt = (p) => p.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const fmt0 = (p) => Math.round(p).toLocaleString("en-US");
      const tpeHour = (ms) => new Date(ms + 8 * 3600_000).toISOString().slice(11, 16);
      const eventT = (type) => EVENTS.find((e) => e.type === type).t;
      const T_ENTRY = eventT("entry");
      const T_EXIT = eventT("exit");
      // Stops are filmed too: the price the position closed at, and whether it won.
      const WON = TR.result === "tp";
      const EXIT_PX = WON ? TR.tp : TR.stop;
      const pop = (t) => clamp((t - T_ENTRY) / 0.38);
      let MAXV = 1;
      for (const b of D.ones) for (const [, bu, se] of b[6]) MAXV = Math.max(MAXV, bu, se);

      // ---------- time → chart state (pure) ----------
      function latest(reveal, t, from) {
        let i = from - 1;
        while (i + 1 < reveal.length && reveal[i + 1] <= t) i++;
        return i;
      }
      // Scroll position in bars: slides one slot after each new bar appears.
      function anchor(reveal, t, i, from) {
        if (i < from) return i;
        const gap = Math.min(10, (reveal[i + 1] ?? reveal[i] + 0.2) - reveal[i]);
        return i - 1 + easeOut(clamp((t - reveal[i]) / Math.min(0.14, gap)));
      }
      function view(bars, reveal, from, t, slotOf, right, extra) {
        const i = latest(reveal, t, from);
        const a = anchor(reveal, t, i, from);
        const slot = slotOf(a);
        const base = PX1 - right;
        const vis = Math.ceil(base / slot) + 1;
        const cx = (j) => base - (a - j) * slot;
        // Price range over the bars on screen, eased with the scroll.
        const rangeOf = (k) => {
          let lo = Infinity;
          let hi = -Infinity;
          for (let j = Math.max(0, k - vis); j <= k; j++) {
            lo = Math.min(lo, bars[j][3]);
            hi = Math.max(hi, bars[j][2]);
          }
          return extra(lo, hi);
        };
        const [lo1, hi1] = rangeOf(i);
        const [lo0, hi0] = i > from ? rangeOf(i - 1) : [lo1, hi1];
        const s = i >= from ? clamp(a - (i - 1)) : 1;
        let lo = lerp(lo0, lo1, s);
        let hi = lerp(hi0, hi1, s);
        const pad = (hi - lo) * 0.1;
        lo -= pad;
        hi += pad;
        return { t, i, a, slot, vis, cx, lo, hi, bars, y: (p) => PY1 - ((p - lo) / (hi - lo)) * (PY1 - PY0) };
      }
      const view5 = (t) => view(D.five, REVEAL5, D.fiveFrom, t, () => SLOT5, RIGHT5, (lo, hi) => [lo, hi]);
      const view1 = (t) =>
        view(
          D.ones,
          REVEAL1,
          D.oneFrom,
          t,
          // While the position runs the bars narrow so the entry stays on screen.
          (a) => Math.min(SLOT1, (PX1 - RIGHT1) / Math.max(1, a - TR.signal + 5)),
          RIGHT1,
          // The stop joins the range when the position opens; the target only as price runs
          // toward it, so the footprint at the entry keeps its height.
          (lo, hi) => {
            const run = easeInOut(clamp((t - T_ENTRY - 0.4) / (T_EXIT - T_ENTRY - 0.4)));
            for (const [p, e] of [
              [TR.stop, easeOut(pop(t))],
              [EXIT_PX, run],
            ]) {
              lo = Math.min(lo, lerp(lo, p, e));
              hi = Math.max(hi, lerp(hi, p, e));
            }
            return [lo, hi];
          },
        );

      // ---------- drawing primitives ----------
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function tag(x, y, text, bg, fg = "#fff", font = `600 26px ${MONO}`, align = "left") {
        ctx.font = font;
        const w = ctx.measureText(text).width + 22;
        const h = 40;
        const x0 = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
        ctx.fillStyle = bg;
        roundRect(x0, y - h / 2, w, h, 6);
        ctx.fill();
        ctx.fillStyle = fg;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(text, x0 + 11, y + 1);
        return w;
      }
      function hline(y, x0, x1, color, dash = [], width = 2) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x0, Math.round(y) + 0.5);
        ctx.lineTo(x1, Math.round(y) + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      function ring(x, y, r, a, rgb) {
        ctx.strokeStyle = `rgba(${rgb},${a})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // ---------- chart layers ----------
      function drawGrid(S, every) {
        const span = S.hi - S.lo;
        const step = [20, 50, 100, 200, 250, 500, 1000].find((s) => span / s <= 9) ?? 1000;
        ctx.font = `500 26px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        for (let p = Math.ceil(S.lo / step) * step; p <= S.hi; p += step) {
          const y = S.y(p);
          if (y < PY0 - 10 || y > PY1 + 10) continue;
          hline(y, 0, PX1, COL.grid, [], 1);
          ctx.fillStyle = COL.muted;
          ctx.fillText(p.toLocaleString("en-US"), PX1 + 16, y);
        }
        ctx.textAlign = "center";
        for (let j = Math.max(0, S.i - S.vis - 1); j <= S.i; j++) {
          const t = S.bars[j][0];
          if (t % every) continue;
          const x = S.cx(j);
          if (x < 20 || x > PX1 - 20) continue;
          ctx.strokeStyle = COL.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 0.5, PY0 - 40);
          ctx.lineTo(x + 0.5, PY1 + 10);
          ctx.stroke();
          ctx.fillStyle = COL.muted;
          ctx.fillText(tpeHour(t), x, AXIS_Y);
        }
        ctx.fillStyle = "rgba(42,46,57,1)";
        ctx.fillRect(PX1, PY0 - 60, 2, PY1 - PY0 + 110);
        ctx.fillRect(0, AXIS_Y - 34, W, 2);
      }

      function drawWatermark(text) {
        ctx.font = `700 120px ${NUM}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(209,212,220,0.045)";
        ctx.fillText(text, PX1 / 2, (PY0 + PY1) / 2);
      }

      // The case's key levels: a line (or, for the liquidation estimate, a band) with its name.
      function drawLevels(S, axis) {
        D.levels.forEach((L, k) => {
          const y = S.y(L.price);
          if (y < PY0 - 30 || y > PY1 + 30) return;
          const rgb = RGB[L.color];
          if (axis) {
            tag(PX1 + 4, y, fmt0(L.price), `rgba(${rgb},0.95)`, "#141414", `600 24px ${MONO}`);
            return;
          }
          if (L.band) {
            const y0 = S.y(L.price + L.band);
            const y1 = S.y(L.price - L.band);
            ctx.fillStyle = `rgba(${rgb},0.12)`;
            ctx.fillRect(0, y0, PX1, y1 - y0);
            hline(y0, 0, PX1, `rgba(${rgb},0.45)`, [4, 6], 1.5);
            hline(y1, 0, PX1, `rgba(${rgb},0.45)`, [4, 6], 1.5);
          } else {
            // The rule's range around the level (±0.15 %), so a trade that only came near the line reads as near it.
            if (L.zone) {
              const y0 = S.y(L.price + L.zone);
              ctx.fillStyle = `rgba(${rgb},0.12)`;
              ctx.fillRect(0, y0, PX1, S.y(L.price - L.zone) - y0);
            }
            hline(y, 0, PX1, `rgba(${rgb},0.85)`, [10, 8], 2);
          }
          ctx.font = `600 26px ${TC}`;
          ctx.fillStyle = `rgb(${rgb})`;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          // Levels that sit close together stack their names on alternate sides.
          const below = k % 2 === 1;
          ctx.textBaseline = below ? "top" : "bottom";
          ctx.fillText(L.name, 18, below ? y + 6 : y - 6);
        });
      }

      function drawCandles5(S) {
        for (let j = Math.max(0, S.i - S.vis - 1); j <= S.i; j++) {
          const [, o, h, l, c] = S.bars[j];
          const cx = Math.round(S.cx(j));
          if (cx < -SLOT5) continue;
          ctx.fillStyle = c >= o ? COL.up : COL.down;
          const yh = Math.round(S.y(h));
          const yl = Math.round(S.y(l));
          ctx.fillRect(cx - 1, yh, 2, Math.max(1, yl - yh));
          const y0 = Math.round(S.y(Math.max(o, c)));
          const y1 = Math.round(S.y(Math.min(o, c)));
          ctx.fillRect(cx - 5, y0, 10, Math.max(2, y1 - y0));
        }
      }

      // Marks on the 5-minute approach: a ring on the bar and a short label above it.
      function drawMarks(S, t) {
        for (const m of D.marks) {
          if (m.bar > S.i) continue;
          const k = clamp((t - REVEAL5[m.bar]) / 0.35);
          const x = S.cx(m.bar);
          const y = S.y(S.bars[m.bar][2]) - 26;
          ctx.globalAlpha = easeOut(k);
          tag(x, y - 30, m.text, "rgba(232,189,125,0.95)", "#141414", `700 26px ${TC}`, "center");
          ctx.globalAlpha = 1;
          if (k < 1) ring(x, y + 18, 10 + 40 * easeOut(k), 1 - k, RGB.gold);
        }
      }

      // 1-minute footprint: per price bin, aggressive sells on the left half and buys on the
      // right, shaded by size; a 3:1 diagonal imbalance is drawn solid. The open–close body is
      // outlined in the candle's colour.
      function drawFootprint(S, t) {
        // A long position squeezes the bars below footprint size: they turn into plain candles.
        if (S.slot < 16) return drawCandles1(S);
        const half = Math.max(5, S.slot * 0.42);
        const binH = Math.abs(S.y(0) - S.y(D.tick));
        for (let j = Math.max(0, S.i - S.vis - 1); j <= S.i; j++) {
          const [, o, h, l, c, , lv] = S.bars[j];
          const cx = S.cx(j);
          if (cx < -S.slot) continue;
          const born = j >= D.oneFrom ? easeOut(clamp((t - REVEAL1[j]) / 0.18)) : 1;
          const m = new Map(lv.map(([bin, bu, se]) => [bin, [bu, se]]));
          for (const [bin, bu, se] of lv) {
            const y0 = S.y((bin + 1) * D.tick);
            const hh = Math.max(1, binH - (binH > 6 ? 1.5 : 0.5));
            const buyImb = bu >= 1 && bu >= 3 * (m.get(bin - 1)?.[1] ?? 0);
            const sellImb = se >= 1 && se >= 3 * (m.get(bin + 1)?.[0] ?? 0);
            ctx.fillStyle = `rgba(${DOWN},${sellImb ? 0.95 * born : (0.1 + 0.7 * Math.sqrt(se / MAXV)) * born})`;
            ctx.fillRect(cx - half, y0, half - 1, hh);
            ctx.fillStyle = `rgba(${UP},${buyImb ? 0.95 * born : (0.1 + 0.7 * Math.sqrt(bu / MAXV)) * born})`;
            ctx.fillRect(cx + 1, y0, half - 1, hh);
          }
          const up = c >= o;
          ctx.strokeStyle = up ? COL.up : COL.down;
          ctx.globalAlpha = born;
          ctx.lineWidth = 2;
          const yb0 = S.y(Math.max(o, c));
          const yb1 = S.y(Math.min(o, c));
          ctx.strokeRect(cx - half - 2, yb0, 2 * half + 4, Math.max(2, yb1 - yb0));
          // Wick ends as short ticks above and below the cells.
          ctx.fillStyle = up ? COL.up : COL.down;
          ctx.fillRect(cx - 1, S.y(h) - 6, 2, 6);
          ctx.fillRect(cx - 1, S.y(l), 2, 6);
          ctx.globalAlpha = 1;
        }
      }

      function drawCandles1(S) {
        const body = Math.max(2, Math.round(S.slot * 0.62));
        for (let j = Math.max(0, S.i - S.vis - 1); j <= S.i; j++) {
          const [, o, h, l, c] = S.bars[j];
          const cx = Math.round(S.cx(j));
          if (cx < -S.slot) continue;
          ctx.fillStyle = c >= o ? COL.up : COL.down;
          const yh = Math.round(S.y(h));
          ctx.fillRect(cx - 1, yh, 2, Math.max(1, Math.round(S.y(l)) - yh));
          const y0 = Math.round(S.y(Math.max(o, c)));
          ctx.fillRect(cx - Math.floor(body / 2), y0, body, Math.max(2, Math.round(S.y(Math.min(o, c))) - y0));
        }
      }

      function drawStacked(S, t) {
        if (S.slot < 16) return;
        const st = D.stacked;
        if (!st || st.bar > S.i) return;
        const k = clamp((t - REVEAL1[st.bar]) / 0.4);
        const cx = S.cx(st.bar);
        const half = Math.max(5, S.slot * 0.42);
        const y0 = S.y(st.hi) - 4;
        const y1 = S.y(st.lo) + 4;
        const x0 = LONG ? cx - 2 : cx - half - 4;
        const rgb = LONG ? UP : DOWN;
        ctx.strokeStyle = `rgba(255,255,255,${0.9 * easeOut(k)})`;
        ctx.lineWidth = 3;
        roundRect(x0, y0, half + 6, y1 - y0, 4);
        ctx.stroke();
        if (k < 1) {
          ctx.strokeStyle = `rgba(${rgb},${1 - k})`;
          ctx.lineWidth = 6;
          const g = 30 * easeOut(k);
          roundRect(x0 - g, y0 - g, half + 6 + 2 * g, y1 - y0 + 2 * g, 8);
          ctx.stroke();
        }
      }

      function drawDeltaRow(S, t) {
        ctx.font = `600 ${S.slot >= 40 ? 21 : 17}px ${MONO}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = COL.muted;
        ctx.textAlign = "left";
        ctx.fillText("Δ", 4, DELTA_Y);
        ctx.textAlign = "center";
        const every = Math.ceil(64 / S.slot);
        for (let j = Math.max(0, S.i - S.vis - 1); j <= S.i; j++) {
          if ((S.i - j) % every) continue;
          const x = S.cx(j);
          if (x < 34 || x > PX1 - 10) continue;
          const d = S.bars[j][5];
          ctx.globalAlpha = j >= D.oneFrom ? clamp((t - REVEAL1[j]) / 0.18) : 1;
          ctx.fillStyle = d >= 0 ? COL.up : COL.down;
          ctx.fillText(`${d >= 0 ? "+" : "−"}${Math.abs(d)}`, x, DELTA_Y);
        }
        ctx.globalAlpha = 1;
      }

      function drawLast(S, t, readout) {
        const [, o, h, l, c] = S.bars[S.i];
        const col = c >= o ? COL.up : COL.down;
        const y = S.y(c);
        hline(y, 0, PX1, col, [3, 5], 1.5);
        tag(PX1 + 4, y, fmt(c), col, "#fff", `700 26px ${MONO}`);
        if (!readout) return;
        ctx.font = `500 27px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        let x = 26;
        for (const [k, v] of [
          ["O", o],
          ["H", h],
          ["L", l],
          ["C", c],
        ]) {
          ctx.fillStyle = COL.muted;
          ctx.fillText(k, x, OHLC_Y);
          x += 22;
          ctx.fillStyle = col;
          const s = fmt(v);
          ctx.fillText(s, x, OHLC_Y);
          x += ctx.measureText(s).width + 22;
        }
      }

      // Position box: target above (long) and stop below, behind the bars; tags and the result in front.
      function drawPosition(S, t, front) {
        if (TR.signal > S.i) return;
        const closed = t >= T_EXIT;
        const e = backOut(pop(t));
        const x0 = S.cx(TR.signal) + S.slot / 2;
        const xi = S.cx(Math.min(S.i, TR.exit)) + S.slot / 2;
        const x1 = Math.min(PX1 - 8, Math.max(x0 + 4 * SLOT1, xi + 60));
        const ye = S.y(TR.entry);
        const yt = lerp(ye, S.y(TR.tp), e);
        const ys = lerp(ye, S.y(TR.stop), e);
        if (!front) {
          ctx.fillStyle = `rgba(${UP},0.2)`;
          ctx.fillRect(x0, Math.min(ye, yt), x1 - x0, Math.abs(yt - ye));
          ctx.fillStyle = `rgba(${DOWN},0.2)`;
          ctx.fillRect(x0, Math.min(ye, ys), x1 - x0, Math.abs(ys - ye));
          if (S.i > TR.signal) {
            const now = closed ? EXIT_PX : S.bars[S.i][4];
            const yn = S.y(clamp(now, Math.min(TR.stop, TR.tp), Math.max(TR.stop, TR.tp)));
            const good = LONG ? now >= TR.entry : now <= TR.entry;
            ctx.fillStyle = `rgba(${good ? UP : DOWN},0.3)`;
            ctx.fillRect(x0, Math.min(ye, yn), Math.max(0, xi - x0), Math.abs(yn - ye));
          }
          hline(ye, x0, x1, "rgba(209,212,220,0.9)", [], 2);
          return;
        }
        const levels = closed ? 1 - clamp((t - T_EXIT) / 0.12) : 1;
        if (e > 0.6 && levels > 0) {
          ctx.globalAlpha = clamp((e - 0.6) / 0.3) * levels;
          const tpAbove = yt < ye;
          tag(x1, clamp(yt + (tpAbove ? -22 : 22), PY0 - 10, PY1 - 10), `目標 ${fmt(TR.tp)} · ${TR.r}R`, `rgba(${UP},0.95)`, "#fff", `600 24px ${TC}`, "right");
          tag(x1, ys + (tpAbove ? 22 : -22), `停損 ${fmt(TR.stop)}`, `rgba(${DOWN},0.95)`, "#fff", `600 24px ${TC}`, "right");
        }
        ctx.globalAlpha = clamp(pop(t) / 0.4);
        // Inside the box on the stop side, where price does not go while the trade works.
        tag(x0 + 8, ye + (LONG ? 30 : -30), `${LONG ? "做多" : "做空"} ${fmt(TR.entry)}`, LONG ? COL.up : COL.down, "#fff", `700 28px ${TC}`, "left");
        ctx.globalAlpha = 1;
        const f = clamp((t - T_ENTRY) / 0.5);
        if (f > 0 && f < 1) ring(x0, ye, 10 + 60 * easeOut(f), 1 - f, LONG ? UP : DOWN);
        if (!closed) return;
        const xe = S.cx(TR.exit);
        const yr = S.y(EXIT_PX);
        const g = clamp((t - T_EXIT) / 0.6);
        if (g < 1) ring(xe, yr, 12 + 90 * easeOut(g), 1 - g, WON ? UP : DOWN);
        const r = clamp((t - T_EXIT) / 0.3);
        const scale = lerp(1.5, 1, easeOut(r));
        const label = WON ? `止盈 +${TR.r}R` : "停損 −1R";
        ctx.font = `700 34px ${TC}`;
        const w = (ctx.measureText(label).width + 22) * scale;
        ctx.save();
        ctx.globalAlpha = clamp(r * 2);
        ctx.translate(Math.min(xe + 20, PX1 - 10 - w), yr + (yr < ye ? -36 : 36));
        ctx.scale(scale, scale);
        tag(0, 0, label, WON ? COL.up : COL.down, "#fff", `700 34px ${TC}`, "left");
        ctx.restore();
      }

      // ---------- overlays on the main canvas ----------
      function drawChip() {
        ctx = main;
        ctx.font = `700 26px ${TC}`;
        const text = D.chip;
        const w = ctx.measureText(text).width + 40;
        ctx.fillStyle = "rgba(24,28,40,0.94)";
        roundRect(W - 36 - w, 70, w, 56, 28);
        ctx.fill();
        ctx.strokeStyle = "rgba(232,189,125,0.6)";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.fillStyle = COL.gold;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.fillText(text, W - 36 - w + 20, 99);
      }

      const TONES = { level: RGB.gold, buy: UP, sell: DOWN };
      const FEED = EVENTS.flatMap((e) => {
        if (e.type === "alert") {
          const a = D.alerts[e.alert];
          return [{ t: e.t, until: T_EXIT + 0.4, rgb: TONES[a.tone], time: a.at, text: a.text }];
        }
        if (e.type === "entry") return [{ t: e.t, until: T_EXIT + 0.4, rgb: LONG ? UP : DOWN, time: D.ones[TR.signal][0] + 60_000, text: `${LONG ? "開多" : "開空"} ${fmt(TR.entry)} · 停損 ${(Math.abs(TR.entry - TR.stop) / TR.entry * 100).toFixed(2)}%` }];
        return [];
      });
      function drawFeed(t) {
        ctx = main;
        ctx.fillStyle = "rgba(42,46,57,0.6)";
        ctx.fillRect(0, FEED_Y - 14, W, 1);
        ctx.fillRect(0, FEED_Y + 3 * 62 + 4, W, 1);
        const live = FEED.filter((f) => t >= f.t && t < f.until + 0.3).slice(-3);
        live.forEach((f, row) => {
          const inn = easeOut(clamp((t - f.t) / 0.22));
          const out = 1 - clamp((t - f.until) / 0.3);
          ctx.globalAlpha = inn * out;
          const x = 20 - 40 * (1 - inn);
          const y = FEED_Y + row * 62;
          ctx.font = `600 28px ${TC}`;
          const w = ctx.measureText(f.text).width + 132;
          ctx.fillStyle = "rgba(24,28,40,0.94)";
          roundRect(x, y, w, 54, 8);
          ctx.fill();
          ctx.strokeStyle = "rgba(209,212,220,0.12)";
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = `rgb(${f.rgb})`;
          ctx.fillRect(x, y + 8, 5, 38);
          ctx.textBaseline = "middle";
          ctx.textAlign = "left";
          ctx.font = `500 22px ${MONO}`;
          ctx.fillStyle = COL.muted;
          ctx.fillText(tpeHour(f.time), x + 20, y + 28);
          ctx.font = `600 28px ${TC}`;
          ctx.fillStyle = "#eef0f4";
          ctx.fillText(f.text, x + 108, y + 28);
          ctx.globalAlpha = 1;
        });
      }

      function drawEdge(t) {
        const k = clamp((t - T_EXIT) / 0.5);
        if (k <= 0 || k >= 1) return;
        const g = main.createRadialGradient(W / 2, 960, 700, W / 2, 960, 1250);
        g.addColorStop(0, `rgba(${WON ? UP : DOWN},0)`);
        g.addColorStop(1, `rgba(${WON ? UP : DOWN},${0.28 * (1 - k)})`);
        main.fillStyle = g;
        main.fillRect(0, 0, W, H);
      }

      function chart5(t, readout) {
        const S = view5(t);
        drawWatermark("BTCUSDT · 5");
        drawGrid(S, 3_600_000);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, PY0 - 40, PX1, PY1 - PY0 + 60);
        ctx.clip();
        drawLevels(S, false);
        drawCandles5(S);
        drawMarks(S, t);
        ctx.restore();
        drawLevels(S, true);
        drawLast(S, t, readout);
        return S;
      }
      function chart1(t, readout) {
        const S = view1(t);
        drawWatermark("BTCUSDT · 1");
        // Time labels at least ~100 px apart as the bars narrow.
        drawGrid(S, ([5, 10, 15, 30].find((m) => m * S.slot >= 100) ?? 60) * 60_000);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, PY0 - 40, PX1, PY1 - PY0 + 60);
        ctx.clip();
        drawLevels(S, false);
        drawPosition(S, t, false);
        drawFootprint(S, t);
        drawStacked(S, t);
        drawPosition(S, t, true);
        ctx.restore();
        drawLevels(S, true);
        drawDeltaRow(S, t);
        drawLast(S, t, readout);
        return S;
      }

      function draw(t) {
        main.fillStyle = "#131722";
        main.fillRect(0, 0, W, H);
        const z = clamp((t - ZOOM_AT) / ZOOM_LEN);
        if (z <= 0) {
          ctx = main;
          chart5(t, true);
        } else if (z >= 1) {
          ctx = main;
          chart1(t, true);
        } else {
          // Zoom: the 5-minute chart grows toward its newest bar and fades as the footprint arrives.
          const k = easeInOut(z);
          const c5 = off5.getContext("2d");
          c5.clearRect(0, 0, W, H);
          ctx = c5;
          const S = chart5(ZOOM_AT, false);
          const fx = S.cx(S.i);
          const fy = S.y(S.bars[S.i][4]);
          main.save();
          main.globalAlpha = 1 - k;
          main.translate(fx, fy);
          main.scale(1 + 1.2 * k, 1 + 1.2 * k);
          main.translate(-fx, -fy);
          main.drawImage(off5, 0, 0);
          main.restore();
          const c1 = off1.getContext("2d");
          c1.clearRect(0, 0, W, H);
          ctx = c1;
          chart1(t, false);
          main.save();
          main.globalAlpha = k;
          main.drawImage(off1, 0, 0);
          main.restore();
          ctx = main;
          const S1 = view1(t);
          drawLast(z < 0.5 ? S : S1, t, true);
        }
        drawChip();
        drawFeed(t);
        drawEdge(t);
      }

      // ---------- timeline ----------
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      draw(0);
      tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      tl.to("#tf5", { opacity: 0, duration: 0.3, ease: "power1.in" }, ZOOM_AT + 0.1);
      tl.fromTo("#tf1", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, ZOOM_AT + 0.3);
      CAPTIONS.forEach(([a, b], i) => {
        const el = document.getElementById(`cap${i}`);
        tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, a);
        tl.to(el, { opacity: 0, duration: 0.15, ease: "power1.in" }, b - 0.15);
      });
      tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, ENDCARD_AT);
      tl.fromTo("#end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, ENDCARD_AT + 0.1);
      tl.fromTo("#join", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, ENDCARD_AT + 0.5);
      tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, ENDCARD_AT + 0.75);
      tl.fromTo("#disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, ENDCARD_AT + 0.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
