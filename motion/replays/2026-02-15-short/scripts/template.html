    <style>

  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
      <canvas id="stage" width="1080" height="1920" data-layout-ignore></canvas>

      <div class="head" data-layout-allow-occlusion>
        <img src="assets/img/badge.png" alt="" />
        <div>
          <div class="sym">BTCUSDT<small>永續 · 5 分</small></div>
          <div class="meta">幣安 · 歷史回放 2026/02/15（台灣時間）</div>
        </div>
      </div>

      <div class="caps" id="caps">
{{CAPTIONS_HTML}}
      </div>

      <div class="clip" id="endcard" data-start="{{ENDCARD_AT}}" data-duration="{{ENDCARD}}" data-track-index="3">
        <div class="end" id="end">
          <img src="assets/img/badge.png" alt="" />
          <div class="brand">MetaBear</div>
          <div class="join" id="join">加入 LINE 官方帳號</div>
          <div class="url" id="url">lin.ee/cbyuRJv</div>
        </div>
        <p class="disclaimer" id="disclaimer">歷史資料回放：幣安 BTCUSDT 永續合約 5 分 K，2026-02-15 台灣時間。<br />影片內容僅供教學，非投資建議。</p>
      </div>

      <audio id="soundtrack" src="assets/audio/soundtrack.wav" data-start="0" data-duration="{{END}}" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const D = /*@DATA*/ null;
      const REVEAL = /*@REVEAL*/ null;
      const EVENTS = /*@EVENTS*/ null;
      const CAPS = /*@CAPTIONS*/ null;
      const END = {{END}};
      const ENDCARD_AT = {{ENDCARD_AT}};

      const W = 1080;
      const COL = { up: "#26a69a", down: "#ef5350", text: "#d1d4dc", muted: "#787b86", grid: "rgba(42,46,57,0.75)", gold: "#e8bd7d", level: "#b39ddb" };
      const UP = "38,166,154";
      const DOWN = "239,83,80";
      const NUM = '"Barlow Condensed", sans-serif';
      const MONO = '"JetBrains Mono", monospace';
      const TC = '"Noto Sans TC", sans-serif';

      // Chart geometry: plot area, price axis on the right, time axis below.
      const PX1 = 900;
      const PY0 = 300;
      const PY1 = 1440;
      const SLOT = 15; // px per bar; bodies 10 px and wicks 2 px share one integer centre
      const VIS = 46; // bars kept on screen to the left of the newest
      const RIGHT = 14; // empty slots to the right of the newest bar, room for the position box
      const BOX = 12; // position box width in slots

      const canvas = document.getElementById("stage");
      const ctx = canvas.getContext("2d");
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, k) => a + (b - a) * k;
      const easeOut = (k) => 1 - Math.pow(1 - k, 3);
      const backOut = (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.2 * Math.pow(k - 1, 2);
      const fmt = (p) => p.toLocaleString("en-US", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      const tpeHour = (ms) => new Date(ms + 8 * 3600_000).toISOString().slice(11, 16);

      // ---------- time → chart state (pure) ----------
      function latest(t) {
        let i = D.history - 1;
        while (i + 1 < REVEAL.length && REVEAL[i + 1] <= t) i++;
        return i;
      }
      // Scroll position in bars: slides one slot right after each new bar appears.
      function anchor(t, i) {
        if (i < D.history) return i;
        const gap = (REVEAL[i + 1] ?? REVEAL[i] + 0.2) - REVEAL[i];
        return i - 1 + easeOut(clamp((t - REVEAL[i]) / Math.min(0.14, gap)));
      }
      const eventT = (type, k) => EVENTS.find((e) => e.type === type && e.trade === k).t;
      const pop = (t, k) => clamp((t - eventT("entry", k)) / 0.38);

      function rangeAt(t, i) {
        let lo = Infinity;
        let hi = -Infinity;
        for (let j = Math.max(0, i - VIS - 1); j <= i; j++) {
          lo = Math.min(lo, D.bars[j][3]);
          hi = Math.max(hi, D.bars[j][2]);
        }
        D.trades.forEach((tr, k) => {
          if (tr.signal > i || tr.exit < i - VIS) return;
          const e = easeOut(pop(t, k));
          for (const p of [tr.stop, tr.tp]) {
            lo = Math.min(lo, lerp(lo, p, e));
            hi = Math.max(hi, lerp(hi, p, e));
          }
        });
        return [lo, hi];
      }

      function state(t) {
        const i = latest(t);
        const a = anchor(t, i);
        const k = a - Math.floor(a);
        // Price range eases between the previous and current bar sets with the scroll.
        const [lo1, hi1] = rangeAt(t, i);
        const [lo0, hi0] = i > D.history ? rangeAt(t, i - 1) : [lo1, hi1];
        const s = i >= D.history ? clamp(a - (i - 1)) : 1;
        let lo = lerp(lo0, lo1, s);
        let hi = lerp(hi0, hi1, s);
        const pad = (hi - lo) * 0.1;
        lo -= pad;
        hi += pad;
        const base = PX1 - RIGHT * SLOT;
        const shift = Math.round(k * SLOT);
        const fa = Math.floor(a);
        return {
          t,
          i,
          cx: (j) => base - (fa - j) * SLOT - shift,
          y: (p) => PY1 - ((p - lo) / (hi - lo)) * (PY1 - PY0),
          lo,
          hi,
        };
      }

      // ---------- drawing ----------
      function tag(x, y, text, bg, fg = "#fff", font = `600 26px ${MONO}`, align = "left") {
        ctx.font = font;
        const w = ctx.measureText(text).width + 22;
        const h = 40;
        const x0 = align === "right" ? x - w : align === "center" ? x - w / 2 : x;
        ctx.fillStyle = bg;
        roundRect(x0, y - h / 2, w, h, 6);
        ctx.fill();
        ctx.fillStyle = fg;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        ctx.fillText(text, x0 + 11, y + 1);
        return w;
      }
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function hline(y, x0, x1, color, dash = [], width = 2) {
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.setLineDash(dash);
        ctx.beginPath();
        ctx.moveTo(x0, Math.round(y) + 0.5);
        ctx.lineTo(x1, Math.round(y) + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      function drawGrid(S) {
        const span = S.hi - S.lo;
        const step = [50, 100, 200, 250, 500, 1000].find((s) => span / s <= 9) ?? 1000;
        ctx.font = `500 26px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        for (let p = Math.ceil(S.lo / step) * step; p <= S.hi; p += step) {
          const y = S.y(p);
          if (y < PY0 - 10 || y > PY1 + 10) continue;
          hline(y, 0, PX1, COL.grid, [], 1);
          ctx.fillStyle = COL.muted;
          ctx.fillText(p.toLocaleString("en-US"), PX1 + 16, y);
        }
        // Hour lines and labels.
        ctx.textAlign = "center";
        for (let j = Math.max(0, S.i - VIS - 2); j <= S.i; j++) {
          const t = D.bars[j][0];
          if (t % 3_600_000) continue;
          const x = S.cx(j);
          if (x < 0) continue;
          ctx.strokeStyle = COL.grid;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x + 0.5, PY0 - 40);
          ctx.lineTo(x + 0.5, PY1 + 20);
          ctx.stroke();
          ctx.fillStyle = COL.muted;
          ctx.fillText(tpeHour(t), x, PY1 + 52);
        }
        // Axis borders.
        ctx.fillStyle = "rgba(42,46,57,1)";
        ctx.fillRect(PX1, PY0 - 60, 2, PY1 - PY0 + 110);
        ctx.fillRect(0, PY1 + 22, W, 2);
      }

      function drawWatermark() {
        ctx.font = `700 120px ${NUM}`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(209,212,220,0.045)";
        ctx.fillText("BTCUSDT · 5", PX1 / 2, (PY0 + PY1) / 2);
      }

      // Prior UTC day's high and low: one segment per day on screen (lines in the plot, then the
      // current day's price tags on the axis, which lies outside the plot's clip).
      function drawPrior(S, axis = false) {
        const from = Math.max(0, S.i - VIS - 2);
        let j = from;
        while (j <= S.i) {
          const p = D.prior[j];
          let k = j;
          while (k + 1 <= S.i && JSON.stringify(D.prior[k + 1]) === JSON.stringify(p)) k++;
          // Only today's levels: an older day's lines would sit unlabelled on the chart.
          if (p && k === S.i) {
            const x0 = Math.max(0, S.cx(j) - SLOT / 2);
            const x1 = k === S.i ? PX1 : S.cx(k) + SLOT / 2;
            for (const [price, name] of [
              [p[0], "前日高"],
              [p[1], "前日低"],
            ]) {
              const y = S.y(price);
              if (y < PY0 - 30 || y > PY1 + 30) continue;
              if (axis) {
                if (k === S.i) tag(PX1 + 4, y, fmt(price), "rgba(232,189,125,0.95)", "#141414", `600 24px ${MONO}`);
                continue;
              }
              hline(y, x0, x1, "rgba(232,189,125,0.8)", [10, 8], 2);
              if (k === S.i) {
                ctx.font = `600 26px ${TC}`;
                ctx.fillStyle = COL.gold;
                ctx.textAlign = "left";
                ctx.textBaseline = "bottom";
                ctx.fillText(name, Math.max(18, x0 + 8), y - 6);
              }
            }
          }
          j = k + 1;
        }
      }

      function drawLevels(S, t) {
        // A strategy-B level appears with its trade and fades after the exit.
        D.trades.forEach((tr, k) => {
          if (!tr.levelPrice || tr.signal > S.i) return;
          const fade = 1 - clamp((t - eventT("exit", k) - 0.5) / 0.4);
          const a = Math.min(easeOut(pop(t, k)), fade);
          if (a <= 0) return;
          const y = S.y(tr.levelPrice);
          const x0 = Math.max(0, S.cx(tr.signal - 18));
          const x1 = S.cx(tr.signal) + 4 * SLOT;
          ctx.globalAlpha = a;
          hline(y, x0, x1, COL.level, [3, 6], 3);
          ctx.font = `600 26px ${TC}`;
          ctx.fillStyle = COL.level;
          ctx.textAlign = "left";
          ctx.textBaseline = "bottom";
          ctx.fillText(tr.level, x0 + 6, y - 6);
          ctx.globalAlpha = 1;
        });
      }

      function drawCandles(S) {
        for (let j = Math.max(0, S.i - VIS - 2); j <= S.i; j++) {
          const [, o, h, l, c] = D.bars[j];
          const cx = S.cx(j);
          if (cx < -SLOT) continue;
          ctx.fillStyle = c >= o ? COL.up : COL.down;
          const yh = Math.round(S.y(h));
          const yl = Math.round(S.y(l));
          ctx.fillRect(cx - 1, yh, 2, Math.max(1, yl - yh));
          const y0 = Math.round(S.y(Math.max(o, c)));
          const y1 = Math.round(S.y(Math.min(o, c)));
          ctx.fillRect(cx - 5, y0, 10, Math.max(2, y1 - y0));
        }
      }

      function drawLast(S) {
        const [, o, h, l, c] = D.bars[S.i];
        const col = c >= o ? COL.up : COL.down;
        const y = S.y(c);
        hline(y, 0, PX1, col, [3, 5], 1.5);
        tag(PX1 + 4, y, fmt(c), col, "#fff", `700 26px ${MONO}`);
        // OHLC readout, as on a trading terminal.
        ctx.font = `500 27px ${MONO}`;
        ctx.textBaseline = "middle";
        ctx.textAlign = "left";
        let x = 26;
        for (const [k, v] of [
          ["O", o],
          ["H", h],
          ["L", l],
          ["C", c],
        ]) {
          ctx.fillStyle = COL.muted;
          ctx.fillText(k, x, PY0 - 70);
          x += 22;
          ctx.fillStyle = col;
          const s = fmt(v);
          ctx.fillText(s, x, PY0 - 70);
          x += ctx.measureText(s).width + 22;
        }
      }

      // Position boxes sit behind the candles (layer "box"); their tags, rings and the result sit
      // in front (layer "front"). A closed box shrinks to its exit bar and drops its price tags;
      // the result stays until the next entry.
      function drawPositions(S, t, layer) {
        D.trades.forEach((tr, k) => {
          if (tr.signal > S.i) return;
          const te = eventT("entry", k);
          const tx = eventT("exit", k);
          const next = k + 1 < D.trades.length ? eventT("entry", k + 1) : Infinity;
          const long = tr.dir === "long";
          const closed = t >= tx;
          const won = tr.result === "tp";
          const e = backOut(pop(t, k));
          const dim = closed ? lerp(1, 0.4, clamp((t - tx - 0.5) / 0.4)) : 1;
          const x0 = S.cx(tr.signal) + 7;
          const shrink = closed ? easeOut(clamp((t - tx - 0.5) / 0.4)) : 0;
          const x1 = lerp(x0 + BOX * SLOT, Math.max(x0 + SLOT, S.cx(tr.exit) + SLOT / 2), shrink);
          if (x1 < 0) return;
          const ye = S.y(tr.entry);
          const yt = lerp(ye, S.y(tr.tp), e);
          const ys = lerp(ye, S.y(tr.stop), e);
          if (layer === "front") return front();
          ctx.globalAlpha = dim;
          ctx.fillStyle = `rgba(${UP},0.22)`;
          ctx.fillRect(x0, Math.min(ye, yt), x1 - x0, Math.abs(yt - ye));
          ctx.fillStyle = `rgba(${DOWN},0.22)`;
          ctx.fillRect(x0, Math.min(ye, ys), x1 - x0, Math.abs(ys - ye));
          // Open profit or loss so far: a stronger shade from the entry to the latest close.
          const lastBar = Math.min(S.i, tr.exit);
          const now = closed ? (won ? tr.tp : tr.stop) : D.bars[S.i][4];
          if (S.i > tr.signal) {
            const yn = S.y(clamp(now, Math.min(tr.stop, tr.tp), Math.max(tr.stop, tr.tp)));
            const good = long ? now >= tr.entry : now <= tr.entry;
            ctx.fillStyle = `rgba(${good ? UP : DOWN},0.32)`;
            const xn = Math.min(x1, S.cx(lastBar) + 5);
            ctx.fillRect(x0, Math.min(ye, yn), Math.max(0, xn - x0), Math.abs(yn - ye));
          }
          hline(ye, x0, x1, "rgba(209,212,220,0.9)", [], 2);
          ctx.globalAlpha = 1;

          function front() {
            const tags = closed ? 1 - clamp((t - tx - 0.5) / 0.3) : 1;
            // Target and stop tags give way to the result as it lands.
            const levels = closed ? 1 - clamp((t - tx) / 0.12) : 1;
            if (e > 0.6 && levels > 0) {
              ctx.globalAlpha = clamp((e - 0.6) / 0.3) * levels;
              const tpAbove = yt < ye;
              tag(x1, yt + (tpAbove ? -22 : 22), `目標 ${fmt(tr.tp)}`, `rgba(${UP},0.95)`, "#fff", `600 24px ${TC}`, "right");
              tag(x1, ys + (tpAbove ? 22 : -22), `停損 ${fmt(tr.stop)}`, `rgba(${DOWN},0.95)`, "#fff", `600 24px ${TC}`, "right");
            }
            // Entry tag, left of the box.
            ctx.globalAlpha = clamp(pop(t, k) / 0.4) * tags;
            if (tags > 0) tag(x0 - 6, ye, `${long ? "多" : "空"} ${fmt(tr.entry)}`, long ? COL.up : COL.down, "#fff", `700 28px ${TC}`, "right");
            ctx.globalAlpha = 1;
            // Entry flash: a ring on the entry price.
            const f = clamp((t - te) / 0.5);
            if (f > 0 && f < 1) ring(x0, ye, 10 + 60 * easeOut(f), 1 - f, long ? UP : DOWN);
            if (!closed) return;
            // Result: a ring where the target or stop was hit, then a tag that stays until the next entry.
            const r = clamp((t - tx) / 0.3);
            const xe = S.cx(tr.exit);
            const yr = S.y(won ? tr.tp : tr.stop);
            const g = clamp((t - tx) / 0.6);
            if (g < 1) ring(xe, yr, 12 + 90 * easeOut(g), 1 - g, won ? UP : DOWN);
            const gone = 1 - clamp((t - next + 0.1) / 0.25);
            if (gone <= 0) return;
            const scale = lerp(1.5, 1, easeOut(r));
            const label = won ? "止盈 +1R" : "停損 −1R";
            ctx.font = `700 34px ${TC}`;
            const w = (ctx.measureText(label).width + 22) * scale;
            ctx.save();
            ctx.globalAlpha = clamp(r * 2) * gone;
            // Beside the hit level, kept inside the plot.
            ctx.translate(Math.min(xe + SLOT, PX1 - 10 - w), yr + (yr < ye ? -34 : 34));
            ctx.scale(scale, scale);
            tag(0, 0, label, won ? COL.up : COL.down, "#fff", `700 34px ${TC}`, "left");
            ctx.restore();
          }
        });
      }

      function ring(x, y, r, a, rgb) {
        ctx.strokeStyle = `rgba(${rgb},${a})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.stroke();
      }

      function drawEdge(t) {
        // A brief edge glow on each result: green for a target, red for a stop.
        for (const ev of EVENTS) {
          if (ev.type !== "exit") continue;
          const k = clamp((t - ev.t) / 0.5);
          if (k <= 0 || k >= 1) continue;
          const rgb = D.trades[ev.trade].result === "tp" ? UP : DOWN;
          const g = ctx.createRadialGradient(W / 2, 960, 700, W / 2, 960, 1250);
          g.addColorStop(0, `rgba(${rgb},0)`);
          g.addColorStop(1, `rgba(${rgb},${0.28 * (1 - k)})`);
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, 1920);
        }
      }

      function draw(t) {
        ctx.fillStyle = "#131722";
        ctx.fillRect(0, 0, W, 1920);
        const S = state(t);
        drawWatermark();
        drawGrid(S);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, PY0 - 40, PX1, PY1 - PY0 + 60);
        ctx.clip();
        drawPrior(S);
        drawLevels(S, t);
        drawPositions(S, t, "box");
        drawCandles(S);
        drawPositions(S, t, "front");
        ctx.restore();
        drawPrior(S, true);
        drawLast(S);
        drawEdge(t);
      }

      // ---------- timeline ----------
      Promise.all([
        document.fonts.load(`700 100px ${NUM}`),
        document.fonts.load(`500 26px ${MONO}`),
        document.fonts.load(`700 40px ${TC}`, "多空止盈停損目標前日高低"),
      ]).then(() => {
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        draw(0);
        tl.to(clock, { t: END, duration: END, ease: "none", onUpdate: () => draw(clock.t) }, 0);
        CAPS.forEach(([a, b], i) => {
          const el = document.getElementById(`cap${i}`);
          tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.2, ease: "power2.out", immediateRender: false }, a);
          tl.to(el, { opacity: 0, duration: 0.15, ease: "power1.in" }, b - 0.15);
        });
        tl.fromTo("#endcard", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out", immediateRender: false }, ENDCARD_AT);
        tl.fromTo("#end", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", immediateRender: false }, ENDCARD_AT + 0.1);
        tl.fromTo("#join", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, ENDCARD_AT + 0.5);
        tl.fromTo("#url", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, ENDCARD_AT + 0.75);
        tl.fromTo("#disclaimer", { opacity: 0 }, { opacity: 1, duration: 0.5, immediateRender: false }, ENDCARD_AT + 0.6);
        window.__timelines["main"] = tl;
      });
    </script>
  </body>
</html>
