<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaBear Academy Showreel</title>
    <link rel="stylesheet" href="../../../public/orderflow/motion/fonts/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      canvas {
        display: block;
        width: 1920px;
        height: 1080px;
      }
      body.preview canvas {
        width: 100vw;
        height: auto;
        max-height: calc(100vh - 48px);
        object-fit: contain;
      }
      #ui {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 16px;
        font:
          14px ui-monospace,
          monospace;
        color: #94a8b9;
      }
      #ui[hidden] {
        display: none;
      }
      #scrub {
        flex: 1;
      }
      button {
        background: #101b22;
        color: #edf2ed;
        border: 1px solid #26363c;
        border-radius: 6px;
        padding: 6px 14px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui" hidden>
      <button id="play">▶ / ❚❚</button>
      <input id="scrub" type="range" min="0" step="0.01" value="0" />
      <span id="time">0.00s</span>
      <audio id="audio" preload="auto"></audio>
    </div>
    <script>
      if (location.search.includes("preview"))
        document.body.classList.add("preview");
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
