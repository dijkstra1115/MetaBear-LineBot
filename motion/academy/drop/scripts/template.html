    <script>
      const W = 1920;
      const H = 1080;
      /*__DATA__*/
      const tl = gsap.timeline({ paused: true });
      const beat = (i) => GRID.T0 + i * GRID.P;
      const P = GRID.P;

      // ---------- camera ----------
      const camXY = (fx, fy, z) => {
        const x = Math.min(0, Math.max(W - W * z, W / 2 - fx * z));
        const y = Math.min(0, Math.max(H - H * z, H / 2 - fy * z));
        return { x, y, scale: z };
      };
      for (const s of SHOTS) {
        const cam = document.getElementById("cam-" + s.id);
        const inn = document.getElementById("camin-" + s.id);
        tl.set(cam, { visibility: "visible" }, s.start);
        tl.set(cam, { visibility: "hidden" }, s.end);
        for (const [t, fx, fy, z, dur, ease] of s.cam) {
          if (!dur) tl.set(inn, camXY(fx, fy, z), t);
          else tl.to(inn, { ...camXY(fx, fy, z), duration: dur, ease }, t);
        }
        if (s.cursor) {
          const el = document.getElementById("cur-" + s.id);
          const c = CURSORS[s.id];
          const place = (m) => {
            const i = Math.max(0, Math.min(c.pts.length - 1, Math.round(m * c.fps) - c.base));
            const [x, y] = c.pts[i];
            const z = gsap.getProperty(inn, "scale") || 1;
            el.style.transform = "translate(" + (x - 6) + "px," + (y - 3) + "px) scale(" + (1.25 / z).toFixed(4) + ")";
          };
          for (const g of s.segs) {
            const p = { m: g.m0 };
            const m1 = g.m0 + (g.end - g.start) * g.rate;
            tl.fromTo(p, { m: g.m0 }, { m: m1, duration: g.end - g.start, ease: "none", immediateRender: false, onUpdate: () => place(p.m) }, g.start);
          }
          place(s.segs[0].m0);
        }
      }
      for (const r of RIPPLES) {
        tl.fromTo("#rip-" + r.cam + "-" + r.i, { opacity: 1, scale: 0.3 }, { opacity: 0, scale: 1.9, duration: 0.5, ease: "power2.out", immediateRender: false }, r.t);
      }

      // ---------- motion vocabulary ----------
      const slam = (sel, t, s = 1.7, d = 0.3) => tl.fromTo(sel, { scale: s, opacity: 0, filter: "blur(18px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: d, ease: "power4.out" }, t);
      const snap = (sel, t, dx = -280) => tl.fromTo(sel, { x: dx, opacity: 0 }, { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, t);
      const rise = (sel, t, dy = 80) => tl.fromTo(sel, { y: dy, rotation: 3, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.38, ease: "circ.out" }, t);
      const pop = (sel, t) => tl.fromTo(sel, { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.2)" }, t);
      const fade = (sel, t, d = 0.25) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
      const flash = (t, a, d = 0.35) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      const shake = (t, amp, d = 0.4) => {
        const steps = Math.round(d / 0.033);
        for (let i = 0; i < steps; i++) {
          const k = 1 - i / steps;
          const a = amp * k * k;
          tl.to("#shake", { x: Math.sin(i * 12.9898 + t * 7.1) * a, y: Math.cos(i * 78.233 + t * 3.3) * a, duration: 0.033, ease: "none" }, t + i * 0.033);
        }
        tl.to("#shake", { x: 0, y: 0, duration: 0.033, ease: "none" }, t + steps * 0.033);
      };
      const rgb = (t, d, amt) => {
        tl.set("#rig", { filter: "url(#rgb)" }, t);
        tl.fromTo("#rgb-r", { attr: { dx: amt } }, { attr: { dx: 0 }, duration: d, ease: "power2.out", immediateRender: false }, t);
        tl.fromTo("#rgb-gb", { attr: { dx: -amt } }, { attr: { dx: 0 }, duration: d, ease: "power2.out", immediateRender: false }, t);
        tl.set("#rig", { filter: "none" }, t + d);
      };
      const whip = (sel, t, dir = 1) => tl.fromTo(sel, { x: -dir * 380, filter: "blur(16px)" }, { x: 0, filter: "blur(0px)", duration: 0.16, ease: "power3.out", immediateRender: false }, t);
      const count = (sel, t, to, d, fmt = (v) => Math.round(v).toLocaleString("en-US")) => {
        const el = document.querySelector(sel);
        const p = { v: 0 };
        el.textContent = fmt(0);
        tl.fromTo(p, { v: 0 }, { v: to, duration: d, ease: "power2.out", immediateRender: false, onUpdate: () => (el.textContent = fmt(p.v)) }, t);
      };

      // ---------- backdrop ----------
      tl.fromTo("#glow", { scale: 1, opacity: 0.8 }, { scale: 1.12, opacity: 1, duration: 4 * P, ease: "sine.inOut", yoyo: true, repeat: Math.max(0, Math.floor(GRID.END / (4 * P)) - 1) }, 0);
      tl.fromTo("#bg-grid", { backgroundPosition: "-1px -1px" }, { backgroundPosition: "-1px 239px", duration: GRID.END, ease: "none" }, 0);
      tl.fromTo("#grain", { backgroundPosition: "0px 0px" }, { backgroundPosition: "-2400px -1700px", duration: GRID.END, ease: "steps(" + Math.round(GRID.END * 24) + ")" }, 0);

      // ---------- A · press play, drag back, your move ----------
      flash(beat(0), 0.55);
      shake(beat(0), 10, 0.35);
      fade("#a1k", beat(0) + 0.1);
      slam("#a1a", beat(0), 1.8);
      snap("#a1b", beat(2), -320);
      flash(beat(4), 0.25, 0.2);
      snap("#a2a", beat(4), 300);
      tl.set("#cam-a", { filter: "none" }, 0);
      pop("#a2c", beat(5));
      slam("#a2b", beat(6), 1.5);
      tl.set("#cam-a", { filter: "brightness(0.38) saturate(0.7) blur(3px)" }, beat(8));
      slam("#a3-0", beat(8), 2.6, 0.28);
      tl.fromTo("#a3-1", { y: -460, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "expo.out" }, beat(9));
      tl.fromTo("#a3-2", { x: -260, rotation: -24, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.34, ease: "circ.out" }, beat(10));
      tl.fromTo("#a3-3", { scale: 0.2, rotation: 18, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.36, ease: "back.out(2.4)" }, beat(11));
      for (let i = 0; i < 4; i++) {
        flash(beat(8 + i), 0.12 + i * 0.05, 0.22);
        shake(beat(8 + i), 4 + i * 2, 0.2);
      }
      fade("#a3t", beat(11) + 0.15);
      tl.to(".giant-row", { scale: 1.08, duration: 4 * P, ease: "power2.in" }, beat(8));

      // ---------- B · hands-on challenge ----------
      flash(beat(12), 0.5, 0.25);
      rgb(beat(12), 0.22, 26);
      whip("#cam-b", beat(12), 1);
      fade("#b1k", beat(12));
      snap("#b1a", beat(12));
      snap("#b1b", beat(12) + P / 2);
      pop("#b1c0", beat(13));
      pop("#b1c1", beat(14));
      pop("#b1c2", beat(15));
      flash(beat(16), 0.4, 0.25);
      shake(beat(16) + 0.08, 12, 0.4);
      pop("#b2c", beat(16));
      slam("#b2a", beat(17));
      rise("#b2b", beat(18));
      flash(beat(20), 0.3, 0.25);
      shake(beat(20), 8, 0.3);
      tl.fromTo("#b3g", { x: 900, opacity: 0 }, { x: -1500, opacity: 1, duration: 4 * P, ease: "none" }, beat(20));
      fade("#b3k", beat(20));
      slam("#b3n", beat(20), 1.4);
      count("#b3v", beat(20), 2240, 2 * P);

      // ---------- C · real-time feedback ----------
      flash(beat(24), 0.5, 0.3);
      whip("#cam-c", beat(24), -1);
      pop("#c1c", beat(24));
      slam("#c1a", beat(25));
      slam("#c1b", beat(25) + P / 2, 1.4);
      flash(beat(26), 0.55, 0.3);
      rgb(beat(26), P, 34);
      shake(beat(26), 9, 0.3);
      tl.fromTo("#c1g", { x: 700, opacity: 0 }, { x: -500, opacity: 1, duration: 2 * P, ease: "none" }, beat(26));
      rise("#c1s", beat(27));

      // ---------- D · lessons answer back ----------
      flash(beat(28), 0.3, 0.25);
      tl.fromTo("#cam-d1", { x: 520, rotationY: -28, opacity: 0 }, { x: 0, rotationY: -6, opacity: 1, duration: 0.42, ease: "expo.out" }, beat(28));
      fade("#d1k", beat(28));
      snap("#d1a", beat(28));
      rise("#d1s", beat(29));
      flash(beat(30), 0.3, 0.25);
      tl.fromTo("#cam-d2", { x: -520, rotationY: 28, opacity: 0 }, { x: 0, rotationY: 6, opacity: 1, duration: 0.42, ease: "expo.out" }, beat(30));
      fade("#d2k", beat(30));
      snap("#d2a", beat(30), 280);
      rise("#d2s", beat(31));
      const tileIn = [
        [{ x: -320, scale: 0.86 }, "expo.out"],
        [{ y: -300, scale: 0.9 }, "expo.out"],
        [{ y: 300, rotationX: 35 }, "circ.out"],
        [{ scale: 1.35 }, "power4.out"],
      ];
      tileIn.forEach(([from, ease], i) => {
        const t = beat(32 + i);
        tl.fromTo("#cam-g" + (i + 1), { ...from, opacity: 0 }, { x: 0, y: 0, scale: 1, rotationX: 0, opacity: 1, duration: 0.3, ease }, t);
        pop("#g" + (i + 1) + "l", t + 0.08);
        flash(t, 0.18, 0.2);
        shake(t, 5, 0.18);
      });
      flash(beat(36), 0.3, 0.25);
      tl.fromTo("#cam-m", { x: -560, rotationY: 42, rotationX: 4, opacity: 0 }, { x: 0, rotationY: 16, rotationX: 4, opacity: 1, duration: 0.45, ease: "expo.out" }, beat(36));
      tl.to("#cam-m", { rotationY: 9, duration: 3.5 * P, ease: "sine.inOut" }, beat(36) + 0.45);
      slam("#m0", beat(36), 1.5);
      count("#m0v", beat(36), 23, 0.5);
      snap("#m1", beat(37), 260);
      snap("#m2", beat(38), 260);
      snap("#m3", beat(39), 260);
      fade("#m4", beat(39) + P / 2);
      for (let i = 0; i < 4; i++) shake(beat(36 + i), 4, 0.16);

      // ---------- build: six lessons, half a beat each, into the silent beat ----------
      for (let i = 0; i < 6; i++) {
        const t = beat(40 + i / 2);
        flash(t, 0.14 + i * 0.03, 0.14);
        slam("#k" + i + "t", t, 1.3, 0.16);
      }
      tl.fromTo("#progf", { scaleX: 0 }, { scaleX: 0.99, duration: GRID.SILENT - beat(40), ease: "power1.in" }, beat(40));
      count("#progv", beat(40), 99, GRID.SILENT - beat(40), (v) => Math.round(v) + "%");
      tl.set("#cam-e", { filter: "grayscale(1) brightness(0.5)" }, GRID.SILENT);
      tl.set("#cam-e", { filter: "none" }, GRID.DROP);

      // ---------- DROP · lesson complete, turn report, ranked ----------
      flash(GRID.DROP, 1, 0.55);
      rgb(GRID.DROP, 0.4, 44);
      shake(GRID.DROP, 26, 0.7);
      slam("#ed1", GRID.DROP, 2.2, 0.26);
      tl.fromTo("#ed2", { scale: 0.2, rotation: -30, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.34, ease: "back.out(2.6)" }, GRID.DROP + 0.06);
      tl.fromTo("#ed2 polyline", { strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, GRID.DROP + 0.1);
      fade("#edt", GRID.DROP + 0.15);
      flash(beat(45), 0.55, 0.3);
      shake(beat(45), 14, 0.4);
      tl.fromTo("#cam-f", { rotationX: 38, y: 140, opacity: 0.2 }, { rotationX: 0, y: 0, opacity: 1, duration: 0.32, ease: "power3.out" }, beat(45));
      pop("#fc", beat(45) + 0.05);
      flash(beat(46), 0.55, 0.3);
      rgb(beat(46), 0.25, 30);
      shake(beat(46), 14, 0.4);
      slam("#ha", beat(46), 1.6);
      snap("#hs", beat(46) + P / 2);
      flash(beat(47), 0.4, 0.3);
      for (let i = 0; i < 9; i++) {
        const col = i % 3;
        const row = Math.floor(i / 3);
        tl.fromTo("#cam-w" + i, { scale: 0.25, rotationY: (col - 1) * 40, rotationX: (row - 1) * -30, opacity: 0 }, { scale: 1, rotationY: 0, rotationX: 0, opacity: 1, duration: 0.42, ease: "expo.out" }, beat(47) + i * 0.025);
        tl.to("#cam-w" + i, { scale: 0.9, opacity: 0.32, duration: 4 * P, ease: "power2.out" }, beat(48));
      }
      slam("#wa", beat(47), 1.6, 0.28);

      // ---------- lockup ----------
      flash(beat(48), 0.6, 0.45);
      shake(beat(48), 12, 0.45);
      fade(".lockup", beat(48), 0.2);
      tl.fromTo("#lb", { scale: 0.3, rotation: -40, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.45, ease: "back.out(2)" }, beat(48));
      slam("#lt", beat(48) + 0.05, 1.5, 0.34);
      tl.fromTo("#lm", { scaleX: 1.35, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.5, ease: "expo.out" }, beat(49));
      rise("#lg", beat(49) + P / 2, 50);
      pop("#lu", beat(50));
      fade("#ldis", beat(50) + 0.2, 0.4);
      tl.fromTo("#fade", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.in" }, GRID.END - 0.5);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
