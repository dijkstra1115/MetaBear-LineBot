      <script>
        (function () {
          const B = 60 / 128;
          const S = B * 4; // segment length
          const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          const root = document.getElementById("s5-threats-root");
          const q = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });

          // phase switching (hard cut + punch + flash on each downbeat)
          const phases = ["#s5-a", "#s5-b", "#s5-c", "#s5-d"];
          phases.forEach((id, i) => {
            const t = i * S;
            tl.fromTo(id, { opacity: 0 }, { opacity: 1, duration: 0.02, immediateRender: false }, t);
            if (i > 0) tl.fromTo(phases[i - 1], { opacity: 1 }, { opacity: 0, duration: 0.02, immediateRender: false }, t);
            tl.fromTo(id, { scale: 1.08, filter: "blur(10px)" }, { scale: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out", immediateRender: false }, t);
            if (i > 0) tl.fromTo("#s5-flash", { opacity: 0.2 }, { opacity: 0, duration: 0.22, immediateRender: false }, t);
            if (i < 3) {
              tl.fromTo(`${id} .s5-copy .eb`, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t + 0.05);
              tl.fromTo(`${id} .s5-copy h2`, { yPercent: 40, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.35, ease: ["power4.out", "expo.out", "circ.out"][i] }, t + 0.08);
              tl.fromTo(`${id} .s5-copy p`, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, t + 0.35);
              tl.fromTo(`${id} .s5-panel`, { x: 80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, t + 0.04);
            }
          });
          // header + counter (pure function of time)
          tl.fromTo("#s5-head", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0);
          tl.to("#s5-head", { opacity: 0, duration: 0.05 }, S * 3);
          const hd = { t: 0 };
          tl.fromTo(hd, { t: 0 }, { t: S * 3, duration: S * 3, ease: "none", onUpdate: () => { q("#s5-n").textContent = "0" + Math.min(3, 1 + Math.floor(hd.t / S + 1e-6)) + " / 03"; } }, 0);

          // ---- A: iceberg absorbs ----
          const candle = q("#s5-a-candle");
          gsap.set(candle, { y: 0 });
          // candle bottom at panel y=600; top position = 600 - 600*scaleY
          tl.fromTo(candle, { scaleY: 0.12 }, { scaleY: (600 - 266) / 600, duration: 0.9, ease: "power2.in" }, 0.05);
          tl.to(candle, { scaleY: (600 - 272) / 600, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 0.95);
          tl.to(candle, { scaleY: (600 - 420) / 600, duration: 0.6, ease: "power3.inOut" }, 1.25);
          tl.fromTo(candle, { filter: "hue-rotate(0deg)" }, { filter: "hue-rotate(160deg) saturate(1.4)", duration: 0.3 }, 1.25);
          const fill = { v: 0 };
          tl.fromTo(fill, { v: 0 }, { v: 8.4, duration: 0.9, ease: "power2.out", onUpdate: () => { q("#s5-a-fill").textContent = fill.v.toFixed(1); } }, 0.9);
          tl.fromTo("#s5-a-wall", { opacity: 0.35 }, { opacity: 1, duration: 0.08, yoyo: true, repeat: 7, ease: "none" }, 0.9);
          tl.fromTo("#s5-a-stamp", { scale: 2.4, opacity: 0, rotation: -14 }, { scale: 1, opacity: 1, rotation: -6, duration: 0.28, ease: "power4.out" }, B * 2);
          tl.fromTo("#s5-a-panel", { x: 0 }, { x: 14, duration: 0.04, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, B * 2);

          // ---- B: hunter locks on ----
          const T0 = S;
          const moves = [[610, 150], [220, 280], [520, 380], [400, 430]];
          tl.fromTo("#s5-b-reticle", { x: moves[0][0], y: moves[0][1], scale: 1.8, opacity: 0 }, { x: moves[0][0], y: moves[0][1], scale: 1.3, opacity: 1, duration: 0.25, ease: "power2.out", immediateRender: false }, T0 + 0.1);
          [0.525, 0.755, 0.985].forEach((dt, k) => {
            tl.fromTo("#s5-b-reticle", { x: moves[k][0], y: moves[k][1] }, { x: moves[k + 1][0], y: moves[k + 1][1], duration: 0.18, ease: "expo.out", immediateRender: false }, T0 + dt - 0.1);
          });
          tl.fromTo("#s5-b-reticle", { scale: 1.3 }, { scale: 0.62, duration: 0.2, ease: "back.out(3)", immediateRender: false }, T0 + 1.02);
          tl.fromTo("#s5-b-lock", { opacity: 1 }, { opacity: 0.2, duration: 0.06, yoyo: true, repeat: 5, ease: "none", immediateRender: false }, T0 + 0.3);
          const lk = { v: 0 };
          tl.fromTo(lk, { v: 0 }, { v: 1, duration: 0.01, immediateRender: false, onUpdate: () => { q("#s5-b-lock").textContent = lk.v > 0.5 ? "LOCKED" : "TRACKING"; } }, T0 + 1.02);
          tl.fromTo("#s5-b-liq", { opacity: 0.4 }, { opacity: 1, duration: 0.1, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, T0 + 1.02);
          tl.fromTo("#s5-b-stamp", { scale: 2.2, opacity: 0, rotation: 10 }, { scale: 1, opacity: 1, rotation: 4, duration: 0.28, ease: "power4.out", immediateRender: false }, T0 + 1.2);

          // ---- C: pulled back ----
          const T1 = S * 2;
          const up = q("#s5-c-up"), back = q("#s5-c-back");
          const LU = up.getTotalLength(), LB = back.getTotalLength();
          up.style.strokeDasharray = LU; up.style.strokeDashoffset = LU;
          const dot = q("#s5-c-dot");
          const pr = { u: 0, b: 0 };
          const drawC = () => {
            up.style.strokeDashoffset = LU * (1 - pr.u);
            const P = pr.b > 0 ? back.getPointAtLength(LB * pr.b) : up.getPointAtLength(LU * pr.u);
            gsap.set(dot, { x: P.x, y: P.y });
          };
          back.style.opacity = 0;
          drawC();
          tl.fromTo(pr, { u: 0 }, { u: 1, duration: 0.55, ease: "power2.in", onUpdate: drawC, immediateRender: false }, T1 + 0.05);
          tl.fromTo(back, { opacity: 0 }, { opacity: 1, duration: 0.2, immediateRender: false }, T1 + 0.62);
          tl.fromTo(pr, { b: 0 }, { b: 1, duration: 0.75, ease: "power2.inOut", onUpdate: drawC, immediateRender: false }, T1 + 0.65);
          tl.fromTo("#s5-c-tc", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, T1 + 0.65);
          tl.fromTo("#s5-c-pnl", { scale: 0.3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(2.5)", immediateRender: false }, T1 + 1.25);

          // ---- D: read the tape ----
          const T2 = S * 3;
          const bandsD = [
            { y: 150, h: 10, tag: "✓ FUEL 58 BTC", c: "ok", x: 1300 },
            { y: 240, h: 5, tag: "✕ TOO THIN", c: "thin", x: 1480 },
            { y: 330, h: 16, tag: "✕ ICEBERG", c: "no", x: 1380 },
            { y: 700, h: 12, tag: "✓ FUEL 112 BTC", c: "ok", x: 1330 },
            { y: 800, h: 6, tag: "✕ HUNTED", c: "no", x: 1500 },
            { y: 900, h: 14, tag: "✓ FUEL 31 BTC", c: "ok", x: 1400 },
          ];
          const bw = q("#s5-d-bands"), tw = q("#s5-d-tags");
          bandsD.forEach((b, i) => {
            const el = document.createElement("div");
            el.className = "s5-band"; el.style.top = b.y + "px"; el.style.height = b.h + "px";
            bw.appendChild(el);
            const tg = document.createElement("div");
            tg.className = "s5-d-tag " + b.c; tg.textContent = b.tag;
            tg.style.left = b.x + "px"; tg.style.top = b.y - 56 + "px";
            tw.appendChild(tg);
            const hitT = T2 + 0.2 + ((b.x - 0) / 1920) * 1.3;
            tl.fromTo(tg, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2.5)", immediateRender: false }, hitT);
            if (b.c !== "ok") tl.to(el, { opacity: 0.18, duration: 0.25 }, hitT);
            else tl.to(el, { opacity: 1, filter: "brightness(1.6)", duration: 0.25 }, hitT);
          });
          tl.fromTo("#s5-d-scan", { x: 0 }, { x: 2160, duration: 1.5, ease: "power1.inOut", immediateRender: false }, T2 + 0.15);
          tl.fromTo("#s5-d-copy", { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, T2 + 0.02);
          tl.fromTo("#s5-d-copy p", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, T2 + B * 2);

          window.__timelines["s5-threats"] = tl;
        })();
