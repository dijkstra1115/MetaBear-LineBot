      <script>
        (() => {
          const DUR = 7;
          const cues = JSON.parse(document.getElementById("s6-cues").dataset.cues);
          const ez = {
            lin: (x) => x,
            out3: (x) => 1 - Math.pow(1 - x, 3),
            out5: (x) => 1 - Math.pow(1 - x, 5),
            in3: (x) => x * x * x,
            inout: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
          };
          const keys = (t, ks) => {
            if (t <= ks[0][0]) return ks[0][1];
            for (let i = 1; i < ks.length; i++) {
              if (t <= ks[i][0]) {
                const [t0, v0] = ks[i - 1];
                const [t1, v1, e] = ks[i];
                return v0 + (v1 - v0) * ez[e || "inout"]((t - t0) / (t1 - t0));
              }
            }
            return ks[ks.length - 1][1];
          };
          const pk = (t, t0, d) => (t < t0 ? 0 : Math.max(0, 1 - (t - t0) / d) ** 2);
          const win = (t, a, b, fi = 0.2, fo = 0.2) => (t < a || t > b ? 0 : Math.min(1, (t - a) / fi, (b - t) / fo));
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const fmt = (n, d = 0) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
          const $ = (id) => document.getElementById(id);

          const P0 = 100200, P1 = 103000, Y0 = 960, Y1 = 150;
          const yOf = (p) => Y0 - ((p - P0) * (Y0 - Y1)) / (P1 - P0);
          const ZC = 101640, ZW = 508, TRUE_LIQ = 101820;
          const axis = $("s6-axis");
          for (let p = 100400; p <= 102800; p += 400) {
            const d = document.createElement("div");
            d.className = "s6-lab";
            d.style.top = yOf(p) + "px";
            d.textContent = fmt(p);
            axis.appendChild(d);
          }
          const price = (t) => keys(t, [[0, 102300], [3.6, 102300], [4.3, TRUE_LIQ, "in3"], [4.7, 101540, "out3"], [7, 101600, "inout"]]) + (t < 3.6 ? Math.sin(t * 5.3) * 12 : 0);
          // price history as a line (prior minutes)
          const hist = [];
          for (let i = 0; i < 60; i++) {
            const x = i / 59;
            hist.push(100800 + 1500 * Math.pow(x, 2.2) + (hash(i * 3.3) - 0.5) * 90);
          }
          hist[59] = 102300;

          const ctx = $("s6-canvas").getContext("2d");
          const draw = (t, vis) => {
            ctx.clearRect(0, 0, 1920, 1080);
            if (vis <= 0) return;
            ctx.globalAlpha = vis;
            ctx.strokeStyle = "rgba(151,175,181,0.08)";
            ctx.lineWidth = 2;
            for (let p = 100400; p <= 102800; p += 400) {
              ctx.beginPath();
              ctx.moveTo(110, yOf(p));
              ctx.lineTo(1470, yOf(p));
              ctx.stroke();
            }
            // rival liquidation zone: blurred violet, collapses to a line on the blow-up
            const bt = t - cues.boomV[0];
            if (bt < 0) {
              const g = ctx.createLinearGradient(0, yOf(ZC + ZW), 0, yOf(ZC - ZW));
              const breathe = 0.5 + 0.12 * Math.sin(t * 5);
              g.addColorStop(0, "rgba(183,156,255,0)");
              g.addColorStop(0.35, `rgba(183,156,255,${(0.28 * breathe + 0.1).toFixed(3)})`);
              g.addColorStop(0.65, `rgba(183,156,255,${(0.28 * breathe + 0.1).toFixed(3)})`);
              g.addColorStop(1, "rgba(183,156,255,0)");
              ctx.fillStyle = g;
              ctx.fillRect(110, yOf(ZC + ZW), 1360, yOf(ZC - ZW) - yOf(ZC + ZW));
              ctx.setLineDash([12, 10]);
              ctx.strokeStyle = "rgba(183,156,255,0.55)";
              ctx.strokeRect(110, yOf(ZC + ZW), 1360, yOf(ZC - ZW) - yOf(ZC + ZW));
              ctx.setLineDash([]);
            } else if (bt < 1.2) {
              ctx.save();
              ctx.shadowColor = "#b79cff";
              ctx.shadowBlur = 40;
              ctx.fillStyle = `rgba(236,228,255,${Math.max(0, 1 - bt).toFixed(3)})`;
              const h = 8 + bt * 120;
              ctx.fillRect(110, yOf(TRUE_LIQ) - h / 2, 1360, h);
              ctx.restore();
              for (let k = 0; k < 110; k++) {
                const ang = hash(k * 1.9) * Math.PI * 2;
                const r = (300 + hash(k * 4.1) * 1100) * Math.min(bt, 0.8) * (1 - bt * 0.35);
                ctx.fillStyle = `rgba(${200 + Math.round(hash(k) * 55)},${170 + Math.round(hash(k * 2) * 60)},255,${Math.max(0, 1 - bt / 1.1).toFixed(3)})`;
                const sz = 3 + hash(k * 7) * 7;
                ctx.fillRect(1380 + Math.cos(ang) * r, yOf(TRUE_LIQ) + Math.sin(ang) * r * 0.5, sz, sz);
              }
            }
            // price line
            const p = price(t);
            ctx.save();
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#e8f3ef";
            ctx.shadowColor = "#70e6c9";
            ctx.shadowBlur = 16;
            ctx.beginPath();
            hist.forEach((v, i) => {
              const x = 110 + i * 21;
              i ? ctx.lineTo(x, yOf(v)) : ctx.moveTo(x, yOf(v));
            });
            ctx.lineTo(1380, yOf(p));
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = "#fb7f91";
            ctx.beginPath();
            ctx.arc(1380, yOf(p), 10, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1;
          };

          const cardEls = [...document.querySelectorAll(".s6-card")];
          const cardX = [110 + 200, 110 + 430 + 200, 110 + 860 + 200, 110 + 1290 + 200];
          const curKeys = {
            x: [[0, 1980], [1.5, 1980], [1.75, cardX[0], "out3"], [1.95, cardX[1]], [2.15, cardX[2]], [2.35, cardX[3]], [2.7, 1300, "inout"], [3.1, 900, "out3"], [3.4, 330, "inout"], [7, 360]],
            y: [[0, 1100], [1.5, 1100], [1.75, 780, "out3"], [2.35, 780], [2.7, 600, "inout"], [3.1, yOf(ZC) + 30, "out3"], [3.4, 972, "inout"], [4.7, 972], [5.2, 1120, "in3"], [7, 1120]],
          };
          const qmarks = [$("s6-q1"), $("s6-q2"), $("s6-q3")];
          const GLY = "?#%@&$*!";
          const render = (t) => {
            const vis = win(t, 2.55, 4.8, 0.25, 0.2);
            draw(t, vis);
            $("s6-b").style.opacity = vis;
            $("s6-a").style.opacity = t < 2.5 ? 1 : Math.max(0, 1 - (t - 2.5) / 0.2);
            $("s6-c").style.opacity = t < 4.8 ? 0 : Math.min(1, (t - 4.8) / 0.25) * (t > 6.6 ? Math.max(0, 1 - (t - 6.6) / 0.35) : 1);
            const p = price(t);
            $("s6-price").style.transform = `translateY(${yOf(p)}px)`;
            $("s6-price").textContent = fmt(p, 2);
            $("s6-zonetag").style.transform = `translateY(${yOf(ZC + ZW) - 54}px)`;
            $("s6-zonetag").style.opacity = t < cues.boomV[0] ? 1 : 0;
            $("s6-tip").style.transform = `translateY(${yOf(ZC) - 40}px)`;
            $("s6-tip").style.opacity = win(t, cues.hover[4], 3.55, 0.15, 0.15);
            // cursor
            $("s6-curpos").style.transform = `translate(${keys(t, curKeys.x) - 4}px, ${keys(t, curKeys.y) - 4}px)`;
            $("s6-cursor").style.transform = `scale(${1 - 0.2 * pk(t, cues.click[0], 0.22)})`;
            const rp = t < cues.click[0] ? 1 : Math.min(1, (t - cues.click[0]) / 0.5);
            $("s6-ripple").style.opacity = 1 - rp;
            $("s6-ripple").style.transform = `translate(330px, 972px) scale(${0.2 + 2.2 * ez.out3(rp)})`;
            // card hovers: lift + scrambled liquidation glyphs
            cardEls.forEach((c, i) => {
              const h = pk(t, cues.hover[i], 0.5);
              c.querySelector(".hl").style.opacity = h;
              const inK = ez.out3(Math.min(1, Math.max(0, (t - (1.0 + i * 0.08)) / 0.5)));
              c.style.opacity = inK;
              c.style.transform = `perspective(1600px) translateY(${(1 - inK) * 140 - 22 * h}px) rotateY(${(1 - inK) * -40}deg)`;
            });
            qmarks.forEach((q, i) => {
              const h = t >= cues.hover[i + 1] && t < cues.hover[i + 1] + 0.3;
              const st = Math.floor(t * 24) + i * 5;
              q.textContent = h ? [0, 1, 2].map((k) => GLY[Math.floor(hash(st * 3 + k) * GLY.length)]).join("") : "???";
            });
            // slams
            const l1 = Math.min(1, Math.max(0, (t - cues.slam[0]) / 0.35));
            $("s6-l1").style.opacity = l1;
            $("s6-l1").style.transform = `scale(${1 + 0.5 * (1 - ez.out5(l1))})`;
            $("s6-l1").style.filter = `blur(${(1 - l1) * 14}px)`;
            const l2 = Math.min(1, Math.max(0, (t - cues.slam[1]) / 0.35));
            $("s6-l2").style.opacity = l2;
            $("s6-l2").style.transform = `translateX(${(1 - ez.out5(l2)) * -240}px)`;
            $("s6-room").style.opacity = Math.min(1, Math.max(0, (t - 0.8) / 0.3));
            // sell button + toast
            document.querySelector("#s6-sell .hl").style.opacity = t >= cues.hover[5] && t < cues.click[0] ? 0.3 : 0.8 * pk(t, cues.click[0], 0.6);
            $("s6-sell").style.transform = `scale(${1 - 0.07 * pk(t, cues.click[0], 0.3)})`;
            const tk = t < cues.boomV[0] ? 0 : Math.min(1, (t - cues.boomV[0]) / 0.2);
            $("s6-toast").style.opacity = tk;
            $("s6-toast").style.transform = `translateX(${(1 - ez.out3(tk)) * -60}px) scale(${1 + 0.3 * pk(t, cues.badge[0], 0.3)})`;
            $("s6-flash").style.opacity = 0.8 * pk(t, cues.boomV[0], 0.35);
            $("s6-b").style.transform = `translate(${(hash(Math.floor(t * 30)) - 0.5) * 30 * pk(t, cues.boomV[0], 0.5)}px, 0)`;
            // rank rows cascade
            document.querySelectorAll(".s6-rrow").forEach((r, i) => {
              const k = Math.min(1, Math.max(0, (t - cues.tick[i]) / 0.3));
              r.style.opacity = k;
              r.style.transform = `translateX(${(1 - ez.out3(k)) * 80}px)`;
            });
          };
          const drive = { t: 0 };
          render(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drive.t) }, 0);
          tl.fromTo(".s6-ctext strong", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.15, ease: "power4.out" }, 4.85);
          tl.fromTo(".s6-ctext p", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.3);
          tl.fromTo(".s6-rank", { x: 120, rotationY: -20, transformPerspective: 1600 }, { x: 0, rotationY: 0, duration: 0.6, ease: "expo.out" }, 4.8);
          window.__timelines["s6-pvp"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
