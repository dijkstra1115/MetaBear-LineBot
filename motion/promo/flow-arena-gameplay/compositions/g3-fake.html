<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template id="g3-fake-template">
      <style>
        #g3-fake-root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 70% 45%, #152b3b 0%, #08121b 62%); }
        #g3-world { position: absolute; inset: 0; }
        .g3-grid { position: absolute; left: 100px; right: 100px; height: 2px; background: rgba(151, 175, 181, 0.1); }
        .g3-ax { position: absolute; right: 36px; font: 400 20px var(--mono); color: rgba(151, 175, 181, 0.55); font-variant-numeric: tabular-nums; }
        #g3-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
        #g3-high { position: absolute; left: 100px; width: 1720px; top: 429px; border-top: 3px dashed rgba(232, 243, 239, 0.55); }
        #g3-high-l { position: absolute; left: 120px; top: 388px; font: 700 22px var(--mono); letter-spacing: 0.12em; color: rgba(232, 243, 239, 0.8); white-space: nowrap; }
        #g3-stops { position: absolute; left: 1100px; width: 720px; top: 452px; border-top: 4px dotted var(--coral); opacity: 0; }
        #g3-stops-l { position: absolute; left: 1520px; top: 462px; font: 700 22px var(--mono); color: var(--coral); white-space: nowrap; opacity: 0; }
        #g3-band { position: absolute; left: 0; width: 1920px; top: 632px; height: 16px; opacity: 0; transform-origin: 100% 50%; }
        #g3-band-l { position: absolute; left: 1330px; top: 660px; font: 700 24px var(--mono); color: var(--coral); white-space: nowrap; opacity: 0; }
        #g3-bo {
          position: absolute;
          left: 1120px;
          top: 440px;
          padding: 8px 18px;
          border-radius: 10px;
          background: var(--mint);
          color: #06231d;
          font: 700 26px var(--mono);
          letter-spacing: 0.1em;
          opacity: 0;
          white-space: nowrap;
        }
        .g3-ch {
          position: absolute;
          left: 0;
          top: 0;
          width: 88px;
          height: 34px;
          border-radius: 9px;
          display: grid;
          place-items: center;
          font: 700 19px var(--mono);
          color: #06231d;
          background: var(--mint);
          box-shadow: 0 0 16px rgba(112, 230, 201, 0.5);
          opacity: 0;
        }
        .g3-ch.l25 { background: #9ff0da; }
        .g3-ch.l50 { background: #d7fff4; }
        #g3-crowd { position: absolute; left: 1510px; top: 280px; font: 900 40px var(--tc); color: var(--mint); white-space: nowrap; opacity: 0; }
        #g3-crowd span { font: 700 26px var(--mono); color: var(--ink); margin-left: 12px; }
        .g3-stop { position: absolute; top: 438px; padding: 4px 10px; border-radius: 6px; background: var(--coral); color: #2a0710; font: 700 18px var(--mono); opacity: 0; }
        .g3-p { position: absolute; left: 0; top: 0; width: 14px; height: 5px; border-radius: 3px; opacity: 0; }
        #g3-ring { position: absolute; left: 1600px; top: 640px; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 5px solid #ffe2e7; box-shadow: 0 0 40px rgba(251, 127, 145, 0.8); opacity: 0; }
        #g3-pop { position: absolute; right: 360px; top: 560px; padding: 10px 20px; border-radius: 10px; border: 3px solid var(--coral); background: rgba(251, 127, 145, 0.16); color: #ffe2e7; font: 900 40px var(--tc); opacity: 0; white-space: nowrap; }
        #g3-pnl { position: absolute; left: 1560px; top: 760px; padding: 10px 22px; border-radius: 12px; background: var(--mint); color: #06231d; font: 700 44px var(--mono); opacity: 0; white-space: nowrap; }
        #g3-head { position: absolute; left: 120px; top: 110px; height: 120px; width: 1500px; }
        .g3-h { position: absolute; left: 0; top: 0; font: 400 84px/1 var(--display); letter-spacing: -0.03em; color: var(--ink); white-space: nowrap; opacity: 0; }
        .g3-h.c { color: var(--coral); font-size: 120px; }
        .g3-h.g { color: var(--gold); }
        #g3-keys { position: absolute; left: 120px; top: 880px; display: flex; gap: 60px; }
        #g3-kq, #g3-ke { opacity: 0; }
        #g3-flash { position: absolute; inset: 0; background: radial-gradient(ellipse at 80% 60%, rgba(255, 226, 231, 0.9), rgba(251, 127, 145, 0.2) 60%, rgba(0, 0, 0, 0)); opacity: 0; mix-blend-mode: screen; }
      </style>

      <div data-hf-id="hf-3t60" id="g3-fake-root" data-composition-id="g3-fake" data-width="1920" data-height="1080">
        <div data-hf-id="hf-r2q0" id="g3-world">
          <div data-hf-id="hf-rvu0" id="g3-gridwrap"></div>
          <div data-hf-id="hf-50bw" class="heat long" id="g3-band"></div>
          <div data-hf-id="hf-0zvc" id="g3-band-l">⚡ 50× LONG LIQ · 38 BTC</div>
          <div data-hf-id="hf-jp4g" id="g3-high"></div>
          <div data-hf-id="hf-y0eg" id="g3-high-l">30s HIGH · 101,240</div>
          <div data-hf-id="hf-4xqv" id="g3-stops"></div>
          <div data-hf-id="hf-4afh" id="g3-stops-l">CHASER STOPS ≈ 101,000</div>
          <svg data-hf-id="hf-1kvv" id="g3-svg" viewBox="0 0 1920 1080">
            <defs data-hf-id="hf-mh0t"><filter data-hf-id="hf-unxt" id="g3-blur" x="-10%" y="-50%" width="120%" height="200%"><fegaussianblur data-hf-id="hf-4y1c" stdDeviation="6" /></filter></defs>
            <path data-hf-id="hf-lwu0" id="g3-glow" fill="none" stroke="#70e6c9" stroke-width="12" opacity="0.4" filter="url(#g3-blur)" stroke-linejoin="round" />
            <path data-hf-id="hf-bs5l" id="g3-line" fill="none" stroke="#70e6c9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />
            <circle data-hf-id="hf-wri0" id="g3-dot" r="11" fill="#eafff8" />
          </svg>
          <div data-hf-id="hf-hruu" id="g3-bo">▲ BREAKOUT</div>
          <div data-hf-id="hf-um97" id="g3-chasers"></div>
          <div data-hf-id="hf-dfj8" id="g3-crowd">追價散戶<span data-hf-id="hf-ksuk">+7 BTC</span></div>
          <div data-hf-id="hf-jytp" id="g3-stopchips"></div>
          <div data-hf-id="hf-f2k2" id="g3-ring"></div>
          <div data-hf-id="hf-cz0q" id="g3-parts"></div>
          <div data-hf-id="hf-0rng" id="g3-pop">多單爆倉 38 BTC</div>
          <div data-hf-id="hf-brrx" id="g3-pnl">+$98K</div>
        </div>
        <div data-hf-id="hf-an76" id="g3-flash"></div>
        <div data-hf-id="hf-uwyi" id="g3-head">
          <div data-hf-id="hf-ic3h" class="g3-h" id="g3-ha">Poke the 30-second high.</div>
          <div data-hf-id="hf-1w25" class="g3-h" id="g3-hb" style="font-size: 70px">Chasers pile in — 20×, 25×, 50×.</div>
          <div data-hf-id="hf-62lb" class="g3-h c" id="g3-hc">Now flip.</div>
          <div data-hf-id="hf-2f5r" class="g3-h g" id="g3-hd">Their stops are your fuel.</div>
        </div>
        <div data-hf-id="hf-v4so" id="g3-keys">
          <div data-hf-id="hf-hom6" class="kc-row" id="g3-kq"><div data-hf-id="hf-ihw1" class="kc mint">Q</div><div data-hf-id="hf-q141" class="kc-lbl"><small data-hf-id="hf-q3t8">MARKET BUY</small>25 BTC</div></div>
          <div data-hf-id="hf-bfey" class="kc-row" id="g3-ke"><div data-hf-id="hf-cjts" class="kc coral">E</div><div data-hf-id="hf-aez1" class="kc-lbl"><small data-hf-id="hf-ttzy">MARKET SELL · LONG 25 → SHORT 75</small>100 BTC</div></div>
        </div>
      </div>

      <script>
        (function () {
          const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          const root = document.getElementById("g3-fake-root");
          const q = (s) => root.querySelector(s);
          const M = window.Matter;
          const D = 10.8;

          // grid + axis (y 429 = 101,240; 1px ≈ 3.1 USDT)
          const gw = q("#g3-gridwrap");
          for (let y = 250; y <= 850; y += 100) {
            const g = document.createElement("div"); g.className = "g3-grid"; g.style.top = y + "px"; g.setAttribute("data-layout-ignore", ""); gw.appendChild(g);
            const a = document.createElement("div"); a.className = "g3-ax"; a.style.top = y - 28 + "px"; a.setAttribute("data-layout-ignore", "");
            a.textContent = Math.round(101240 - (y - 429) * 3.1).toLocaleString("en-US"); gw.appendChild(a);
          }

          // ---------- price path: history + timed future ----------
          const hist = [];
          for (let i = 0; i <= 60; i++) {
            const x = 120 + i * 16;
            const y = 505 + Math.sin(i * 0.33) * 40 + (prand(i * 2.1) - 0.5) * 22 - (i > 50 ? (i - 50) * 3 : 0);
            hist.push([x, Math.max(438, y)]);
          }
          const K = [ // [t, x, y]
            [0.0, 1080, 482], [1.0, 1100, 470], [1.25, 1160, 378], [2.2, 1250, 366], [3.3, 1360, 358], [4.5, 1460, 352],
            [4.75, 1492, 452], [5.4, 1530, 520], [6.0, 1566, 590], [6.5, 1600, 640], [7.0, 1640, 700], [7.5, 1680, 724], [9.0, 1730, 702], [10.8, 1770, 712],
          ];
          const headAt = (t) => {
            let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
            const [t0, x0, y0] = K[i], [t1, x1, y1] = K[i + 1];
            const k = Math.min(1, Math.max(0, (t - t0) / (t1 - t0)));
            const wig = (Math.sin(t * 7.3) * 2.2 + Math.sin(t * 3.1) * 1.6) * (t > 1.3 && t < 4.5 ? 1 : 0.3);
            return [x0 + (x1 - x0) * k, y0 + (y1 - y0) * k + wig];
          };
          const line = q("#g3-line"), glow = q("#g3-glow"), dot = q("#g3-dot");
          const drawPath = (t) => {
            const pts = hist.slice();
            for (let s = 0; s <= t; s += 0.05) pts.push(headAt(s));
            const h = headAt(t); pts.push(h);
            const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
            line.setAttribute("d", d); glow.setAttribute("d", d);
            dot.setAttribute("cx", h[0]); dot.setAttribute("cy", h[1]);
            const col = t > 4.5 ? "#fb7f91" : "#70e6c9";
            line.setAttribute("stroke", col); glow.setAttribute("stroke", col);
          };

          // ---------- Matter.js: chasers pile on the breakout, then get knocked off ----------
          const NCH = 14, T0 = 1.3, FLIP = 4.75, HZ = 60;
          const engine = M.Engine.create();
          engine.gravity.y = 1.1;
          const ledge = M.Bodies.rectangle(1305, 372, 360, 24, { isStatic: true, angle: -0.06 });
          const lipL = M.Bodies.rectangle(1128, 330, 16, 90, { isStatic: true });
          const lipR = M.Bodies.rectangle(1482, 316, 16, 90, { isStatic: true });
          M.Composite.add(engine.world, [ledge, lipL, lipR]);
          const LEV = ["20×", "25×", "50×"];
          const chEls = [], bodies = [], frames = [];
          for (let k = 0; k < NCH; k++) {
            const el = document.createElement("div");
            const lv = Math.floor(prand(k * 9) * 3);
            el.className = "g3-ch " + ["l20", "l25", "l50"][lv]; el.setAttribute("data-layout-ignore", "");
            el.textContent = "LONG " + LEV[lv];
            q("#g3-chasers").appendChild(el); chEls.push(el);
            bodies.push(M.Bodies.rectangle(1170 + prand(k * 5) * 280, -40 - prand(k * 7) * 60, 88, 34, { chamfer: { radius: 8 }, restitution: 0.25, friction: 0.5, angle: (prand(k * 3) - 0.5) * 0.6 }));
          }
          const steps = Math.ceil((D - T0) * HZ);
          const added = new Array(NCH).fill(false);
          for (let s = 0; s <= steps; s++) {
            const t = T0 + s / HZ;
            for (let k = 0; k < NCH; k++) if (!added[k] && t >= T0 + k * 0.14) { M.Composite.add(engine.world, bodies[k]); added[k] = true; }
            if (Math.abs(t - FLIP) < 0.5 / HZ) {
              M.Composite.remove(engine.world, [ledge, lipL, lipR]);
              bodies.forEach((b, k) => {
                M.Body.setVelocity(b, { x: (prand(k * 31) - 0.3) * 9, y: -4 - prand(k * 37) * 6 });
                M.Body.setAngularVelocity(b, (prand(k * 41) - 0.5) * 0.5);
              });
            }
            frames.push(bodies.map((b, k) => (added[k] ? [b.position.x, b.position.y, b.angle] : null)));
            M.Engine.update(engine, 1000 / HZ);
          }
          const placeChasers = (t) => {
            const s = Math.round((t - T0) * HZ);
            const f = s >= 0 && s < frames.length ? frames[s] : null;
            chEls.forEach((el, k) => {
              const p = f && f[k];
              if (!p || p[1] > 1200) { gsap.set(el, { opacity: 0 }); return; }
              gsap.set(el, { opacity: 1, x: p[0] - 44, y: p[1] - 17, rotation: (p[2] * 180) / Math.PI });
            });
          };

          const tl = gsap.timeline({ paused: true });
          const drv = { t: 0 };
          tl.fromTo(drv, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => { drawPath(drv.t); placeChasers(drv.t); } }, 0);

          // keys
          const press = (sel, t, glowc) => {
            tl.fromTo(sel, { opacity: 0, y: 30, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.25, ease: "back.out(2.5)" }, t - 0.3);
            tl.fromTo(sel + " .kc", { y: 0, boxShadow: "0 10px 0 #0c1820, 0 16px 30px rgba(0,0,0,.5)" },
              { y: 9, boxShadow: `0 1px 0 #0c1820, 0 0 40px ${glowc}`, duration: 0.06, ease: "power2.in", yoyo: true, repeat: 1 }, t);
          };
          press("#g3-kq", 1.0, "rgba(112,230,201,.8)");
          tl.to("#g3-kq", { opacity: 0.3, duration: 0.3 }, 3.5);
          press("#g3-ke", 4.5, "rgba(251,127,145,.9)");

          // headline swaps (one anchor, four states)
          const heads = [["#g3-ha", 0.8, 1.95], ["#g3-hb", 2.0, 3.95], ["#g3-hc", 4.0, 6.95], ["#g3-hd", 7.0, 10.8]];
          heads.forEach(([id, a, b], i) => {
            tl.fromTo(id, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: ["expo.out", "power4.out", "back.out(2)", "circ.out"][i] }, a);
            if (b < 10) tl.to(id, { opacity: 0, y: -30, duration: 0.12, ease: "power2.in" }, b - 0.12);
          });
          tl.fromTo("#g3-hc", { scale: 1.6 }, { scale: 1, duration: 0.35, ease: "power4.out", transformOrigin: "0 60%", immediateRender: false }, 4.0);

          // breakout
          tl.fromTo("#g3-bo", { opacity: 0, scale: 0.4, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.3, ease: "back.out(2.6)" }, 1.25);
          tl.to("#g3-bo", { opacity: 0, duration: 0.3 }, 3.0);
          tl.fromTo("#g3-high", { borderTopColor: "rgba(232,243,239,.55)" }, { borderTopColor: "rgba(112,230,201,1)", duration: 0.08, yoyo: true, repeat: 3 }, 1.25);
          tl.fromTo("#g3-crowd", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.4);
          tl.to("#g3-crowd", { opacity: 0, duration: 0.2 }, 4.7);

          // the trap: stops + fresh 50× liquidation band appear
          tl.fromTo("#g3-stops", { opacity: 0, scaleX: 0, transformOrigin: "0 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, 3.0);
          tl.fromTo("#g3-stops-l", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3 }, 3.2);
          tl.fromTo("#g3-band", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "expo.out" }, 3.0);
          tl.fromTo("#g3-band-l", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3 }, 3.3);
          tl.fromTo("#g3-band", { filter: "brightness(1)" }, { filter: "brightness(1.7)", duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, 3.6);

          // stops trigger at the flip
          const chips = q("#g3-stopchips");
          for (let k = 0; k < 8; k++) {
            const c = document.createElement("div"); c.className = "g3-stop"; c.textContent = "STOP";
            c.style.left = 1180 + k * 44 + "px"; chips.appendChild(c);
            tl.fromTo(c, { opacity: 0, y: 0, scale: 0.4 }, { opacity: 1, scale: 1, y: 30 + prand(k) * 60, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 4.75 + k * 0.04);
            tl.to(c, { opacity: 0, y: 160, duration: 0.5, ease: "power2.in" }, 5.3 + k * 0.03);
          }
          tl.fromTo("#g3-stops", { opacity: 1 }, { opacity: 0.2, duration: 0.05, yoyo: true, repeat: 5, immediateRender: false }, 4.75);
          tl.to(["#g3-stops", "#g3-stops-l"], { opacity: 0, duration: 0.3 }, 5.6);

          // 50× band detonates at 6.5
          const BOOM = 6.5;
          tl.to("#g3-band", { scaleY: 6, opacity: 0, duration: 0.45, ease: "expo.out" }, BOOM);
          tl.to("#g3-band-l", { opacity: 0, duration: 0.2 }, BOOM);
          tl.fromTo("#g3-ring", { scale: 0.1, opacity: 1 }, { scale: 3, opacity: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, BOOM);
          tl.fromTo("#g3-flash", { opacity: 0.6 }, { opacity: 0, duration: 0.45, immediateRender: false }, BOOM);
          tl.fromTo("#g3-pop", { opacity: 0, scale: 0.4, x: 30 }, { opacity: 1, scale: 1, x: 0, duration: 0.35, ease: "back.out(2.4)" }, BOOM + 0.05);
          const pw = q("#g3-parts"), parts = [];
          const COL = ["#ffe2e7", "#fb7f91", "#f6d78c", "#fff4d6"];
          for (let k = 0; k < 26; k++) {
            const p = document.createElement("div"); p.className = "g3-p"; p.style.background = COL[k % 4]; pw.appendChild(p);
            const a = prand(k * 19) * Math.PI * 2; parts.push({ p, a, sp: 300 + prand(k * 23) * 500 });
          }
          const pd = { T: 0 };
          tl.fromTo(pd, { T: 0 }, {
            T: 1, duration: 1.0, ease: "none", immediateRender: false,
            onUpdate: () => parts.forEach((o) => {
              const e = 1 - Math.pow(1 - pd.T, 3);
              gsap.set(o.p, { x: 1600 + Math.cos(o.a) * o.sp * e, y: 640 + Math.sin(o.a) * o.sp * 0.6 * e + 380 * pd.T * pd.T, rotation: o.a * 57.3, opacity: pd.T <= 0 || pd.T >= 1 ? 0 : 1 - pd.T });
            }),
          }, BOOM);
          tl.fromTo("#g3-world", { x: 0 }, { x: 16, duration: 0.04, yoyo: true, repeat: 7, ease: "none", immediateRender: false }, BOOM);

          tl.fromTo("#g3-pnl", { opacity: 0, scale: 0.3, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: "back.out(2.6)" }, 8.0);

          window.__timelines["g3-fake"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
