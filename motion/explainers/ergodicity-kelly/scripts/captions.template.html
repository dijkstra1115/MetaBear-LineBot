<template>
  <style>
    @font-face { font-family: "Montserrat"; src: url("assets/fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
    @font-face { font-family: "Noto Sans TC Sub"; src: url("assets/fonts/NotoSansTC-sub.ttf") format("truetype"); font-weight: 100 900; }
    #root { position: absolute; inset: 0; pointer-events: none; }
    .cg, .cz { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    .cg-in { position: absolute; left: 50px; right: 50px; bottom: 1488px; text-align: center; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 66px; line-height: 1.16; color: #f1e8d2; text-shadow: 0 0 3px rgba(2, 8, 5, 0.9), 0 2px 8px rgba(2, 8, 5, 0.85), 0 6px 26px rgba(2, 8, 5, 0.7); }
    .cg-in .pl { opacity: 0; }
    .cz-in .pl { background: rgba(4, 11, 8, 0.58); border-radius: 14px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .w { display: inline-block; position: relative; opacity: 0; }
    .k { padding: 0 10px; }
    .box { position: absolute; inset: 2px -2px -4px -2px; border: 3px solid #e8b44c; opacity: 0; display: block; }
    .h { position: absolute; width: 12px; height: 12px; background: #0b2219; border: 3px solid #e8b44c; display: block; }
    .h.a { left: -8px; top: -8px; } .h.b { right: -8px; top: -8px; } .h.c { left: -8px; bottom: -8px; } .h.d { right: -8px; bottom: -8px; }
    .cz-in .pl { opacity: 1; padding: 6px 20px 8px; }
    .cz-in { position: absolute; left: 50px; right: 50px; top: 458px; text-align: center; font-family: "Noto Sans TC Sub", sans-serif; font-weight: 500; font-size: 42px; line-height: 1.3; letter-spacing: 0.04em; color: rgba(241, 232, 210, 0.86); text-shadow: 0 2px 14px rgba(2, 8, 5, 0.6); opacity: 0; }
  </style>
  <div data-hf-id="hf-avse" id="root" data-composition-id="captions" data-start="0" data-duration="__DURATION__" data-width="1080" data-height="1920">
<!--GROUPS-->
  </div>
  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      document.querySelectorAll(".cg").forEach((g) => {
        const g0 = parseFloat(g.dataset.start);
        const words = [...g.querySelectorAll(".w")];
        tl.fromTo(g.querySelector(".pl"), { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power1.out" }, g0);
        words.forEach((w, i) => {
          const at = g0 + parseFloat(w.dataset.t);
          tl.fromTo(w, { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, at);
          const box = w.querySelector(".box");
          if (box) tl.fromTo(box, { opacity: 0, scale: 1.14 }, { opacity: 1, scale: 1, duration: 0.2, ease: "expo.out" }, at + 0.04);
          const next = words[i + 1];
          if (next && !w.classList.contains("k")) tl.to(w, { opacity: 0.58, duration: 0.12, ease: "power1.out" }, g0 + parseFloat(next.dataset.t));
        });
      });
      document.querySelectorAll(".cz").forEach((z) => {
        const z0 = parseFloat(z.dataset.start);
        const z1 = z0 + parseFloat(z.dataset.duration);
        const inner = z.querySelector(".cz-in");
        tl.fromTo(inner, { opacity: 0, filter: "blur(5px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, z0);
        tl.to(inner, { opacity: 0, duration: 0.12, ease: "power2.in" }, Math.max(z0 + 0.2, z1 - 0.12));
      });
      tl.set({}, {}, __DURATION__);
      window.__timelines = window.__timelines || {};
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
