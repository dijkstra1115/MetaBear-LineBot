        const count = (sel, t, d, a, b, f = num, ease = "power2.out") => {
          const o = { v: a };
          const el = $(sel);
          el.textContent = f(a);
          tl.to(o, { v: b, duration: d, ease, onUpdate: () => (el.textContent = f(o.v)) }, L(t));
        };
        // game value at composition time t from the captured log of a shot: key 0 price (cents), 1 PnL, 2 chain
        const game = (id, key, t) => {
          const d = DATA[id];
          const f = Math.min(d.r.length - 1, Math.max(0, (t - d.s) / 0.05));
          const i = Math.floor(f);
          const a = d.r[i][key], b = (d.r[i + 1] || d.r[i])[key];
          return key === 2 ? a : a + (b - a) * (f - i);
        };
        const live = (sel, id, key, f, t0 = DATA[id].s, t1 = DATA[id].e) => {
          const el = $(sel);
          const o = { v: 0 };
          el.textContent = f(game(id, key, t0));
          tl.to(o, { v: 1, duration: t1 - t0, ease: "none", onUpdate: () => (el.textContent = f(game(id, key, t0 + o.v * (t1 - t0)))) }, L(t0));
        };
        // stable pseudo-random from an integer
        const hash = (n) => {
          const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
          return x - Math.floor(x);
        };
/* @kit:end */
          // speed lines: radial strokes from the centre outwards, fixed by a hash so every render matches
          const svg = $("#fx-lines");
          const NS = "http://www.w3.org/2000/svg";
          for (let i = 0; i < 64; i++) {
            const a = (i / 64) * Math.PI * 2 + hash(i) * 0.08;
            const r0 = 300 + hash(i + 7) * 260;
            const r1 = r0 + 500 + hash(i + 19) * 700;
            const ln = document.createElementNS(NS, "line");
            ln.setAttribute("x1", (960 + Math.cos(a) * r0).toFixed(1));
            ln.setAttribute("y1", (540 + Math.sin(a) * r0 * 0.62).toFixed(1));
            ln.setAttribute("x2", (960 + Math.cos(a) * r1).toFixed(1));
            ln.setAttribute("y2", (540 + Math.sin(a) * r1 * 0.62).toFixed(1));
            ln.setAttribute("stroke-width", (2 + hash(i + 3) * 5).toFixed(1));
            ln.setAttribute("opacity", (0.35 + hash(i + 5) * 0.65).toFixed(2));
            svg.appendChild(ln);
          }
          for (const [t, k] of HITS) {
            tl.fromTo("#fx-flash", { opacity: 0.85 * k }, { opacity: 0, duration: 0.12 + 0.22 * k, ease: "power2.out", immediateRender: false }, L(t));
            if (k >= 0.9) {
              tl.fromTo("#fx-lines", { opacity: 0.9, scale: 0.8, transformOrigin: "960px 540px" }, { opacity: 0, scale: 1.25, duration: 0.42, ease: "power2.out", immediateRender: false }, L(t));
              tl.fromTo("#fx-edge", { opacity: 0.9 }, { opacity: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, L(t));
            }
          }
          // grain jumps 12 times a second
          const grain = $("#fx-grain");
          const drive = { t: 0 };
          const DUR = 45;
          const move = () => {
            const i = Math.floor(drive.t * 12);
            grain.style.transform = `translate(${Math.round(hash(i) * 64 - 32)}px, ${Math.round(hash(i + 999) * 64 - 32)}px)`;
          };
          move();
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: move }, 0);
          window.__timelines["fx-overlay"] = tl;
        })();
      </script>
    </template>
  </body>
