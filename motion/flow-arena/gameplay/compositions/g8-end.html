<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <template id="g8-end-template">
      <style>
        #g8-end-root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 48%, #172f3f 0%, #08121b 58%, #050b11 100%); }
        #g8-stage { position: absolute; inset: 0; perspective: 1200px; }
        .g8-w { position: absolute; left: 0; right: 0; top: 330px; text-align: center; opacity: 0; }
        .g8-w .en { font: 400 250px/1 var(--display); letter-spacing: -0.05em; white-space: nowrap; }
        .g8-w .tc { margin-top: 20px; font: 900 64px var(--tc); letter-spacing: 0.3em; color: var(--ink); }
        #g8-all { position: absolute; inset: 0; opacity: 0; }
        .g8-rule { position: absolute; left: 260px; width: 1400px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, rgba(246, 215, 140, 0), #fff4d6 50%, rgba(246, 215, 140, 0)); box-shadow: 0 0 30px rgba(246, 215, 140, 0.8); }
        #g8-brand { position: absolute; left: 0; right: 0; top: 140px; display: flex; justify-content: center; align-items: center; gap: 20px; }
        #g8-brand img { width: 76px; height: 76px; }
        #g8-brand span { font: 700 40px var(--mono); color: var(--ink); }
        #g8-brand em { font: 500 34px var(--tc); font-style: normal; color: var(--muted); padding-left: 22px; border-left: 3px solid #3b4d51; }
        #g8-word { position: absolute; left: 0; right: 0; top: 372px; text-align: center; font: 400 216px/1 var(--display); letter-spacing: -0.04em; color: var(--ink); text-shadow: 0 0 80px rgba(112, 230, 201, 0.35); white-space: nowrap; }
        #g8-tc { position: absolute; left: 0; right: 0; top: 640px; text-align: center; font: 900 92px/1 var(--tc); letter-spacing: 0.34em; padding-left: 0.34em; color: var(--gold); text-shadow: 0 0 50px rgba(246, 215, 140, 0.5); }
        #g8-tc span { display: inline-block; }
        #g8-cta { position: absolute; left: 0; right: 0; top: 786px; display: flex; justify-content: center; }
        #g8-cta div { padding: 18px 44px; border-radius: 14px; background: var(--mint); color: #06231d; font: 700 40px var(--mono); letter-spacing: 0.06em; box-shadow: 0 0 60px rgba(112, 230, 201, 0.5); white-space: nowrap; }
        #g8-foot { position: absolute; left: 0; right: 0; top: 948px; text-align: center; font: 700 24px var(--mono); letter-spacing: 0.16em; color: #8fa9af; white-space: nowrap; }
        #g8-foot span { font: 500 24px var(--tc); letter-spacing: 0.1em; }
        #g8-black { position: absolute; inset: 0; background: #000; opacity: 0; }
      </style>

      <div data-hf-id="hf-q5py" id="g8-end-root" data-composition-id="g8-end" data-width="1920" data-height="1080">
        <div data-hf-id="hf-xdqh" id="g8-stage">
          <div data-hf-id="hf-m6fv" class="g8-w" id="g8-w1"><div data-hf-id="hf-8yhi" data-layout-allow-overlap="" class="en" style="color: var(--mint)">SHAKE.</div><div data-hf-id="hf-1zgx" class="tc" data-layout-allow-overlap="">下大單</div></div>
          <div data-hf-id="hf-bay8" class="g8-w" id="g8-w2"><div data-hf-id="hf-6r4l" data-layout-allow-overlap="" class="en" style="color: var(--ink)">FAKE.</div><div data-hf-id="hf-xatt" class="tc" data-layout-allow-overlap="">假突破</div></div>
          <div data-hf-id="hf-c2m1" class="g8-w" id="g8-w3"><div data-hf-id="hf-rm2k" data-layout-allow-overlap="" class="en" style="color: var(--coral)">CHAIN.</div><div data-hf-id="hf-bm89" class="tc" data-layout-allow-overlap="">連環爆倉</div></div>
          <div data-hf-id="hf-3eq6" class="g8-w" id="g8-w4"><div data-hf-id="hf-f3xo" data-layout-allow-overlap="" class="en" style="color: var(--gold)">PROBE.</div><div data-hf-id="hf-6iv1" class="tc" data-layout-allow-overlap="">先試探</div></div>
          <div data-hf-id="hf-7cu7" class="g8-w" id="g8-w5"><div data-hf-id="hf-kwod" data-layout-allow-overlap="" class="en" style="color: var(--mint)">FLIP.</div><div data-hf-id="hf-qesf" class="tc" data-layout-allow-overlap="">反手收割</div></div>
        </div>
        <div data-hf-id="hf-onlq" id="g8-all">
          <div data-hf-id="hf-995g" class="g8-rule" id="g8-r1" style="top: 350px"></div>
          <div data-hf-id="hf-bxy4" class="g8-rule" id="g8-r2" style="top: 610px"></div>
          <div data-hf-id="hf-u2i0" id="g8-brand"><img data-hf-id="hf-4d1q" src="assets/logo.png" alt=""><span data-hf-id="hf-ler6">MetaBear</span><em data-hf-id="hf-smnk">互動學院</em></div>
          <div data-hf-id="hf-i5cy" id="g8-word">FLOW ARENA</div>
          <div data-hf-id="hf-xsm2" id="g8-tc"><span data-hf-id="hf-gyg5">爆</span><span data-hf-id="hf-awag">倉</span><span data-hf-id="hf-1a9o">獵</span><span data-hf-id="hf-0r9r">場</span></div>
          <div data-hf-id="hf-9jk1" id="g8-cta"><div data-hf-id="hf-kbgb">PLAY THE LIQUIDATION HUNT →</div></div>
          <div data-hf-id="hf-lv7i" id="g8-foot">SIMULATED MARKET · NO REAL FUNDS · <span data-hf-id="hf-po92">虛構市場 · 模擬合約 · 無真實資金</span></div>
        </div>
        <div data-hf-id="hf-2y4i" id="g8-black"></div>
      </div>

      <script>
        (function () {
          const B = 0.5;
          const root = document.getElementById("g8-end-root");
          const tl = gsap.timeline({ paused: true });

          // one word per beat; each arrives from depth and is punched past the camera by the next
          const ENT = [{ z: -900, rotationX: 40 }, { z: -900, rotationY: -50 }, { z: -900, rotationX: -40 }, { z: -900, rotationY: 50 }, { z: -1200, scale: 0.6 }];
          for (let i = 0; i < 5; i++) {
            const id = "#g8-w" + (i + 1), t = i * B;
            tl.fromTo(id, Object.assign({ opacity: 0 }, ENT[i]), { opacity: 1, z: 0, rotationX: 0, rotationY: 0, scale: 1, duration: 0.22, ease: "expo.out" }, t);
            tl.to(id, { z: 900, opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, t + B - 0.05);
          }

          // lockup on 56.5
          const L = 2.5;
          tl.fromTo("#g8-all", { opacity: 0 }, { opacity: 1, duration: 0.05 }, L);
          tl.fromTo("#g8-r1", { y: 130, scaleX: 0.2 }, { y: 0, scaleX: 1, duration: 0.55, ease: "expo.out" }, L);
          tl.fromTo("#g8-r2", { y: -130, scaleX: 0.2 }, { y: 0, scaleX: 1, duration: 0.55, ease: "expo.out" }, L);
          tl.fromTo("#g8-word", { clipPath: "inset(50% 0% 50% 0%)", scale: 1.12 }, { clipPath: "inset(0% 0% 0% 0%)", scale: 1, duration: 0.6, ease: "expo.out" }, L + 0.05);
          tl.fromTo("#g8-tc", { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, L + 0.4);
          gsap.utils.toArray(root.querySelectorAll("#g8-tc span")).forEach((el, i) => tl.fromTo(el, { x: (i - 1.5) * 90 }, { x: 0, duration: 0.8, ease: "expo.out" }, L + 0.4));
          tl.fromTo("#g8-brand", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, L + 0.6);
          tl.fromTo("#g8-brand img", { rotation: -30, scale: 0.4 }, { rotation: 0, scale: 1, duration: 0.6, ease: "back.out(2.2)" }, L + 0.6);
          tl.fromTo("#g8-cta div", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.4)" }, L + 1.0);
          tl.fromTo("#g8-foot", { opacity: 0 }, { opacity: 1, duration: 0.5 }, L + 1.2);
          tl.fromTo("#g8-all", { scale: 1 }, { scale: 1.03, duration: 3.5, ease: "none", immediateRender: false }, L);
          tl.fromTo("#g8-black", { opacity: 0 }, { opacity: 1, duration: 1.0, ease: "power2.in" }, 4.9);

          window.__timelines["g8-end"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
