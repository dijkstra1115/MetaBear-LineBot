        #g4-tape .head b { color: var(--mint); font-weight: 700; }

        .g4-row span { color: #9fb8bb; }
        .g4-row strong { color: var(--ink); }
        .g4-row em { font-style: normal; color: var(--gold); }
        #g4-dim { position: absolute; inset: 0; background: rgba(5, 9, 15, 0.84); opacity: 0; }
        #g4-final { position: absolute; left: 120px; top: 300px; width: 1680px; }
        .g4-fw { display: block; width: fit-content; font: 400 180px/0.94 var(--display); letter-spacing: -0.04em; color: var(--ink); }
        .g4-fw.c { color: var(--coral); text-shadow: 0 0 80px rgba(251, 127, 145, 0.5); }
        #g4-fp { margin-top: 40px; font: 700 34px/1.4 var(--mono); color: #cfe3df; max-width: 1150px; }
      </style>

      <div data-hf-id="hf-2ku8" id="g4-cascade-root" data-composition-id="g4-cascade" data-width="1920" data-height="1080">
        <div data-hf-id="hf-gx11" id="g4-stage">
          <div data-hf-id="hf-msbl" id="g4-plane">

              <div data-hf-id="hf-fqum" id="g4-cam">
                <div data-hf-id="hf-swct" id="g4-gridwrap"></div>

        <div data-hf-id="hf-n3u8" id="g4-hud">

          <div data-hf-id="hf-g0yl" id="g4-ign" data-layout-allow-overlap="">$0</div>
          <div data-hf-id="hf-8xxg" id="g4-crow"><span data-hf-id="hf-udn0" class="tc">連環爆倉</span><span data-hf-id="hf-wf72" id="g4-combo">×1</span></div>
        </div>

          <span data-hf-id="hf-66ut" class="g4-fw c" id="g4-f2" data-layout-allow-overlap="">ONE PUSH.</span>
          <p data-hf-id="hf-ol1c" id="g4-fp" data-layout-allow-overlap="">Every liquidation is a market order — it shoves price straight into the next band.</p>
        </div>

      <script>
        (function () {
          const prand = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
          const root = document.getElementById("g4-cascade-root");
          const q = (s) => root.querySelector(s);
          const fmt = (v, d = 2) => v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
          const D = 10.8, TOP = 240;
          const priceAt = (y) => 100120 - (y - TOP) * 3.2;

          // world: grid, axis, history
          const gw = q("#g4-gridwrap");
          for (let y = 100; y <= 2300; y += 140) {
            const g = document.createElement("div"); g.className = "g4-grid"; g.style.top = y + "px"; g.setAttribute("data-layout-ignore", ""); gw.appendChild(g);
            const a = document.createElement("div"); a.className = "g4-ax"; a.style.top = y - 30 + "px"; a.setAttribute("data-layout-ignore", ""); a.textContent = fmt(priceAt(y)); gw.appendChild(a);
          }
          const cw = q("#g4-candles");
          let c = 250;
          for (let i = 0; i < 30; i++) {
            const o = c; c = o + (prand(i * 3.7) - 0.48) * 30 + (250 - o) * 0.15;
            const el = document.createElement("div");
            el.className = "g4-c " + (c < o ? "up" : "dn");
            el.style.left = 110 + i * 25 + "px"; el.style.top = Math.min(o, c) + "px"; el.style.height = Math.max(6, Math.abs(o - c)) + "px";
            cw.appendChild(el);
          }

          // bands (long liquidations below price)
          const P = [1.5, 2.75, 3.75, 4.5, 5.0, 5.5];
          const BY = [560, 880, 1150, 1370, 1560, 1730];
          const BH = [10, 14, 16, 20, 24, 30];
          const SZ = [14, 31, 58, 96, 140, 212];
          const LEV = ["50×", "25×", "20×", "25×", "50×", "20×"];
          const bw = q("#g4-bands"), fx = q("#g4-fx");
          const bands = BY.map((y, i) => {
            const el = document.createElement("div");
            el.className = "g4-band heat long"; el.style.top = y - BH[i] / 2 + "px"; el.style.height = BH[i] + "px";
            el.innerHTML = `<div class="lbl" data-layout-allow-overlap>⚡ ${SZ[i]} BTC · ${LEV[i]} LONGS</div>`;
            bw.appendChild(el); return el;
          });

          const tl = gsap.timeline({ paused: true });

          // 3D orbit of the whole chart plane
          tl.fromTo("#g4-plane", { rotationX: 24, rotationY: -20, z: -120 }, { rotationX: 12, rotationY: 12, z: 60, duration: 6.2, ease: "sine.inOut" }, 0);
          tl.to("#g4-plane", { rotationX: 6, rotationY: 4, z: 0, duration: 1.2, ease: "power2.out" }, 6.2);

          // head driver: candle, camera, tag
          const head = { y: TOP + 10 };
          const cand = q("#g4-candle"), cam = q("#g4-cam"), tag = q("#g4-tag");
          const CAMY = 560;
          const drawHead = () => {
            const y = head.y;
            gsap.set(cand, { scaleY: Math.max(0.001, (y - TOP) / 2000) });
            gsap.set(cam, { y: -Math.max(0, y - CAMY) });
            gsap.set(tag, { y });
            tag.textContent = fmt(priceAt(y));
          };
          drawHead();
          const legs = [[0.3, P[0], BY[0], "power2.in"], [P[0], P[1], BY[1], "power1.in"], [P[1], P[2], BY[2], "power1.in"], [P[2], P[3], BY[3], "none"], [P[3], P[4], BY[4], "none"], [P[4], P[5], BY[5], "none"], [P[5], 6.2, BY[5] + 170, "power3.out"]];
          let prevY = TOP + 10;
          legs.forEach(([a, b, y, ease]) => { tl.fromTo(head, { y: prevY }, { y, duration: b - a, ease, onUpdate: drawHead, immediateRender: false }, a); prevY = y; });

          // shake (hash jitter, envelope)
          const hash = (n) => { const x = Math.sin(n * 91.7 + 17.3) * 43758.5453; return x - Math.floor(x); };
          const shk = q("#g4-shake");
          const shake = (t, amp, dur) => {
            const env = { a: 0 };
            tl.fromTo(env, { a: amp }, { a: 0, duration: dur, ease: "power2.out", immediateRender: false, onUpdate: () => { const s = Math.floor(tl.time() / 0.033); gsap.set(shk, { x: (hash(s) * 2 - 1) * env.a, y: (hash(s + 50) * 2 - 1) * env.a }); } }, t);
            tl.set(shk, { x: 0, y: 0 }, t + dur);
          };

          // Canvas 2D sparks: every burst is a pure function of time since its pierce
          const cv = q("#g4-sparks"), ctx = cv.getContext("2d");
          const SP = 70;
          const COLS = ["#fff4d6", "#ffe2e7", "#fb7f91", "#f6d78c", "#ffffff"];
          const camAt = (t) => { // mirrors head legs to know camera offset at any t
            let y = TOP + 10;
            for (const [a, b, yy, ease] of legs) {
              const y0 = y;
              if (t <= a) break;
              const k = Math.min(1, (t - a) / (b - a));
              const e = ease === "power2.in" ? k * k * k : ease === "power1.in" ? k * k : ease === "power3.out" ? 1 - Math.pow(1 - k, 4) : k; // GSAP powerN = degree N+1
              y = y0 + (yy - y0) * e;
              if (k < 1) break;
              y = yy;
            }
            return Math.max(0, y - CAMY);
          };
          const drawSparks = (t) => {
            ctx.clearRect(0, 0, 1920, 1080);
            ctx.globalCompositeOperation = "lighter";
            const camY = camAt(t);
            P.forEach((pt, i) => {
              const dt = t - pt;
              if (dt < 0 || dt > 1.4) return;
              const ox = 897, oy = BY[i] - camY;
              for (let k = 0; k < SP; k++) {
                const a = prand(i * 1000 + k) * Math.PI * 2;
                const sp = (380 + prand(i * 1000 + k + 7) * (700 + i * 140)) * (k % 5 === 0 ? 1.4 : 1);
                const life = 0.7 + prand(i * 1000 + k + 13) * 0.7;
                if (dt > life) continue;
                const e = 1 - Math.exp(-dt * 3.2);
                const x = ox + (Math.cos(a) * sp * e) / 3.2;
                const y = oy + (Math.sin(a) * sp * 0.55 * e) / 3.2 + 420 * dt * dt;
                const vx = Math.cos(a) * sp * Math.exp(-dt * 3.2), vy = Math.sin(a) * sp * 0.55 * Math.exp(-dt * 3.2) + 840 * dt;
                const al = 1 - dt / life;
                ctx.strokeStyle = COLS[(k + i) % COLS.length];
                ctx.globalAlpha = al;
                ctx.lineWidth = 2 + (k % 3);
                ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - vx * 0.03, y - vy * 0.03); ctx.stroke();
              }
            });
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
          };

          // tape rows arrive from depth; older rows slide down (absolute targets)
          const rowsWrap = q("#g4-rows");
          const TAPE = [];
          P.forEach((t, i) => {
            TAPE.push({ t, txt: `<span>00:${String(21 + i).padStart(2, "0")}</span><strong>LONG ${SZ[i]} BTC</strong><em>×${i + 1}</em>` });
            TAPE.push({ t: t + 0.1, txt: `<span>00:${String(21 + i).padStart(2, "0")}</span><strong>LONG ${(1.5 + prand(i * 4) * 8).toFixed(1)} BTC</strong><em>×${i + 1}</em>` });
          });
          const rowEls = TAPE.map((r) => { const el = document.createElement("div"); el.className = "g4-row"; el.innerHTML = r.txt; el.querySelectorAll("span,strong,em").forEach((x) => x.setAttribute("data-layout-allow-overlap", "")); rowsWrap.appendChild(el); return el; });
          TAPE.forEach((r, e) => {
            tl.fromTo(rowEls[e], { opacity: 0, z: -700, rotationY: -35, y: 0 }, { opacity: 1, z: 0, rotationY: 0, y: 0, duration: 0.35, ease: "expo.out", immediateRender: false }, r.t);
            for (let k = 0; k < e; k++) tl.to(rowEls[k], { y: (e - k) * 66, duration: 0.2, ease: "power3.out" }, r.t);
          });

          // counters (pure functions of time)
          const IGN = [420000, 970000, 1610000, 2180000, 2660000, 3120000];
          const ignEl = q("#g4-ign"), comboEl = q("#g4-combo");
          const drv = { t: 0 };
          tl.fromTo(drv, { t: 0 }, {
            t: D, duration: D, ease: "none",
            onUpdate: () => {
              const t = drv.t;
              let n = 0; P.forEach((p) => { if (t >= p) n++; });
              let v = 0;
              if (n) { const a = n > 1 ? IGN[n - 2] : 0, b = IGN[n - 1], k = Math.min(1, (t - P[n - 1]) / 0.3); v = a + (b - a) * (1 - Math.pow(1 - k, 3)); }
              ignEl.textContent = "$" + (v >= 1e6 ? (v / 1e6).toFixed(2) + "M" : v < 1000 ? "0" : Math.round(v / 1000) + "K");
              comboEl.textContent = "×" + Math.max(1, n);
              const dt = n ? t - P[n - 1] : 9;
              gsap.set(comboEl, { scale: 1 + Math.max(0, n - 1) * 0.04 + Math.max(-0.12, (0.9 + n * 0.25) * Math.exp(-dt * 11) * Math.cos(dt * 14)) });
              drawSparks(t);
            },
          }, 0);
          tl.fromTo("#g4-crow", { opacity: 0 }, { opacity: 1, duration: 0.15 }, P[0]);
          tl.fromTo("#g4-hud", { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.3);
          tl.fromTo("#g4-tapewrap", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "expo.out" }, 0.4);

          // detonations
          P.forEach((t, i) => {
            const band = bands[i];
            tl.to(band, { filter: "brightness(3)", duration: 0.06 }, t - 0.06);
            tl.to(band, { scaleY: 6, opacity: 0, duration: 0.45, ease: "expo.out" }, t);
            const ring = document.createElement("div"); ring.className = "g4-ring"; ring.style.left = "897px"; ring.style.top = BY[i] + "px"; fx.appendChild(ring);
            tl.fromTo(ring, { scale: 0.1, opacity: 1 }, { scale: 2.6 + i * 0.45, opacity: 0, duration: 0.7, ease: "expo.out", immediateRender: false }, t);
            const pop = document.createElement("div"); pop.className = "g4-pop"; pop.style.top = BY[i] - 120 + "px"; pop.textContent = `多單爆倉 ${SZ[i]} BTC`; fx.appendChild(pop);
            tl.fromTo(pop, { scale: 0.4, opacity: 0, x: -30 }, { scale: 1, opacity: 1, x: 0, duration: 0.3, ease: "back.out(2.4)", immediateRender: false }, t + 0.03);
            tl.to(pop, { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, t + Math.min(0.9, (P[i + 1] || t + 1.2) - t - 0.1));
            tl.fromTo("#g4-flash", { opacity: 0.3 + i * 0.08 }, { opacity: 0, duration: 0.38, ease: "power2.out", immediateRender: false }, t);
            shake(t, 8 + i * 4, 0.32 + i * 0.03);
          });

          // ×6 flies at the camera, then the payoff line
          const MEGA = 6.0;
          tl.fromTo("#g4-mega", { opacity: 0, scale: 0.5, z: 0 }, { opacity: 1, scale: 1.2, duration: 0.12, ease: "power2.out" }, MEGA - 0.12);
          tl.to("#g4-mega", { scale: 7, opacity: 0, filter: "blur(18px)", duration: 0.5, ease: "power3.in" }, MEGA);
          tl.fromTo("#g4-flash", { opacity: 0.95 }, { opacity: 0, duration: 0.6, immediateRender: false }, MEGA + 0.25);
          shake(MEGA, 22, 0.5);
          tl.fromTo("#g4-dim", { opacity: 0 }, { opacity: 1, duration: 0.3 }, MEGA + 0.2);
          tl.to(["#g4-hud", "#g4-tapewrap"], { opacity: 0, scale: 0.94, duration: 0.25 }, MEGA + 0.15);
          tl.fromTo("#g4-f1", { x: -260, opacity: 0, skewX: -16 }, { x: 0, opacity: 1, skewX: 0, duration: 0.35, ease: "expo.out" }, 6.5);
          tl.fromTo("#g4-f2", { scale: 1.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "power4.out", transformOrigin: "0 70%" }, 7.0);
          tl.fromTo("#g4-fp", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 7.6);
          tl.fromTo("#g4-final", { scale: 1 }, { scale: 1.04, duration: 3.2, ease: "none" }, 6.5);

          window.__timelines["g4-cascade"] = tl;
        })();
      </script>
    </template>
