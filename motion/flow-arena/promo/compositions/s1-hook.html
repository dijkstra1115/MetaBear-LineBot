      <script>
        (() => {
          const DUR = 5;
          const cues = JSON.parse(document.getElementById("s1-cues").dataset.cues);
          const ez = {
            lin: (x) => x,
            out3: (x) => 1 - Math.pow(1 - x, 3),
            in3: (x) => x * x * x,
            inout: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
          };
          const keys = (t, ks) => {
            if (t <= ks[0][0]) return ks[0][1];
            for (let i = 1; i < ks.length; i++) {
              if (t <= ks[i][0]) {
                const [t0, v0] = ks[i - 1];
                const [t1, v1, e] = ks[i];
                return v0 + (v1 - v0) * ez[e || "inout"]((t - t0) / (t1 - t0));
              }
            }
            return ks[ks.length - 1][1];
          };
          const pk = (t, t0, d) => (t < t0 ? 0 : Math.max(0, 1 - (t - t0) / d) ** 2);
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const fmt = (n, d = 0) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });

          // Price space
          const P0 = 99700, P1 = 100600, Y0 = 940, Y1 = 140;
          const yOf = (p) => Y0 - ((p - P0) * (Y0 - Y1)) / (P1 - P0);
          const pOf = (y) => P0 + ((Y0 - y) * (P1 - P0)) / (Y0 - Y1);

          const BANDS = [
            { p: 99770, s: 0.32 },
            { p: 99880, s: 0.18 },
            { p: 100170, s: 0.46 },
            { p: 100300, s: 0.28 },
            { p: 100450, s: 1.0, hot: true },
            { p: 100545, s: 0.55 },
          ];
          const heat = (t, a) => {
            const c = [92 + (255 - 92) * t, 64 + (214 - 64) * t, 170 + (102 - 170) * t].map(Math.round);
            return `rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)})`;
          };

          // Candle history (seeded)
          const candles = [];
          {
            const raw = [];
            let v = 99900;
            for (let i = 0; i < 47; i++) {
              v += 4 + (hash(i * 3.1) - 0.5) * 60;
              raw.push(v);
            }
            let prev = 99900;
            raw.forEach((r, i) => {
              const close = r + ((100080 - raw[46]) * (i + 1)) / 47;
              const open = prev;
              const hi = Math.max(open, close) + hash(i * 5.7) * 24;
              const lo = Math.min(open, close) - hash(i * 9.3) * 24;
              candles.push({ open, close, hi, lo });
              prev = close;
            });
          }

          // DOM: axis labels + liquidation map bars
          const axis = document.getElementById("s1-axis");
          const labels = [];
          for (let p = 99800; p <= 100500; p += 100) {
            const d = document.createElement("div");
            d.className = "s1-lab";
            d.style.top = yOf(p) + "px";
            d.innerHTML = `<span class="hl"></span><b>${fmt(p)}</b>`;
            axis.appendChild(d);
            labels.push(d);
          }
          const map = document.getElementById("s1-map");
          const bars = BANDS.map((b) => {
            const d = document.createElement("div");
            d.className = "s1-bar";
            d.style.top = yOf(b.p) + "px";
            d.style.width = 30 + b.s * 180 + "px";
            d.style.background = heat(b.s, 0.9);
            if (b.hot) d.style.boxShadow = "0 0 30px rgba(255,214,102,.8)";
            map.appendChild(d);
            return d;
          });

          const price = (t) => {
            const base = keys(t, [
              [0, 100080],
              [3.3, 100080],
              [4.4, 100450, "in3"],
              [5, 100470, "out3"],
            ]);
            const wob = t < 3.3 ? Math.sin(t * 7.1) * 9 + Math.sin(t * 13.7) * 5 : 0;
            return base + wob;
          };

          const ctx = document.getElementById("s1-canvas").getContext("2d");
          const pricetag = document.getElementById("s1-pricetag");
          const draw = (t) => {
            ctx.clearRect(0, 0, 1920, 1080);
            // grid
            ctx.strokeStyle = "rgba(151,175,181,0.08)";
            ctx.lineWidth = 2;
            for (let p = 99800; p <= 100500; p += 100) {
              ctx.beginPath();
              ctx.moveTo(90, yOf(p));
              ctx.lineTo(1450, yOf(p));
              ctx.stroke();
            }
            for (let x = 110; x < 1450; x += 216) {
              ctx.beginPath();
              ctx.moveTo(x, 120);
              ctx.lineTo(x, 960);
              ctx.stroke();
            }
            // heat bands
            const pulse = 0.5 + 0.5 * Math.sin(t * 6);
            const boomT = t - 4.4;
            BANDS.forEach((b) => {
              let a = 0.1 + b.s * 0.42;
              let h = 14 + b.s * 16;
              if (b.hot) {
                a += pulse * 0.12 + (t > 1.85 && t < 4.4 ? 0.15 : 0);
                if (boomT > 0) {
                  a = Math.max(0, 1 - boomT * 1.4);
                  h += boomT * 160;
                }
              }
              ctx.save();
              if (b.hot) {
                ctx.shadowColor = "rgba(255,214,102,0.9)";
                ctx.shadowBlur = 40;
              }
              ctx.fillStyle = boomT > 0 && b.hot ? `rgba(255,240,200,${a.toFixed(3)})` : heat(b.s, a);
              ctx.fillRect(90, yOf(b.p) - h / 2, 1540, h);
              ctx.restore();
            });
            // candles
            const cw = 16;
            candles.forEach((c, i) => {
              const x = 110 + i * 27;
              const up = c.close >= c.open;
              ctx.strokeStyle = ctx.fillStyle = up ? "#70e6c9" : "#fb7f91";
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(x + cw / 2, yOf(c.hi));
              ctx.lineTo(x + cw / 2, yOf(c.lo));
              ctx.stroke();
              const y1 = yOf(Math.max(c.open, c.close));
              const y2 = yOf(Math.min(c.open, c.close));
              ctx.fillRect(x, y1, cw, Math.max(3, y2 - y1));
            });
            // live candle
            const p = price(t);
            const lx = 110 + 47 * 27;
            const open = 100080;
            const hi = Math.max(open, p) + 6;
            ctx.strokeStyle = ctx.fillStyle = p >= open ? "#70e6c9" : "#fb7f91";
            ctx.save();
            if (t > 3.3) {
              ctx.shadowColor = "#70e6c9";
              ctx.shadowBlur = 30;
            }
            ctx.beginPath();
            ctx.moveTo(lx + cw / 2, yOf(hi));
            ctx.lineTo(lx + cw / 2, yOf(Math.min(open, p) - 10));
            ctx.stroke();
            ctx.fillRect(lx, yOf(Math.max(open, p)), cw, Math.max(3, yOf(Math.min(open, p)) - yOf(Math.max(open, p))));
            ctx.restore();
            // last-price line
            ctx.setLineDash([10, 8]);
            ctx.strokeStyle = "rgba(242,197,117,0.8)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(90, yOf(p));
            ctx.lineTo(1452, yOf(p));
            ctx.stroke();
            ctx.setLineDash([]);
            // blast particles
            if (boomT > 0) {
              for (let k = 0; k < 70; k++) {
                const ang = hash(k * 1.7) * Math.PI * 2;
                const sp = 300 + hash(k * 2.9) * 900;
                const r = sp * Math.min(boomT, 0.6) * (1 - boomT * 0.4);
                const px = lx + cw / 2 + Math.cos(ang) * r;
                const py = yOf(100450) + Math.sin(ang) * r * 0.55;
                ctx.fillStyle = `rgba(255,${180 + Math.round(hash(k) * 60)},90,${Math.max(0, 1 - boomT * 1.6).toFixed(3)})`;
                ctx.fillRect(px, py, 5, 5);
              }
            }
            pricetag.style.transform = `translateY(${yOf(p)}px)`;
            pricetag.textContent = fmt(p, 2);
          };

          // cursor path (x,y) keyed; also drives crosshair readout
          const curKeys = {
            x: [[0, 1760], [0.35, 1760], [0.6, 1530, "out3"], [1.85, 1530], [2.9, 1530], [3.12, 1280, "inout"], [5, 1280]],
            y: [[0, 1150], [0.35, 1150], [0.6, 880, "out3"], [1.56, 228, "lin"], [1.85, 273, "out3"], [2.9, 273], [3.12, 975, "inout"], [5, 975]],
          };
          const cursor = document.getElementById("s1-curpos");
          const cross = document.getElementById("s1-cross");
          const crosstag = document.getElementById("s1-crosstag");
          const fuel = document.getElementById("s1-fuel");
          const render = (t) => {
            draw(t);
            const cx = keys(t, curKeys.x);
            const cy = keys(t, curKeys.y);
            cursor.style.transform = `translate(${cx - 4}px, ${cy - 4}px)`;
            const onAxis = t > 0.55 && t < 2.95;
            cross.style.opacity = onAxis ? 1 : 0;
            crosstag.style.opacity = onAxis ? 1 : 0;
            cross.style.transform = `translateY(${cy}px)`;
            crosstag.style.transform = `translateY(${cy}px)`;
            crosstag.textContent = fmt(Math.round(pOf(cy) / 10) * 10);
            fuel.style.transform = `scaleX(${keys(t, [[1.9, 0], [2.6, 0.92, "out3"]])})`;
            // transient pulses are pure functions of t (seek-safe in both directions)
            cues.hover.forEach((h, i) => {
              const k = pk(t, h, 0.45);
              labels[i].querySelector(".hl").style.opacity = k;
              labels[i].querySelector("b").style.color = k > 0.5 ? "#08231f" : "#97afb5";
              labels[i].style.transform = `scale(${1 + 0.16 * k})`;
              labels[i].style.opacity = Math.abs(99800 + i * 100 - price(t)) < 40 ? 0 : 1;
            });
            bars[4].style.transform = `scaleY(${1 + 1.6 * pk(t, cues.lock[0], 0.5)})`;
            const hb = document.querySelector("#s1-buy .hl");
            hb.style.opacity = t < cues.hoverBtn[0] ? 0 : t < cues.click[0] ? 0.35 : 0.9 * pk(t, cues.click[0], 0.6);
            document.getElementById("s1-buy").style.transform = `scale(${1 - 0.07 * pk(t, cues.click[0], 0.3)})`;
            document.getElementById("s1-cursor").style.transform = `scale(${1 - 0.2 * pk(t, cues.click[0], 0.2)})`;
            const rp = t >= cues.click[0] ? Math.min(1, (t - cues.click[0]) / 0.5) : 1;
            const ripple = document.getElementById("s1-ripple");
            ripple.style.opacity = 1 - rp;
            ripple.style.transform = `translate(1280px, 975px) scale(${0.2 + 1.6 * ez.out3(rp)})`;
            document.getElementById("s1-flash").style.opacity = Math.max(0.85 * pk(t, 4.4, 0.3), keys(t, [[4.7, 0], [5.0, 1, "in3"]]));
          };
          const drive = { t: 0 };
          render(0);

          const tl = gsap.timeline({ paused: true });
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drive.t) }, 0);

          // camera: focus pull, slow drift, punch on the blast
          tl.fromTo("#s1-cam", { scale: 1.22, filter: "blur(14px) brightness(0.3)" }, { scale: 1.05, filter: "blur(0px) brightness(1)", duration: 0.8, ease: "power3.out" }, 0);
          tl.to("#s1-cam", { scale: 1.0, duration: 3.5, ease: "sine.inOut" }, 0.8);
          tl.to("#s1-cam", { scale: 1.1, duration: 0.5, ease: "power4.out" }, 4.4);
          [0, 1, 2, 3, 4, 5].forEach((k) => {
            tl.to("#s1-cam", { x: (hash(k + 1) - 0.5) * 40, y: (hash(k + 9) - 0.5) * 30, duration: 0.04, ease: "none" }, 4.4 + k * 0.04);
          });
          tl.to("#s1-cam", { x: 0, y: 0, duration: 0.08 }, 4.64);

          // label hover blips
          // lock onto the hottest band
          const hot = bars[4];
          tl.fromTo("#s1-tip", { opacity: 0, x: 40, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(2)" }, 1.9);
          tl.to("#s1-tip", { opacity: 0, x: -30, duration: 0.25, ease: "power2.in" }, 3.0);

          // slam copy
          tl.fromTo("#s1-eyebrow", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 2.0);
          tl.fromTo("#s1-l1", { opacity: 0, scale: 1.6, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.4, ease: "power4.out" }, cues.slam[0]);
          tl.fromTo("#s1-l2", { opacity: 0, x: -260 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, cues.slam[1]);
          gsap.set(["#s1-l1", "#s1-l2", "#s1-eyebrow"], { transformOrigin: "0% 50%" });

          // order bar, hover, click
          tl.fromTo("#s1-order", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.8);
          tl.to("#s1-order", { opacity: 0, y: 60, duration: 0.3, ease: "power2.in" }, 4.1);

          // blast
          tl.fromTo("#s1-ticker", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.5)" }, 4.45);

          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
