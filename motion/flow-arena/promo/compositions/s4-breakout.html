      <script>
        (() => {
          const DUR = 9;
          const cues = JSON.parse(document.getElementById("s4-cues").dataset.cues);
          const ez = {
            lin: (x) => x,
            out3: (x) => 1 - Math.pow(1 - x, 3),
            in3: (x) => x * x * x,
            inout: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
          };
          const keys = (t, ks) => {
            if (t <= ks[0][0]) return ks[0][1];
            for (let i = 1; i < ks.length; i++) {
              if (t <= ks[i][0]) {
                const [t0, v0] = ks[i - 1];
                const [t1, v1, e] = ks[i];
                return v0 + (v1 - v0) * ez[e || "inout"]((t - t0) / (t1 - t0));
              }
            }
            return ks[ks.length - 1][1];
          };
          const pk = (t, t0, d) => (t < t0 ? 0 : Math.max(0, 1 - (t - t0) / d) ** 2);
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const fmt = (n, d = 0) => n.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
          const $ = (id) => document.getElementById(id);

          const PX = 110, PY = 110;
          const asks = [100860, 100720, 100580, 100440, 100300, 100180];
          const askSz = [900, 760, 640, 560, 480, 420];
          const bids = [100080, 100020, 99960];
          const bidSz = [380, 460, 520];
          const host = $("s4-rows");
          const mk = (price, size, side, top) => {
            const d = document.createElement("div");
            d.className = "s4-row " + side;
            d.style.top = top + "px";
            d.innerHTML = `<span class="bar"></span><span class="fl"></span><b>${fmt(price)}.0</b><i>${fmt(size)}</i>`;
            host.appendChild(d);
            return { d, bar: d.querySelector(".bar"), fl: d.querySelector(".fl"), sz: d.querySelector("i"), size };
          };
          const askRows = asks.map((p, i) => mk(p, askSz[i], "ask", 84 + i * 50));
          // eaten rows tear off the book and fly at the viewer
          const flyers = asks.map((p, i) => {
            const d = document.createElement("div");
            d.className = "s4-row ask";
            d.style.left = PX + 14 + "px";
            d.style.top = PY + 84 + i * 50 + "px";
            d.innerHTML = `<b>${fmt(p)}.0</b><i>吃掉 ${fmt(Math.round(askSz[i] * 0.2))}</i>`;
            d.setAttribute("data-layout-ignore", "");
            $("s4-flyers").appendChild(d);
            return d;
          });
          bids.forEach((p, i) => {
            const r = mk(p, bidSz[i], "bid", 484 + i * 50);
            r.bar.style.transform = `scaleX(${bidSz[i] / 1000})`;
          });
          // streaks for the price rocket
          const sh = $("s4-streaks");
          const streaks = [];
          for (let i = 0; i < 16; i++) {
            const d = document.createElement("div");
            d.className = "s4-streak";
            sh.appendChild(d);
            streaks.push({ d, x: PX + 30 + hash(i * 3.7) * 860, sp: 900 + hash(i * 5.1) * 1400, o: hash(i * 2.2) });
          }

          const qtys = [...document.querySelectorAll(".s4-qty")];
          const qx = [209, 371, 533, 695];
          const QY = PY + 705 + 30;
          const BX = 346, BY = PY + 790 + 36;
          const curKeys = {
            x: [[0, 900], [2.0, 900], [2.3, qx[0], "out3"], [2.45, qx[1]], [2.6, qx[2]], [2.75, qx[3]], [2.9, qx[2]], [3.2, qx[2]], [3.35, BX, "out3"], [4.2, BX], [5.0, 560, "inout"], [9, 580]],
            y: [[0, 1150], [2.0, 1150], [2.3, QY, "out3"], [3.2, QY], [3.35, BY, "out3"], [4.2, BY], [5.0, 1010, "inout"], [9, 1020]],
          };
          const shrinkAt = (i) => cues.shrink[0] + (asks.length - 1 - i) * 0.12;
          const lastPrice = (t) => {
            let p = 100120 + Math.sin(t * 5) * 4;
            cues.eat.forEach((e, k) => {
              if (t >= e) p = keys(t, [[e, k === 0 ? 100120 : asks[asks.length - k]], [e + 0.12, asks[asks.length - 1 - k], "out3"]]);
            });
            return p;
          };

          const render = (t) => {
            const cx = keys(t, curKeys.x);
            const cy = keys(t, curKeys.y);
            $("s4-curpos").style.transform = `translate(${cx - 4}px, ${cy - 4}px)`;
            let press = 0;
            cues.click.forEach((c) => (press = Math.max(press, pk(t, c, 0.22))));
            $("s4-cursor").style.transform = `scale(${1 - 0.2 * press})`;
            const lc = cues.click.filter((c) => t >= c).pop();
            const rp = lc === undefined ? 1 : Math.min(1, (t - lc) / 0.5);
            const rpos = lc === cues.click[0] ? [qx[2], QY] : [BX, BY];
            $("s4-ripple").style.opacity = 1 - rp;
            $("s4-ripple").style.transform = `translate(${rpos[0]}px, ${rpos[1]}px) scale(${0.2 + (lc === cues.click[1] ? 2.6 : 1.6) * ez.out3(rp)})`;

            // qty hovers; 2,500 selected after first click
            qtys.forEach((q, i) => {
              let h = 0;
              cues.hover.slice(0, 5).forEach((hv, k) => {
                const target = [0, 1, 2, 3, 2][k];
                if (target === i) h = Math.max(h, pk(t, hv, 0.4));
              });
              const sel = i === 2 && t >= cues.click[0];
              q.querySelector(".hl").style.opacity = sel ? 0.9 : h * 0.85;
              q.style.color = sel || h > 0.5 ? "#08231f" : "#e8f3ef";
              q.style.transform = `scale(${1 + 0.1 * h})`;
            });
            const bh = t >= cues.hover[5] && t < cues.click[1] ? 0.35 : 0.9 * pk(t, cues.click[1], 0.7);
            document.querySelector("#s4-buy .hl").style.opacity = bh;
            $("s4-buy").style.transform = `scale(${1 - 0.07 * pk(t, cues.click[1], 0.3)})`;
            $("s4-preview").style.opacity = t >= cues.click[0] ? Math.min(1, (t - cues.click[0]) / 0.2) : 0;

            // asks thin out, then get eaten nearest-first
            let depth = 0;
            askRows.forEach((r, i) => {
              const sk = t < shrinkAt(i) ? 1 : 1 - 0.8 * ez.out3(Math.min(1, (t - shrinkAt(i)) / 0.35));
              const size = Math.round(r.size * sk);
              const e = cues.eat[asks.length - 1 - i];
              const eaten = t >= e;
              r.bar.style.transform = `scaleX(${eaten ? 0 : (r.size / 1000) * sk})`;
              r.sz.textContent = eaten ? "—" : fmt(size);
              r.fl.style.opacity = 0.85 * pk(t, e, 0.25);
              r.d.style.opacity = eaten ? 0.18 + 0.82 * pk(t, e, 0.25) : 1;
              if (!eaten) depth += size;
              r.d.style.transform = `translateX(${sk < 1 && t < shrinkAt(i) + 0.35 ? (hash(Math.floor(t * 30) + i) - 0.5) * 8 : 0}px)`;
            });
            $("s4-depthv").textContent = `${fmt(Math.round(depth))} BTC`;
            flyers.forEach((d, i) => {
              const e = cues.eat[asks.length - 1 - i];
              const u = t - e;
              if (u < 0 || u > 0.75) {
                d.style.opacity = 0;
                return;
              }
              const k = u / 0.75;
              d.style.opacity = 1 - k * k;
              d.style.transform = `translate3d(${(i - 2.5) * 160 * k}px, ${-60 * k}px, ${1100 * ez.in3(Math.min(1, k * 1.15))}px) rotateX(${-35 * k}deg) rotateZ(${(i % 2 ? 1 : -1) * 12 * k}deg)`;
            });
            // price
            const lp = lastPrice(t);
            $("s4-last").textContent = fmt(lp, 1);
            const rising = t >= cues.eat[0];
            $("s4-last").style.color = rising ? "#70e6c9" : "#f2c575";
            $("s4-last").style.textShadow = rising ? `0 0 ${20 + 40 * pk(t, cues.eat[cues.eat.length - 1], 0.6)}px #70e6c9` : "none";
            $("s4-arrow").textContent = rising ? "▲" : "";
            // rocket streaks during the eat window
            const sw = t >= cues.eat[0] && t < cues.eat[5] + 0.4;
            streaks.forEach((s, i) => {
              const tt = t - cues.eat[0] - s.o * 0.3;
              const y = PY + 300 - ((tt * s.sp) % 220);
              s.d.style.opacity = sw && tt > 0 ? 0.8 * (1 - Math.max(0, t - cues.eat[5]) / 0.4) : 0;
              s.d.style.transform = `translate(${s.x}px, ${y}px)`;
            });
            // news banner shake at arrival
            $("s4-news").style.transform = `translateX(${(hash(Math.floor(t * 30)) - 0.5) * 18 * pk(t, cues.alarm[0], 0.4)}px)`;
            // stamp
            const sIn = t >= cues.stamp[0] ? Math.min(1, (t - cues.stamp[0]) / 0.2) : 0;
            $("s4-stamp").style.opacity = sIn;
            $("s4-stamp").style.transform = `scale(${1 + 1.2 * (1 - ez.out3(sIn))}) rotate(-8deg)`;
            // teaser band
            const bIn = t >= cues.band[0] ? Math.min(1, (t - cues.band[0]) / 0.4) : 0;
            const pulse = 0.75 + 0.25 * Math.sin((t - cues.band[0]) * 9);
            $("s4-band").style.opacity = bIn * pulse;
            $("s4-bandlab").style.opacity = bIn;
          };
          const drive = { t: 0 };
          render(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drive.t) }, 0);
          tl.fromTo("#s4-panel", { opacity: 0, x: -260, rotationY: 38, transformPerspective: 1800 }, { opacity: 1, x: 0, rotationY: 0, duration: 0.75, ease: "expo.out" }, 0);
          tl.fromTo("#s4-chip", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.05);
          tl.fromTo("#s4-num", { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.45, ease: "circ.out" }, 0.1);
          tl.fromTo("#s4-title", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.25);
          tl.fromTo("#s4-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 0.5);
          tl.fromTo("#s4-news", { y: -110 }, { y: 0, duration: 0.3, ease: "back.out(2)" }, cues.alarm[0]);
          tl.to("#s4-news", { y: -110, duration: 0.3, ease: "power2.in" }, 6.0);
          tl.fromTo("#s4-depth", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.1);
          tl.fromTo("#s4-cost", { opacity: 0 }, { opacity: 1, duration: 0.2 }, cues.bar[0]);
          tl.fromTo("#s4-c1", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, cues.bar[0]);
          tl.fromTo("#s4-c2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, cues.bar[0] + 0.35);
          // exit: camera tilts up toward the band
          tl.to("#s4-world", { y: 420, scale: 0.92, opacity: 0, filter: "blur(10px)", duration: 0.5, ease: "power3.in" }, 8.5);
          window.__timelines["s4-breakout"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
