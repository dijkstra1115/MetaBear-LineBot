      <script>
        (() => {
          const DUR = 12;
          const cues = JSON.parse(document.getElementById("s9-cues").dataset.cues);
          const PATH = JSON.parse(document.getElementById("s9-path").dataset.path).path;
          const ez = {
            lin: (x) => x,
            out3: (x) => 1 - Math.pow(1 - x, 3),
            out5: (x) => 1 - Math.pow(1 - x, 5),
            in3: (x) => x * x * x,
            inout: (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2),
          };
          const keys = (t, ks) => {
            if (t <= ks[0][0]) return ks[0][1];
            for (let i = 1; i < ks.length; i++) {
              if (t <= ks[i][0]) {
                const [t0, v0] = ks[i - 1];
                const [t1, v1, e] = ks[i];
                return v0 + (v1 - v0) * ez[e || "inout"]((t - t0) / (t1 - t0));
              }
            }
            return ks[ks.length - 1][1];
          };
          const pk = (t, t0, d) => (t < t0 ? 0 : Math.max(0, 1 - (t - t0) / d) ** 2);
          const win = (t, a, b, fi = 0.25, fo = 0.2) => (t < a || t > b ? 0 : Math.min(1, (t - a) / fi, (b - t) / fo));
          const $ = (id) => document.getElementById(id);
          // scene time -> recording time (clip B skips 1s of mouse travel)
          const src = (s) => (s < 2.6 ? s : s + 1.0);
          const cursorAt = (tt) => {
            if (tt <= PATH[0][0]) return PATH[0];
            for (let i = 1; i < PATH.length; i++) {
              if (tt <= PATH[i][0]) {
                const a = PATH[i - 1], b = PATH[i];
                const k = (tt - a[0]) / (b[0] - a[0]);
                return [tt, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
              }
            }
            return PATH[PATH.length - 1];
          };
          // camera: scale S centred on (fx, fy) of the recording, plus a 3D tilt
          const CAM = {
            S: [[0, 0.6], [1.1, 0.8, "out3"], [1.3, 0.8], [2.1, 1.35, "inout"], [2.55, 1.35], [2.62, 2.1, "out5"], [4.6, 2.1], [5.3, 2.1], [5.75, 1.02, "out5"], [9.4, 1.15, "inout"], [9.9, 2.0, "out5"], [10.3, 2.0], [10.8, 1.3, "out3"], [11.4, 1.3], [12, 3.2, "in3"]],
            fx: [[0, 960], [1.3, 960], [2.1, 1120, "inout"], [2.55, 1120], [2.62, 440, "out5"], [4.4, 540, "inout"], [4.6, 560], [5.3, 1266, "inout"], [5.75, 1000, "out5"], [9.4, 1060, "inout"], [9.9, 1541, "out5"], [10.3, 1541], [10.8, 900, "out3"], [12, 880, "in3"]],
            fy: [[0, 540], [1.3, 540], [2.1, 540, "inout"], [2.55, 540], [2.62, 935, "out5"], [4.6, 935], [5.3, 935], [5.75, 560, "out5"], [9.4, 520, "inout"], [9.9, 935, "out5"], [10.3, 935], [10.8, 540, "out3"], [12, 513, "in3"]],
            rx: [[0, 32], [1.1, 0, "out3"], [1.3, 0], [2.1, 8, "inout"], [2.55, 8], [2.62, 0, "out5"], [5.3, 0], [5.75, 14, "out5"], [9.4, 6, "inout"], [9.9, 0, "out5"], [10.8, 6, "out3"], [12, 0]],
            ry: [[0, -30], [1.1, 0, "out3"], [1.3, 0], [2.1, -10, "inout"], [2.55, -10], [2.62, 0, "out5"], [5.3, 0], [5.75, -16, "out5"], [9.4, 12, "inout"], [9.9, 0, "out5"], [10.8, -8, "out3"], [12, 0]],
          };
          const steps = [
            ["s9-st1", 1.1, 2.55],
            ["s9-st2", 2.75, 4.55],
            ["s9-st3", 4.75, 9.4],
            ["s9-st4", 9.6, 11.5],
          ];
          const keyEls = [["s9-k1", cues.key[0]], ["s9-k2", cues.key[1]], ["s9-k3", cues.key[2]]];
          const pops = [["s9-p1", cues.pop[0], 8.2, -380, 40], ["s9-p2", cues.pop[1], 9.3, -120, 300], ["s9-p3", cues.pop[2], 11.6, -220, 260]];

          const render = (t) => {
            const S = keys(t, CAM.S), fx = keys(t, CAM.fx), fy = keys(t, CAM.fy);
            $("s9-win").style.transform = `translate(${960 - fx * S}px, ${560 - fy * S}px) scale(${S})`;
            $("s9-tilt").style.transform = `rotateX(${keys(t, CAM.rx)}deg) rotateY(${keys(t, CAM.ry)}deg)`;
            $("s9-win").style.borderRadius = `${18 / S}px`;
            $("s9-sheen").style.opacity = win(t, 0.2, 1.3, 0.2, 0.3);
            $("s9-sheen").style.transform = `translateX(${-400 + 2600 * Math.min(1, Math.max(0, (t - 0.2) / 1.1))}px) rotate(18deg)`;
            // recorded cursor + hover/click pulses
            const c = cursorAt(src(t));
            $("s9-curpos").style.transform = `translate(${c[1] - 3}px, ${c[2] - 3}px) scale(${1 / Math.max(1, S * 0.75)})`;
            let press = 0;
            cues.click.forEach((k) => (press = Math.max(press, pk(t, k, 0.22))));
            $("s9-cursor").style.transform = `scale(${1 - 0.22 * press})`;
            const lc = cues.click.filter((k) => t >= k).pop();
            const rp = lc === undefined ? 1 : Math.min(1, (t - lc) / 0.45);
            $("s9-ring").style.opacity = (1 - rp) * 0.9;
            $("s9-ring").style.transform = `translate(${c[1]}px, ${c[2]}px) scale(${0.3 + 1.4 * ez.out3(rp)})`;
            // step cards
            steps.forEach(([id, a, b], i) => {
              const k = win(t, a, b, 0.25, 0.18);
              const inK = ez.out5(Math.min(1, Math.max(0, (t - a) / 0.35)));
              $(id).style.opacity = k;
              $(id).style.transform = `perspective(1200px) translateX(${(1 - inK) * -160}px) rotateY(${(1 - inK) * 35}deg)`;
            });
            // keycaps fly out of the screen at the viewer
            keyEls.forEach(([id, k0]) => {
              const u = t - k0;
              const el = $(id);
              if (u < -0.18 || u > 0.75) {
                el.style.opacity = 0;
                return;
              }
              const z = keys(u, [[-0.18, -1600], [0.0, -60, "out3"], [0.2, 0, "out3"], [0.75, 1150, "in3"]]);
              el.style.opacity = u < 0.55 ? 1 : Math.max(0, 1 - (u - 0.55) / 0.2);
              el.style.transform = `translate3d(0, ${u > 0 ? -u * 120 : 0}px, ${z}px) rotateX(${18 - u * 10}deg) rotateY(${-22 + u * 30}deg) scaleY(${1 - 0.12 * pk(t, k0, 0.15)})`;
            });
            // cards peel out of the gameplay toward the camera, then float
            pops.forEach(([id, a, b, fxo, fyo]) => {
              const el = $(id);
              const u = t - a;
              if (u < 0 || t > b + 0.25) {
                el.style.opacity = 0;
                return;
              }
              const z = keys(u, [[0, -900], [0.22, 260, "out3"], [0.8, 80, "out5"], [3, 60]]);
              const ry = keys(u, [[0, 40], [0.22, -14, "out3"], [0.8, -8], [3, -4]]);
              el.style.opacity = Math.min(1, u / 0.1) * (t > b ? Math.max(0, 1 - (t - b) / 0.25) : 1);
              el.style.transform = `translate3d(${fxo * ez.out3(Math.min(1, u / 0.8))}px, ${fyo * ez.out3(Math.min(1, u / 0.8))}px, ${z}px) rotateY(${ry}deg) rotateX(${keys(u, [[0, 20], [0.8, 4]])}deg)`;
            });
            $("s9-chip").style.opacity = win(t, 0.4, 11.4, 0.3, 0.3);
            $("s9-flash").style.opacity = Math.max(0.5 * pk(t, 2.6, 0.2), 0.35 * pk(t, cues.boom[0][0], 0.2), keys(t, [[11.55, 0], [12, 0.85, "in3"]]));
          };
          const drive = { t: 0 };
          render(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drive.t) }, 0);
          window.__timelines["s9-howto"] = tl;
        })();
      </script>
