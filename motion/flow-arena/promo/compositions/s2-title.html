<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Noto Sans TC";
          src: url("assets/fonts/NotoSansTC-sub.ttf") format("truetype");
          font-weight: 100 900;
          font-display: block;
        }
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #08121b;
          color: #e8f3ef;
          font-family: "Noto Sans TC", sans-serif;
        }
        #s2-glow {
          position: absolute;
          left: 360px;
          top: 40px;
          width: 1200px;
          height: 1000px;
          border-radius: 50%;
          background: radial-gradient(circle, #1d6b5e88 0%, #13424b44 40%, #08121b00 70%);
        }
        #s2-streaks {
          position: absolute;
          inset: 0;
        }
        .s2-streak {
          position: absolute;
          left: 0;
          top: 0;
          height: 10px;
          border-radius: 6px;
        }
        #s2-grid {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(#97afb512 2px, transparent 2px), linear-gradient(90deg, #97afb512 2px, transparent 2px);
          background-size: 120px 120px;
          background-position: -2px -2px;
        }
        #s2-stack {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .s2-eyebrow {
          display: flex;
          align-items: center;
          gap: 16px;
          font: 700 26px "JetBrains Mono", monospace;
          letter-spacing: 0.3em;
          color: #70e6c9;
        }
        .s2-eyebrow i {
          display: block;
          width: 14px;
          height: 14px;
          border-radius: 50%;
          background: #70e6c9;
          box-shadow: 0 0 20px #70e6c9;
        }
        #s2-word {
          position: relative;
          width: 1640px;
          height: 290px;
          margin-top: 18px;
        }
        .s2-copy {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: "Archivo Black", sans-serif;
          font-size: 250px;
          line-height: 1;
          letter-spacing: -0.02em;
          white-space: nowrap;
        }
        .s2-copy em {
          font-style: normal;
          color: #70e6c9;
          margin-left: 0.22em;
        }
        .s2-ch {
          display: inline-block;
        }
        .s2-copy.base {
          color: #eef8f4;
          text-shadow: 0 0 60px #70e6c955;
        }
        .s2-copy.warm {
          color: #fb7f91;
          mix-blend-mode: screen;
          opacity: 0;
        }
        .s2-copy.warm em {
          color: #fb7f91;
        }
        .s2-copy.cool {
          color: #7fd8ff;
          mix-blend-mode: screen;
          opacity: 0;
        }
        .s2-copy.cool em {
          color: #7fd8ff;
        }
        .s2-sub {
          display: flex;
          align-items: baseline;
          gap: 40px;
          margin-top: 22px;
        }
        .s2-sub b {
          font: 700 44px "JetBrains Mono", monospace;
          letter-spacing: 0.34em;
          color: #97afb5;
        }
        .s2-sub strong {
          font-size: 96px;
          font-weight: 900;
          letter-spacing: 0.02em;
          color: #f2c575;
          text-shadow: 0 0 40px #f2c57566;
        }
        .s2-corner {
          position: absolute;
          font: 700 22px "JetBrains Mono", monospace;
          letter-spacing: 0.16em;
          color: #69818a;
        }
        .s2-rule {
          position: absolute;
          left: 140px;
          top: 830px;
          width: 1640px;
          height: 3px;
          background: linear-gradient(90deg, #70e6c900, #70e6c9, #f2c575, #70e6c900);
          transform-origin: 50% 50%;
        }
      </style>

      <div id="root" data-composition-id="s2-title" data-width="1920" data-height="1080">
        <div id="s2-cues" hidden data-cues='{"glitch":[0,1.0,2.0],"whoosh":[2.55]}'></div>
        <div id="s2-grid"></div>
        <div id="s2-glow"></div>
        <div id="s2-streaks"></div>
        <div id="s2-stack">
          <div class="s2-eyebrow" id="s2-eyebrow"><i></i>METABEAR 互動學院 · BTC 永續合約</div>
          <div id="s2-word">
            <div class="s2-copy warm" aria-hidden="true" data-layout-ignore>FLOW<em>ARENA</em></div>
            <div class="s2-copy cool" aria-hidden="true" data-layout-ignore>FLOW<em>ARENA</em></div>
            <div class="s2-copy base" id="s2-base"><span class="s2-ch">F</span><span class="s2-ch">L</span><span class="s2-ch">O</span><span class="s2-ch">W</span><em><span class="s2-ch">A</span><span class="s2-ch">R</span><span class="s2-ch">E</span><span class="s2-ch">N</span><span class="s2-ch">A</span></em></div>
          </div>
          <div class="s2-sub" id="s2-sub"><b>LIQUIDATION HUNT</b><strong>爆倉獵場</strong></div>
        </div>
        <div class="s2-rule" id="s2-rule"></div>
        <div class="s2-corner" id="s2-c1" style="left: 64px; top: 56px">FLOW ARENA · V7</div>
        <div class="s2-corner" id="s2-c2" style="right: 64px; top: 56px">SIMULATED BTC/USDT PERP</div>
        <div class="s2-corner" id="s2-c3" style="left: 64px; bottom: 56px">120s / ROUND</div>
        <div class="s2-corner" id="s2-c4" style="right: 64px; bottom: 56px">2–4 PLAYERS</div>
      </div>

      <script>
        (() => {
          const DUR = 3;
          const cues = JSON.parse(document.getElementById("s2-cues").dataset.cues);
          const hash = (n) => {
            const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
            return x - Math.floor(x);
          };
          const heat = (t, a) => {
            const c = [92 + (255 - 92) * t, 64 + (214 - 64) * t, 170 + (102 - 170) * t].map(Math.round);
            return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
          };
          // heat streaks racing right-to-left
          const host = document.getElementById("s2-streaks");
          const streaks = [];
          for (let i = 0; i < 18; i++) {
            const d = document.createElement("div");
            d.className = "s2-streak";
            const s = hash(i * 4.3);
            const w = 300 + hash(i * 2.1) * 900;
            d.style.width = w + "px";
            d.style.height = 6 + s * 16 + "px";
            d.style.top = 60 + hash(i * 7.7) * 960 + "px";
            d.style.background = `linear-gradient(90deg, ${heat(s, 0)}, ${heat(s, 0.85)} 70%, ${heat(Math.min(1, s + 0.2), 1)})`;
            d.style.boxShadow = s > 0.7 ? "0 0 30px rgba(255,214,102,.6)" : "none";
            host.appendChild(d);
            streaks.push({ d, speed: 1800 + hash(i * 9.1) * 2600, off: hash(i * 1.3) * 2400, w });
          }
          const copies = [...document.querySelectorAll("#s2-word .s2-copy")];
          const bursts = cues.glitch.filter((t) => t > 0.5).map((t) => ({ t, d: 0.16 }));
          const chars = [...document.querySelectorAll("#s2-base .s2-ch")];
          const render = (t) => {
            streaks.forEach((s) => {
              const x = 2000 + s.off - s.speed * t;
              const xx = ((x % 3400) + 3400) % 3400 - 1300;
              s.d.style.transform = `translateX(${xx}px)`;
            });
            // chromatic jitter, quantized to 1/20s
            let amp = 0;
            bursts.forEach((b) => {
              if (t >= b.t && t < b.t + b.d) amp = Math.max(amp, 1 - (t - b.t) / b.d);
            });
            const step = Math.floor(t * 20);
            copies.forEach((el, layer) => {
              if (layer === 2) return;
              const jx = (hash(step * 13 + layer * 7) * 2 - 1) * 26 * amp;
              const jy = (hash(step * 29 + layer * 11) * 2 - 1) * 9 * amp;
              el.style.opacity = amp > 0 ? 0.85 : 0;
              el.style.transform = `translate(${jx}px, ${jy}px)`;
            });
            // slice displacement on entrance
            const base = document.getElementById("s2-base");
            const e = t < 0.5 ? 1 - Math.floor(t * 15) / 7.5 : 0;
            base.style.clipPath = "none";
            base.style.transform = "none";
            // letters punch out of the screen toward the viewer, then slam into place
            chars.forEach((c, i) => {
              const u = Math.min(1, Math.max(0, (t - 0.03 * i) / 0.32));
              const k = 1 - Math.pow(1 - u, 4);
              c.style.opacity = u > 0 ? Math.min(1, u * 3) : 0;
              c.style.transform = `perspective(900px) translateZ(${(1 - k) * 700}px) translateY(${(1 - k) * (i % 2 ? -60 : 60)}px) rotateY(${(1 - k) * (i < 4 ? -50 : 50)}deg)`;
              c.style.filter = `blur(${(1 - k) * 12}px)`;
            });
            // beat breath
            const beat = [0, 0.5, 1, 1.5, 2].reduce((m, b) => (t >= b ? Math.max(0, 1 - (t - b) / 0.35) : m), 0);
            document.getElementById("s2-glow").style.transform = `scale(${1 + 0.08 * beat})`;
            document.getElementById("s2-glow").style.opacity = 0.7 + 0.3 * beat;
          };
          const drive = { t: 0 };
          render(0);
          const tl = gsap.timeline({ paused: true });
          tl.to(drive, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(drive.t) }, 0);
          tl.fromTo("#s2-word", { scale: 1.12 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
          tl.fromTo("#s2-eyebrow", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.25);
          tl.fromTo("#s2-sub", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.45, ease: "circ.out" }, 0.5);
          tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.inOut" }, 0.45);
          tl.fromTo(["#s2-c1", "#s2-c2", "#s2-c3", "#s2-c4"], { opacity: 0 }, { opacity: 1, duration: 0.2, stagger: 0.08, ease: "none" }, 0.6);
          tl.fromTo("#s2-grid", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
          tl.to("#s2-grid", { backgroundPosition: "-2px 118px", duration: DUR, ease: "none" }, 0);
          // zoom-through exit
          tl.to("#s2-stack", { scale: 1.8, opacity: 0, filter: "blur(20px)", duration: 0.4, ease: "power3.in" }, 2.6);
          tl.to(["#s2-rule", "#s2-c1", "#s2-c2", "#s2-c3", "#s2-c4"], { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.65);
          window.__timelines["s2-title"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
