                  ctx.fillText(usd(h.p), Math.min(h.x - 26, 1790), Math.max(h.y - 26, 420));
                  burst(ctx, ft, megaPush.f + 0.05, h.x, h.y, { n: 60, color: "45,226,166", speed: 1200, arc: Math.PI * 1.6, life: 1.2, size: 8, seed: 41 });
                  burst(ctx, ft, selfClose.f + 0.04, h.x, h.y, { n: 70, color: "255,211,107", speed: 1100, arc: Math.PI * 2, life: 1.4, size: 10, seed: 43, g: 700 });
                  loop.forEach((c, i) => burst(ctx, ft, c.fc + 0.02, h.x, h.y, { n: 18, color: "255,211,107", speed: 520, arc: Math.PI * 2, life: 0.7, size: 7, seed: 50 + i, g: 400 }));
                }
                ctx.globalAlpha = 1;
              }
              hud(g);
              setText(bn, "+" + (sample(RZ, g) / 100).toFixed(2));
              setText(pn, "+" + (sample(EQ, g) / 100).toFixed(2));
              setText(ln, String(loop.filter((c) => ft >= c.fc).length));
              const sh = shake(ft, HITS);
              world.style.transform = `translate(${sh.x}px, ${sh.y}px) rotate(${sh.r}deg)`;
            };
            drive(render);

            // bar 24: the breath — hollow gold 1
            drift(".l-breath .num", t24, bar(24, 3), { scale: 0.94 }, { scale: 1.03 });
            fade(".l-breath", t24, 0.5);
            tl.to($(".l-breath .num"), { scale: 6, opacity: 0, filter: "blur(10px)", duration: BEAT, ease: "power3.in" }, L(bar(24, 3)));
            out(".l-breath .no, .l-breath .lab", bar(24, 3), { d: 0.2 });
            flash(".l-gflash", t25, 0.4, 0.32);

            // bar 25: player card
            slam(".l-card .big", t25, { from: 1.6, d: 0.28 });
            snap(".l-card .rank", t25 + 0.06, { dx: -120 });
            snap(".l-card .name", bar(25, 0.5), { dx: -260, d: 0.36 });
            pop(".l-card .chip", bar(25, 1.5), { stagger: 0.12, rot: -4, from: 0.6 });
            wipe(".l-card .tag", bar(25, 2.5), { d: 0.4 });
            out(".l-card .big", t26 - 0.12, { dx: -260, blur: 12, d: 0.2 });
            out(".l-card .info", t26 - 0.12, { dx: -160, blur: 12, d: 0.2 });
            fade(".l-ghost", t25, 0.6, 1);

            // bar 26: the wall, then the pinned price
            fade(".l-hud", t26, 0.25);
            rise(".l-wall .cap .big", t26 + 0.03);
            snap(".l-wall .cap .en", bar(26, 0.5), { dx: -80 });
            slam(".l-wall .tagw", t26 + BEAT, { from: 1.6, d: 0.24, x: 200 });
            flash(".l-flash", t26 + BEAT, 0.35, 0.3);
            out(".l-wall", bar(26, 1.75), { dx: -300, blur: 14, d: 0.2 });
            rise(".l-pin .big", bar(26, 2));
            snap(".l-pin .en", bar(26, 2.5), { dx: -80 });
            out(".l-pin", t27 - 0.06, { dy: -40, blur: 10, d: 0.12 });

            // bars 27–28: the loop
            fade(".l-bank", t27, 0.2);
            tl.fromTo($(".l-bank"), { x: -120 }, { x: 0, duration: 0.3, ease: "expo.out" }, L(t27));
            rise(".l-loop", t27 + 0.05);
            loop.forEach((c) => {
              kick(".l-bank .n", c.fc + 0.05, 1.12, 0.22);
              kick(".l-loop .n", c.fc, 1.18, 0.2);
              flash(".l-gflash", c.fc, 0.12, 0.2);
            });
            out(".l-loop", t29 - 0.08, { dx: 120, blur: 10, d: 0.14 });

            // bar 29: the last push — paper next to banked
            rise(".l-paper", bar(29, 0) + 0.02);
            snap(".l-push", bar(29, 2), { dx: 200, skew: 14 });
            flash(".l-flash", megaPush.f, 0.28, 0.3);
            kick(".l-paper .n", bar(29, 3), 1.1, 0.25);

            // bar 30: the self-close
            out(".l-push", selfClose.f - 0.06, { dy: -40, d: 0.1 });
            tl.to($(".l-paper"), { opacity: 0.25, scale: 0.8, duration: 0.3, ease: "power3.out", transformOrigin: "0% 0%" }, L(selfClose.f));
            flash(".l-gflash", selfClose.f, 0.35, 0.35);
            tl.fromTo($(".l-self"), { opacity: 0, scale: 2.6, rotation: -12 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "back.out(1.6)" }, L(selfClose.f + 0.04));
            kick(".l-bank .n", selfClose.f + 0.08, 1.22, 0.4);
            out(".l-paper", finalClose.f, { d: 0.2 });
            out(".l-self", t31 - 0.1, { dx: 140, blur: 10, d: 0.14 });

            // bar 31: flat to the bell
            rise(".l-done .min", t31);
            pop(".l-done .chip", bar(31, 1), { stagger: 0.14, rot: 4, from: 0.6 });
            flash(".l-gflash", tEnd - 0.05, 0.4, 0.3);

            window.__timelines["s5-liu"] = tl;
          });
        })();
      </script>
    </template>
