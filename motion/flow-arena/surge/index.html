    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0d10;
      }
      @font-face {
        font-family: "Noto Sans TC";
        src: url("assets/fonts/NotoSansTC-sub.ttf") format("truetype");
        font-weight: 100 900;
        font-display: block;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
      }
      #paper {
        position: absolute;
        inset: 0;
        background-color: #ece8de;
        background-image: linear-gradient(rgba(20, 20, 20, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(20, 20, 20, 0.06) 1px, transparent 1px);
        background-size: 160px 160px;
        background-position: -1px -1px;
        opacity: 0;
      }
      #ink {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 50%, #15181d 0%, #07080a 100%);
        opacity: 0;
      }
      #rig {
        position: absolute;
        inset: 0;
        overflow: hidden;
        perspective: 1800px;
      }
      #rig-shake {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .cam {
        position: absolute;
        overflow: hidden;
        isolation: isolate;
        visibility: hidden;
      }
      .cam.screen {
        border-radius: 18px;
        box-shadow: 0 50px 90px rgba(10, 12, 16, 0.42), 0 10px 26px rgba(10, 12, 16, 0.35), 0 0 0 1px rgba(10, 12, 16, 0.25);
      }
      .cam-fit {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      .cam-in {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        transform-origin: 0 0;
      }
      video.shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        filter: contrast(1.08) saturate(1.2);
      }
      .cam.gray video.shot {
        filter: grayscale(1) contrast(1.15) brightness(0.8);
      }
      .cam.violet video.shot {
        filter: grayscale(0.75) contrast(1.15) brightness(0.9) hue-rotate(10deg);
      }
      .knock {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ece8de;
        mix-blend-mode: lighten;
      }
      .knock span {
        display: block;
        font: 900 560px "Noto Sans TC", sans-serif;
        letter-spacing: -0.06em;
        line-height: 1;
        color: #000;
        white-space: nowrap;
      }
      .cursor {
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 30px;
        transform-origin: 6px 3px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.7));
      }
      .cursor::before,
      .cursor::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 30px;
        height: 30px;
        clip-path: polygon(20% 9%, 20% 78%, 38% 61%, 50% 89%, 61% 84%, 49% 57%, 73% 57%);
      }
      .cursor::before {
        background: #0a0f16;
        transform: scale(1.28);
        transform-origin: 20% 9%;
      }
      .cursor::after {
        background: #fdfaf2;
      }
      .ripple {
        position: absolute;
        width: 0;
        height: 0;
        opacity: 0;
      }
      .ripple::before {
        content: "";
        position: absolute;
        left: -44px;
        top: -44px;
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 4px solid #2de2a6;
        box-shadow: 0 0 18px #2de2a6;
      }
      .layer {
        position: absolute;
        inset: 0;
      }
    </style>
